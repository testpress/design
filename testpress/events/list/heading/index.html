<div x-data="{ 
       open: false,
       top: 0,
       left: 'auto',
       right: 'auto',
       _triggerEl: null,
       _menuEl: null,
       _scrollHandler: null,
       init() {
         this.$watch('open', value => {
           console.log('Watch open value:', value);
           if (value) {
             console.log('Trigger ref:', this.$refs.trigger, 'Menu ref:', this.$refs.menu);
             this._triggerEl = this.$refs.trigger;
             this._menuEl = this.$refs.menu;
             this._scrollHandler = this._scrollHandler || this.updatePosition.bind(this);
             setTimeout(() => { 
               console.log('Calling updatePosition from setTimeout');
               this.updatePosition(); 
             }, 0);
             window.addEventListener('scroll', this._scrollHandler, true);
             window.addEventListener('resize', this._scrollHandler, true);
           } else {
             if (this._scrollHandler) {
               window.removeEventListener('scroll', this._scrollHandler, true);
               window.removeEventListener('resize', this._scrollHandler, true);
             }
           }
         });
       },
       updatePosition() {
         const trigger = this._triggerEl;
         console.log('updatePosition called, trigger:', trigger);
         if (!trigger) {
           console.log('No trigger element found!');
           return;
         }
         const rect = trigger.getBoundingClientRect();
         console.log('Trigger bounding rect:', rect);
         this.top = rect.bottom + 4;
         const placement = 'bottom-end';
         console.log('Placement:', placement);
          const menuWidth = this._menuEl ? this._menuEl.offsetWidth : 224;
          const menuHeight = this._menuEl ? this._menuEl.offsetHeight : 160;
          
          if (placement === 'bottom-end' || placement === 'top-end') {
            if (rect.right < menuWidth) {
              this.left = rect.left;
              this.right = 'auto';
            } else {
              this.left = rect.right - menuWidth;
              this.right = 'auto';
            }
            this.top = placement === 'bottom-end' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          } else if (placement === 'bottom-start' || placement === 'top-start') {
            let leftPos = rect.left;
            if (window.innerWidth - leftPos < menuWidth) {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            } else {
              this.left = leftPos;
              this.right = 'auto';
            }
            this.top = placement === 'bottom-start' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          }
       }
     }" 
     @keydown.escape.window="open = false"
     class="inline-flex ">

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('headerUpdater', () => ({
      pageDescription: '',
      selectedMonth: 'All Months',
      selectedEvent: 'All Events',
      selectedUser: 'All Users',
      init() {
        const params = new URLSearchParams(window.location.search);
        
        const eventNames = {
          
          "exam_deleted": "Exam Deleted",
          
          "course_created": "Course Created",
          
          "course_deleted": "Course Deleted",
          
          "course_updated": "Course Updated",
          
          "user_registered": "User Registered",
          
          "login_failed": "Failed Login Attempt",
          
          "admin_login": "Admin Login",
          
          "super_admin_added": "Super Admin Added",
          
          "staff_privilege_modified": "Staff Privilege Modified",
          
          "sensitive_data_export": "Sensitive Data Exported",
          
          "account_deactivated": "Account Deactivated",
          
          "account_restored": "Account Restored",
          
          "order_validity_updated": "Order Validity Updated",
          
          "live_class_deleted": "Live Class Deleted",
          
          "own_account_deleted": "Own Account Deleted",
          
          "chapter_deleted": "Chapter Deleted",
          
          "exam_updated": "Exam Updated",
          
          "zoom_account_connected": "Zoom Account Connected",
          
          "zoom_account_disconnected": "Zoom Account Disconnected",
          
          "zoom_licenses_imported": "Zoom Licenses Imported",
          
          "zoom_license_assigned": "Zoom License Assigned",
          
          "zoom_license_unassigned": "Zoom License Unassigned",
          
          "zoom_license_deleted": "Zoom License Deleted",
          
          "zoom_settings_updated": "Zoom Settings Updated",
          
        };
        
        const monthNames = {
          "01-11-2024": "November 2024",
          "01-10-2024": "October 2024",
          "01-09-2024": "September 2024",
          "01-08-2024": "August 2024",
          "01-07-2024": "July 2024",
          "01-06-2024": "June 2024",
          "01-05-2024": "May 2024",
          "01-04-2024": "April 2024",
          "01-03-2024": "March 2024",
          "01-02-2024": "February 2024",
          "01-01-2024": "January 2024",
          "01-12-2023": "December 2023"
        };

        const ipParam = params.get('ip');
        if (ipParam) {
          this.pageDescription = `Showing events filtered by IP Address: ${ipParam}`;
        }
        
        if(params.get('month')){
          const rawMonth = params.get('month');
          this.selectedMonth = monthNames[rawMonth] || rawMonth;
        }
        if(params.get('event_key')){
          const key = params.get('event_key');
          this.selectedEvent = eventNames[key] || key;
        }
        if(params.get('user')){
          this.selectedUser = params.get('user');
        }
      },
      updateFilter(key, value) {
        const url = new URL(window.location);
        if (value) {
          url.searchParams.set(key, value);
        } else {
          url.searchParams.delete(key);
        }
        window.location.href = url.toString();
      },
    }));
  });
</script>
