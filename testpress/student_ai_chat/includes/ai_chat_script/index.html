<script>
  const AI_CHAT_IMG = {
    wheatstone: { src: '/img/ai_chat/wheatstone.svg', name: 'IMG_20261022_1612.jpg' },
    integral: { src: '/img/ai_chat/integral.svg', name: 'Screenshot 2026-10-22 at 4.15 PM.png' },
  };

  // Sample conversations. AI replies are HTML strings so they can show headings, lists and tables.
  const AI_CHAT_SEED = [
    {
      id: 'sn1-sn2', title: 'SN1 vs SN2 reactions with examples', group: 'Today',
      messages: [
        { role: 'user', text: 'Explain SN1 vs SN2 reactions with examples' },
        { role: 'ai', html: `
          <p>Both are <strong>nucleophilic substitution</strong> reactions: a nucleophile replaces a leaving group. They differ in <em>when</em> the bond to the leaving group breaks.</p>
          <h3>Key differences</h3>
          <table>
            <thead><tr><th></th><th>SN1</th><th>SN2</th></tr></thead>
            <tbody>
              <tr><td>Steps</td><td>Two (carbocation forms first)</td><td>One (bond forms and breaks together)</td></tr>
              <tr><td>Rate law</td><td>Rate = k[R–X]</td><td>Rate = k[R–X][Nu⁻]</td></tr>
              <tr><td>Best substrate</td><td>3° &gt; 2° &gt; 1°</td><td>CH₃ &gt; 1° &gt; 2°</td></tr>
              <tr><td>Stereochemistry</td><td>Racemisation</td><td>Inversion (Walden)</td></tr>
              <tr><td>Solvent</td><td>Polar protic (water, alcohol)</td><td>Polar aprotic (acetone, DMSO)</td></tr>
            </tbody>
          </table>
          <h3>Examples</h3>
          <ul>
            <li><strong>SN1:</strong> (CH₃)₃C–Br + H₂O → (CH₃)₃C–OH + HBr</li>
            <li><strong>SN2:</strong> CH₃–Br + OH⁻ → CH₃–OH + Br⁻</li>
          </ul>
          <p>Quick check for NEET: if the carbon is crowded and the solvent is protic, think SN1.</p>` },
        { role: 'user', text: 'Then why does tert-butyl bromide prefer SN1 and not SN2?' },
        { role: 'ai', html: `
          <p>Two reasons, and both come from the three methyl groups on the central carbon:</p>
          <ul>
            <li><strong>Steric hindrance blocks SN2.</strong> SN2 needs the nucleophile to attack from the back side. Three bulky CH₃ groups leave no room to approach.</li>
            <li><strong>A stable carbocation favours SN1.</strong> The tert-butyl carbocation is 3°, stabilised by hyperconjugation (9 α-hydrogens) and the +I effect of the methyl groups.</li>
          </ul>
          <p>So the slow step of SN1, forming the carbocation, is easy here, while SN2 is almost impossible.</p>` },
      ],
    },
    {
      id: 'wheatstone', title: 'Equivalent resistance of a Wheatstone bridge', group: 'Today',
      messages: [
        { role: 'user', text: 'Find the equivalent resistance between A and B', images: [AI_CHAT_IMG.wheatstone] },
        { role: 'ai', html: `
          <p>Check the balance condition first: <strong>P/Q = 10/20 = 0.5</strong> and <strong>R/S = 15/30 = 0.5</strong>. They are equal, so the bridge is <strong>balanced</strong> and no current flows through the galvanometer G.</p>
          <p>Remove G. You are left with two branches in parallel:</p>
          <ul>
            <li>P + Q = 10 + 20 = 30 Ω</li>
            <li>R + S = 15 + 30 = 45 Ω</li>
          </ul>
          <p><strong>R<sub>eq</sub> = (30 × 45) / (30 + 45) = 18 Ω</strong></p>` },
      ],
    },
    {
      id: 'mitosis', title: 'Mitosis vs meiosis — key differences', group: 'Yesterday',
      messages: [
        { role: 'user', text: 'What are the key differences between mitosis and meiosis?' },
        { role: 'ai', html: `
          <p>Both are types of cell division, but they have different jobs: <strong>mitosis</strong> makes identical body cells, while <strong>meiosis</strong> makes gametes with half the chromosome number.</p>
          <table>
            <thead><tr><th></th><th>Mitosis</th><th>Meiosis</th></tr></thead>
            <tbody>
              <tr><td>Divisions</td><td>One</td><td>Two (meiosis I and II)</td></tr>
              <tr><td>Daughter cells</td><td>2, diploid (2n)</td><td>4, haploid (n)</td></tr>
              <tr><td>Crossing over</td><td>No</td><td>Yes, in prophase I</td></tr>
              <tr><td>Genetic make-up</td><td>Identical to parent</td><td>Different from parent and each other</td></tr>
              <tr><td>Where</td><td>Somatic cells</td><td>Reproductive cells (gonads)</td></tr>
            </tbody>
          </table>
          <p>For NEET, remember that <strong>homologous chromosomes separate in anaphase I</strong>, and sister chromatids separate in anaphase II (just like in mitosis).</p>` },
        { role: 'user', text: 'In which stage does the chromosome number become half?' },
        { role: 'ai', html: `
          <p>The chromosome number halves at the end of <strong>meiosis I</strong>, which is why it is called the <strong>reductional division</strong>.</p>
          <ul>
            <li>In <strong>anaphase I</strong>, homologous chromosomes move to opposite poles.</li>
            <li>After <strong>telophase I</strong>, each cell has n chromosomes (each still with two chromatids).</li>
            <li>Meiosis II is <strong>equational</strong>: it separates chromatids, so the number stays n.</li>
          </ul>` },
      ],
    },
    {
      id: 'ex-dx', title: 'Integrate x·eˣ dx step by step', group: 'Yesterday',
      messages: [
        { role: 'user', text: 'Integrate x·eˣ dx step by step' },
        { role: 'ai', html: `
          <p>Use <strong>integration by parts</strong>: ∫u dv = uv − ∫v du. Choose u with ILATE (Inverse, Log, Algebraic, Trig, Exponential), so x comes before eˣ.</p>
          <ul>
            <li>u = x, so du = dx</li>
            <li>dv = eˣ dx, so v = eˣ</li>
          </ul>
          <p>Substitute: ∫x·eˣ dx = x·eˣ − ∫eˣ dx = x·eˣ − eˣ + C</p>
          <p><strong>Answer: eˣ(x − 1) + C</strong></p>` },
      ],
    },
    {
      id: 'bohr', title: 'Radius of nth orbit in Bohr model', group: 'Previous 7 days',
      messages: [
        { role: 'user', text: 'What is the formula for the radius of the nth orbit in Bohr’s model?' },
        { role: 'ai', html: `
          <p>For a hydrogen-like atom with atomic number Z:</p>
          <p><strong>rₙ = 0.529 × n² / Z Å</strong></p>
          <ul>
            <li>0.529 Å is the Bohr radius (a₀), the radius of the first orbit of hydrogen.</li>
            <li>r ∝ n², so the 2nd orbit is 4 times bigger than the 1st.</li>
            <li>r ∝ 1/Z, so orbits shrink as nuclear charge increases.</li>
          </ul>
          <p>Example: for He⁺ (Z = 2), r₁ = 0.529 / 2 = 0.2645 Å.</p>` },
      ],
    },
    {
      id: 'hardy', title: 'Conditions for Hardy–Weinberg equilibrium', group: 'Previous 7 days',
      messages: [
        { role: 'user', text: 'What are the conditions for Hardy–Weinberg equilibrium?' },
        { role: 'ai', html: `
          <p>Allele frequencies stay constant from one generation to the next only when <strong>none of these factors act</strong> on the population:</p>
          <ul>
            <li>No gene flow (migration)</li>
            <li>No genetic drift, so the population is large</li>
            <li>No mutation</li>
            <li>Random mating</li>
            <li>No natural selection</li>
          </ul>
          <p>The equation is <strong>p² + 2pq + q² = 1</strong>, where p and q are the frequencies of the two alleles. Any change in these values means evolution is happening.</p>` },
      ],
    },
    {
      id: 'lechatelier', title: 'Le Chatelier’s principle when pressure increases', group: 'Previous 7 days',
      messages: [
        { role: 'user', text: 'What happens to N₂ + 3H₂ ⇌ 2NH₃ when pressure is increased?' },
        { role: 'ai', html: `
          <p>By Le Chatelier’s principle, the equilibrium shifts to <strong>reduce the pressure</strong>, which means towards the side with fewer gas moles.</p>
          <ul>
            <li>Reactants: 1 + 3 = 4 moles of gas</li>
            <li>Products: 2 moles of gas</li>
          </ul>
          <p>So the equilibrium shifts <strong>forward</strong> and more NH₃ is formed. This is why the Haber process runs at about 200 atm.</p>` },
      ],
    },
    {
      id: 'doppler', title: 'Doppler effect: source moving towards observer', group: 'Earlier',
      messages: [
        { role: 'user', text: 'A source of 500 Hz moves towards a stationary observer at 30 m/s. What frequency is heard? Speed of sound = 330 m/s.' },
        { role: 'ai', html: `
          <p>When the source moves towards a stationary observer, the apparent frequency increases:</p>
          <p><strong>f′ = f × v / (v − vₛ)</strong></p>
          <ul>
            <li>f = 500 Hz, v = 330 m/s, vₛ = 30 m/s</li>
            <li>f′ = 500 × 330 / (330 − 30) = 500 × 330 / 300</li>
          </ul>
          <p><strong>f′ = 550 Hz</strong></p>` },
      ],
    },
  ];

  // Canned replies for the live demo.
  const AI_CHAT_DEMO_REPLY = `
    <p>Good question. Here is a short, exam-focused way to approach it:</p>
    <ul>
      <li><strong>Start from the definition</strong> and write down what is given and what is asked.</li>
      <li><strong>Pick the governing equation</strong> and check the units before substituting.</li>
      <li><strong>Solve step by step</strong>, keeping significant figures to the end.</li>
    </ul>
    <p>Ask a follow-up if you want me to work through a numerical example.</p>`;
  const AI_CHAT_IMAGE_REPLY = `
    <p>You’ve set it up correctly with <strong>integration by parts</strong>: u = x, dv = eˣ dx, so du = dx and v = eˣ.</p>
    <p>Use ∫u dv = uv − ∫v du:</p>
    <ul>
      <li>∫x·eˣ dx = x·eˣ − ∫eˣ dx</li>
      <li>∫eˣ dx = eˣ</li>
    </ul>
    <p><strong>Answer: x·eˣ − eˣ + C = eˣ(x − 1) + C</strong></p>
    <p>Check by differentiating: d/dx [eˣ(x − 1)] = eˣ(x − 1) + eˣ = x·eˣ ✓</p>`;

  // Starter chips on the new-chat screen. Each fills the message box; the student finishes the sentence.
  const AI_CHAT_STARTERS = [
    { label: 'Explain a concept', prompt: 'Explain the concept of ', d: 'M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z' },
    { label: 'Solve a problem', prompt: 'Help me solve this step by step: ', d: 'M4 2h16v20H4zM8 6h8M16 14v4M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01' },
    { label: 'Practice questions', prompt: 'Give me 5 practice questions on ', d: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01' },
    { label: 'Study tips', prompt: 'How should I revise ', d: 'M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5M9 18h6M10 22h4' },
  ];

  const AI_CHAT_LIMITS = { maxChars: 4000, counterFrom: 3500, maxImages: 4 };
  const AI_CHAT_IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

  document.addEventListener('alpine:init', () => {
    Alpine.data('aiChatApp', () => ({
      chats: [],
      activeId: null,          // null = new chat
      draft: '',
      attachments: [],         // { id, src, name, progress, status: 'uploading' | 'done' }
      attachError: '',
      dragging: false,
      expandComposer: false,   // set once the text wraps; cleared when the box is empty
      status: 'idle',          // idle | thinking | streaming
      block: null,             // null | hour | chat | day | unavailable | offline | other_device
      loading: true,           // chat list; also shown before the page's scripts load
      sidebarOpen: false,      // mobile drawer
      collapsed: document.documentElement.dataset.aiSidebar === 'collapsed', // desktop: minified to icons (saved)
      sidebarWidth: 260,       // desktop: dragged by the sidebar's edge
      sidebarDefault: 260,
      sidebarMin: 220,
      sidebarMax: 420,
      resizing: false,
      menuFor: null,           // chat id whose "more" menu is open
      plusOpen: false,
      renamingId: null,
      renameDraft: '',
      deleteTarget: null,
      lightbox: null,
      copied: null,
      tip: { show: false, text: '', x: 0, y: 0, place: 'bottom' },
      pressTimer: null,
      pressedOpen: false,
      camera: { shot: null, error: false, stream: null },
      starters: AI_CHAT_STARTERS,
      limits: AI_CHAT_LIMITS,

      init() {
        this.chats = JSON.parse(JSON.stringify(AI_CHAT_SEED));
        // The app header (which normally applies the saved theme) isn't on this page, so apply it here.
        const theme = localStorage.getItem('hs_theme') || 'default';
        document.documentElement.classList.toggle('dark', theme === 'dark' || (theme === 'default' && window.matchMedia('(prefers-color-scheme: dark)').matches));
        try { const w = parseInt(localStorage.getItem('ai_chat_sidebar_w'), 10); if (w) this.setSidebarWidth(w); } catch (e) {}
        // The collapsed look is plain CSS on <html data-ai-sidebar>, so it's right before Alpine loads; keep it in step.
        this.$watch('collapsed', (v) => {
          document.documentElement.dataset.aiSidebar = v ? 'collapsed' : '';
          try { localStorage.setItem('ai_chat_sidebar_collapsed', v ? '1' : ''); } catch (e) {}
        });
        this.loading = false;
        // Ready to type on load (desktop only: on phones this would pop the keyboard unasked).
        if (!this.isTouch) this.focusInput();
      },

      get active() { return this.chats.find((c) => c.id === this.activeId) || null; },
      get messages() { return this.active ? this.active.messages : []; },
      get groups() {
        return ['Today', 'Yesterday', 'Previous 7 days', 'Earlier']
          .map((name) => ({ name, chats: this.chats.filter((c) => c.group === name) }))
          .filter((g) => g.chats.length);
      },
      get tooLong() { return this.draft.length > this.limits.maxChars; },
      get showCounter() { return this.draft.length >= this.limits.counterFrom; },
      get busy() { return this.status !== 'idle'; },
      get locked() { return ['hour', 'chat', 'unavailable', 'offline', 'other_device'].includes(this.block); },
      // One line shown above the (disabled) message box.
      get blockNote() {
        return {
          hour: 'You’ve sent 20 messages in the last hour. You can send again at <strong class="font-medium text-gray-800 dark:text-neutral-200">4:37 PM</strong>.',
          unavailable: 'AI Chat is temporarily unavailable. Your chats are safe; try again in a few minutes.',
          offline: 'You’re offline. You can send once you’re back online.',
        }[this.block] || '';
      },
      get expanded() { return this.expandComposer || this.attachments.length > 0 || this.draft.includes('\n'); },
      get uploading() { return this.attachments.some((a) => a.status === 'uploading'); },
      get hasContent() { return this.draft.trim().length > 0 || this.attachments.length > 0; },
      get canSend() { return this.hasContent && !this.uploading && !this.tooLong && !this.busy && !this.block; },

      get isTouch() { return window.matchMedia('(hover: none)').matches; },

      // ----- Tooltip (fixed position, so overflow can't clip it) -----
      showTip(el, text, place = 'bottom') {
        if (this.isTouch) return;
        const r = el.getBoundingClientRect();
        this.tip = place === 'right'
          ? { show: true, text, place, x: r.right + 8, y: r.top + r.height / 2 }
          : { show: true, text, place, x: r.left + r.width / 2, y: r.bottom + 6 };
      },
      hideTip() { this.tip.show = false; },

      // ----- Sidebar width (desktop) -----
      setSidebarWidth(w) {
        this.sidebarWidth = Math.round(Math.min(this.sidebarMax, Math.max(this.sidebarMin, w)));
        document.documentElement.style.setProperty('--ai-sidebar-w', this.sidebarWidth + 'px');
        try { localStorage.setItem('ai_chat_sidebar_w', this.sidebarWidth); } catch (e) {}
      },
      startResize(e) {
        const startX = e.clientX, startW = this.sidebarWidth;
        this.resizing = true;
        this.hideTip();
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        // Dragged well past the narrowest width, the sidebar collapses (like ChatGPT); drag back out to reopen it.
        const move = (ev) => {
          const w = startW + ev.clientX - startX;
          this.collapsed = w < this.sidebarMin - 60;
          this.setSidebarWidth(this.collapsed ? startW : w);
        };
        const up = () => {
          this.resizing = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      },

      // ----- Chats -----
      openChat(id) {
        this.activeId = id;
        this.block = null;
        this.sidebarOpen = false;
        this.menuFor = null;
        this.scrollDown();
        if (!this.isTouch) this.focusInput();
      },
      newChat() {
        this.activeId = null;
        this.draft = '';
        this.attachments = [];
        this.attachError = '';
        this.block = null;
        this.sidebarOpen = false;
        this.focusInput();
      },
      startRename(chat) {
        this.menuFor = null;
        this.renamingId = chat.id;
        this.renameDraft = chat.title;
        this.$nextTick(() => setTimeout(() => {
          const el = document.getElementById('ai-chat-rename-' + chat.id);
          if (el) { el.focus(); el.select(); }
        }, 30));
      },
      saveRename(chat) {
        const t = this.renameDraft.trim();
        if (t) chat.title = t;
        this.renamingId = null;
      },
      // Touch screens: long-press a chat title to open its menu.
      pressStart(chat) {
        clearTimeout(this.pressTimer);
        this.pressTimer = setTimeout(() => {
          this.menuFor = chat.id;
          this.pressedOpen = true;
          if (navigator.vibrate) navigator.vibrate(10);
        }, 450);
      },
      pressEnd() { clearTimeout(this.pressTimer); },
      // New titles type in from left to right.
      typeTitle(chat) {
        chat.shown = '';
        const full = chat.title;
        let n = 0;
        const tick = setInterval(() => {
          n += 1;
          chat.shown = full.slice(0, n);
          if (n >= full.length) { clearInterval(tick); delete chat.shown; chat.shown = undefined; }
        }, 22);
      },
      askDelete(chat) {
        this.menuFor = null;
        this.deleteTarget = chat;
        window.dispatchEvent(new CustomEvent('open-modal-ai-chat-delete'));
      },
      confirmDelete() {
        if (!this.deleteTarget) return;
        const id = this.deleteTarget.id;
        this.chats = this.chats.filter((c) => c.id !== id);
        if (this.activeId === id) this.activeId = null;
        this.deleteTarget = null;
      },

      // ----- Images -----
      useStarter(s) { this.draft = s.prompt; this.$nextTick(() => { const el = document.getElementById('ai-chat-input'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }); },
      pickImages() { this.plusOpen = false; document.getElementById('ai-chat-file').click(); },
      // Phones open the camera app directly; desktops get a live camera preview.
      takePhoto() {
        this.plusOpen = false;
        if (this.isTouch) document.getElementById('ai-chat-camera').click();
        else window.dispatchEvent(new CustomEvent('open-modal-ai-chat-camera'));
      },
      async startCamera() {
        this.camera.error = false;
        this.camera.shot = null;
        try {
          this.camera.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          const v = document.querySelector('[x-ref="cameraVideo"]');
          if (v) v.srcObject = this.camera.stream;
        } catch (e) {
          this.camera.error = true;
        }
      },
      stopCamera() {
        if (this.camera.stream) this.camera.stream.getTracks().forEach((t) => t.stop());
        this.camera.stream = null;
      },
      capturePhoto() {
        const v = document.querySelector('[x-ref="cameraVideo"]');
        const c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        this.camera.shot = c.toDataURL('image/jpeg', 0.85);
        this.stopCamera();
      },
      usePhoto() {
        this.attachError = '';
        if (this.attachments.length >= this.limits.maxImages) { this.attachError = `You can add up to ${this.limits.maxImages} images in one message.`; return; }
        this.addAttachment(this.camera.shot, 'Photo.jpg');
        this.camera.shot = null;
      },
      onPaste(e) {
        const files = [...(e.clipboardData ? e.clipboardData.files : [])];
        if (files.length) { e.preventDefault(); this.addFiles(files); }
      },
      onDrop(e) { this.dragging = false; this.addFiles([...e.dataTransfer.files]); },
      addFiles(files) {
        this.attachError = '';
        for (const f of files) {
          if (!AI_CHAT_IMAGE_TYPES.includes(f.type)) { this.attachError = 'Only JPG, PNG and WebP images can be added.'; continue; }
          if (this.attachments.length >= this.limits.maxImages) { this.attachError = `You can add up to ${this.limits.maxImages} images in one message.`; break; }
          this.addAttachment(URL.createObjectURL(f), f.name);
        }
      },
      // Simulated compress-and-upload with progress. animate = false keeps the given progress (prototype states).
      addAttachment(src, name, progress = 0, animate = true) {
        this.attachments.push({ id: 'a' + Math.random().toString(36).slice(2), src, name, progress, status: progress >= 100 ? 'done' : 'uploading' });
        const item = this.attachments[this.attachments.length - 1];
        if (item.status === 'done' || !animate) return;
        const tick = setInterval(() => {
          if (!this.attachments.includes(item)) return clearInterval(tick);
          item.progress = Math.min(100, item.progress + 9 + Math.round(Math.random() * 8));
          if (item.progress >= 100) { item.status = 'done'; clearInterval(tick); }
        }, 160);
      },
      removeAttachment(a) { this.attachments = this.attachments.filter((x) => x !== a); this.attachError = ''; },

      // ----- Sending -----
      focusInput() { this.$nextTick(() => setTimeout(() => { const el = document.getElementById('ai-chat-input'); if (el) el.focus(); }, 30)); },
      send() {
        if (!this.canSend) return;
        const text = this.draft.trim();
        const images = this.attachments.map((a) => ({ src: a.src, name: a.name }));
        if (!this.active) {
          // Provisional title for launch: the first message, shortened. Image-only chats get a generic title.
          const base = text || 'Image question';
          const title = base.length > 48 ? base.slice(0, 47).trimEnd() + '…' : base;
          this.chats.unshift({ id: 'c' + Date.now(), title, group: 'Today', messages: [] });
          this.activeId = this.chats[0].id;
          this.typeTitle(this.chats[0]);
        } else {
          const chat = this.active;
          chat.group = 'Today';
          this.chats = [chat, ...this.chats.filter((c) => c !== chat)];
        }
        this.active.messages.push({ role: 'user', text, images });
        this.draft = '';
        this.attachments = [];
        this.attachError = '';
        this.status = 'thinking';
        this.scrollDown();
        // Phones: close the keyboard so the reply is visible (like ChatGPT).
        // Desktop: keep the cursor in the box; the first message re-renders it, so refocus.
        if (this.isTouch) { const el = document.getElementById('ai-chat-input'); if (el) el.blur(); }
        else this.focusInput();
        setTimeout(() => this.stream(images.length ? AI_CHAT_IMAGE_REPLY : AI_CHAT_DEMO_REPLY), 1400);
      },

      // Reveals the reply a few words at a time, like a streamed response.
      stream(html) {
        this.active.messages.push({ role: 'ai', html: '', state: 'streaming' });
        const msg = this.active.messages[this.active.messages.length - 1];
        this.status = 'streaming';
        const parts = html.split(/(\s+)/);
        let i = 0;
        const tick = setInterval(() => {
          i += 4;
          msg.html = parts.slice(0, i).join('');
          this.scrollDown();
          if (i >= parts.length) {
            clearInterval(tick);
            msg.html = html; msg.state = 'done';
            this.status = 'idle';
          }
        }, 45);
      },

      // One retry per failed reply (PRD): reuses the same question, no new message.
      retry(i) {
        if (this.busy) return;
        this.active.messages.splice(i, 1);
        this.status = 'thinking';
        this.scrollDown();
        const q = this.active.messages[i - 1] || {};
        setTimeout(() => this.stream((q.images || []).length ? AI_CHAT_IMAGE_REPLY : AI_CHAT_DEMO_REPLY), 1400);
      },

      copy(key, text) {
        navigator.clipboard && navigator.clipboard.writeText(text);
        this.copied = key;
        setTimeout(() => { this.copied = null; }, 1500);
      },
      plainText(html) { const d = document.createElement('div'); d.innerHTML = html; return d.innerText.trim(); },

      scrollDown() {
        // The thread is inside an x-if, so wait for it to render.
        this.$nextTick(() => setTimeout(() => {
          const el = document.getElementById('ai-chat-thread');
          if (el) el.scrollTop = el.scrollHeight;
        }, 30));
      },

      // Prototype only: puts the page into one of the listed states.
      applyState(p) {
        Object.assign(this, {
          activeId: null, draft: '', expandComposer: false, attachments: [], attachError: '', status: 'idle', block: null, loading: false,
          sidebarOpen: false, collapsed: false, menuFor: null, plusOpen: false, renamingId: null, deleteTarget: null, lightbox: null,
        });
        this.chats = JSON.parse(JSON.stringify(AI_CHAT_SEED));
        ['ai-chat-delete', 'ai-chat-camera'].forEach((id) => window.dispatchEvent(new CustomEvent('close-modal-' + id)));
        const sn = () => this.chats.find((c) => c.id === 'sn1-sn2');
        const openSn = (extra = []) => { this.activeId = 'sn1-sn2'; sn().messages.push(...extra); };
        const q = { role: 'user', text: 'What happens to the rate of an SN1 reaction if I double the concentration of the nucleophile?' };
        const mobile = !window.matchMedia('(min-width: 768px)').matches;
        const stuck = 'I’m stuck at the last step. How do I finish this?';
        switch (p) {
          case 'history': this.sidebarOpen = true; break;
          case 'loading': this.loading = true; this.sidebarOpen = true; break;
          case 'collapsed': this.collapsed = true; openSn(); break;
          case 'first_use': this.chats = []; break;
          case 'typing': this.draft = 'How is the electric field inside a hollow charged conducting sphere zero?'; break;
          case 'conversation': openSn(); break;
          case 'follow_up': openSn(); this.draft = q.text; break;
          case 'thinking': openSn([q]); this.status = 'thinking'; break;
          case 'streaming':
            openSn([q, { role: 'ai', state: 'streaming', html: '<p>The rate <strong>does not change</strong>. In SN1, the slow (rate-determining) step is the formation of the carbocation, and the nucleophile' }]);
            this.status = 'streaming'; break;
          case 'off_topic': openSn([{ role: 'user', text: 'Who will win the IPL this year?' }, { role: 'ai', state: 'off_topic' }]); break;
          case 'image_uploading':
            this.draft = stuck;
            this.addAttachment(AI_CHAT_IMG.integral.src, AI_CHAT_IMG.integral.name, 100);
            this.addAttachment(AI_CHAT_IMG.wheatstone.src, AI_CHAT_IMG.wheatstone.name, 46, false);
            break;
          case 'image_ready': this.draft = stuck; this.addAttachment(AI_CHAT_IMG.integral.src, AI_CHAT_IMG.integral.name, 100); break;
          case 'image_sent': this.activeId = 'wheatstone'; break;
          case 'image_error':
            this.addAttachment(AI_CHAT_IMG.integral.src, AI_CHAT_IMG.integral.name, 100);
            this.attachError = 'Only JPG, PNG and WebP images can be added.';
            break;
          case 'rename': openSn(); if (mobile) this.sidebarOpen = true; this.startRename(sn()); break;
          case 'delete_confirm': openSn(); this.askDelete(sn()); break;
          case 'camera': this.$nextTick(() => window.dispatchEvent(new CustomEvent('open-modal-ai-chat-camera'))); break;
          case 'new_title': this.draft = 'Why is the electric field inside a conductor zero?'; this.$nextTick(() => this.send()); break;
          case 'failed': openSn([q, { role: 'ai', state: 'failed' }]); break;
          case 'failed_again': openSn([q, { role: 'ai', state: 'failed', retried: true }]); break;
          case 'too_long':
            openSn();
            this.draft = ('Explain this passage from the NCERT chapter on electrochemistry: In an electrochemical cell, the chemical energy of a spontaneous redox reaction is converted into electrical energy. The Daniell cell uses zinc and copper electrodes dipped in solutions of their sulphates, connected by a salt bridge. ').repeat(20).slice(0, 4126);
            break;
          case 'limit_hour': openSn(); this.block = 'hour'; break;
          case 'limit_chat': openSn(); this.block = 'chat'; break;
          case 'limit_day': this.block = 'day'; break;
          case 'unavailable': openSn(); this.block = 'unavailable'; break;
          case 'offline': openSn(); this.block = 'offline'; break;
          case 'other_device': openSn([q]); this.block = 'other_device'; break;
        }
        this.scrollDown();
      },
    }));

    // Prototype only: floating state switcher.
    Alpine.data('aiChatPrototype', () => ({
      open: false,
      state: 'live',
      dark: document.documentElement.classList.contains('dark'),
      groups: [
        { name: 'Start', states: [
          ['live', 'Live demo'],
          ['history', 'Chat history'],
          ['loading', 'Loading chats'],
          ['collapsed', 'Sidebar collapsed'],
          ['first_use', 'First use'],
          ['typing', 'Typing a question'],
        ] },
        { name: 'Conversation', states: [
          ['conversation', 'Reopened conversation'],
          ['follow_up', 'Follow-up question'],
          ['thinking', 'Thinking'],
          ['streaming', 'Reply streaming in'],
          ['off_topic', 'Non-academic question'],
        ] },
        { name: 'Images', states: [
          ['image_uploading', 'Image uploading'],
          ['image_ready', 'Image ready to send'],
          ['image_sent', 'Question with an image'],
          ['image_error', 'Unsupported file'],
          ['camera', 'Take a photo (desktop camera)'],
        ] },
        { name: 'Manage chats', states: [
          ['new_title', 'New chat title typing in'],
          ['rename', 'Rename a chat'],
          ['delete_confirm', 'Delete a chat'],
        ] },
        { name: 'Errors and limits', states: [
          ['failed', 'Reply failed'],
          ['failed_again', 'Reply failed after retry'],
          ['too_long', 'Message too long'],
          ['limit_hour', 'Hourly limit reached'],
          ['limit_chat', 'Chat limit reached'],
          ['limit_day', 'Daily new-chat limit'],
          ['unavailable', 'AI temporarily unavailable'],
          ['offline', 'No internet'],
          ['other_device', 'Reply on another device'],
        ] },
      ],
      pick(id) {
        this.state = id;
        this.open = false;
        window.dispatchEvent(new CustomEvent('ai-chat-state', { detail: id }));
      },
      toggleDark() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
      },
    }));
  });
</script>
