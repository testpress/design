    <template x-if="durations.length > 1 && durations.length <= 3">

    <template x-if="durations.length > 3">
      <div>
        




<div x-data="{ 
       open: false,
       top: 0,
       left: 'auto',
       right: 'auto',
       _triggerEl: null,
       _menuEl: null,
       _scrollHandler: null,
       init() {
         this.$watch('open', value => {
           console.log('Watch open value:', value);
           if (value) {
             this.$dispatch('dropdown-opened');
             console.log('Trigger ref:', this.$refs.trigger, 'Menu ref:', this.$refs.menu);
             this._triggerEl = this.$refs.trigger;
             this._menuEl = this.$refs.menu;
             this._scrollHandler = this._scrollHandler || this.updatePosition.bind(this);
             setTimeout(() => { 
               console.log('Calling updatePosition from setTimeout');
               this.updatePosition(); 
             }, 0);
             window.addEventListener('scroll', this._scrollHandler, true);
             window.addEventListener('resize', this._scrollHandler, true);
           } else {
             if (this._scrollHandler) {
               window.removeEventListener('scroll', this._scrollHandler, true);
               window.removeEventListener('resize', this._scrollHandler, true);
             }
           }
         });
       },
       updatePosition() {
         const trigger = this._triggerEl;
         console.log('updatePosition called, trigger:', trigger);
         if (!trigger) {
           console.log('No trigger element found!');
           return;
         }
         const rect = trigger.getBoundingClientRect();
         console.log('Trigger bounding rect:', rect);
         this.top = rect.bottom + 4;
         const placement = 'bottom-end';
         const adaptive = true;
         console.log('Placement:', placement);
          const menuWidth = this._menuEl ? this._menuEl.offsetWidth : 224;
          const menuHeight = this._menuEl ? this._menuEl.offsetHeight : 160;
          
          if (placement === 'bottom-end' || placement === 'top-end') {
            if (adaptive && rect.right < menuWidth) {
              this.left = rect.left;
              this.right = 'auto';
            } else {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            }
            this.top = placement === 'bottom-end' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          } else if (placement === 'bottom-start' || placement === 'top-start') {
            let leftPos = rect.left;
            if (adaptive && (window.innerWidth - leftPos < menuWidth)) {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            } else {
              this.left = leftPos;
              this.right = 'auto';
            }
            this.top = placement === 'bottom-start' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          }
       }
     }" 
     @keydown.escape.window="open = false"
     @dropdown-opened.window="if ($event.target !== $el) open = false"
     class="inline-flex ">
  
  <!-- Trigger -->
  <div @click="open = !open" class="cursor-pointer" x-ref="trigger">
    
      <button type="button" class="py-1.5 ps-3 pe-2 inline-flex items-center gap-x-1.5 bg-white border border-gray-200 rounded-lg text-sm font-medium text-gray-800 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-200" aria-haspopup="menu" :aria-label="'Duration: ' + duration"><span x-text="duration"></span><svg class="shrink-0 size-4 text-gray-500 transition-transform" :class="open ? 'rotate-180' : ''" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    
  </div>

  <!-- Dropdown Menu -->
  <div x-show="open" 
       x-ref="menu"
       x-cloak
       @click.outside="open = false"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-95"
       class="fixed z-[9999] w-40 bg-white dark:bg-neutral-900 border border-transparent rounded-xl shadow-xl p-1"
       x-bind:style="{ top: top + 'px', left: left === 'auto' ? 'auto' : left + 'px', right: right === 'auto' ? 'auto' : right + 'px' }"
       role="menu"
       aria-orientation="vertical">
    
      
        
          <template x-for="item in durations" :key="item">
            <button type="button" role="menuitemradio" :aria-checked="duration === item"
              @click="setDuration(item); open = false"
              class="w-full flex items-center justify-between gap-x-3 py-1.5 px-2 rounded-lg text-[13px] text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:text-neutral-200 dark:hover:bg-neutral-800">
              <span x-text="item"></span>
              <svg x-show="duration === item" class="shrink-0 size-3.5 text-primary-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </template>
        
      
  </div>
</div>

      </div>
    </template>
  </div>



  
  
  <div class="mt-6 grid gap-4" role="radiogroup" aria-label="Plans"
       :class="plans.length === 1 ? 'sm:grid-cols-1' : plans.length === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-3'">
    <template x-for="plan in plans" :key="plan.id">
      <div role="radio" :tabindex="detailFor(plan) ? 0 : -1"
           :aria-checked="isSelected(plan)" :aria-disabled="!detailFor(plan)"

           class="row-span-3 grid grid-rows-subgrid gap-y-0 bg-white rounded-xl transition focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 dark:bg-neutral-800"
           :class="!detailFor(plan) ? 'border border-gray-200 opacity-60 cursor-not-allowed dark:border-neutral-700'
                   : isSelected(plan) ? 'ring-2 ring-primary-600 shadow-md cursor-pointer' : 'border border-gray-200 hover:border-gray-300 cursor-pointer dark:border-neutral-700'">

        
        <div class="px-4 pt-4 pb-3">
          <div class="flex items-start justify-between gap-x-3">
            <h3 class="font-semibold text-base text-gray-800 dark:text-neutral-200" x-text="plan.name"></h3>
            <span class="mt-0.5 shrink-0 size-5 inline-flex items-center justify-center rounded-full border-2 transition-colors"

            </span>
          </div>
          
          <template x-if="!truncated[plan.id]">
            <p class="mt-1 text-sm text-gray-500 line-clamp-2 dark:text-neutral-400" x-text="plan.description" x-init="$nextTick(() => measureDescription($el, plan))" @resize.window.debounce.150ms="measureDescription($el, plan)"></p>
          </template>
          <template x-if="truncated[plan.id]">
            
  
  
  
  
  

  <div x-data="{
         active: false,
         top: 0, left: 0,
         arrowOffset: '50%',
         updatePosition() {
           const trigger = this.$refs.trigger;
           const tip = this.$refs.tip;
           if (!trigger || !tip) return;
           const r = trigger.getBoundingClientRect();
           const placement = 'bottom';
           const gap = 8;
           // Force display to measure real dimensions (tip may still be hidden via x-show)
           const wasHidden = tip.style.display === 'none' || getComputedStyle(tip).display === 'none';
           if (wasHidden) tip.style.setProperty('display', 'block', 'important');
           const tipW = tip.offsetWidth || 100;
           const tipH = tip.offsetHeight || 28;
           if (wasHidden) tip.style.removeProperty('display');
           console.log('[tooltip] placement:', placement, '| trigger rect:', r, '| tipW:', tipW, '| tipH:', tipH);
           if (placement === 'top') {
             this.top  = r.top - tipH - gap;
             this.left = r.left + (r.width - tipW) / 2;
           } else if (placement === 'bottom') {
             this.top  = r.bottom + gap;
             this.left = r.left + (r.width - tipW) / 2;
           } else if (placement === 'left') {
             this.top  = r.top + (r.height - tipH) / 2;
             this.left = r.left - tipW - gap;
           } else if (placement === 'right') {
             this.top  = r.top + (r.height - tipH) / 2;
             this.left = r.right + gap;
           }
           // Clamp to viewport
           const minL = 8, maxL = window.innerWidth - tipW - 8;
           const origLeft = this.left;
           this.left = Math.max(minL, Math.min(this.left, maxL));
           if (placement === 'top' || placement === 'bottom') {
             const triggerCenter = r.left + r.width / 2;
             const shift = triggerCenter - this.left;
             this.arrowOffset = Math.max(8, Math.min(shift, tipW - 8)) + 'px';
           }
           console.log('[tooltip] final top:', this.top, '| left:', this.left);
         }
       }"
       @mouseenter="active = true; $nextTick(() => updatePosition())"
       @mouseleave="active = false"
       @focusin="active = true; $nextTick(() => updatePosition())"
       @focusout="active = false"
       @click="active = !active; if(active) $nextTick(() => updatePosition())"
       @click.outside="active = false"
       @keydown.escape.window="active = false"
       @scroll.window.capture.passive="if(active) updatePosition()"
       @resize.window.passive="if(active) updatePosition()"
       class="relative inline-flex items-center align-middle cursor-pointer">

    <!-- Trigger -->
    <div x-ref="trigger"
         class="inline-flex items-center justify-center"
         aria-describedby="tooltip-9328">
      <p class="mt-1 text-sm text-gray-500 line-clamp-2 dark:text-neutral-400" x-text="plan.description" x-init="$nextTick(() => measureDescription($el, plan))" @resize.window.debounce.150ms="measureDescription($el, plan)"></p>
    </div>

    <!-- Tooltip Card (fixed, escapes overflow containers) -->
    <div x-show="active"
         x-cloak
         x-ref="tip"
         id="tooltip-9328"
         role="tooltip"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         :style="{ top: top + 'px', left: left + 'px' }"
         class="fixed z-[9999] py-1.5 px-2.5 bg-gray-900 dark:bg-white text-xs font-medium text-white dark:text-neutral-800 rounded-md shadow-2xs break-words whitespace-normal max-w-xs">

      <span x-text="plan.description"></span>

      <!-- Arrow -->
      
        <span class="absolute bottom-full -translate-x-1/2 border-4 border-transparent border-b-gray-900 dark:border-b-white" :style="{ left: arrowOffset }"></span>
      
    </div>
  </div>

          </template>
        </div>

        
        <div class="px-4 pb-3">
          <template x-if="detailFor(plan)">
            <p class="flex flex-wrap items-baseline gap-x-1.5">

          </li>
        </ul>
      </div>
    </template>

    <div class="lg:hidden mt-4">
      <div class="-mx-4 px-4 overflow-x-auto">
        <div class="inline-flex gap-1 p-1 rounded-lg bg-gray-100 dark:bg-neutral-700" role="group" aria-label="Plans">

          <template x-for="course in allCourses" :key="course">

          <template x-for="benefit in benefits" :key="benefit.id">

              <span x-show="!includes(plan, benefit)"><svg class="mx-auto shrink-0 size-4 text-gray-300 dark:text-neutral-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
            </div>

    <div class="hidden lg:block mt-4 border border-gray-200 rounded-xl overflow-hidden dark:border-neutral-700">
