name: CI

on:
  push:
    branches: ["main"]
    # Root Markdown files and docs/ aren't part of the site
    paths-ignore:
      - '*.md'
      - 'docs/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build without holding the gh-pages lock. A newer push to main cancels this
  # build: its deploy will include everything anyway.
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: main-build
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # Reuse installed packages until a lockfile or the Node version changes
      - id: node
        run: echo "version=$(node -v)" >> "$GITHUB_OUTPUT"

      - id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            src/simba/node_modules
            src/odinhire/node_modules
            src/limeread/node_modules
            src/testpress/node_modules
          key: deps-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json', 'src/simba/package-lock.json', 'src/odinhire/package-lock.json', 'src/limeread/package-lock.json', 'src/testpress/package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm run setup:ci

      # Product CSS is committed and copied as-is, so CI doesn't rebuild it
      - name: Build
        run: npm run build:ci

      # Packed as one file: the artifact upload rejects some file names
      # in public/ (for example Windows ":Zone.Identifier" files in img/)
      - name: Pack site
        run: tar -cf site.tar -C public .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar
          retention-days: 1

  # Only the push to gh-pages is queued with PR preview deploys, so the two
  # never write to gh-pages at the same time.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: gh-pages-publisher
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Unpack site
        run: mkdir public && tar -xf site.tar -C public && rm site.tar

      # Previews whose removal job GitHub cancelled get removed here instead.
      # Never blocks the deploy.
      - name: Remove previews of closed PRs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: .github/scripts/remove-closed-previews.sh

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: public
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
