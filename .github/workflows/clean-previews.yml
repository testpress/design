name: Remove previews of closed PRs

# Run by hand from the Actions tab. Start with "Only list" on to see what
# would be removed, then run again with it off.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the previews that would be removed
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Same queue as the main and preview deploys, so nothing else writes to
    # gh-pages while this runs
    concurrency:
      group: gh-pages-publisher
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Remove previews of closed PRs
        run: .github/scripts/remove-closed-previews.sh
