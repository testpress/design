<!-- Prototype-only control: switch page states for review. Not part of the product UI. -->
<div x-data="{ open: false }" class="fixed bottom-5 end-5 z-60">
  <div x-show="open" x-cloak x-transition @click.away="open = false"
    class="mb-2 w-60 p-3 space-y-3 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-xl text-sm">
    <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground-1">Prototype states</p>
    <div class="space-y-1.5">
      <p class="text-foreground">Book status</p>
      <div class="flex gap-1.5">
        <button type="button" @click="status = 'published'" :class="status === 'published' ? 'bg-primary text-primary-foreground' : 'bg-surface text-foreground'" class="py-1 px-2 rounded-md text-xs font-medium">Published</button>
        <button type="button" @click="status = 'draft'" :class="status === 'draft' ? 'bg-primary text-primary-foreground' : 'bg-surface text-foreground'" class="py-1 px-2 rounded-md text-xs font-medium">Draft</button>
      </div>
    </div>
    <div class="space-y-1.5">
      <p class="text-foreground">Preview result</p>
      <div class="flex gap-1.5">
        <button type="button" @click="demoFail = false; preview = 'idle'" :class="!demoFail ? 'bg-primary text-primary-foreground' : 'bg-surface text-foreground'" class="py-1 px-2 rounded-md text-xs font-medium">Opens</button>
        <button type="button" @click="demoFail = true; preview = 'idle'" :class="demoFail ? 'bg-primary text-primary-foreground' : 'bg-surface text-foreground'" class="py-1 px-2 rounded-md text-xs font-medium">Fails</button>
      </div>
    </div>
  </div>
  <button type="button" @click="open = !open" aria-label="Prototype states"
    class="size-11 inline-flex justify-center items-center rounded-full bg-gray-900 text-white shadow-lg hover:bg-gray-800 dark:bg-white dark:text-gray-900">
    <i class="shrink-0 size-5" data-lucide="flask-conical"></i>
  </button>
</div>
