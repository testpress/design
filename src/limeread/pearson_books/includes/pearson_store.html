<script>
  document.addEventListener('alpine:init', () => {
    // Form state for a Pearson book. Access (visibility + groups) is shared with
    // the upload form through $store.publish, set by visibilityManager.
    Alpine.store('pearson', {
      isbn: '',
      isbnTouched: false,
      metadata: {
        title: '',
        author: '',
        publisher: 'Pearson',
        publication_year: '',
        edition: '',
        language: '',
        subject: '',
        description: ''
      },
      coverUploaded: false,

      get isbnDigits() {
        return this.isbn.replace(/[\s-]/g, '').toUpperCase();
      },
      get isIsbnValid() {
        const d = this.isbnDigits;
        return /^\d{13}$/.test(d) || /^\d{9}[\dX]$/.test(d);
      },
      get isbnError() {
        if (!this.isbnTouched || !this.isbn.trim()) return '';
        return this.isIsbnValid ? '' : 'Enter a 10 or 13-digit ISBN.';
      },
      get isDetailsComplete() {
        const m = this.metadata;
        return !!(m.title.trim() && m.author.trim() && m.language && m.subject);
      },
      get isAccessConfigured() {
        return Alpine.store('publish').isAccessConfigured;
      },
      get accessSummary() {
        return Alpine.store('publish').accessSummary;
      },
      get isReady() {
        return this.isIsbnValid && this.isDetailsComplete && this.coverUploaded && this.isAccessConfigured;
      },
      get canSaveDraft() {
        return this.isIsbnValid && this.metadata.title.trim();
      }
    });
  });
</script>
