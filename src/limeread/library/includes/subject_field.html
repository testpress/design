{# Searchable subject dropdown. Needs `metadata` in the Alpine scope and the helpers in scripts/ebook_publish_validator.html. #}
        <div x-data="subjectSelect({{ (subjectOptions or ['Fiction', 'Non-Fiction', 'Science', 'Technology', 'History', 'Biography', 'Business', 'Education', 'Philosophy', 'Art', 'Travel', 'Health']) | dump | replace('"', "'") }})">
          <label class="block mb-2 text-sm font-medium text-foreground">
            Subject <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div x-ref="subjectTrigger" @click="toggle()"
              class="py-1.5 sm:py-2 px-3 flex items-center justify-between w-full bg-layer border border-layer-line rounded-lg sm:text-sm text-layer-foreground cursor-pointer hover:bg-layer-hover focus:outline-hidden transition-colors">
              <span x-text="metadata.subjects[0] || 'Select Subject'"
                :class="!metadata.subjects[0] && 'text-muted-foreground-1'"></span>
              <i class="shrink-0 size-4 text-muted-foreground-1" data-lucide="chevron-down"></i>
            </div>

            <!-- Dropdown -->
            <div x-show="open" @click.away="open = false" x-cloak x-transition
              :class="position === 'bottom' ? 'top-full mt-1' : 'bottom-full mb-1'"
              class="absolute z-50 w-full max-h-60 p-1 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-lg shadow-xl overflow-hidden flex flex-col">
              <div class="p-1">
                <input type="text" x-model="search" placeholder="Search subjects..."
                  class="block w-full text-xs sm:text-sm bg-layer border border-layer-line rounded-md text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus py-1.5 px-2">
              </div>
              <div
                class="overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
                <!-- Auto-detected Subject Item -->
                <template x-if="detectedMetadata.subject && !search">
                  <div @click="select(detectedMetadata.subject)"
                    class="py-2 px-3 w-full text-sm text-gray-800 dark:text-neutral-200 cursor-pointer hover:bg-gray-100 dark:hover:bg-neutral-800 rounded-md flex items-center justify-between">
                    <div class="flex items-center gap-x-2 truncate">
                      <span x-text="detectedMetadata.subject" class="truncate font-medium"></span>
                      <span
                        class="py-0.5 px-1.5 rounded-full text-[10px] font-medium bg-primary/10 text-primary border border-primary/20 shrink-0">Auto
                        detected</span>
                    </div>
                    <template x-if="metadata.subjects.includes(detectedMetadata.subject)">
                      <svg class="shrink-0 size-3.5 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                    </template>
                  </div>
                </template>
                <template x-for="option in filteredOptions" :key="option">
                  <div @click="select(option)"
                    class="py-2 px-3 w-full text-sm text-gray-800 dark:text-neutral-200 cursor-pointer hover:bg-gray-100 dark:hover:bg-neutral-800 rounded-md flex items-center justify-between">
                    <span x-text="option"></span>
                    <template x-if="metadata.subjects.includes(option)">
                      <svg class="shrink-0 size-3.5 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                    </template>
                  </div>
                </template>

                <!-- 
                DEVELOPER NOTE: Empty State Placeholder
                Use this when the database has zero existing subjects.
                <div class="py-10 px-3 text-center">
                  <p class="text-sm text-gray-500 font-medium">No subjects available</p>
                  <p class="text-xs text-muted-foreground-1 mt-1">Start typing to create a new subject</p>
                </div>
                -->

                <!-- No Results / Add New Subject -->
                <template x-if="filteredOptions.length === 0 && search">
                  <div @click="select(search)"
                    class="py-2.5 px-3 w-full text-sm text-gray-800 dark:text-neutral-200 cursor-pointer hover:bg-gray-100 dark:hover:bg-neutral-800 rounded-md border-t border-gray-100 dark:border-neutral-800 mt-1">
                    <div class="flex items-center gap-x-2">
                      <svg class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
                      <span>Add "<span x-text="search" class="font-medium"></span>" as new subject</span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
