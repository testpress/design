<div class="px-5 max-w-340 mx-auto flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 sm:gap-5">
  <div class="flex items-center gap-4">
    <a :href="previewPath + '/limeread/create/?state=choose'" aria-label="Back to Add Ebook"
      class="size-9.5 shrink-0 inline-flex justify-center items-center rounded-xl bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus">
      <i class="shrink-0 size-4" data-lucide="arrow-left"></i>
    </a>
    <div>
      <h1 class="text-lg md:text-xl font-semibold text-foreground">
        Add Pearson Ebook
      </h1>
      <p class="text-sm text-muted-foreground-1">
        Opens in Pearson reader
      </p>
    </div>
  </div>

  <div class="flex justify-end items-center gap-x-2">
    <a :href="$store.pearson.canSaveDraft ? previewPath + '/limeread/detail/?state=pearson_draft' : null"
      :aria-disabled="!$store.pearson.canSaveDraft"
      :class="!$store.pearson.canSaveDraft && 'opacity-50 pointer-events-none'"
      class="py-2 px-3 inline-flex justify-center items-center whitespace-nowrap bg-layer border border-layer-line text-layer-foreground text-sm font-medium rounded-lg shadow-2xs hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus">
      Save as draft
    </a>
    <a :href="$store.pearson.isReady ? previewPath + '/limeread/detail/?state=pearson' : null"
      :aria-disabled="!$store.pearson.isReady"
      :class="!$store.pearson.isReady && 'opacity-50 pointer-events-none'"
      class="py-2 px-3 inline-flex justify-center items-center gap-x-2 whitespace-nowrap bg-primary border border-primary-line text-primary-foreground text-sm font-medium rounded-lg shadow-2xs hover:bg-primary-hover focus:outline-hidden focus:bg-primary-focus">
      Publish
    </a>
  </div>
</div>
