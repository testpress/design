  <div class="flex flex-col bg-card border border-card-line rounded-xl shadow-2xs">
    <!-- Header -->
    <div class="py-3 px-5 flex justify-between items-center gap-x-5 border-b border-card-header rounded-t-xl">
      <h2 class="inline-block font-semibold text-foreground">
        Visibility and Access Control
      </h2>
    </div>
    <!-- End Header -->

    <!-- Body -->
    <div x-data="visibilityManager()" class="p-5 space-y-4">
      <!-- Checkbox Grid -->
      <div class="grid lg:grid-cols-2 gap-3 lg:gap-5">
        <!-- Checkbox -->
        <label for="hs-pro-esdo1"
          class="py-3 px-4 flex text-sm bg-layer text-layer-foreground rounded-xl cursor-pointer ring-1 ring-layer-line has-checked:ring-2 has-checked:ring-primary-checked">
          <input type="radio" id="hs-pro-esdo1" x-model="visibility"
            class="shrink-0 mt-0.5 bg-transparent border-layer-line text-primary rounded-full focus:ring-0 focus:ring-offset-0 checked:bg-primary-checked checked:border-primary-checked"
            value="Public" name="hs-pro-esdo">
          <span class="grow px-4 space-y-1">
            <span class="block font-medium">
              Public
            </span>
            <span class="block text-sm/6 text-muted-foreground-1">
              Visible and borrowable by all eligible members across your organization.
            </span>
          </span>
        </label>
        <!-- End Checkbox -->
        <!-- Checkbox -->
        <label for="hs-pro-esdo2"
          class="py-3 px-4 flex text-sm bg-layer text-layer-foreground rounded-xl cursor-pointer ring-1 ring-layer-line has-checked:ring-2 has-checked:ring-primary-checked">
          <input type="radio" id="hs-pro-esdo2" x-model="visibility"
            class="shrink-0 mt-0.5 bg-transparent border-layer-line text-primary rounded-full focus:ring-0 focus:ring-offset-0 checked:bg-primary-checked checked:border-primary-checked"
            value="Restricted" name="hs-pro-esdo">
          <span class="grow px-4 space-y-1">
            <span class="block font-medium">
              Restricted
            </span>
            <span class="block text-sm/6 text-muted-foreground-1">
              Only selected access groups can discover and borrow this ebook.
            </span>
          </span>
        </label>
      </div>

      <div x-show="visibility === 'Restricted'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="pt-2">
        <div class="flex justify-between items-center mb-2">
          <label class="block text-sm font-medium text-foreground">
            Access Groups
          </label>
          <a href="javascript:;" @click="showNewGroupModal = true" class="text-xs font-medium text-primary hover:underline transition-all">
            Create new group
          </a>
        </div>
        
        <div class="relative">
          <!-- Selected Tags / Trigger -->
          <div x-ref="trigger" @click="toggle()" 
               class="relative ps-0.5 pe-9 min-h-11 flex items-center flex-wrap w-full bg-layer border border-layer-line rounded-lg text-start text-sm cursor-pointer">
            
            <template x-if="accessGroups.length === 0">
              <span class="p-2 text-muted-foreground-1">Select access groups...</span>
            </template>

            <template x-for="id in accessGroups" :key="id">
              <div class="flex flex-nowrap items-center text-nowrap relative z-10 bg-card border border-card-line rounded-full p-1 m-1 transition-all">
                <div class="whitespace-nowrap text-foreground ps-1 text-xs font-medium" x-text="options.find(o => o.id === id)?.name"></div>
                <div @click.stop="accessGroups = accessGroups.filter(i => i !== id)" 
                     class="inline-flex shrink-0 justify-center items-center size-4 ms-2 rounded-full bg-layer-hover text-muted-foreground-1 hover:text-foreground focus:outline-none text-xs cursor-pointer">
                  <svg class="shrink-0 size-2.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </div>
              </div>
            </template>

            <div class="absolute top-1/2 end-3 -translate-y-1/2">
              <i class="shrink-0 size-4 text-muted-foreground-1" data-lucide="chevrons-up-down"></i>
            </div>
          </div>

          <!-- Dropdown -->
          <div x-show="open" @click.away="open = false" x-cloak x-transition
               :class="position === 'bottom' ? 'top-full mt-2' : 'bottom-full mb-2'"
               class="absolute z-50 w-full max-h-60 p-1 bg-dropdown border border-dropdown-line rounded-xl shadow-lg overflow-hidden flex flex-col">
            
            <!-- Search -->
            <div class="p-1">
              <input type="text" x-model="search" placeholder="Search groups..." 
                     class="block w-full text-xs sm:text-sm bg-layer border border-layer-line rounded-md text-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:ring-primary-focus py-1.5 px-2">
            </div>

            <!-- Options -->
            <div class="overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
              <template x-for="option in filteredOptions" :key="option.id">
                <div @click="if(accessGroups.includes(option.id)) { accessGroups = accessGroups.filter(i => i !== option.id) } else { accessGroups.push(option.id) }" 
                     class="py-2 px-3 w-full text-sm text-foreground cursor-pointer hover:bg-muted-hover rounded-md flex items-center justify-between">
                  <span x-text="option.name"></span>
                  <template x-if="accessGroups.includes(option.id)">
                    <svg class="shrink-0 size-3.5 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
                  </template>
                </div>
              </template>

              <!-- No Results -->
              <template x-if="filteredOptions.length === 0">
                <div class="py-4 px-3 text-sm text-muted-foreground-1 text-center">
                  No access groups found.
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- New Group Modal -->
      <template x-teleport="body">
        <div x-show="showNewGroupModal" 
             @keydown.escape.window="showNewGroupModal = false"
             class="fixed inset-0 z-100 flex items-center justify-center p-4 sm:p-6"
             x-cloak>
          <!-- Backdrop -->
          <div x-show="showNewGroupModal" 
               x-transition:enter="transition ease-out duration-300"
               x-transition:enter-start="opacity-0"
               x-transition:enter-end="opacity-100"
               x-transition:leave="transition ease-in duration-200"
               x-transition:leave-start="opacity-100"
               x-transition:leave-end="opacity-0"
               class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm dark:bg-black/60"
               @click="showNewGroupModal = false"></div>

          <!-- Modal Card -->
          <div x-show="showNewGroupModal" 
               x-transition:enter="transition ease-out duration-300"
               x-transition:enter-start="opacity-0 scale-95 translate-y-4"
               x-transition:enter-end="opacity-100 scale-100 translate-y-0"
               x-transition:leave="transition ease-in duration-200"
               x-transition:leave-start="opacity-100 scale-100 translate-y-0"
               x-transition:leave-end="opacity-0 scale-95 translate-y-4"
               class="relative w-full max-w-xl bg-card border border-card-line shadow-2xl rounded-xl overflow-hidden flex flex-col"
               @click.stop>
            
            <!-- Header -->
            <div class="py-2.5 px-4 flex justify-between items-center border-b border-card-header">
              <h2 class="font-medium text-foreground">Create New Group</h2>
              <button @click="showNewGroupModal = false" type="button" class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-layer-hover text-foreground hover:bg-muted-hover transition-colors">
                <span class="sr-only">Close</span>
                <i class="shrink-0 size-4" data-lucide="x"></i>
              </button>
            </div>

            <!-- Body -->
            <div class="p-4 space-y-5 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
              <div class="space-y-2">
                <label class="block text-sm font-medium text-foreground">
                  Group Name <span class="text-red-500">*</span>
                </label>
                <input type="text" x-model="newGroup.name" placeholder="e.g. Science Department"
                  class="py-1.5 sm:py-2 px-3 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-layer-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:z-10 focus:ring-primary-focus">
              </div>
              <div class="space-y-2">
                <label class="block text-sm font-medium text-foreground">
                  Description
                </label>
                <textarea x-model="newGroup.description" rows="3" placeholder="Briefly describe the access group..."
                  class="py-1.5 sm:py-2 px-3 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-layer-foreground placeholder:text-muted-foreground-1 focus:border-primary-focus focus:z-10 focus:ring-primary-focus resize-none"></textarea>
              </div>
            </div>

            <!-- Footer -->
            <div class="p-4 flex justify-end items-center gap-2 border-t border-card-header">
              <button @click="showNewGroupModal = false" type="button" 
                class="py-2 px-3 text-nowrap inline-flex justify-center items-center text-sm font-medium rounded-lg bg-card border border-card-line text-foreground shadow-2xs hover:bg-muted-hover transition-colors">
                Cancel
              </button>
              <button @click="saveNewGroup()" type="button" 
                class="py-2 px-3 text-nowrap inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg bg-primary border border-transparent text-primary-foreground shadow-2xs hover:bg-primary-hover transition-colors disabled:opacity-50 disabled:pointer-events-none"
                :disabled="!newGroup.name.trim()">
                Create group
              </button>
            </div>
          </div>
        </div>
      </template>

    </div>
    <!-- End Body -->
  </div>
