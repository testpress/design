---
tags: tpstreams
title: Unsubscribe from SDK Notifications | TPStreams
permalink: tpstreams/settings/sdk_notifications/unsubscribe/
---

{% extends "layouts/tpstreams/base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8" x-data="{
  unsubscribed: false,
  email: 'alex.dev@acme.org',
  platform: 'Android',
  orgName: 'Acme Corporation',
  init() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('email')) this.email = decodeURIComponent(params.get('email'));
    if (params.get('platform')) this.platform = decodeURIComponent(params.get('platform'));
    if (params.get('org')) this.orgName = decodeURIComponent(params.get('org'));
  }
}">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 shadow-sm border border-gray-200 rounded-2xl sm:px-10">
      
      <!-- Confirmation State (GET) -->
      <template x-if="!unsubscribed">
        <div class="space-y-6 text-center">
          <div class="mx-auto size-14 rounded-full bg-amber-50 text-amber-600 border border-amber-200 flex items-center justify-center">
            <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
          </div>

          <div>
            <h2 class="text-xl font-bold text-gray-900">Unsubscribe from SDK Updates</h2>
            <p class="mt-2 text-xs text-gray-500">
              You are about to unsubscribe <strong class="text-gray-800" x-text="email"></strong> from <strong class="text-gray-800" x-text="platform"></strong> SDK release notifications for <strong class="text-gray-800" x-text="orgName"></strong>.
            </p>
          </div>

          <div class="p-3 bg-gray-50 rounded-lg text-xs text-gray-600 border border-gray-200/80 text-left space-y-1">
            <p><span class="font-medium text-gray-800">Target Platform:</span> <span x-text="platform + ' SDK'"></span></p>
            <p><span class="font-medium text-gray-800">Organization:</span> <span x-text="orgName"></span></p>
            <p class="text-[11px] text-gray-400 pt-1">You will not receive emails for new versions, bug fixes, or breaking changes for this platform.</p>
          </div>

          <div class="pt-2">
            <button
              type="button"
              @click="unsubscribed = true"
              class="w-full py-2.5 px-4 text-sm font-semibold rounded-lg bg-red-600 text-white hover:bg-red-700 shadow-xs focus:outline-none focus:ring-2 focus:ring-red-500 transition"
            >
              Confirm Unsubscribe
            </button>
          </div>
        </div>
      </template>

      <!-- Completed Success State (POST) -->
      <template x-if="unsubscribed">
        <div class="space-y-6 text-center">
          <div class="mx-auto size-14 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200 flex items-center justify-center">
            <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>

          <div>
            <h2 class="text-xl font-bold text-gray-900">Successfully Unsubscribed</h2>
            <p class="mt-2 text-xs text-gray-500">
              <strong class="text-gray-800" x-text="email"></strong> has been removed from <strong class="text-gray-800" x-text="platform"></strong> SDK release notifications for <strong class="text-gray-800" x-text="orgName"></strong>.
            </p>
          </div>

          <div class="p-3 bg-emerald-50/50 rounded-lg text-xs text-emerald-800 border border-emerald-100">
            If you ever need to re-subscribe, simply ask your organization administrator to register your email in <strong>Settings &gt; SDK Notifications</strong>.
          </div>

          <div class="pt-2">
            <a
              href="/tpstreams/settings/sdk_notifications/"
              class="inline-flex items-center justify-center py-2 px-4 text-xs font-semibold rounded-lg bg-gray-900 text-white hover:bg-black transition"
            >
              Return to Settings
            </a>
          </div>
        </div>
      </template>

    </div>
  </div>
</div>
{% endblock %}
