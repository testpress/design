<div class="mt-4">
  <!-- Table State -->
  <template x-if="hasSubscriptions">
    <div class="flex flex-col bg-white border border-gray-200 shadow-sm rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50 text-left">
            <tr>
              <th scope="col" class="px-6 py-3 text-start text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Developer Email
              </th>
              <th scope="col" class="px-6 py-3 text-start text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Platform
              </th>
              <th scope="col" class="px-6 py-3 text-start text-xs font-semibold text-gray-500 uppercase tracking-wider">
                Subscribed On
              </th>
              <th scope="col" class="px-6 py-3 text-end text-xs font-semibold text-gray-500 uppercase">
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <template x-for="item in subscriptions" :key="item.id">
              <tr class="hover:bg-gray-50/70 transition duration-150">
                <!-- Email Column -->
                <td class="px-6 py-4 whitespace-nowrap">
                  <div class="flex items-center gap-x-3">
                    <span class="inline-flex items-center justify-center size-8 rounded-full bg-blue-50 text-blue-700 text-xs font-bold uppercase ring-1 ring-blue-600/20" x-text="item.email.slice(0, 2)">
                    </span>
                    <div>
                      <span class="block text-sm font-medium text-gray-900" x-text="item.email"></span>
                    </div>
                  </div>
                </td>

                <!-- Platform Column -->
                <td class="px-6 py-4 whitespace-nowrap">
                  <!-- Android -->
                  <template x-if="item.platform === 'android'">
                    <span class="inline-flex items-center gap-x-1.5 py-1 px-2.5 rounded-md text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200">
                      <img class="size-3.5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/android/android-original.svg" alt="Android">
                      Android
                    </span>
                  </template>
                  <!-- iOS -->
                  <template x-if="item.platform === 'ios'">
                    <span class="inline-flex items-center gap-x-1.5 py-1 px-2.5 rounded-md text-xs font-medium bg-orange-50 text-orange-800 border border-orange-200">
                      <img class="size-3.5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/swift/swift-original.svg" alt="iOS">
                      iOS
                    </span>
                  </template>
                  <!-- Flutter -->
                  <template x-if="item.platform === 'flutter'">
                    <span class="inline-flex items-center gap-x-1.5 py-1 px-2.5 rounded-md text-xs font-medium bg-sky-50 text-sky-800 border border-sky-200">
                      <img class="size-3.5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/flutter/flutter-original.svg" alt="Flutter">
                      Flutter
                    </span>
                  </template>
                  <!-- React Native -->
                  <template x-if="item.platform === 'react_native'">
                    <span class="inline-flex items-center gap-x-1.5 py-1 px-2.5 rounded-md text-xs font-medium bg-cyan-50 text-cyan-800 border border-cyan-200">
                      <img class="size-3.5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React Native">
                      React Native
                    </span>
                  </template>
                </td>

                <!-- Date Column -->
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="item.created_at">
                </td>

                <!-- Actions Column -->
                <td class="px-6 py-4 whitespace-nowrap text-end text-sm font-medium">
                  <button
                    type="button"
                    class="inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent text-gray-500 hover:text-red-600 disabled:opacity-50 disabled:pointer-events-none transition"
                    @click="promptDelete(item)"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 size-4">
                      <path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </template>

  <!-- Empty State -->
  <template x-if="!hasSubscriptions">
    <div class="flex flex-col items-center justify-center py-16 px-4 bg-white border border-gray-200 rounded-xl shadow-sm text-center">
      <div class="p-4 bg-blue-50 rounded-2xl mb-4 border border-blue-100">
        <svg class="size-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2zM9 9h6m-6 3h4" />
        </svg>
      </div>
      <h3 class="text-lg font-semibold text-gray-800">
        No SDK subscriptions yet
      </h3>
      <p class="mt-2 text-sm text-gray-500 max-w-md mx-auto">
        Add your Android, iOS, Flutter, or React Native developer emails to automatically notify them when playback fixes and new SDK versions are released.
      </p>
      <div class="mt-6">
        <button
          type="button"
          data-hs-overlay="#add-subscription-modal"
          class="py-2 px-3.5 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 transition"
        >
          <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Add First Subscription
        </button>
      </div>
    </div>
  </template>
</div>
