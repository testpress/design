<div
  id="confirm_delete_modal"
  class="hs-overlay hidden size-full fixed top-0 start-0 z-[200] overflow-x-hidden overflow-y-auto [--close-when-click-inside:true] pointer-events-none"
  role="dialog"
  tabindex="-1"
  aria-labelledby="delete_subscription_label"
>
  <div
    class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto h-[calc(100%-3.5rem)] min-h-[calc(100%-3.5rem)] flex items-center"
  >
    <div
      class="w-full max-h-full flex flex-col bg-white rounded-xl pointer-events-auto shadow-[0_10px_40px_10px_rgba(0,0,0,0.08)] border border-gray-100"
    >
      <!-- Header -->
      <div class="py-3 px-4 flex justify-between items-center border-b border-gray-100">
        <h3 id="delete_subscription_label" class="font-medium text-gray-800">
          Remove Subscription
        </h3>
        <button
          type="button"
          class="size-8 shrink-0 inline-flex justify-center items-center rounded-full border border-transparent bg-gray-100 text-gray-800 hover:bg-gray-200 focus:outline-none transition"
          aria-label="Close"
          data-hs-overlay="#confirm_delete_modal"
        >
          <span class="sr-only">Close</span>
          <svg
            class="shrink-0 size-4"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="p-4 flex gap-x-4">
        <div class="flex-shrink-0 h-10 w-10 flex items-center justify-center rounded-full bg-red-100">
          <svg
            class="h-5 w-5 text-red-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>

        <div class="grow">
          <p class="text-sm text-gray-800 font-medium">
            Are you sure you want to remove this subscription?
          </p>
          <p class="text-xs text-gray-500 mt-1">
            <template x-if="itemToDelete">
              <span>
                <strong><span x-text="itemToDelete.email"></span></strong> will no longer receive release notifications for the
                <strong class="uppercase"><span x-text="itemToDelete.platform_label || itemToDelete.platform"></span></strong> SDK.
              </span>
            </template>
          </p>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex justify-end items-center gap-x-2 py-3 px-4 border-t border-gray-100 bg-gray-50 rounded-b-xl">
        <button
          type="button"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none"
          data-hs-overlay="#confirm_delete_modal"
        >
          Cancel
        </button>
        <button
          type="button"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-red-600 text-white hover:bg-red-700 focus:outline-none transition"
          @click="deleteSubscription()"
        >
          Remove
        </button>
      </div>
    </div>
  </div>
</div>
