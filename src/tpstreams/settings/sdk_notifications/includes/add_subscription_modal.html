<div
  id="add-subscription-modal"
  class="hs-overlay hidden size-full fixed top-0 start-0 z-[200] overflow-x-hidden overflow-y-auto pointer-events-none"
  role="dialog"
  tabindex="-1"
  aria-labelledby="add-subscription-modal-label"
>
  <div
    class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-lg sm:w-full m-3 sm:mx-auto min-h-[calc(100%-3.5rem)] flex items-center"
  >
    <div
      class="w-full flex flex-col bg-white border border-gray-200 shadow-xl rounded-2xl pointer-events-auto"
    >
      <!-- Modal Header -->
      <div
        class="flex justify-between items-center gap-x-4 py-3.5 px-5 border-b border-gray-100 shrink-0"
      >
        <div class="grow min-w-0">
          <h3
            id="add-subscription-modal-label"
            class="font-semibold text-gray-800 text-lg"
          >
            Add SDK Subscription
          </h3>
          <p class="text-xs text-gray-500 mt-0.5">
            Register a developer to receive release notes for their specific platform. (Maximum of 5 subscriptions)
          </p>
        </div>
        <button
          type="button"
          class="size-8 shrink-0 inline-flex justify-center items-center rounded-full border border-transparent bg-gray-100 text-gray-600 hover:bg-gray-200 focus:outline-none transition"
          aria-label="Close"
          data-hs-overlay="#add-subscription-modal"
        >
          <span class="sr-only">Close</span>
          <svg
            class="shrink-0 size-4"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Form -->
      <form @submit.prevent="createSubscription()" class="flex flex-col flex-1">
        <div class="p-5 space-y-5 flex-1">

          <!-- Error Alert Banner (if any) -->
          <template x-if="errorMessage">
            <div class="p-3 bg-red-50 border border-red-200 rounded-lg flex items-start gap-x-2.5 text-xs text-red-700">
              <svg class="size-4 shrink-0 text-red-500 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <span x-text="errorMessage"></span>
            </div>
          </template>

          <!-- Email Input -->
          <div>
            <label for="subscriber-email" class="block text-sm font-medium text-gray-800 mb-1">
              Developer Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              id="subscriber-email"
              x-model="newEmail"
              @input="errorMessage = ''"
              placeholder="e.g. alex.chen@example.com"
              class="py-2.5 px-3.5 block w-full border border-gray-300 rounded-lg text-sm text-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder:text-gray-400"
              required
            />
            <p class="text-xs text-gray-500 mt-1.5">
              The address will be automatically lowercased and trimmed.
            </p>
          </div>

          <!-- Platform Selector (Cards/Tiles) -->
          <div>
            <label class="block text-sm font-medium text-gray-800 mb-2">
              SDK Platform <span class="text-red-500">*</span>
            </label>
            <div class="grid grid-cols-2 gap-2.5">
              <!-- Android -->
              <label
                class="flex items-center gap-x-3 p-3 border rounded-xl cursor-pointer transition"
                :class="newPlatform === 'android' ? 'border-blue-600 bg-blue-50/50 ring-1 ring-blue-600' : 'border-gray-200 hover:border-gray-300 bg-white'"
              >
                <input
                  type="radio"
                  name="platform"
                  value="android"
                  x-model="newPlatform"
                  @change="errorMessage = ''"
                  class="sr-only"
                />
                <div class="size-8 rounded-lg bg-emerald-50 border border-emerald-200 flex items-center justify-center shrink-0">
                  <img class="size-5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/android/android-original.svg" alt="Android">
                </div>
                <span class="text-sm font-semibold text-gray-900">Android</span>
              </label>

              <!-- iOS -->
              <label
                class="flex items-center gap-x-3 p-3 border rounded-xl cursor-pointer transition"
                :class="newPlatform === 'ios' ? 'border-blue-600 bg-blue-50/50 ring-1 ring-blue-600' : 'border-gray-200 hover:border-gray-300 bg-white'"
              >
                <input
                  type="radio"
                  name="platform"
                  value="ios"
                  x-model="newPlatform"
                  @change="errorMessage = ''"
                  class="sr-only"
                />
                <div class="size-8 rounded-lg bg-orange-50 border border-orange-200 flex items-center justify-center shrink-0">
                  <img class="size-5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/swift/swift-original.svg" alt="iOS">
                </div>
                <span class="text-sm font-semibold text-gray-900">iOS</span>
              </label>

              <!-- Flutter -->
              <label
                class="flex items-center gap-x-3 p-3 border rounded-xl cursor-pointer transition"
                :class="newPlatform === 'flutter' ? 'border-blue-600 bg-blue-50/50 ring-1 ring-blue-600' : 'border-gray-200 hover:border-gray-300 bg-white'"
              >
                <input
                  type="radio"
                  name="platform"
                  value="flutter"
                  x-model="newPlatform"
                  @change="errorMessage = ''"
                  class="sr-only"
                />
                <div class="size-8 rounded-lg bg-sky-50 border border-sky-200 flex items-center justify-center shrink-0">
                  <img class="size-5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/flutter/flutter-original.svg" alt="Flutter">
                </div>
                <span class="text-sm font-semibold text-gray-900">Flutter</span>
              </label>

              <!-- React Native -->
              <label
                class="flex items-center gap-x-3 p-3 border rounded-xl cursor-pointer transition"
                :class="newPlatform === 'react_native' ? 'border-blue-600 bg-blue-50/50 ring-1 ring-blue-600' : 'border-gray-200 hover:border-gray-300 bg-white'"
              >
                <input
                  type="radio"
                  name="platform"
                  value="react_native"
                  x-model="newPlatform"
                  @change="errorMessage = ''"
                  class="sr-only"
                />
                <div class="size-8 rounded-lg bg-cyan-50 border border-cyan-200 flex items-center justify-center shrink-0">
                  <img class="size-5 shrink-0" src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React Native">
                </div>
                <span class="text-sm font-semibold text-gray-900">React Native</span>
              </label>
            </div>
          </div>

        </div>

        <!-- Modal Footer -->
        <div class="flex justify-end items-center gap-x-2 py-3 px-5 border-t border-gray-100 bg-gray-50/50 rounded-b-2xl">
          <button
            type="button"
            class="py-2 px-3 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 focus:outline-none transition"
            data-hs-overlay="#add-subscription-modal"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="py-2 px-4 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
