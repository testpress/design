<div class="mx-auto mt-12 max-w-7xl flow-root 2xl:mt-14" x-show="totalLicenseRequests > 0">
  <div class="-my-2 -mx-4 overflow-visible sm:-mx-6 lg:-mx-8">
    <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
      <div class="shadow ring-1 ring-black ring-opacity-5 md:rounded-lg">
        <table class="min-w-full divide-y divide-gray-300">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="w-1/2 py-2.5 px-5 text-left text-sm font-normal text-gray-500 whitespace-nowrap">
                {% include "./date_sort_header.html" %}
              </th>
              <th scope="col" class="w-1/2 py-2.5 px-5 text-left text-sm font-normal text-gray-500 whitespace-nowrap">
                {% include "./license_requests_sort_header.html" %}
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 bg-white">
            <template x-for="day in daysInSelectedMonth" :key="day.date">
              <tr>
                <td class="whitespace-nowrap px-5 py-4 text-sm font-medium text-gray-900" x-text="day.label"></td>
                <td class="whitespace-nowrap px-5 py-4 text-sm text-gray-500" x-text="formatNumber(day.count)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
