<script>
  function interactiveLiveStream() {
    const params = new URLSearchParams(window.location.search);
    const STAGES = ['scheduled', 'ready', 'live', 'completed'];

    return {
      stage: STAGES.includes(params.get('state')) ? params.get('state') : 'scheduled',

      // Join link: one per live stream. Name is always asked; email and phone are the host's choice.
      hasJoinLink: params.get('link') !== 'none',
      collectEmail: false,
      collectPhone: false,
      draftEmail: false,
      draftPhone: false,

      // Invite participants card: 'link' or 'embed'
      inviteTab: 'link',

      // Activity steps reached so far, used to show the timeline up to the current stage.
      get stageIndex() {
        return STAGES.indexOf(this.stage);
      },
      get isBeforeLive() {
        return this.stage === 'scheduled' || this.stage === 'ready';
      },
      get guestFields() {
        return ['Name', this.collectEmail && 'Email', this.collectPhone && 'Phone number'].filter(Boolean);
      },

      // In the product, Go Live starts the session and opens the live room in a new tab in one
      // request, and Stop live completes it straight away, so neither has a waiting state.
      goLive() {
        this.stage = 'live';
      },
      stopLive() {
        this.stage = 'completed';
      },

      openJoinLinkModal() {
        this.draftEmail = this.hasJoinLink ? this.collectEmail : false;
        this.draftPhone = this.hasJoinLink ? this.collectPhone : false;
        this.$dispatch('open-modal-join-link');
      },
      saveJoinLink() {
        this.collectEmail = this.draftEmail;
        this.collectPhone = this.draftPhone;
        this.hasJoinLink = true;
      },
    };
  }
</script>
