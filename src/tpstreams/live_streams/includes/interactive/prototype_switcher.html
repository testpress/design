{# Prototype only: state switcher, bottom right. Same style as the one on the create live stream form. #}
<div
  x-data="{
    open: false,
    // Has this browser opened the switcher before? (only stops the pulse; storage may be unavailable)
    opened: (() => { try { return localStorage.getItem('ls-prototype-opened') === '1'; } catch (e) { return false; } })(),
    seen() { this.opened = true; try { localStorage.setItem('ls-prototype-opened', '1'); } catch (e) {} },
    stages: [
      ['scheduled', 'Scheduled'],
      ['ready', 'Not scheduled'],
      ['live', 'Live'],
      ['completed', 'Completed'],
    ],
  }"
  class="fixed bottom-3 end-3 md:bottom-4 md:end-4 z-[60]"
  @click.outside="open = false"
  @keydown.escape="open = false">
  <div x-show="open" x-transition.opacity x-cloak
       class="absolute bottom-full end-0 mb-2 w-64 p-1 bg-white border border-gray-200 rounded-xl shadow-lg">
    <p class="px-2 pt-1 pb-1.5 text-[11px] font-medium uppercase tracking-wide text-gray-400">Live stream</p>
    <template x-for="s in stages" :key="s[0]">
      <button type="button" @click="stage = s[0]"
              class="w-full flex items-center justify-between gap-x-3 py-1.5 px-2 rounded-lg text-[13px] text-start hover:bg-gray-100"
              :class="stage === s[0] ? 'text-primary-700 font-medium' : 'text-gray-800'">
        <span x-text="s[1]"></span>
        <svg x-show="stage === s[0]" class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
    <div class="my-1 border-t border-gray-100"></div>
    <p class="px-2 pt-1 pb-1.5 text-[11px] font-medium uppercase tracking-wide text-gray-400">Join link</p>
    <template x-for="s in [[true, 'Created'], [false, 'Not created yet']]" :key="s[1]">
      <button type="button" @click="hasJoinLink = s[0]"
              class="w-full flex items-center justify-between gap-x-3 py-1.5 px-2 rounded-lg text-[13px] text-start hover:bg-gray-100"
              :class="hasJoinLink === s[0] ? 'text-primary-700 font-medium' : 'text-gray-800'">
        <span x-text="s[1]"></span>
        <svg x-show="hasJoinLink === s[0]" class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
  <!-- Labelled and dark so reviewers spot it and can't mistake it for product UI; pulses until first opened -->
  <button type="button" @click="open = !open; seen()" :aria-expanded="open"
          class="relative inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full bg-gray-900 text-white text-xs font-medium shadow-lg opacity-90 hover:opacity-100 focus:opacity-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-gray-900 transition">
    <span x-show="!opened" class="absolute -top-0.5 -end-0.5 flex size-2.5"><span class="absolute inline-flex size-full rounded-full bg-amber-400 opacity-75 animate-ping"></span><span class="relative inline-flex size-2.5 rounded-full bg-amber-400"></span></span>
    <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
    Prototype states
  </button>
</div>
