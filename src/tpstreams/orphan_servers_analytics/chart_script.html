<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script id="chart-dates-data" type="application/json">["2026-07-23", "2026-07-24", "2026-07-25", "2026-07-26", "2026-07-27", "2026-07-28", "2026-07-29", "2026-07-30", "2026-07-31", "2026-08-01"]</script>
<script id="chart-wasted-hours-data" type="application/json">[20, 25, 22, 30, 28, 12, 15, 14, 18, 10]</script>

<script>
  window.addEventListener('load', () => {
    let chartDates = ['Jan', 'Feb', 'Mar', 'Apr', 'May'];
    let chartData = [10, 20, 15, 25, 30];

    try {
      const datesText = document.getElementById('chart-dates-data').textContent.trim();
      const hoursText = document.getElementById('chart-wasted-hours-data').textContent.trim();
      if (datesText && datesText !== "" && !datesText.includes("{" + "{")) chartDates = JSON.parse(datesText);
      if (hoursText && hoursText !== "" && !hoursText.includes("{" + "{")) chartData = JSON.parse(hoursText);
    } catch (e) {
      console.warn("Could not parse dynamic chart data");
    }

    const clearFilterBadge = document.getElementById('clear-filter-badge');
    const clearFilterText = document.getElementById('clear-filter-text');
    const rows = document.querySelectorAll('.anomaly-row');
    const activeTab = document.getElementById('active-anomalies-tab');
    const resolvedTab = document.getElementById('historical-orphans-tab');

    let chartInstance = null;

    // 1. Reset logic
    const resetTableAndBadge = () => {
      rows.forEach(row => row.style.display = '');
      if (clearFilterBadge) {
        clearFilterBadge.classList.add('hidden');
        clearFilterBadge.style.display = '';
      }
      if (chartInstance) {
        chartInstance.updateSeries([{ name: 'Wasted Hours', data: chartData }]);
      }
    };

    // 2. ApexCharts Single Series Bar Chart
    const buildChartOptions = () => ({
      chart: {
        type: 'bar',
        height: 250,
        toolbar: { show: false },
        zoom: { enabled: false },
        events: {
          dataPointSelection: function(event, chartContext, config) {
            const dateClicked = chartDates[config.dataPointIndex];
            if (dateClicked) {
              let filterText = dateClicked;
              const parts = dateClicked.split('-');
              if (parts.length === 3) {
                filterText = `${parts[2]}-${parts[1]}-${parts[0]}`;
              }
              if (clearFilterText) {
                clearFilterText.textContent = filterText;
              }
              if (clearFilterBadge) {
                clearFilterBadge.classList.remove('hidden');
                clearFilterBadge.style.display = 'inline-flex';
              }
              rows.forEach(row => {
                row.style.display = row.getAttribute('data-date') === dateClicked ? '' : 'none';
              });
            }
          }
        }
      },
      series: [
        {
          name: 'Wasted Hours',
          data: chartData
        }
      ],
      plotOptions: {
        bar: {
          horizontal: false,
          columnWidth: '25%',
          borderRadius: 4
        }
      },
      dataLabels: {
        enabled: false
      },
      stroke: {
        show: true,
        width: 4,
        colors: ['transparent']
      },
      xaxis: {
        categories: chartDates,
        axisBorder: { show: false },
        axisTicks: { show: false },
        labels: {
          style: {
            colors: '#9ca3af',
            fontSize: '13px',
            fontFamily: 'Inter, ui-sans-serif, system-ui',
            fontWeight: 400
          },
          formatter: function (value) {
            const d = new Date(value);
            if (!isNaN(d)) {
              return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
            return value;
          }
        }
      },
      yaxis: {
        labels: {
          align: 'left',
          style: {
            colors: '#9ca3af',
            fontSize: '13px',
            fontFamily: 'Inter, ui-sans-serif, system-ui',
            fontWeight: 400
          },
          formatter: (value) => value >= 1000 ? `${value / 1000}k` : value
        }
      },
      states: {
        hover: {
          filter: {
            type: 'darken',
            value: 0.9
          }
        }
      },
      tooltip: {
        y: {
          formatter: (value) => `${value} hrs`
        },
        custom: function ({series, seriesIndex, dataPointIndex, w}) {
          let dateStr = chartDates[dataPointIndex];
          const dateObj = new Date(dateStr);
          if (!isNaN(dateObj)) {
            dateStr = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
          }
          const val = series[seriesIndex][dataPointIndex];
          let formattedVal = val >= 1000 ? (val / 1000) + 'k' : val;
          return `
            <div class="px-2 py-1">
              <div class="text-sm font-medium text-gray-800 dark:text-neutral-200 mb-1.5">${dateStr}</div>
              <div class="flex items-center gap-x-2 text-sm">
                <span class="size-2 rounded-sm bg-blue-600"></span>
                <span class="text-gray-500 dark:text-neutral-400">Wasted Hours:</span>
                <span class="font-medium text-gray-800 dark:text-neutral-200 ml-auto">${formattedVal}</span>
              </div>
            </div>
          `;
        }
      },
      fill: {
        opacity: 1
      },
      colors: ['#2563eb'],
      grid: {
        strokeDashArray: 4,
        borderColor: '#e5e7eb',
        padding: {
          top: 0,
          right: 0,
          bottom: 0,
          left: 10
        }
      }
    });

    const chartDom = document.querySelector('#hs-single-bar-chart');
    if (chartDom) {
      chartInstance = new ApexCharts(chartDom, buildChartOptions());
      chartInstance.render();
    }

    // 3. Leaderboard Click (Filter by Org)
    document.querySelectorAll('.org-filter-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const orgName = e.currentTarget.getAttribute('data-filter-org');
        if (orgName) {
          if (clearFilterText) {
            clearFilterText.textContent = orgName;
          }
          if (clearFilterBadge) {
            clearFilterBadge.classList.remove('hidden');
            clearFilterBadge.style.display = 'inline-flex';
          }
          
          rows.forEach(row => {
            row.style.display = row.getAttribute('data-org') === orgName ? '' : 'none';
          });
          
          if (chartInstance) {
            const newChartData = chartDates.map(dateKey => {
               let sum = 0;
               rows.forEach(row => {
                 if (row.getAttribute('data-org') === orgName && row.getAttribute('data-date') === dateKey) {
                   sum += parseInt(row.getAttribute('data-hours') || '0', 10);
                 }
               });
               return sum;
            });
            chartInstance.updateSeries([{ name: 'Wasted Hours', data: newChartData }]);
          }
        }
      });
    });

    // 4. Tab Toggle & Clear Filters
    if (clearFilterBadge) {
      const clearBtn = clearFilterBadge.querySelector('a');
      if (clearBtn) {
        clearBtn.addEventListener('click', (e) => {
          e.preventDefault();
          resetTableAndBadge();
        });
      }
    }

    const activeClass = "px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-gray-800 text-sm font-medium rounded-lg hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:bg-gray-800 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800 dark:after:bg-white";
    const inactiveClass = "px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-gray-500 hover:text-gray-800 text-sm font-medium rounded-lg hover:bg-gray-100 focus:outline-hidden focus:bg-gray-100 dark:text-neutral-400 dark:hover:text-neutral-200 dark:hover:bg-neutral-800 dark:focus:bg-neutral-800";

    const updateTabs = (clickedTab, otherTab) => {
      if (clickedTab && otherTab) {
        clickedTab.className = activeClass;
        otherTab.className = inactiveClass;
      }
    };

    if (activeTab) {
      activeTab.addEventListener('click', (e) => {
        e.preventDefault();
        updateTabs(activeTab, resolvedTab);
      });
    }

    if (resolvedTab) {
      resolvedTab.addEventListener('click', (e) => {
        e.preventDefault();
        updateTabs(resolvedTab, activeTab);
      });
    }

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  });
</script>
