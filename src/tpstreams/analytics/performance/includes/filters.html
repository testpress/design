{% from "src/ui-system/components/date-picker.html" import date_picker %}
<!-- Toolbar: Search + Filters -->
<div class="pb-4 border-b border-gray-200 dark:border-neutral-700 flex flex-wrap items-center justify-between gap-2">

  <!-- Search (left) -->
  <div class="relative max-w-xs w-full sm:w-auto">
    <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-3.5">
      <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    </div>
    <input type="text" id="content-perf-search"
      class="py-[7px] ps-10 pe-8 block w-full bg-gray-100 border-transparent rounded-lg text-sm placeholder:text-gray-500 focus:border-primary-500 focus:ring-primary-600 dark:bg-neutral-700 dark:border-transparent dark:text-neutral-400 dark:placeholder:text-neutral-400 dark:focus:ring-neutral-600"
      placeholder="Search by video title...">
  </div>

  <!-- Right controls -->
  <div class="flex items-center gap-2 flex-wrap">

    <!-- Date Range Dropdown -->
    <div class="hs-dropdown [--placement:bottom-start] [--auto-close:inside] relative inline-flex" x-data="{ dateLabel: 'Last 30 days', showCustom: false }">
      <button type="button" id="cp-date-toggle"
        class="py-[7px] px-3 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-200 dark:hover:bg-neutral-700"
        aria-haspopup="menu" aria-expanded="false">
        <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>
        </svg>
        <span x-text="dateLabel"></span>
        <svg class="shrink-0 size-3.5 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="hs-dropdown-menu hs-dropdown-open:opacity-100 w-44 transition-[opacity,margin] duration opacity-0 hidden z-20 bg-white rounded-xl shadow-[0_10px_40px_10px_rgba(0,0,0,0.08)] border border-gray-200 py-1 dark:bg-neutral-900 dark:border-neutral-700" role="menu" aria-labelledby="cp-date-toggle">
        <button type="button" @click="dateLabel='Last 7 days'; try { window.HSDropdown.getInstance($el.closest('.hs-dropdown')).close(); } catch(e){}" class="w-full flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">Last 7 days</button>
        <button type="button" @click="dateLabel='Last 30 days'; try { window.HSDropdown.getInstance($el.closest('.hs-dropdown')).close(); } catch(e){}" class="w-full flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">Last 30 days</button>
        <button type="button" @click="dateLabel='Last 90 days'; try { window.HSDropdown.getInstance($el.closest('.hs-dropdown')).close(); } catch(e){}" class="w-full flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">Last 90 days</button>
        <button type="button" @click="dateLabel='All time'; try { window.HSDropdown.getInstance($el.closest('.hs-dropdown')).close(); } catch(e){}" class="w-full flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">All time</button>
        <div class="my-1 border-t border-gray-100 dark:border-neutral-700"></div>
        
        <!-- Custom range — click opens left flyout -->
        <div class="relative" @click.stop>
          <button type="button"
            @click="showCustom = !showCustom"
            class="w-full flex items-center justify-between gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-200 dark:hover:bg-neutral-700"
            role="menuitem">
            Custom range
            <i data-lucide="chevron-right" class="shrink-0 size-3.5 text-gray-400"></i>
          </button>

          <!-- Flyout: below on mobile, LEFT on sm+ -->
          <div x-show="showCustom" x-cloak @click.stop
               class="absolute top-full left-0 mt-1 sm:top-0 sm:right-full sm:left-auto sm:mt-0 sm:mr-2 z-50 shadow-xl rounded-xl border border-gray-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 [&_.shadow-lg]:shadow-none">
            <div @click="
              if ($event.target.innerText?.trim() === 'Apply') {
                var val = $el.querySelector('input[name=perf_custom_date]')?.value;
                if (val) {
                  dateLabel = val;
                  showCustom = false;
                  try { window.HSDropdown.getInstance($el.closest('.hs-dropdown')).close(); } catch(e){}
                }
              }
            ">
              {{ date_picker(name="perf_custom_date", inline=true, range=true, show_footer_actions=true) }}
            </div>
          </div>
        </div>

      </div>
    </div>
    <!-- End Date Range -->

    <!-- Country Dropdown -->
    <div class="hs-dropdown [--placement:bottom-end] relative inline-flex" x-data="{ countryLabel: 'All Countries' }">
      <button type="button" id="cp-country-toggle"
        class="py-[7px] px-3 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-200 dark:hover:bg-neutral-700"
        aria-haspopup="menu" aria-expanded="false">
        <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
        </svg>
        <span x-text="countryLabel"></span>
        <svg class="shrink-0 size-3.5 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="hs-dropdown-menu hs-dropdown-open:opacity-100 w-48 transition-[opacity,margin] duration opacity-0 hidden z-20 bg-white rounded-xl shadow-[0_10px_40px_10px_rgba(0,0,0,0.08)] border border-gray-200 py-1 dark:bg-neutral-900 dark:border-neutral-700" role="menu" aria-labelledby="cp-country-toggle">
        <button type="button" @click="countryLabel='All Countries'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">All Countries</button>
        <button type="button" @click="countryLabel='United States'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">United States</button>
        <button type="button" @click="countryLabel='India'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">India</button>
        <button type="button" @click="countryLabel='China'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">China</button>
        <button type="button" @click="countryLabel='Brazil'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">Brazil</button>
        <button type="button" @click="countryLabel='Germany'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">Germany</button>
        <button type="button" @click="countryLabel='United Kingdom'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">United Kingdom</button>
        <button type="button" @click="countryLabel='France'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">France</button>
        <button type="button" @click="countryLabel='Japan'" class="w-full text-start flex items-center gap-x-2 py-2 px-3 text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-800" role="menuitem">Japan</button>
      </div>
    </div>
    <!-- End Country Dropdown -->

    <!-- Export Button -->
    <button type="button"
      class="py-[7px] px-3 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-200 dark:hover:bg-neutral-700">
      <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
      </svg>
      Export CSV
    </button>
    <!-- End Export -->

  </div>

</div>
<!-- End Toolbar -->

<!-- Flatpickr: Custom Date Range (sentinel pattern) -->
<link rel="stylesheet" href="https://unpkg.com/flatpickr/dist/flatpickr.min.css">
<script src="https://unpkg.com/flatpickr/dist/flatpickr.min.js"></script>
<script>
(function () {
  const input = document.getElementById('perf-custom-date');
  if (!input) return;

  function createFooter(instance) {
    const footer = document.createElement('div');
    footer.className = 'flatpickr-footer flex justify-end gap-2 px-3 py-2 border-t border-gray-100 dark:border-neutral-700';

    const cancel = document.createElement('button');
    cancel.textContent = 'Cancel';
    cancel.className = 'py-1.5 px-3 text-xs rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300';
    cancel.onclick = () => { instance.clear(); instance.close(); };

    const apply = document.createElement('button');
    apply.textContent = 'Apply';
    apply.className = 'py-1.5 px-3 text-xs rounded-lg bg-primary-600 text-white hover:bg-primary-700';
    apply.onclick = () => instance.close();

    footer.appendChild(cancel);
    footer.appendChild(apply);
    instance.calendarContainer.appendChild(footer);
  }

  flatpickr(input, {
    mode: 'range',
    showMonths: 2,
    closeOnSelect: false,
    maxDate: 'today',
    dateFormat: 'M j, Y',
    onReady(_, __, instance) { createFooter(instance); }
  });
})();
</script>
<!-- End Flatpickr -->
