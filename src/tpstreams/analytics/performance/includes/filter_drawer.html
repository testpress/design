<!-- Filter Drawer -->
<div id="hs-analytics-filter-drawer"
  class="hs-overlay hs-overlay-open:translate-x-0 hidden translate-x-full fixed top-0 end-0 transition-all duration-300 transform size-full sm:w-[400px] z-[80] flex flex-col bg-white dark:bg-neutral-800"
  role="dialog" tabindex="-1" aria-labelledby="hs-analytics-filter-label">

  <!-- Header -->
  <div class="py-3 px-6 flex justify-between items-center border-b dark:border-neutral-700">
    <h3 id="hs-analytics-filter-label" class="font-medium text-gray-800 dark:text-neutral-200">
      Filter
    </h3>
    <button type="button"
      class="py-1.5 px-2 inline-flex justify-center items-center gap-x-1 rounded-full border border-gray-200 text-xs text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:bg-neutral-800 dark:border-neutral-700 dark:hover:bg-neutral-700 dark:text-neutral-200"
      aria-label="Close" data-hs-overlay="#hs-analytics-filter-drawer">
      <span class="hidden lg:block">Esc</span>
      <span class="block lg:hidden">Close</span>
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>
  <!-- End Header -->

  <!-- Body -->
  <div class="bg-gray-100 h-full overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500 dark:bg-neutral-900">
    <div class="p-2 space-y-2">

      <!-- Country Card -->
      <div class="p-4 bg-white rounded-lg shadow-sm dark:bg-neutral-800">
        <div class="mb-3">
          <h5 class="truncate font-medium text-sm text-gray-800 dark:text-neutral-200">Country</h5>
          <p class="text-xs text-gray-500 dark:text-neutral-400 mt-0.5">Filter by viewer's country</p>
        </div>
        <div class="flex flex-wrap gap-2" x-data="{ country: '' }">
          <template x-for="c in ['All', 'United States', 'India', 'China', 'Brazil', 'Germany', 'United Kingdom', 'France', 'Japan']" :key="c">
            <label
              class="py-2 px-2.5 relative flex justify-center items-center text-center text-[13px] bg-white border border-gray-200 ring-1 ring-transparent text-gray-800 cursor-pointer rounded-xl hover:border-primary-600 hover:ring-primary-600 dark:bg-neutral-700 dark:text-neutral-200 dark:border-neutral-600 has-[:checked]:bg-primary-100 has-[:checked]:border-primary-200 has-[:checked]:ring-primary-200 has-[:checked]:text-primary-800 dark:has-[:checked]:bg-primary-800/30 dark:has-[:checked]:border-primary-800/50 dark:has-[:checked]:text-primary-400">
              <input type="radio" name="filter-country" :value="c" x-model="country" class="hidden peer">
              <span
                class="flex shrink-0 justify-center items-center size-0 bg-primary-500 text-transparent rounded-full transition-all duration-200 peer-checked:size-4 peer-checked:me-1.5 peer-checked:text-white">
                <svg class="shrink-0 size-2.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <span class="block" x-text="c"></span>
            </label>
          </template>
        </div>
      </div>
      <!-- End Country Card -->

      <!-- Device Card -->
      <div class="p-4 bg-white rounded-lg shadow-sm dark:bg-neutral-800">
        <div class="mb-3">
          <h5 class="truncate font-medium text-sm text-gray-800 dark:text-neutral-200">Device</h5>
          <p class="text-xs text-gray-500 dark:text-neutral-400 mt-0.5">Filter by viewing device (multiple)</p>
        </div>
        <div class="flex flex-wrap gap-2" x-data="{ devices: [] }">
          <template x-for="d in [
            { name: 'Android', icon: 'smartphone' },
            { name: 'Web', icon: 'globe' },
            { name: 'iOS', icon: 'smartphone' },
            { name: 'TV', icon: 'tv' }
          ]" :key="d.name">
            <label
              class="py-2 px-3 relative flex items-center gap-x-2 text-[13px] bg-white border border-gray-200 ring-1 ring-transparent text-gray-800 cursor-pointer rounded-xl hover:border-primary-600 hover:ring-primary-600 dark:bg-neutral-700 dark:text-neutral-200 dark:border-neutral-600 has-[:checked]:bg-primary-100 has-[:checked]:border-primary-200 has-[:checked]:ring-primary-200 has-[:checked]:text-primary-800 dark:has-[:checked]:bg-primary-800/30 dark:has-[:checked]:border-primary-800/50 dark:has-[:checked]:text-primary-400">
              <input type="checkbox" :value="d.name" x-model="devices" class="hidden peer">
              <span
                class="flex shrink-0 justify-center items-center size-0 bg-primary-500 text-transparent rounded-full transition-all duration-200 peer-checked:size-4 peer-checked:text-white">
                <svg class="shrink-0 size-2.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <!-- Android icon -->
              <template x-if="d.name === 'Android' || d.name === 'iOS'">
                <svg class="shrink-0 size-3.5 text-gray-500 peer-checked:text-primary-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
              </template>
              <!-- Web icon -->
              <template x-if="d.name === 'Web'">
                <svg class="shrink-0 size-3.5 text-gray-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              </template>
              <!-- TV icon -->
              <template x-if="d.name === 'TV'">
                <svg class="shrink-0 size-3.5 text-gray-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="15" x="2" y="3" rx="2"/><polyline points="8 21 12 17 16 21"/></svg>
              </template>
              <span class="block" x-text="d.name"></span>
            </label>
          </template>
        </div>
      </div>
      <!-- End Device Card -->

    </div>
  </div>
  <!-- End Body -->

  <!-- Footer -->
  <div class="p-6 border-t border-gray-200 dark:border-neutral-700 bg-white dark:bg-neutral-800">
    <div class="flex items-center gap-x-2">
      <button type="button"
        class="py-2 px-3 w-full inline-flex justify-center items-center gap-x-1.5 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 dark:bg-neutral-800 dark:hover:bg-neutral-700 dark:border-neutral-700 dark:text-neutral-300"
        data-hs-overlay="#hs-analytics-filter-drawer">
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        Clear filters
      </button>
      <button type="button"
        class="py-2 px-3 w-full inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 focus:outline-none focus:bg-primary-700"
        data-hs-overlay="#hs-analytics-filter-drawer">
        Apply Filters
      </button>
    </div>
  </div>
  <!-- End Footer -->

</div>
<!-- End Filter Drawer -->
