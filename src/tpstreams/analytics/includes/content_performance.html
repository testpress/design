{% from "src/ui-system/components/alert.html" import alert %}
<div class="grid lg:grid-cols-2 gap-4 mt-8">
  <!-- Top Performing Content -->
  <div class="bg-white border border-gray-200 rounded-xl shadow-2xs dark:bg-neutral-800 dark:border-neutral-700 flex flex-col h-full" x-data="{
    activeFilter: 'views',
    items: [
      { title: 'Advanced Networking', viewsNum: 24000, views: '24K', watchNum: 48, watch: '48 min', compNum: 82, comp: '82%', img: 'https://images.unsplash.com/photo-1506466010722-395aa2bef877?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'Machine Learning 101', viewsNum: 19000, views: '19K', watchNum: 52, watch: '52 min', compNum: 91, comp: '91%', img: 'https://images.unsplash.com/photo-1549490349-8643362247b5?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'Data Structures', viewsNum: 16000, views: '16K', watchNum: 55, watch: '55 min', compNum: 95, comp: '95%', img: 'https://images.unsplash.com/photo-1516116216624-53e697fedbea?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'React Patterns', viewsNum: 12000, views: '12K', watchNum: 120, watch: '120 min', compNum: 88, comp: '88%', img: 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'Cloud Architecture', viewsNum: 10000, views: '10K', watchNum: 136, watch: '136 min', compNum: 81, comp: '81%', img: 'https://images.unsplash.com/photo-1505373877841-8d25f7d46678?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' }
    ],
    get sortedItems() {
      return this.items.sort((a, b) => {
        if (this.activeFilter === 'views') return b.viewsNum - a.viewsNum;
        if (this.activeFilter === 'watch') return b.watchNum - a.watchNum;
        if (this.activeFilter === 'comp') return b.compNum - a.compNum;
      });
    },
    get filterLabel() {
      if (this.activeFilter === 'views') return 'Most Views';
      if (this.activeFilter === 'watch') return 'Highest Watch Time';
      if (this.activeFilter === 'comp') return 'Highest Completion';
    }
  }">
    <!-- Header -->
    <div class="border-b border-gray-200 dark:border-neutral-700">
      <div class="py-3 px-5 flex flex-wrap justify-between items-center gap-y-2 gap-x-5">
        <h2 class="font-medium text-gray-800 dark:text-neutral-200">
          Top Performing Content
        </h2>
        <!-- Dropdown -->
        <div class="hs-dropdown relative inline-flex">
          <button id="hs-top-performing-dropdown" type="button" class="py-1.5 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700" aria-haspopup="menu" aria-expanded="false" aria-label="Dropdown">
            <span x-text="filterLabel">Most Views</span>
            <i data-lucide="chevron-down" class="shrink-0 size-4"></i>
          </button>
          <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 hidden min-w-40 bg-white shadow-md rounded-lg p-2 mt-2 dark:bg-neutral-800 dark:border dark:border-neutral-700 z-10" role="menu" aria-orientation="vertical" aria-labelledby="hs-top-performing-dropdown">
            <a @click.prevent="activeFilter = 'views'" class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 dark:hover:text-neutral-300 dark:focus:bg-neutral-700 cursor-pointer">
              Most Views
            </a>
            <a @click.prevent="activeFilter = 'watch'" class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 dark:hover:text-neutral-300 dark:focus:bg-neutral-700 cursor-pointer">
              Highest Watch Time
            </a>
            <a @click.prevent="activeFilter = 'comp'" class="flex items-center gap-x-3.5 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 dark:hover:text-neutral-300 dark:focus:bg-neutral-700 cursor-pointer">
              Highest Completion
            </a>
          </div>
        </div>
      </div>
    </div>
    <!-- End Header -->

    <div class="p-5 sm:p-6 flex-1 flex flex-col gap-y-5">
      <template x-for="item in sortedItems" :key="item.title">
        <!-- Item -->
        <a href="#" class="flex gap-3 group">
          <div class="shrink-0">
            <img class="w-20 h-11 object-cover rounded" :src="item.img" :alt="item.title">
          </div>
          <div class="flex-1">
            <div class="flex justify-between items-start mb-1">
              <div class="flex items-center gap-x-2">
                <span class="font-medium text-sm text-gray-800 dark:text-neutral-200 group-hover:text-blue-600 dark:group-hover:text-blue-500" x-text="item.title"></span>
              </div>
              <span class="text-sm text-gray-500 dark:text-neutral-400 font-medium" 
                    x-text="activeFilter === 'views' ? item.views : (activeFilter === 'watch' ? item.watch : item.comp)"></span>
            </div>
            <div class="text-[13px] text-gray-500 dark:text-neutral-400">
              <template x-if="activeFilter === 'views'">
                <span>Avg Watch <span x-text="item.watch"></span> &bull; Completion <span x-text="item.comp"></span></span>
              </template>
              <template x-if="activeFilter === 'watch'">
                <span><span x-text="item.views"></span> views &bull; Completion <span x-text="item.comp"></span></span>
              </template>
              <template x-if="activeFilter === 'comp'">
                <span><span x-text="item.views"></span> views &bull; Avg Watch <span x-text="item.watch"></span></span>
              </template>
            </div>
          </div>
        </a>
      </template>
    </div>

    <!-- Footer -->
    <div class="text-center border-t border-gray-200 dark:border-neutral-700 mt-auto">
      <a href="/tpstreams/analytics/performance/" class="p-3 flex justify-center items-center gap-x-2 text-sm text-blue-600 dark:text-blue-500 rounded-b-xl hover:text-blue-700 dark:hover:text-blue-400 hover:bg-gray-50 dark:hover:bg-neutral-700/50 transition">
        View Full Report
        <i data-lucide="arrow-right" class="shrink-0 size-4"></i>
      </a>
    </div>
  </div>

  <!-- Least Viewed Contents -->
  <div class="bg-white border border-gray-200 rounded-xl shadow-2xs dark:bg-neutral-800 dark:border-neutral-700 flex flex-col h-full" x-data="{
    items: [
      { title: 'Weekly Townhall', viewsNum: 1200, views: '1.2K', watch: '6 min', comp: '18%', img: 'https://images.unsplash.com/photo-1478720568477-152d9b164e26?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'Product Update Q2', viewsNum: 980, views: '980', watch: '9 min', comp: '22%', img: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'HR Onboarding', viewsNum: 2100, views: '2.1K', watch: '14 min', comp: '27%', img: 'https://images.unsplash.com/photo-1440404653325-ab127d49abc1?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'Compliance 2026', viewsNum: 3400, views: '3.4K', watch: '18 min', comp: '31%', img: 'https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' },
      { title: 'Legacy Overview', viewsNum: 4800, views: '4.8K', watch: '22 min', comp: '34%', img: 'https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80' }
    ],
    get sortedItems() {
      return this.items.sort((a, b) => a.viewsNum - b.viewsNum);
    }
  }">
    <!-- Header -->
    <div class="border-b border-gray-200 dark:border-neutral-700">
      <div class="py-4 px-5">
        <h2 class="font-medium text-gray-800 dark:text-neutral-200">
          Least Viewed Contents
        </h2>
      </div>
    </div>
    <!-- End Header -->

    <div class="p-5 sm:p-6 flex-1 flex flex-col gap-y-5">
      <template x-for="item in sortedItems" :key="item.title">
        <!-- Item -->
        <a href="#" class="flex gap-3 group">
          <div class="shrink-0">
            <img class="w-20 h-11 object-cover rounded" :src="item.img" :alt="item.title">
          </div>
          <div class="flex-1">
            <div class="flex justify-between items-start mb-1">
              <div class="flex items-center gap-x-2">
                <span class="font-medium text-sm text-gray-800 dark:text-neutral-200 group-hover:text-blue-600 dark:group-hover:text-blue-500" x-text="item.title"></span>
              </div>
              <span class="text-sm text-gray-500 dark:text-neutral-400 font-medium" x-text="item.views"></span>
            </div>
            <div class="text-[13px] text-gray-500 dark:text-neutral-400">
              <span>Avg Watch <span x-text="item.watch"></span> &bull; Completion <span x-text="item.comp"></span></span>
            </div>
          </div>
        </a>
      </template>
    </div>
    <!-- Footer -->
    <div class="text-center border-t border-gray-200 dark:border-neutral-700 mt-auto">
      <a href="/tpstreams/analytics/performance/" class="p-3 flex justify-center items-center gap-x-2 text-sm text-blue-600 dark:text-blue-500 rounded-b-xl hover:text-blue-700 dark:hover:text-blue-400 hover:bg-gray-50 dark:hover:bg-neutral-700/50 transition">
        View Full Report
        <i data-lucide="arrow-right" class="shrink-0 size-4"></i>
      </a>
    </div>
  </div>
</div>
