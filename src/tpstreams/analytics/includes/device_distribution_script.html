<script>
(function() {
  let deviceDistributionChart;
  function renderDeviceDistributionChart() {
    const categories = ['Mobile', 'Desktop', 'Tablet', 'Others'];
    const data = [5200, 3100, 2400, 1200];
    const colors = ['#0768fd', '#8B5CF6', '#06B6D4', '#6366F1'];
    
    const options = {
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { top: 10, right: 10, bottom: 20, left: 40 },
      xAxis: {
        type: 'category',
        data: categories,
        axisLine: { show: false },
        axisTick: { show: false },
        axisLabel: { color: '#78716c', fontSize: 12, fontFamily: 'Inter, ui-sans-serif, system-ui, sans-serif' }
      },
      yAxis: {
        type: 'value',
        min: 0,
        splitNumber: 4,
        splitLine: { lineStyle: { type: 'dashed', color: '#e7e5e4' } },
        axisLabel: {
          color: '#78716c',
          fontSize: 12,
          fontFamily: 'Inter, ui-sans-serif, system-ui, sans-serif',
          formatter: function (v) {
            if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
            return Math.round(v);
          }
        }
      },
      series: [{
        name: 'Viewers',
        type: 'bar',
        data: data.map((val, idx) => ({ value: val, itemStyle: { color: colors[idx] } })),
        barWidth: '55%',
        itemStyle: { borderRadius: [4, 4, 0, 0] }
      }]
    };
    
    if (!deviceDistributionChart) {
      const el = document.getElementById('user-analytics-device-distribution-chart');
      if (!el) return;
      deviceDistributionChart = echarts.init(el);
    }
    deviceDistributionChart.setOption(options);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () { renderDeviceDistributionChart(); }, 100);
    });
  } else {
    setTimeout(function () { renderDeviceDistributionChart(); }, 100);
  }

  window.addEventListener('resize', function () {
    if (deviceDistributionChart) {
      deviceDistributionChart.resize();
    }
  });
})();
</script>
