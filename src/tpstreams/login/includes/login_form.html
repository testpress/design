<form class="space-y-6" action="" method="POST" x-data="{ showBlockedAlert: true }">
  <!-- Blocked Account Notice Alert (Colorless / Light Neutral Alert with Dismiss Button) -->
  <div id="blocked-account-alert" class="w-full bg-gray-50 border border-gray-200 text-gray-800 rounded-lg p-3.5 mb-6" role="alert" tabindex="-1" aria-labelledby="blocked-account-label" x-show="showBlockedAlert" x-transition.opacity.duration.300ms>
    <div class="flex items-start">
      <div class="shrink-0 mt-0.5">
        <i data-lucide="circle-alert" class="shrink-0 size-4 text-red-500"></i>
      </div>
      <div class="ms-3 flex-1">
        <p id="blocked-account-label" class="text-sm text-gray-700">
          Your account has been temporarily restricted. Please contact <a href="mailto:support@testpress.in" class="text-gray-900 font-medium underline underline-offset-2 hover:text-blue-600">support@testpress.in</a>.
        </p>
      </div>
      <div class="ps-3 ms-auto">
        <div class="-mx-1.5 -my-1.5">
          <button type="button" @click="showBlockedAlert = false" class="inline-flex rounded-lg p-1.5 text-gray-400 hover:text-gray-600 focus:outline-hidden focus:ring-2 focus:ring-offset-2 focus:ring-gray-300 transition-colors">
            <span class="sr-only">Dismiss</span>
            <i data-lucide="x" class="shrink-0 size-4"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div>
    <label for="id_email" class="block text-sm font-medium text-gray-700">Email address</label>
    <div class="mt-1 relative rounded-md shadow-sm">
      <input type="email" name="login" placeholder="you@example.com" autocomplete="email" class="block w-full appearance-none rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-blue-600 focus:outline-none focus:ring-blue-600 sm:text-sm" required id="id_email" value="support@testpress.in">
    </div>
  </div>

  <div>
    <label for="id_password" class="block text-sm font-medium text-gray-700">Password</label>
    <div class="mt-1 relative rounded-md shadow-sm">
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" class="block w-full appearance-none rounded-md border border-gray-300 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-blue-600 focus:outline-none focus:ring-blue-600 sm:text-sm" required id="id_password">
    </div>
  </div>

  <div class="flex items-center justify-between">
    <div class="flex items-center">
      <input type="checkbox" name="remember" id="id_remember" class="h-4 w-4 rounded border-gray-300 text-blue-700 focus:ring-blue-600">
      <label for="id_remember" class="ml-2 block text-sm text-gray-900">Remember me</label>
    </div>

    <div class="text-sm">
      <a href="#" class="font-medium text-blue-700 hover:text-blue-600">Forgot your password?</a>
    </div>
  </div>

  <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
    Sign In
  </button>
</form>
