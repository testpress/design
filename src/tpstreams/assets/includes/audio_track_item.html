<li class="flex items-center justify-between py-4 pl-4 pr-5 text-sm leading-6 hover:bg-gray-50/50">
  <div class="flex w-0 flex-1 items-center">
    
    <!-- Audio Icon -->
    <svg class="h-5 w-5 flex-shrink-0 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m9 9 10.5-3m0 6.553v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 1 1-.99-3.467l2.31-.66a2.25 2.25 0 0 0 1.632-2.163Zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 0 1-.99-3.467l2.31-.66A2.25 2.25 0 0 0 9 15.553Z" />
    </svg>

    <!-- Track Label, Format & Size Info -->
    <div class="ml-4 flex min-w-0 flex-1 items-center gap-2">
      <span class="truncate font-medium text-gray-900" x-text="track.name"></span>
      
      <!-- Processing Tag -->
      <span x-show="track.status === 'processing'" class="text-xs text-blue-600 font-medium inline-flex items-center gap-1">
        <svg class="animate-spin h-3 w-3 text-blue-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        (processing...)
      </span>

      <!-- Default Tag -->
      <span x-show="track.is_default" class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-700">
        Default
      </span>

      <span class="flex-shrink-0 text-gray-400" x-text="track.size"></span>
      <span class="flex-shrink-0 text-gray-400 hidden sm:inline" x-text="'(' + track.duration + ')'"></span>
    </div>
  </div>

  <!-- Action Menu Dropdown -->
  <div class="ml-4 flex-shrink-0 flex">
    <div class="relative inline-block text-left" x-data="{ showMenu: false, openUpward: false }">
      <div>
        <button 
          @click="openUpward = ($event.clientY + 210 > window.innerHeight); showMenu = !showMenu;" 
          @click.away="showMenu = false" 
          type="button"
          class="flex items-center rounded-full text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-gray-100 p-1"
          aria-expanded="true" aria-haspopup="true">
          <span class="sr-only">Open options</span>
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M10 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM10 8.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM11.5 15.5a1.5 1.5 0 10-3 0 1.5 1.5 0 003 0z" />
          </svg>
        </button>
      </div>

      <div x-cloak x-show="showMenu"
        :class="openUpward ? 'bottom-full mb-2 origin-bottom-right' : 'top-full mt-2 origin-top-right'"
        class="absolute right-0 z-50 w-48 rounded-md bg-white shadow-xl ring-1 ring-black ring-opacity-5 focus:outline-none divide-y divide-gray-100"
        role="menu" aria-orientation="vertical" tabindex="-1"
        x-transition:enter="transition ease-out duration-100" 
        x-transition:enter-start="transform opacity-0 scale-95"
        x-transition:enter-end="transform opacity-100 scale-100" 
        x-transition:leave="transition ease-in duration-75"
        x-transition:leave-start="transform opacity-100 scale-100"
        x-transition:leave-end="transform opacity-0 scale-95">
        
        <div class="py-1" role="none">
          <!-- Set as Default -->
          <button type="button" @click="setAsDefault(track); showMenu = false;"
            :disabled="track.is_default || !track.is_active || track.status !== 'completed'"
            class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-50 disabled:opacity-40 disabled:pointer-events-none"
            role="menuitem">
            Set as Default
          </button>

          <!-- Edit -->
          <button type="button" @click="openEditModal(track); showMenu = false;"
            :disabled="track.status === 'processing'"
            class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-50 disabled:opacity-40 disabled:pointer-events-none"
            role="menuitem">
            Edit
          </button>

          <!-- Enable / Disable -->
          <button type="button" @click="toggleTrackStatus(track); showMenu = false;"
            :disabled="track.status === 'processing' || (track.is_default && track.is_active)"
            class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-50 disabled:opacity-40 disabled:pointer-events-none"
            role="menuitem"
            x-text="track.is_active ? 'Disable' : 'Enable'">
          </button>
        </div>

        <div class="py-1" role="none">
          <!-- Delete -->
          <button type="button" @click="openDeleteModal(track); showMenu = false;"
            class="text-red-600 block w-full text-left px-4 py-2 text-sm hover:bg-red-50 font-medium"
            role="menuitem">
            Delete
          </button>
        </div>

      </div>
    </div>
  </div>
</li>
