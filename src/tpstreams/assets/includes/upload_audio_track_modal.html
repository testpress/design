<!-- Preline Pro Modal: Upload Audio Track -->
<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showUploadModal" class="relative z-50" aria-labelledby="upload-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Overlay -->
  <div x-show="showUploadModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-500/75 transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div x-show="showUploadModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="if(!isUploading) showUploadModal = false"
        class="w-full sm:max-w-xl bg-white border border-gray-200 rounded-xl pointer-events-auto shadow-xl transition-all text-left">
        
        <div x-data="{ 
          selectedFile: null, 
          fileName: '', 
          fileSizeFormatted: '',
          fileInput: null,
          language: '',
          trackName: '',
          isDefault: false,
          isDragging: false,
          
          resetForm() {
            this.selectedFile = null;
            this.fileName = '';
            this.fileSizeFormatted = '';
            this.language = '';
            this.trackName = '';
            this.isDefault = false;
            this.isDragging = false;
            if (this.fileInput) this.fileInput.value = '';
          }
        }">
          
          <!-- Header -->
          <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200">
            <h2 id="upload-modal-title" class="font-medium text-gray-800 text-base">
              Upload audio track
            </h2>
            <button type="button" @click="if (!isUploading) { resetForm(); showUploadModal = false; }" :disabled="isUploading"
              class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-100 text-gray-800 hover:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none focus:outline-none focus:bg-gray-200" aria-label="Close">
              <span class="sr-only">Close</span>
              <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>
          <!-- End Header -->

          <!-- Body -->
          <div class="p-4 space-y-4">
            
            <!-- Grid: Language & Track Name -->
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <!-- Language Select (Reusable Preline Component) -->
              {% include "./language_select.html" %}

              <!-- Track Label / Name Input -->
              <div>
                <label for="track-name" class="block mb-1.5 text-sm font-medium text-gray-800">
                  Track Label / Name <span class="text-gray-400 font-normal lowercase">(optional)</span>
                </label>
                <input type="text" id="track-name" x-model="trackName" :placeholder="language ? language : 'e.g., Director\'s Commentary'"
                  class="py-2 px-3 block w-full bg-white border border-gray-200 rounded-lg text-sm text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
              </div>
            </div>

            <!-- Preline Drag & Drop Audio Upload Zone -->
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-800">
                Audio File <span class="text-red-500">*</span>
              </label>

              <!-- State 1: Dropzone (No File Selected) -->
              <div x-show="!selectedFile"
                @dragover.prevent="isDragging = true"
                @dragleave.prevent="isDragging = false"
                @drop.prevent="
                  isDragging = false;
                  if ($event.dataTransfer.files.length) {
                    selectedFile = $event.dataTransfer.files[0];
                    fileName = selectedFile.name;
                    fileSizeFormatted = (selectedFile.size / (1024 * 1024)).toFixed(1) + ' MB';
                    if (!trackName && language) trackName = language;
                  }
                "
                :class="isDragging ? 'border-blue-500 bg-blue-50/50 ring-2 ring-blue-500/20' : 'border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300'"
                class="relative border border-dashed rounded-xl p-6 sm:p-8 transition flex flex-col items-center justify-center text-center cursor-pointer group">
                
                <!-- Full-area invisible input so clicking anywhere triggers file selection -->
                <input type="file" id="audioFilePicker" accept=".mp3,.aac,.m4a,.wav,audio/*"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                  x-on:change="
                    if ($event.target.files.length) {
                      selectedFile = $event.target.files[0];
                      fileName = selectedFile.name;
                      fileSizeFormatted = (selectedFile.size / (1024 * 1024)).toFixed(1) + ' MB';
                      fileInput = $event.target;
                      if (!trackName && language) trackName = language;
                    }
                  ">
                
                <div class="size-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mb-3">
                  <svg class="size-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
                  </svg>
                </div>
                <div class="flex flex-wrap justify-center text-sm leading-6 text-gray-600">
                  <span class="pe-1 font-medium text-gray-800">
                    Drop your files here or
                  </span>
                  <span class="font-semibold text-blue-600 group-hover:underline">
                    browse
                  </span>
                </div>
                <p class="text-xs text-gray-500 mt-1">
                  Supported formats: MP3, AAC, M4A, WAV (Max 500MB)
                </p>
              </div>

              <!-- State 2: Attached File Card with Preline In-Card Progress -->
              <div x-show="selectedFile" x-cloak
                class="p-3.5 bg-gray-50 border border-gray-200 rounded-xl space-y-2.5">
                
                <div class="flex items-center justify-between gap-x-3">
                  <div class="flex items-center gap-x-3 min-w-0">
                    <div class="size-9 rounded-lg bg-blue-50 border border-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                      <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m9 9 10.5-3m0 6.553v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 1 1-.99-3.467l2.31-.66a2.25 2.25 0 0 0 1.632-2.163Zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 1 1-.99-3.467l2.31-.66A2.25 2.25 0 0 0 9 15.553Z" />
                      </svg>
                    </div>
                    <div class="min-w-0">
                      <p class="text-sm font-medium text-gray-800 truncate" x-text="fileName"></p>
                      <div class="flex items-center gap-x-2 text-xs text-gray-500 mt-0.5">
                        <span x-text="fileSizeFormatted"></span>
                        <span>&bull;</span>
                        <span x-show="!isUploading" class="inline-flex items-center text-emerald-600 font-medium">
                          <svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                          </svg>
                          Ready for upload
                        </span>
                        <span x-show="isUploading" class="inline-flex items-center text-blue-600 font-medium" x-cloak>
                          Uploading...
                        </span>
                      </div>
                    </div>
                  </div>

                  <!-- Remove Action (hidden during active upload) -->
                  <button x-show="!isUploading" type="button" 
                    x-on:click="
                      selectedFile = null;
                      fileName = '';
                      fileSizeFormatted = '';
                      if (fileInput) fileInput.value = '';
                    "
                    class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition shrink-0"
                    title="Remove file">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <!-- Preline In-Card Progress Bar -->
                <div x-show="isUploading" class="flex items-center gap-x-3 whitespace-nowrap pt-1" x-cloak>
                  <div class="flex w-full h-2 bg-gray-200 rounded-full overflow-hidden" role="progressbar" :aria-valuenow="uploadProgress" aria-valuemin="0" aria-valuemax="100">
                    <div class="flex flex-col justify-center rounded-full overflow-hidden bg-blue-600 text-xs text-white text-center whitespace-nowrap transition-all duration-300 ease-out"
                      :style="'width: ' + uploadProgress + '%'"></div>
                  </div>
                  <div class="w-10 text-end">
                    <span class="text-xs font-semibold text-gray-700" x-text="uploadProgress + '%'"></span>
                  </div>
                </div>

              </div>

            </div>

            <!-- Default Track Setting (TPStreams Checkbox Pattern) -->
            <div class="relative flex items-start gap-x-3 pt-1">
              <div class="flex h-6 items-center">
                <input id="set-default-audio" type="checkbox" x-model="isDefault" :disabled="isUploading"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
              </div>
              <div class="text-sm leading-6">
                <label for="set-default-audio" class="font-medium text-gray-800 cursor-pointer select-none" :class="isUploading ? 'opacity-50 cursor-not-allowed' : ''">Set as default audio track</label>
                <p class="text-xs text-gray-500">Plays by default when a viewer starts the video.</p>
              </div>
            </div>

          </div>
          <!-- End Body -->

          <!-- Footer -->
          <div class="p-4 flex justify-end items-center gap-x-2 border-t border-gray-200">
            <button type="button" @click="resetForm(); showUploadModal = false;" :disabled="isUploading"
              class="py-2 px-3 inline-flex justify-center items-center text-center bg-white border border-gray-200 text-gray-800 text-sm font-medium rounded-lg shadow-2xs hover:bg-gray-50 focus:outline-none disabled:opacity-50 disabled:pointer-events-none">
              Cancel
            </button>
            <button type="button" 
              @click="
                if (!selectedFile || !language) {
                  alert('Please select an audio file and language.');
                  return;
                }
                isUploading = true;
                uploadProgress = 15;
                let interval = setInterval(() => {
                  uploadProgress = Math.min(100, uploadProgress + 25);
                  if (uploadProgress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                      if (isDefault) {
                        tracks.forEach(t => t.is_default = false);
                      }
                      tracks.unshift({
                        id: 'trk_' + Date.now(),
                        name: trackName || language,
                        language: language,
                        lang_code: language.toLowerCase().slice(0, 2),
                        status: 'processing',
                        is_default: isDefault,
                        is_active: true,
                        size: (selectedFile.size / (1024 * 1024)).toFixed(1) + ' MB',
                        duration: '04:32'
                      });
                      resetForm();
                      isUploading = false;
                      uploadProgress = 0;
                      showUploadModal = false;
                    }, 400);
                  }
                }, 250);
              "
              :disabled="isUploading || !selectedFile || !language"
              class="py-2 px-3 inline-flex justify-center items-center gap-x-2 text-center bg-blue-600 border border-transparent text-white text-sm font-medium rounded-lg shadow-2xs hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-none">
              <template x-if="isUploading">
                <span class="inline-flex items-center gap-1.5">
                  <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Uploading...
                </span>
              </template>
              <template x-if="!isUploading">
                <span>Upload audio track</span>
              </template>
            </button>
          </div>
          <!-- End Footer -->

        </div>

      </div>
    </div>
  </div>
</div>
