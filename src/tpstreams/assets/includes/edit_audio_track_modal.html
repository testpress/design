<!-- Preline Pro Modal: Edit Audio Track -->
<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showEditModal" class="relative z-50" aria-labelledby="edit-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Overlay -->
  <div x-show="showEditModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-500/75 transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div x-show="showEditModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="showEditModal = false"
        class="w-full sm:max-w-xl bg-white border border-gray-200 rounded-xl pointer-events-auto shadow-xl transition-all text-left">
        
        <template x-if="editingTrack">
          <div>
            <!-- Header -->
            <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200">
              <h2 id="edit-modal-title" class="font-medium text-gray-800 text-base">
                Edit audio track
              </h2>
              <button type="button" @click="showEditModal = false"
                class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-100 text-gray-800 hover:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none focus:outline-none focus:bg-gray-200" aria-label="Close">
                <span class="sr-only">Close</span>
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
            <!-- End Header -->

            <!-- Body -->
            <div class="p-4 space-y-4">
              
              <!-- Language Select (Reusable Preline Component) -->
              {% include "./language_select.html" %}

              <!-- Track Label / Name Input -->
              <div>
                <label for="edit-track-name" class="block mb-1.5 text-sm font-medium text-gray-800">
                  Track Label / Name <span class="text-gray-400 font-normal lowercase">(optional)</span>
                </label>
                <input type="text" id="edit-track-name" x-model="editingTrack.name" placeholder="e.g., Director's Commentary"
                  class="py-2 px-3 block w-full bg-white border border-gray-200 rounded-lg text-sm text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
              </div>

              <!-- Default Track Setting (TPStreams Checkbox Pattern) -->
              <div class="relative flex items-start gap-x-3 pt-1">
                <div class="flex h-6 items-center">
                  <input id="edit-set-default-audio" type="checkbox" x-model="editingTrack.is_default"
                    :disabled="!editingTrack.is_active"
                    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600 cursor-pointer disabled:cursor-not-allowed disabled:opacity-50">
                </div>
                <div class="text-sm leading-6">
                  <label for="edit-set-default-audio" class="font-medium text-gray-800 cursor-pointer select-none"
                    :class="!editingTrack.is_active ? 'opacity-60 cursor-not-allowed' : ''">
                    Set as default audio track
                  </label>
                  <p class="text-xs text-gray-500" x-text="editingTrack.is_active ? 'Plays by default when a viewer starts the video.' : 'Track must be enabled before setting as default.'"></p>
                </div>
              </div>

            </div>
            <!-- End Body -->

            <!-- Footer -->
            <div class="p-4 flex justify-end items-center gap-x-2 border-t border-gray-200">
              <button type="button" @click="showEditModal = false"
                class="py-2 px-3 inline-flex justify-center items-center text-center bg-white border border-gray-200 text-gray-800 text-sm font-medium rounded-lg shadow-2xs hover:bg-gray-50 focus:outline-none disabled:opacity-50 disabled:pointer-events-none">
                Cancel
              </button>
              <button type="button" 
                @click="
                  saveTrackEdit();
                  showEditModal = false;
                "
                class="py-2 px-3 inline-flex justify-center items-center gap-x-2 text-center bg-blue-600 border border-transparent text-white text-sm font-medium rounded-lg shadow-2xs hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-none">
                Save changes
              </button>
            </div>
            <!-- End Footer -->

          </div>
        </template>

      </div>
    </div>
  </div>
</div>
