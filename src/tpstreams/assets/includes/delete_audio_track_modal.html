<!-- Preline Modal: Delete Audio Track -->
<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showDeleteModal" class="relative z-50" aria-labelledby="delete-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Blur -->
  <div x-show="showDeleteModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <!-- Modal Panel -->
      <div x-show="showDeleteModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="showDeleteModal = false"
        class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-gray-100">
        
        <template x-if="deletingTrack">
          <div class="p-6 text-center">
            <!-- Trash Icon Badge -->
            <div class="flex items-center justify-center w-12 h-12 mx-auto rounded-2xl bg-red-50 text-red-600 border border-red-200 shadow-sm mb-4">
              <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
            </div>
            
            <h3 class="text-base font-semibold text-gray-900" id="delete-modal-title">Delete Audio Track?</h3>
            <p class="mt-2 text-sm text-gray-600">
              Are you sure you want to delete <span class="font-semibold text-gray-900" x-text="deletingTrack.name"></span>? This will permanently remove this audio track from the video.
            </p>

            <div class="mt-6 flex items-center justify-center gap-x-3">
              <button type="button" @click="showDeleteModal = false"
                class="py-2 px-4 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none transition">
                Cancel
              </button>
              <button type="button" 
                @click="
                  confirmDeleteTrack();
                  showDeleteModal = false;
                "
                class="py-2 px-4 text-sm font-semibold rounded-lg bg-red-600 text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition">
                Delete Track
              </button>
            </div>
          </div>
        </template>

      </div>
    </div>
  </div>
</div>
