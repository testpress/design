<script>
  // Prototype data. Each state is one order. Cases come from testpress_python:
  // discounts (voucher/discount code, automatic offers), processing fees, subscription and installment plans,
  // gateways (Testpress Razorpay/PayU; institute's own Razorpay, PayU, Stripe, PayPal, CCAvenue; legacy Instamojo/Zwitch/Citrus),
  // payment type Debit (Testpress collected) vs Credit (institute collected, e.g. recorded cash), voucher, cash and free orders.
  const base = {
    id: 3137, txn: 'order_TX5HfPkuG3pJE9', placed: '2 Sep 2026, 12:52 pm',
    product: 'PSC Civil Engineering',
    img: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=480&h=270&q=80',
    planLabel: 'Validity', plan: '365 days', price: '₹5,999.00', access: 'Until 2 Sep 2027',
    lines: [{ label: 'Price', amount: '₹5,999.00' }, { label: 'Coupon', code: 'PSC1000', amount: '−₹1,000.00' }],
    paid: '₹4,999.00',
    pay: { kind: 'gateway', gateway: 'Razorpay', method: 'UPI', id: 'pay_PH4x9KQe2LmR7a', on: '2 Sep 2026, 12:53 pm', own: false, collector: 'testpress' },
    payout: { fees: '−₹499.90', earning: '₹4,499.10', status: 'pending', date: '30 Nov' },
    refund: 'yes',          // yes | mark (cash collected by you) | no (free, voucher, collected by Testpress offline) 
    refundAmount: '₹4,999.00',
    note: '',
  };
  const S = (o) => ({ ...base, ...o, pay: { ...base.pay, ...(o.pay || {}) }, payout: o.payout === null ? null : { ...base.payout, ...(o.payout || {}) } });

  window.ORDER_CASES = {
    paid: S({}),
    no_discount: S({ lines: [{ label: 'Price', amount: '₹4,999.00' }], price: '₹4,999.00' }),
    offer_coupon: S({
      lines: [
        { label: 'Price', amount: '₹5,999.00' },
        { label: 'Diwali offer', sub: 'Automatic, 20% off', amount: '−₹1,199.80' },
        { label: 'Coupon', code: 'PSC500', amount: '−₹500.00' },
      ],
      paid: '₹4,299.20', refundAmount: '₹4,299.20', payout: { fees: '−₹429.92', earning: '₹3,869.28' },
    }),
    payu_fee: S({
      lines: [{ label: 'Price', amount: '₹4,999.00' }, { label: 'Processing fee', amount: '+₹99.00' }],
      price: '₹4,999.00', paid: '₹5,098.00', refundAmount: '₹5,098.00',
      pay: { gateway: 'PayU', method: 'Credit card · HDFC', id: '403993715531077182' },
      payout: { fees: '−₹598.90', earning: '₹4,499.10' },
    }),
    subscription: S({
      product: 'SSC CGL Complete Prep', planLabel: 'Subscription', plan: 'Pro · 30 days', price: '₹799.00',
      access: 'Until 2 Oct 2026', lines: [{ label: 'Pro · 30 days', amount: '₹799.00' }], paid: '₹799.00', refundAmount: '₹799.00',
      payout: { fees: '−₹79.90', earning: '₹719.10' },
      img: 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=480&h=270&q=80',
    }),
    installment: S({
      planLabel: 'Installments', plan: '2 of 3 paid', price: '₹15,000.00', access: 'Until 2 Sep 2027',
      lines: [{ label: 'Product price', sub: '3 installments', amount: '₹15,000.00' }, { label: 'This installment', amount: '₹5,000.00' }],
      paid: '₹5,000.00', refundAmount: '₹5,000.00', payout: { fees: '−₹500.00', earning: '₹4,500.00' },
      note: 'Next installment of ₹5,000 is due on 2 Oct 2026.',
    }),
    own_gateway: S({ pay: { own: true, collector: 'you' }, payout: null }),
    own_payu: S({ pay: { gateway: 'PayU', method: 'Net banking · HDFC', id: '403993715531077182', own: true, collector: 'you' }, payout: null }),
    stripe: S({ pay: { gateway: 'Stripe', method: 'Card', id: 'pi_3TTj7xQ1EDQsiXjw0Uglypcb', own: true, collector: 'you' }, payout: null, refund: 'mark' }),
    cash: S({ pay: { kind: 'cash', gateway: 'Cash payment', method: 'Note: Paid at the front office', id: '', collector: 'you' }, payout: null, refund: 'mark' }),
    cash_testpress: S({ pay: { kind: 'cash', gateway: 'Cash payment', method: 'Note: Bank transfer to Testpress, UTR 412566981032', id: '', collector: 'testpress' }, refund: 'no' }),
    voucher: S({ lines: [{ label: 'Price', amount: '₹4,999.00' }], price: '₹4,999.00', pay: { kind: 'voucher', gateway: 'Testpress voucher', method: 'Code TPV-8K2M-91QX', id: '', collector: 'testpress' }, payout: null, refund: 'no' }),
    free: S({ lines: [{ label: 'Price', amount: '₹2,999.00' }, { label: 'Coupon', code: 'FREEPSC', amount: '−₹2,999.00' }], price: '₹2,999.00', paid: '₹0.00', pay: { kind: 'free' }, payout: null, refund: 'no' }),
    not_owner: S({}),
    confirm: S({}), refunding: S({}),
    refunded: S({ payout: { status: 'paid', date: '15 Sep' } }),
    checking: S({}), rejected: S({}),
    marked: S({ pay: { gateway: 'Stripe', method: 'Card', id: 'pi_3TTj7xQ1EDQsiXjw0Uglypcb', own: true, collector: 'you' }, payout: null, refund: 'mark' }),
  };

  document.addEventListener('alpine:init', () => {
    Alpine.data('orderDetail', () => ({
      state: window.odState(),
      typed: '',
      processing: false,
      outcome: null,   // null | refunded | checking | rejected | marked

      init() {
        window.addEventListener('od-state', (e) => this.setState(e.detail));
        this.$nextTick(() => this.setState(this.state));
      },

      setState(s) {
        this.state = s;
        this.outcome = ['refunded', 'checking', 'rejected', 'marked'].includes(s) ? s : null;
        this.processing = s === 'refunding';
        this.typed = s === 'refunding' ? 'refund' : '';
        if (s === 'confirm' || s === 'refunding') this.$dispatch('open-modal-refund-modal');
        else this.$dispatch('close-modal-refund-modal');
        this.$nextTick(() => window.lucide && window.lucide.createIcons());
      },

      get d() { return window.ORDER_CASES[this.state] || window.ORDER_CASES.paid; },
      get refundState() { return this.outcome || 'none'; },
      get isOwner() { return this.state !== 'not_owner'; },
      get canStart() { return this.refundState === 'none' && ['yes', 'mark'].includes(this.d.refund); },
      get accessRemoved() { return ['refunded', 'marked'].includes(this.outcome); },
      get status() {
        if (['refunded', 'marked'].includes(this.outcome)) return 'refunded';
        if (this.outcome === 'checking') return 'pending';
        if (this.d.pay.kind === 'free') return 'free';
        return 'paid';
      },
      get typedOk() { return this.typed === 'refund'; },

      openRefund() {
        if (!this.isOwner || !this.canStart) return;
        this.typed = '';
        this.processing = false;
        this.$dispatch('open-modal-refund-modal');
      },
      closeRefund() {
        if (this.processing) return;
        this.$dispatch('close-modal-refund-modal');
      },
      confirmRefund() {
        if (!this.typedOk || this.processing) return;
        this.processing = true;
        setTimeout(() => {
          this.processing = false;
          this.$dispatch('close-modal-refund-modal');
          this.outcome = this.d.refund === 'mark' ? 'marked' : 'refunded';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 1600);
      },
    }));
  });
</script>
