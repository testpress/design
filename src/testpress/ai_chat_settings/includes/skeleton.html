<!-- Loading: plain markup, so it also shows before Alpine starts -->
<div x-show="loading" class="space-y-6 animate-pulse" aria-label="Loading AI Chat settings">
  {% for rows in [2, 4, 1] %}
    <div class="p-6 bg-white rounded-xl shadow-sm dark:bg-neutral-800">
      <div class="h-4 w-40 rounded-full bg-gray-200 dark:bg-neutral-700"></div>
      <div class="mt-6 space-y-5">
        {% for n in range(rows) %}
          <div class="flex items-center justify-between gap-x-6">
            <div class="flex-1 space-y-2">
              <div class="h-3.5 w-1/3 rounded-full bg-gray-200 dark:bg-neutral-700"></div>
              <div class="h-3 w-2/3 rounded-full bg-gray-100 dark:bg-neutral-700/60"></div>
            </div>
            <div class="h-8 w-28 rounded-lg bg-gray-100 dark:bg-neutral-700/60"></div>
          </div>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>
