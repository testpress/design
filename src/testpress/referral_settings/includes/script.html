<script>
  // Prototype states (bottom-right switcher, and shareable as ?state=)
  window.REFER_STATES = {
    initial: 'setup',
    groups: [
      { name: 'Program', states: [['setup', 'Not set up yet'], ['on', 'On, fixed amounts'], ['on_percent', 'On, percentages'], ['on_mixed', 'On, % off and fixed credits'], ['off', 'Turned off']] },
      { name: 'Access', states: [['readonly', 'View only (no permission)']] }
    ]
  };
  (function () {
    const v = new URLSearchParams(location.search).get('state');
    if (window.REFER_STATES.groups.flatMap(g => g.states.map(s => s[0])).includes(v)) window.REFER_STATES.initial = v;
  })();

  document.addEventListener('alpine:init', () => {
    // Offer (PRD FR-8, FR-9): each side is a fixed amount (₹) or a percentage with an optional maximum (₹).
    // minPurchase: null = any amount (PRD default ₹0). Wait and time-to-buy default to 30 days (FR-5, FR-6).
    const DEFAULTS = () => ({
      setupDone: true, enabled: true,
      offer: {
        friend: { type: 'amount', value: 300, max: null },
        student: { type: 'amount', value: 200, max: null },
        minPurchase: null,
      },
      rules: { whoCanInvite: 'buyers', perStudent: 10, buyDays: 30, waitDays: 30 },
    });

    Alpine.data('referralAdmin', () => ({
      saved: DEFAULTS(),
      readOnly: false,

      init() {
        this.apply(window.REFER_STATES.initial);
        // Back from the edit page after saving (?saved=setup · edit)
        const saved = new URLSearchParams(location.search).get('saved');
        if (saved) {
          setTimeout(() => saved === 'setup' ? this.toast('Refer & Earn is on', 'Your students can now invite their friends.') : this.toast('Changes saved', 'New referrals get these settings.'), 300);
          const url = new URL(location.href); url.searchParams.delete('saved'); history.replaceState(null, '', url);
        }
        window.addEventListener('refer-state', (e) => this.apply(e.detail));
      },

      apply(state) {
        this.saved = DEFAULTS();
        this.readOnly = false;
        if (state === 'setup') { this.saved.setupDone = false; this.saved.enabled = false; }
        if (state === 'off') this.saved.enabled = false;
        if (state === 'on_percent') this.saved.offer = {
          friend: { type: 'percent', value: 10, max: 500 },
          student: { type: 'percent', value: 10, max: 300 },
          minPurchase: 999,
        };
        if (state === 'on_mixed') this.saved.offer = {
          friend: { type: 'percent', value: 10, max: 500 },
          student: { type: 'amount', value: 200, max: null },
          minPurchase: null,
        };
        if (state === 'readonly') this.readOnly = true;
      },

      money(n) { return '₹' + Number(n).toLocaleString('en-IN'); },

      // Overview tiles: "₹300 off" / "10% off", "₹200 credits" / "10%", and the line under each
      benefit(side) {
        const b = this.saved.offer[side];
        const v = b.type === 'percent' ? b.value + '%' : this.money(b.value);
        return side === 'friend' ? v + ' off' : (b.type === 'percent' ? v + ' in credits' : v + ' credits');
      },
      benefitNote(side) {
        const b = this.saved.offer[side];
        const cap = b.type === 'percent' && b.max ? ', up to ' + this.money(b.max) : '';
        if (side === 'friend') return 'On their first purchase' + cap;
        return (b.type === 'percent' ? 'Of what each friend pays' : 'For each friend who buys') + cap;
      },

      // ----- Program on / off -----
      toggleEnabled() {
        if (this.readOnly) return;
        if (this.saved.enabled) { this.$dispatch('open-modal-refer-turn-off'); return; }
        this.saved.enabled = true;
        this.toast('Refer & Earn is on', 'Your students can now invite their friends.');
      },
      turnOn() {
        this.saved.setupDone = true;
        this.saved.enabled = true;
        this.toast('Refer & Earn is on', 'Your students can now invite their friends.');
      },
      turnOff() {
        this.saved.enabled = false;
        this.$dispatch('close-modal-refer-turn-off');
        this.toast('Refer & Earn is off', 'Students keep their credits.');
      },

      // Setting up and editing happen on their own page (edit/)
      editUrl(section) {
        const pct = this.saved.offer.friend.type === 'percent';
        const mixed = pct && this.saved.offer.student.type !== 'percent';
        return '{{ "/testpress/referral_settings/edit/" | url }}?state=' + (!this.saved.setupDone ? 'setup' : (mixed ? 'edit_mixed' : pct ? 'edit_percent' : 'edit')) + (section ? '#' + section : '');
      },
      startSetup() { location.href = this.editUrl(); },

      toast(title, description) {
        window.dispatchEvent(new CustomEvent('toast', { detail: { variant: 'success', title, description, position: 'bottom-right' } }));
      },
    }));
  });
</script>
