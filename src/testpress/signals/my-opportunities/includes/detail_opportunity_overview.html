<!-- Opportunity Overview Card -->
<div class="bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-xs rounded-xl overflow-hidden">
  <div class="py-3 px-5 border-b border-gray-200 dark:border-neutral-700">
    <h3 class="font-medium text-gray-800 dark:text-neutral-200">
      Opportunity
    </h3>
  </div>
  <div class="p-5">
    <dl class="grid grid-cols-1 sm:grid-cols-2 gap-4 gap-y-5">
      <div>
        <dt class="text-sm text-gray-500 dark:text-neutral-500">Product</dt>
        <dd class="mt-1 text-sm text-gray-800 dark:text-neutral-200">
          <a href="#" class="hover:underline text-primary-600 dark:text-primary-500">{{ item.product | default('JEE Mains Crash Course') }}</a>
        </dd>
      </div>
      <div>
        <dt class="text-sm text-gray-500 dark:text-neutral-500">Owner</dt>
        <dd class="mt-1 text-sm text-gray-800 dark:text-neutral-200">
          <a href="#" class="inline-flex items-center gap-x-1.5 hover:underline">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&amp;h=150&amp;fit=crop&amp;crop=faces" class="shrink-0 size-4 rounded-full object-cover" alt="Priya Sharma">
            {{ item.owner | default('Priya Sharma') }}
          </a>
        </dd>
      </div>
      <div class="sm:col-span-2">
        <dt class="text-sm text-gray-500 dark:text-neutral-500">Collaborators</dt>
        <dd class="mt-1 flex flex-wrap items-center gap-x-1.5 text-sm text-gray-800 dark:text-neutral-200">
          <a href="#" class="inline-flex items-center gap-x-1.5 hover:underline">
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150&amp;h=150&amp;fit=crop&amp;crop=faces" class="shrink-0 size-4 rounded-full object-cover" alt="Arjun">
            Arjun
          </a> 
          <span class="text-gray-400">·</span> 
          <a href="#" class="inline-flex items-center gap-x-1.5 hover:underline">
            <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&amp;h=150&amp;fit=crop&amp;crop=faces" class="shrink-0 size-4 rounded-full object-cover" alt="Meena">
            Meena
          </a> 
          <span class="text-gray-400">·</span> 
          <a href="#" class="inline-flex items-center gap-x-1.5 hover:underline">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&amp;h=150&amp;fit=crop&amp;crop=faces" class="shrink-0 size-4 rounded-full object-cover" alt="Karthik">
            Karthik
          </a> 
          <span class="text-gray-400">·</span> 
          
          <div x-data="{
                 active: false,
                 top: 0, left: 0,
                 currentPlacement: 'bottom',
                 arrowOffset: '50%',
                 updatePosition() {
                   const trigger = this.$refs.trigger;
                   const pop = this.$refs.popover;
                   if (!trigger || !pop) return;
                   const r = trigger.getBoundingClientRect();
                   const placement = 'bottom';
                   const gap = 12;
                   
                   const wasHidden = pop.style.display === 'none' || getComputedStyle(pop).display === 'none';
                   if (wasHidden) pop.style.setProperty('display', 'block', 'important');
                   const popW = pop.offsetWidth || 280;
                   const popH = pop.offsetHeight || 150;
                   if (wasHidden) pop.style.removeProperty('display');
                   
                   let finalPlacement = placement;
                   if (placement === 'bottom' &amp;&amp; r.bottom + popH + gap &gt; window.innerHeight &amp;&amp; r.top - popH - gap &gt; 0) {
                     finalPlacement = 'top';
                   } else if (placement === 'top' &amp;&amp; r.top - popH - gap &lt; 0 &amp;&amp; r.bottom + popH + gap &lt; window.innerHeight) {
                     finalPlacement = 'bottom';
                   } else if (placement === 'right' &amp;&amp; r.right + popW + gap &gt; window.innerWidth &amp;&amp; r.left - popW - gap &gt; 0) {
                     finalPlacement = 'left';
                   } else if (placement === 'left' &amp;&amp; r.left - popW - gap &lt; 0 &amp;&amp; r.right + popW + gap &lt; window.innerWidth) {
                     finalPlacement = 'right';
                   }
                   this.currentPlacement = finalPlacement;

                   if (finalPlacement === 'top') {
                     this.top  = r.top - popH - gap;
                     this.left = r.left + (r.width - popW) / 2;
                   } else if (finalPlacement === 'bottom') {
                     this.top  = r.bottom + gap;
                     this.left = r.left + (r.width - popW) / 2;
                   } else if (finalPlacement === 'left') {
                     this.top  = r.top + (r.height - popH) / 2;
                     this.left = r.left - popW - gap;
                   } else if (finalPlacement === 'right') {
                     this.top  = r.top + (r.height - popH) / 2;
                     this.left = r.right + gap;
                   }
                   
                   if (finalPlacement === 'top' || finalPlacement === 'bottom') {
                     const minL = 8, maxL = window.innerWidth - popW - 8;
                     this.left = Math.max(minL, Math.min(this.left, maxL));
                     const triggerCenter = r.left + r.width / 2;
                     const shift = triggerCenter - this.left;
                     this.arrowOffset = Math.max(12, Math.min(shift, popW - 12)) + 'px';
                   } else {
                     const minT = 8, maxT = window.innerHeight - popH - 8;
                     this.top = Math.max(minT, Math.min(this.top, maxT));
                     const triggerCenterY = r.top + r.height / 2;
                     const shiftY = triggerCenterY - this.top;
                     this.arrowOffset = Math.max(12, Math.min(shiftY, popH - 12)) + 'px';
                   }
                 }
               }" x-init="if (active) { $nextTick(() =&gt; updatePosition()) }" @click.outside="active = false" @keydown.escape.window="active = false" @scroll.window.capture.passive="if(active) updatePosition()" @resize.window.passive="if(active) updatePosition()" class="relative inline-flex items-center align-middle ">

            <!-- Trigger -->
            <div x-ref="trigger" class="inline-flex items-center justify-center " aria-haspopup="dialog" :aria-expanded="active" @click="active = !active; if(active) $nextTick(() =&gt; updatePosition())" aria-controls="popover-4858" aria-expanded="false">
              <span class="hover:underline cursor-pointer text-gray-500 dark:text-neutral-500">+2 more</span>
            </div>

            <!-- Popover Card (fixed viewport relative container) -->
            <div x-show="active" x-ref="popover" id="popover-4858" role="dialog" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" :style="{ top: top + 'px', left: left + 'px' }" class="fixed z-[9999] bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-lg whitespace-normal text-start overflow-visible w-48" style="top: 0px; left: 0px; display: none;">

              <div class="flex flex-col py-1">
                <a class="flex items-center gap-x-2 py-2 px-3 hover:bg-gray-100 dark:hover:bg-neutral-700" href="#">
                  <img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=150&amp;h=150&amp;fit=crop&amp;crop=faces" class="shrink-0 size-6 rounded-full object-cover" alt="Suresh Iyer">
                  <span class="text-sm font-medium text-gray-800 dark:text-neutral-200">Suresh Iyer</span>
                </a>
                <a class="flex items-center gap-x-2 py-2 px-3 hover:bg-gray-100 dark:hover:bg-neutral-700" href="#">
                  <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=150&amp;h=150&amp;fit=crop&amp;crop=faces" class="shrink-0 size-6 rounded-full object-cover" alt="Kavita Rao">
                  <span class="text-sm font-medium text-gray-800 dark:text-neutral-200">Kavita Rao</span>
                </a>
              </div>

              <!-- Arrow -->
              <template x-if="currentPlacement === 'top'">
                <div class="absolute top-full -translate-x-1/2 w-3 h-3 bg-white dark:bg-neutral-800 border-b border-r border-gray-200 dark:border-neutral-700 rotate-45 -mt-1.5" :style="{ left: arrowOffset }"></div>
              </template>
              <template x-if="currentPlacement === 'bottom'">
                <div class="absolute bottom-full -translate-x-1/2 w-3 h-3 bg-white dark:bg-neutral-800 border-t border-l border-gray-200 dark:border-neutral-700 rotate-45 -mb-1.5" :style="{ left: arrowOffset }"></div>
              </template>
              <template x-if="currentPlacement === 'left'">
                <div class="absolute left-full -translate-y-1/2 w-3 h-3 bg-white dark:bg-neutral-800 border-t border-r border-gray-200 dark:border-neutral-700 rotate-45 -ml-1.5" :style="{ top: arrowOffset }"></div>
              </template>
              <template x-if="currentPlacement === 'right'">
                <div class="absolute right-full -translate-y-1/2 w-3 h-3 bg-white dark:bg-neutral-800 border-b border-l border-gray-200 dark:border-neutral-700 rotate-45 -mr-1.5" :style="{ top: arrowOffset }"></div>
              </template>
            </div>
          </div>
        </dd>
      </div>
      <div>
        <dt class="text-sm text-gray-500 dark:text-neutral-500">Status</dt>
        <dd class="mt-1 text-sm text-gray-800 dark:text-neutral-200">
          <span class="inline-flex items-center gap-x-1 py-0.5 px-2 text-[11px] font-medium bg-blue-100 text-blue-800 dark:bg-blue-800/30 dark:text-blue-500 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="clock" aria-hidden="true" class="lucide lucide-clock shrink-0 size-3"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
            {{ item.state | replace("-", " ") | capitalize }}
          </span>
        </dd>
      </div>
    </dl>
  </div>
</div>
