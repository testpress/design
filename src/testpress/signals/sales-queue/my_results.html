<!-- Card -->
<div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-xs rounded-xl overflow-hidden" x-data="{ status: new URLSearchParams(window.location.search).get('status'), get isNoData() { return this.status === 'empty' || this.status === 'onboarding' } }">
  <!-- Header -->
  <div class="flex justify-between items-center px-5 pt-5 pb-4">
    <div>
      <h2 class="font-medium text-sm sm:text-base text-gray-800 dark:text-neutral-200">
        My Results
      </h2>
      <p class="text-sm text-gray-500 dark:text-neutral-400 mt-0.5">
        Your sales metrics for the current month
      </p>
    </div>
  </div>

  <!-- Body -->
  <div class="px-5 pb-6 pt-3">
    <!-- Stats Row -->
    <div class="flex justify-between items-center w-full">
      <!-- Card -->
      <div class="flex flex-col items-center">
        <p class="text-sm sm:text-base text-gray-500 dark:text-neutral-400">
          Won
        </p>
        <div class="mt-0.5 flex justify-center">
          <span x-show="isNoData" style="display: none;" class="block text-sm font-normal text-gray-400 dark:text-neutral-500">-</span>
          <span x-show="!isNoData" class="block text-lg font-medium text-gray-800 dark:text-neutral-200">
            8
          </span>
        </div>
      </div>
      <!-- End Card -->

      <div class="w-px h-8 bg-gray-200 dark:bg-neutral-700"></div>

      <!-- Card -->
      <div class="flex flex-col items-center">
        <p class="text-sm sm:text-base text-gray-500 dark:text-neutral-400">
          Sales
        </p>
        <div class="mt-0.5 flex justify-center">
          <span x-show="isNoData" style="display: none;" class="block text-sm font-normal text-gray-400 dark:text-neutral-500">-</span>
          <span x-show="!isNoData" class="block text-lg font-medium text-gray-800 dark:text-neutral-200">
            ₹1.42L
          </span>
        </div>
      </div>
      <!-- End Card -->

      <div class="w-px h-8 bg-gray-200 dark:bg-neutral-700"></div>

      <!-- Card -->
      <div class="flex flex-col items-center">
        <p class="text-sm sm:text-base text-gray-500 dark:text-neutral-400">
          Incentive
        </p>
        <div class="mt-0.5 flex justify-center">
          <span x-show="isNoData" style="display: none;" class="block text-sm font-normal text-gray-400 dark:text-neutral-500">-</span>
          <span x-show="!isNoData" class="block text-lg font-medium text-green-600 dark:text-green-500">
            ₹1,420
          </span>
        </div>
      </div>
      <!-- End Card -->
    </div>
    <!-- End Stats Row -->
    

  </div>
</div>
<!-- End Card -->
