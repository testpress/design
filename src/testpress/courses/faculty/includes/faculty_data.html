  const COMPLETED_JOB = { status: "completed", jobId: "lj-4c81e07a", startedAt: "2026-11-02T09:12:00", endedAt: "2026-11-02T09:16:00", error: null, sourceAvailable: true };

  });

  // Sample clip played for intro videos in the prototype.
  const SAMPLE_VIDEO_URL = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

  // What each transcoding status means for the admin. `group` is what the admin sees: both "still working" statuses are transcoding, and a cancelled job is a failed one.
  const VIDEO_STATES = {
    submitted: { group: "transcoding", tag: "Intro video transcoding", students: "It will be available once done." },
    progressing: { group: "transcoding", tag: "Intro video transcoding", students: "It will be available once done." },
    completed: { group: "ready", tag: "Intro video", students: "Students can watch this video." },
    failed: { group: "failed", tag: "Intro video failed", students: "Students see the profile without a video." },
    cancelled: { group: "failed", tag: "Intro video failed", students: "Transcoding was stopped before it finished." },
  };

  function videoState(link) {
    return VIDEO_STATES[link && link.transcode ? link.transcode.status : "completed"];
  }

  function sourceMissing(link) {
    return !!(link && link.transcode && link.transcode.sourceAvailable === false);
  }

  // A failed or cancelled job can retry if its source is still there. Otherwise the way forward is a new file.
  function canRetry(link) {
    return !!(link && link.transcode && videoState(link).group === "failed" && !sourceMissing(link));
  }

  function shortTime(iso) {
    return new Date(iso).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  }

  // How long a running job has been going: "2 min ago", then "1 hr ago", then the date once it's a day old.
  function timeAgo(iso, now) {
    const minutes = Math.floor((now - new Date(iso)) / 60000);
    if (minutes < 1) return "just now";
    if (minutes < 60) return minutes + " min ago";
    if (minutes < 1440) return Math.floor(minutes / 60) + " hr ago";
    return shortTime(iso);
  }

  // The one line shown while a job runs: how long it's been going, then what happens next.
  function transcodingText(link, now) {
    const job = link && link.transcode;
    if (!job) return "";
    return (job.startedAt ? "Started " + timeAgo(job.startedAt, now) : "Waiting to start") + ". " + videoState(link).students;
  }

  function fileSize(bytes) {
    return bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + " GB" : Math.max(1, Math.round(bytes / 1e6)) + " MB";
  }

  const LINKS_KEY = FACULTY_KEY + "-links";

  const facultyStore = {
    loadLinks() {
      try {
        const saved = sessionStorage.getItem(LINKS_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return JSON.parse(JSON.stringify(SAMPLE_LINKS));
    },
    saveLinks(links) {
      try { sessionStorage.setItem(LINKS_KEY, JSON.stringify(links)); } catch (e) {}
    },
    load() {
      try {
        const saved = sessionStorage.getItem(FACULTY_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return JSON.parse(JSON.stringify(SAMPLE_PROFILES));
    },
    save(profiles) {
      try { sessionStorage.setItem(FACULTY_KEY, JSON.stringify(profiles)); } catch (e) {}
    },
    reset() {
      try { sessionStorage.removeItem(FACULTY_KEY); sessionStorage.removeItem(LINKS_KEY); } catch (e) {}
    },
    // A one-time message for the next page, such as "added to faculty".
    flash(message) {
      try {
        if (message) return sessionStorage.setItem(FACULTY_KEY + "-flash", message);
        const value = sessionStorage.getItem(FACULTY_KEY + "-flash");
        sessionStorage.removeItem(FACULTY_KEY + "-flash");
        return value;
      } catch (e) { return null; }
    },
  };

  function staffById(id) {
    return STAFF.find((s) => s.id === id);
  }

  // Email of the linked staff account, or "" when the instructor isn't linked.
  function instructorEmail(profile) {
    const staff = profile && profile.staff ? staffById(profile.staff) : null;
    return staff ? staff.email : "";
  }

  function initialsOf(name) {
    return name.replace(/^Dr\.\s*/, "").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  }

  // "History, Art and Culture" → ["History", "Art and Culture"].
  function splitSubjects(text) {
    return (text || "").split(",").map((x) => x.trim()).filter(Boolean);
  }

  // Every subject an instructor teaches, gathered from their course links (for the Faculty list).
  function subjectsFor(id, links) {
    return [...new Set(linksFor(id, links).flatMap((l) => splitSubjects(l.subject)))];
  }

  function linksFor(id, links) {
    return (links || facultyStore.loadLinks()).filter((l) => l.instructor === id);
  }

  function profileUrl(id, isNew) {
    const base = (window.location.pathname.match(/(\/pr-preview\/pr-\d+)?/)[0] || "") + "/testpress/courses/faculty/profile/";
    return `${base}?id=${encodeURIComponent(id)}${isNew ? "&new=1" : ""}`;
  }

  function newInstructorUrl() {
    return (window.location.pathname.match(/(\/pr-preview\/pr-\d+)?/)[0] || "") + "/testpress/courses/faculty/profile/?new=1";
  }

  function courseFacultyUrl(course) {
    return (window.location.pathname.match(/(\/pr-preview\/pr-\d+)?/)[0] || "") + "/testpress/courses/faculty/course/?course=" + encodeURIComponent(course);
  }

  function facultyListUrl() {
    return (window.location.pathname.match(/(\/pr-preview\/pr-\d+)?/)[0] || "") + "/testpress/courses/faculty/";
  }
