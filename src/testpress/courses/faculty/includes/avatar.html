{# Instructor photo, or initials when there is none. `person` needs name and photo. #}
{% macro avatar(person="person", size="size-10", text="text-sm") %}
<template x-if="{{ person }}.photo">
  <img :src="{{ person }}.photo" :alt="{{ person }}.name" class="shrink-0 {{ size }} rounded-full object-cover bg-gray-100 dark:bg-neutral-700">
</template>
<template x-if="!{{ person }}.photo">
  <span class="shrink-0 {{ size }} inline-flex items-center justify-center rounded-full bg-gray-100 {{ text }} font-semibold text-gray-600 dark:bg-neutral-700 dark:text-neutral-300" x-text="initialsOf({{ person }}.name)" aria-hidden="true"></span>
</template>
{% endmacro %}
