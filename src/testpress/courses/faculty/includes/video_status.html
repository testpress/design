{# The "Intro video" tag on a course row, in the dot style of the student card. It only speaks up when
   students can't watch the video, and opens the same drawer as Edit. `link` is an Alpine expression. #}
{% macro video_status(link) %}
  <span class="basis-full sm:basis-auto inline-flex items-center"><span class="hidden sm:inline mx-1.5 text-gray-300 dark:text-neutral-600" aria-hidden="true">·</span><button type="button" @click.stop="openVideo({{ link }})" class="inline-flex items-center hover:underline focus:outline-none focus:underline" :class="videoState({{ link }}).group === 'failed' && 'font-medium text-red-600 dark:text-red-500'">
    <span x-show="videoState({{ link }}).group === 'ready'" class="inline-flex"><i data-lucide="circle-play" class="size-3.5 me-1"></i></span>
    <span x-show="videoState({{ link }}).group === 'transcoding'" class="inline-flex"><i data-lucide="loader-2" class="size-3.5 me-1 animate-spin"></i></span>
    <span x-show="videoState({{ link }}).group === 'failed'" class="inline-flex"><i data-lucide="triangle-alert" class="size-3.5 me-1"></i></span>
    <span x-text="videoState({{ link }}).tag"></span>
  </button></span>
{% endmacro %}
