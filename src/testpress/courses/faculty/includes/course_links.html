{# The course list is filled in when the drawer opens (set-options), so the choice is read from the
   select's own state, not from its hidden native <select>.
   Assign, edit and unassign an instructor's courses: the side drawer (subject, intro video) and
   the unassign confirmation. The page's Alpine data must include courseLinkActions(). #}
{% from "../../../../ui-system/components/button.html" import button %}
{% from "../../../../ui-system/components/drawer.html" import drawer %}
{% from "../../../../ui-system/components/modal.html" import modal %}
{% from "../../../../ui-system/components/select.html" import select %}
{% from "../../../../ui-system/components/upload.html" import upload %}
{% from "../../../../ui-system/components/input.html" import input %}
{% from "../../../../ui-system/components/alert.html" import alert %}
{% from "../../../../ui-system/components/dropdown.html" import dropdown %}
{% from "../../../../ui-system/components/tooltip.html" import tooltip %}

  {% set course_options = [
    { value: "Prelims GS", label: "Prelims GS" },
    { value: "Mains GS", label: "Mains GS" },
    { value: "CSAT", label: "CSAT" },
    { value: "Current affairs", label: "Current affairs" },
    { value: "Sociology Optional", label: "Sociology Optional" },
    { value: "Essay Test Series", label: "Essay Test Series" },
    { value: "Interview Guidance", label: "Interview Guidance" }
  ] %}
  {% call drawer(id="course-link", placement="right", size="md") %}
    <div class="py-3 px-6 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700 shrink-0">
      <h3 class="font-medium text-gray-800 dark:text-neutral-200" x-text="fixedCourse ? (draft.isNew ? 'Assign ' + (person ? person.name : 'instructor') : (person ? person.name : '')) : (draft.isNew ? 'Assign course' : draft.course)"></h3>
      <button type="button" @click="open = false" class="size-8 inline-flex shrink-0 justify-center items-center rounded-full border border-gray-200 text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:border-neutral-700 dark:text-neutral-200 dark:hover:bg-neutral-700">
        <span class="sr-only">Close drawer</span>
        <i data-lucide="x" class="size-4 shrink-0"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto bg-gray-50 dark:bg-neutral-900/50 p-4 space-y-4">
      <div x-show="draft.isNew && !fixedCourse" class="p-4 bg-white rounded-xl border border-gray-200 dark:bg-neutral-900 dark:border-neutral-700">
        <h5 class="mb-3 font-medium text-sm text-gray-800 dark:text-neutral-200">Course <span class="text-red-500">*</span></h5>
        <template x-if="availableCourses.length">
          <div id="course-select" @change="if ($event.target.tagName === 'SELECT') { draft.course = $event.target.closest('[x-data]')._x_dataStack[0].selected; errors.course = ''; }">
            {{ select(label="", name="link_course", placeholder="Select course", options=course_options, search=true, multiple=false) }}
          </div>
        </template>
        <p x-show="!availableCourses.length" class="text-sm text-gray-500 dark:text-neutral-400" x-text="noCourses ? 'There are no courses yet. Create a course first.' : (person ? person.name : 'They') + ' are already in every course.'"></p>
        <p x-show="errors.course" class="mt-1.5 text-xs text-red-500" x-text="errors.course"></p>
      </div>

      <div class="p-4 bg-white rounded-xl border border-gray-200 dark:bg-neutral-900 dark:border-neutral-700">
        <h5 class="mb-3 font-medium text-sm text-gray-800 dark:text-neutral-200">Subject they teach in this course <span class="text-red-500">*</span></h5>
        {# Free text, as in the PRD: shown to students as typed, not linked to Testpress subjects. #}
        {{ input(name="link_subject", placeholder="e.g. Polity, Governance", x_model="draft.subject", extra_attrs='autocomplete="off" @input="errors.subject = \'\'" :class="errors.subject && \'!border-red-500 focus:!ring-red-500\'"') }}
        <p x-show="errors.subject" class="mt-1.5 text-xs text-red-500" x-text="errors.subject"></p>
        <p x-show="!errors.subject" class="mt-1.5 text-xs text-gray-500 dark:text-neutral-400">Shown to students next to their name. For more than one, separate with commas.</p>
      </div>

      <div class="p-4 bg-white rounded-xl border border-gray-200 dark:bg-neutral-900 dark:border-neutral-700">
        <h5 x-init="setInterval(() => clock = Date.now(), 30000)" class="mb-3 font-medium text-sm text-gray-800 dark:text-neutral-200">Intro video</h5>
        {# A video already added: replace or remove it. #}
        <div x-show="draft.video" class="bg-white border border-gray-200 rounded-xl overflow-hidden dark:bg-neutral-800 dark:border-neutral-700">
        <template x-if="draft.video && draftCanPlay">
          <video x-ref="draftVideo" :src="draft.videoUrl || SAMPLE_VIDEO_URL" controls playsinline preload="metadata" class="w-full aspect-video bg-black object-contain"></video>
        </template>
        {# Stands where the player will be, until there's a transcoded video to play. #}
        <div x-show="draft.video && !draftCanPlay" class="aspect-video px-6 flex flex-col justify-center items-center text-center bg-gray-50 dark:bg-neutral-900/50">
          <span x-show="draftState.group === 'transcoding'" class="inline-flex text-gray-400 dark:text-neutral-500"><i data-lucide="loader-2" class="size-6 animate-spin"></i></span>
          <span x-show="draftState.group === 'failed'" class="inline-flex text-red-500"><i data-lucide="triangle-alert" class="size-6"></i></span>
          <p class="mt-2 text-sm font-medium text-gray-800 dark:text-neutral-200" x-text="draftPanelTitle"></p>
          <p class="mt-0.5 text-sm text-balance text-gray-500 dark:text-neutral-400" x-text="draftPanelText"></p>
          <div x-show="draftState.group !== 'transcoding'" class="mt-3 flex items-center gap-x-2">
            <span x-show="canRetry(draftLink)" class="inline-flex">{{ button(text="Retry", variant="secondary", size="sm", icon="rotate-ccw", extra_attrs='@click="retryTranscode(draftLink)"') }}</span>
            {{ button(text='<span x-text="sourceMissing(draftLink) ? \'Upload video\' : \'Replace\'"></span>', variant="secondary", size="sm", icon="upload", extra_attrs='@click="pickReplacement()"') }}
          </div>
        </div>
        <div class="p-3">
          <div class="flex items-center gap-x-3 min-w-0">
            <span class="shrink-0 size-8 flex justify-center items-center bg-gray-50 border border-gray-200 text-gray-500 rounded-lg dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400">
              <i data-lucide="clapperboard" class="size-4"></i>
            </span>
            <div class="min-w-0 grow">
              <p class="text-sm font-medium text-gray-800 truncate dark:text-neutral-200" x-text="draft.video"></p>
              {# Only the file here. Its status is in the panel above. #}
              <p class="text-xs text-gray-500 dark:text-neutral-400">
                <span x-show="draft.pendingFile">New video · </span>
                <span x-show="sourceMissing(draftLink)">Source missing</span>
                <span x-show="!sourceMissing(draftLink)" x-text="draft.videoSize"></span>
              </p>
            </div>
            <div class="shrink-0 flex items-center">
              <span x-show="!draft.pendingFile && !sourceMissing(draftLink)" class="inline-flex">
                {% set download_trigger %}
                  <button type="button" @click="downloadSource(draftLink)" class="size-8 inline-flex justify-center items-center rounded-full text-gray-500 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700" aria-label="Download source">
                    <i data-lucide="download" class="size-4"></i>
                  </button>
                {% endset %}
                {{ tooltip(content="Download source", trigger=download_trigger, placement="top", width="whitespace-nowrap") }}
              </span>
              {{ dropdown(trigger="⋮", placement="bottom-end", width="small", items=[
                { label: "Replace", icon: "refresh-cw", x_on: '@click="pickReplacement(); open = false"' },
                { label: "Remove", icon: "trash-2", variant: "danger", x_on: '@click="removeDraftVideo(); open = false"' }
              ]) }}
            </div>
          </div>
          {# A new file isn't sent until the drawer is saved, so say what saving will do. #}
          <p x-show="draft.pendingFile" class="mt-3 text-xs" :class="draft.savedVideo ? 'text-amber-700 dark:text-amber-500' : 'text-gray-500 dark:text-neutral-400'" x-text="draft.savedVideo ? 'Saving deletes the current video and its source. Students won\'t see a video until this one is ready.' : 'Transcoding starts when you save. Students see it once it\'s ready.'"></p>
        </div>
        </div>
        {# Removing also applies on save, so it can still be undone here. #}
        <div x-show="draftRemoving" class="mb-3">
          {% call alert(variant="warning", size="sm", show_icon=false) %}
            <div class="flex items-start justify-between gap-x-3">
              <p>Saving deletes <span class="font-medium" x-text="draft.savedVideo"></span> and its source. Students stop seeing it.</p>
              <button type="button" @click="undoVideoChange()" class="shrink-0 font-medium underline underline-offset-2 hover:no-underline focus:outline-none">Undo</button>
            </div>
          {% endcall %}
        </div>
        {# Capture: the upload macro empties the input as soon as its own handler runs. #}
        <div id="course-link-video" x-show="!draft.video" @change.capture="if ($event.target.type === 'file' && $event.target.files[0]) pickedFile($event.target.files[0])">
          {{ upload(
            name="link_video",
            accepted_formats="mp4,mov,webm",
            max_size="500MB",
            icon="clapperboard",
            help_text="Optional. A short video where they introduce themselves to students of this course."
          ) }}
        </div>
      </div>


    </div>

    <div class="p-4 border-t dark:border-neutral-700 bg-white dark:bg-neutral-800">
      <div class="flex gap-x-2">
        <button type="button" @click="open = false" class="flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300">
          Cancel
        </button>
        <button type="button" @click="if (saveDraft()) open = false" class="flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700" x-text="draft.isNew ? (fixedCourse ? 'Assign to course' : 'Assign course') : 'Save changes'">
          Save changes
        </button>
      </div>
    </div>
  {% endcall %}

  {% call modal(id="unassign-course", title="Remove from course?", variant="danger", confirm_text="Remove", cancel_text="Cancel") %}
    <p class="text-gray-800 dark:text-neutral-200">
      Students will no longer see <span class="font-medium" x-text="person ? person.name : 'this instructor'"></span> on <span class="font-medium" x-text="unassigning && unassigning.course"></span>.
    </p>
    <p class="mt-2 text-gray-500 dark:text-neutral-400">Their subject and intro video for this course are removed. Their profile and other courses stay the same.</p>
  {% endcall %}

<script>
  // Shared by pages that manage an instructor's courses. Needs `person` on the page.
  function courseLinkActions() {
      const blankDraft = () => ({ isNew: true, course: "", subject: "", video: null, videoUrl: null, videoSize: null, visible: true, savedVideo: null, savedUrl: null, savedSize: null, pendingFile: false });

      return {
        // Set on a course's Faculty page: the drawer is for that course, and picks no course.
        fixedCourse: null,
        allLinks: facultyStore.loadLinks(),
        draft: blankDraft(),
        errors: { course: "", subject: "" },
        unassigning: null,
        draftPlaying: false,
        // Keeps "Started 2 min ago" current while the page stays open.
        clock: Date.now(),

        // The saved link behind the drawer's video, or null while a new file is waiting to be saved.
        get draftLink() {
          if (this.draft.isNew || this.draft.pendingFile) return null;
          return this.links.find((l) => l.course === this.draft.course) || null;
        },

        get draftState() {
          return videoState(this.draftLink);
        },

        get draftCanPlay() {
          return this.draft.pendingFile || this.draftState.group === "ready";
        },

        get draftRemoving() {
          return !this.draft.video && !!this.draft.savedVideo;
        },

        get draftPanelTitle() {
          if (sourceMissing(this.draftLink)) return "Source video is missing";
          return { transcoding: "The video is currently being transcoded", failed: "Transcoding failed" }[this.draftState.group] || "";
        },

        // The job's own error when there is one, otherwise what students see.
        get draftPanelText() {
          if (this.draftState.group === "transcoding") return transcodingText(this.draftLink, this.clock);
          const job = this.draftLink && this.draftLink.transcode;
          return job && job.error && !sourceMissing(this.draftLink) ? job.error : this.draftState.students;
        },

        get links() {
          return this.person ? this.allLinks.filter((l) => l.instructor === this.person.id) : [];
        },

        get noCourses() {
          try { return sessionStorage.getItem(FACULTY_KEY + "-no-courses") === "1"; } catch (e) { return false; }
        },

        get availableCourses() {
          if (this.noCourses) return [];
          return COURSES.filter((c) => !this.links.some((l) => l.course === c));
        },

        // New course: the course select lists only courses they're not in.
        openAssign() {
          this.draft = blankDraft();
          this.draftPlaying = false;
          this.errors = { course: "", subject: "" };
          this.$dispatch("set-uploaded-file", { name: "link_video", files: [] });
          this.$dispatch("open-drawer-course-link");
          this.$nextTick(() => window.lucide && window.lucide.createIcons());
          this.$nextTick(() => {
            const el = document.querySelector("#course-select > div");
            if (!el) return;
            el.dispatchEvent(new CustomEvent("set-options", { detail: this.availableCourses.map((c) => ({ value: c, label: c })) }));
            el.dispatchEvent(new CustomEvent("set-selected-values", { detail: "" }));
          });
        },

        openEdit(link) {
          this.draft = { ...blankDraft(), isNew: false, course: link.course, subject: link.subject || "", video: link.video, videoUrl: link.videoUrl || null, videoSize: link.videoSize || null, visible: link.visible, savedVideo: link.video, savedUrl: link.videoUrl || null, savedSize: link.videoSize || null };
          this.draftPlaying = false;
          this.errors = { course: "", subject: "" };
          this.$dispatch("set-uploaded-file", { name: "link_video", files: [] });
          this.$dispatch("open-drawer-course-link");
          this.$nextTick(() => window.lucide && window.lucide.createIcons());
        },

        // Replace and Remove only change the draft. Files are deleted when the drawer is saved.
        pickedFile(file) {
          this.draft.video = file.name;
          this.draft.videoUrl = URL.createObjectURL(file);
          this.draft.videoSize = fileSize(file.size);
          this.draft.pendingFile = true;
          this.$nextTick(() => window.lucide && window.lucide.createIcons());
        },

        // Nothing changes until a file is picked, so closing the file picker leaves the video as it was.
        pickReplacement() {
          this.$dispatch("set-uploaded-file", { name: "link_video", files: [] });
          const input = document.querySelector("#course-link-video input[type=file]");
          input.value = "";
          input.click();
        },

        removeDraftVideo() {
          this.draft.video = null;
          this.draft.videoUrl = null;
          this.draft.videoSize = null;
          this.draft.pendingFile = false;
          this.draftPlaying = false;
          this.$dispatch("set-uploaded-file", { name: "link_video", files: [] });
        },

        undoVideoChange() {
          this.draft.video = this.draft.savedVideo;
          this.draft.videoUrl = this.draft.savedUrl;
          this.draft.videoSize = this.draft.savedSize;
          this.draft.pendingFile = false;
        },

        // A row's video status opens the same drawer as Edit.
        openVideo(link) {
          if (this.fixedCourse) this.person = { id: link.instructor, name: facultyStore.load()[link.instructor].name };
          this.openEdit(link);
        },

        // Prototype only: plays out a job. A newer job on the same link takes over from this one.
        startTranscode(link) {
          const jobId = "lj-" + Math.random().toString(16).slice(2, 10);
          const update = (changes) => {
            const all = facultyStore.loadLinks();
            const current = all.find((l) => l.course === link.course && l.instructor === link.instructor);
            if (!current || !current.video || (changes.status !== "submitted" && current.transcode.jobId !== jobId)) return;
            current.transcode = { ...current.transcode, ...changes };
            facultyStore.saveLinks(all);
            this.allLinks = all;
          };
          update({ status: "submitted", jobId, startedAt: null, endedAt: null, error: null, sourceAvailable: true });
          setTimeout(() => update({ status: "progressing", startedAt: new Date().toISOString() }), 3000);
          setTimeout(() => update({ status: "completed", endedAt: new Date().toISOString() }), 9000);
        },

        retryTranscode(link) {
          this.startTranscode(link);
          this.$dispatch("toast", { title: "Retrying transcoding", variant: "success" });
        },

        downloadSource(link) {
          this.$dispatch("toast", { title: `Downloading ${link.video}`, variant: "success" });
        },

        saveDraft() {
          this.draftPlaying = false;
          if (this.fixedCourse) this.draft.course = this.fixedCourse;
          if (this.draft.isNew && !this.draft.course) this.errors.course = "Pick a course.";
          if (!splitSubjects(this.draft.subject).length) this.errors.subject = "Add the subject they teach in this course.";
          if (this.errors.course || this.errors.subject) return false;
          const startJob = this.draft.pendingFile;
          const kept = !startJob && this.draft.video ? this.links.find((l) => l.course === this.draft.course) : null;
          const link = { course: this.draft.course, instructor: this.person.id, subject: splitSubjects(this.draft.subject).join(", "), video: this.draft.video, videoUrl: this.draft.videoUrl, videoSize: this.draft.videoSize, transcode: kept ? kept.transcode : null, visible: this.draft.visible };
          const all = facultyStore.loadLinks();
          const i = all.findIndex((l) => l.course === link.course && l.instructor === link.instructor);
          if (i >= 0) all[i] = link; else all.push(link);
          facultyStore.saveLinks(all);
          this.allLinks = all;
          if (startJob) this.startTranscode(link);
          const title = this.fixedCourse
            ? (this.draft.isNew ? `${this.person.name} assigned to ${link.course}` : `${this.person.name} updated`)
            : (this.draft.isNew ? `Assigned to ${link.course}` : `${link.course} updated`);
          this.$dispatch("toast", { title, variant: "success" });
          return true;
        },

        askUnassign(link) {
          this.unassigning = link;
          this.$dispatch("open-modal-unassign-course");
        },

        confirmUnassign() {
          if (!this.unassigning) return;
          const course = this.unassigning.course;
          const all = facultyStore.loadLinks().filter((l) => !(l.course === course && l.instructor === this.person.id));
          facultyStore.saveLinks(all);
          this.allLinks = all;
          this.unassigning = null;
          this.$dispatch("toast", { title: this.fixedCourse ? `${this.person.name} removed from ${course}` : `Unassigned from ${course}`, variant: "success" });
        },
      };
    }
</script>
