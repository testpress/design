{# The course list is filled in when the drawer opens (set-options), so the choice is read from the
   select's own state, not from its hidden native <select>.
   Assign, edit and unassign an instructor's courses: the side drawer (subjects, intro video) and
   the unassign confirmation. The page's Alpine data must include courseLinkActions(). #}
{% from "../../../../ui-system/components/button.html" import button %}
{% from "../../../../ui-system/components/drawer.html" import drawer %}
{% from "../../../../ui-system/components/modal.html" import modal %}
{% from "../../../../ui-system/components/select.html" import select %}
{% from "../../../../ui-system/components/upload.html" import upload %}
{% from "./subject_picker.html" import subject_picker %}

  {% set course_options = [
    { value: "Prelims GS", label: "Prelims GS" },
    { value: "Mains GS", label: "Mains GS" },
    { value: "CSAT", label: "CSAT" },
    { value: "Current affairs", label: "Current affairs" },
    { value: "Sociology Optional", label: "Sociology Optional" },
    { value: "Essay Test Series", label: "Essay Test Series" },
    { value: "Interview Guidance", label: "Interview Guidance" }
  ] %}
  {% call drawer(id="course-link", placement="right", size="md") %}
    <div class="py-3 px-6 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700 shrink-0">
      <h3 class="font-medium text-gray-800 dark:text-neutral-200" x-text="draft.isNew ? 'Assign course' : draft.course"></h3>
      <button type="button" @click="open = false" class="size-8 inline-flex shrink-0 justify-center items-center rounded-full border border-gray-200 text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 dark:border-neutral-700 dark:text-neutral-200 dark:hover:bg-neutral-700">
        <span class="sr-only">Close drawer</span>
        <i data-lucide="x" class="size-4 shrink-0"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto bg-gray-50 dark:bg-neutral-900/50 p-4 space-y-4">
      <div x-show="draft.isNew" class="p-4 bg-white rounded-xl border border-gray-200 dark:bg-neutral-900 dark:border-neutral-700">
        <h5 class="mb-3 font-medium text-sm text-gray-800 dark:text-neutral-200">Course <span class="text-red-500">*</span></h5>
        <template x-if="availableCourses.length">
          <div id="course-select" @change="if ($event.target.tagName === 'SELECT') { draft.course = $event.target.closest('[x-data]')._x_dataStack[0].selected; errors.course = ''; }">
            {{ select(label="", name="link_course", placeholder="Select course", options=course_options, search=true, multiple=false) }}
          </div>
        </template>
        <p x-show="!availableCourses.length" class="text-sm text-gray-500 dark:text-neutral-400" x-text="noCourses ? 'There are no courses yet. Create a course first.' : (person ? person.name : 'They') + ' are already in every course.'"></p>
        <p x-show="errors.course" class="mt-1.5 text-xs text-red-500" x-text="errors.course"></p>
      </div>

      <div class="p-4 bg-white rounded-xl border border-gray-200 dark:bg-neutral-900 dark:border-neutral-700">
        <h5 class="mb-3 font-medium text-sm text-gray-800 dark:text-neutral-200">Subjects in this course <span class="text-red-500">*</span></h5>
        {{ subject_picker("draft.subjects", "link_subjects") }}
        <p x-show="errors.subjects" class="mt-1.5 text-xs text-red-500" x-text="errors.subjects"></p>
        <p x-show="!errors.subjects" class="mt-1.5 text-xs text-gray-500 dark:text-neutral-400" x-text="draft.isNew ? 'Filled in from their profile. Changes here apply only to this course.' : 'Changes here apply only to this course, not to their profile.'"></p>
      </div>

      <div class="p-4 bg-white rounded-xl border border-gray-200 dark:bg-neutral-900 dark:border-neutral-700">
        <h5 class="mb-3 font-medium text-sm text-gray-800 dark:text-neutral-200">Intro video</h5>
        {# A video already added: replace or remove it. #}
        <div x-show="draft.video" class="bg-white border border-gray-200 rounded-xl overflow-hidden dark:bg-neutral-800 dark:border-neutral-700">
        <template x-if="draft.video">
          <video x-ref="draftVideo" :src="draft.videoUrl || SAMPLE_VIDEO_URL" controls playsinline preload="metadata" class="w-full aspect-video bg-black object-contain"></video>
        </template>
        <div class="p-3 flex items-center justify-between gap-x-3">
          <div class="flex items-center gap-x-3 min-w-0">
            <span class="shrink-0 size-8 flex justify-center items-center bg-gray-50 border border-gray-200 text-gray-500 rounded-lg dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400">
              <i data-lucide="clapperboard" class="size-4"></i>
            </span>
            <p class="text-sm font-medium text-gray-800 truncate dark:text-neutral-200" x-text="draft.video"></p>
          </div>
          <div class="shrink-0 flex items-center gap-x-1">
            {{ button(text="Replace", variant="ghost", size="sm", extra_attrs='@click="draft.video = null; draftPlaying = false; $nextTick(() => $root.querySelector(\'#course-link-video input[type=file]\').click())"') }}
            {{ button(text="Remove", variant="ghost", size="sm", extra_attrs='@click="draft.video = null; draft.videoUrl = null; draftPlaying = false"') }}
          </div>
        </div>
        </div>
        <div id="course-link-video" x-show="!draft.video" @change="if ($event.target.type === 'file' && $event.target.files[0]) { draft.video = $event.target.files[0].name; draft.videoUrl = URL.createObjectURL($event.target.files[0]); }">
          {{ upload(
            name="link_video",
            accepted_formats="mp4,mov,webm",
            max_size="500MB",
            icon="clapperboard",
            help_text="Optional. A short video where they introduce themselves to students of this course."
          ) }}
        </div>
      </div>


    </div>

    <div class="p-4 border-t dark:border-neutral-700 bg-white dark:bg-neutral-800">
      <div class="flex gap-x-2">
        <button type="button" @click="open = false" class="flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300">
          Cancel
        </button>
        <button type="button" @click="if (saveDraft()) open = false" class="flex-1 py-2 px-3 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700" x-text="draft.isNew ? 'Assign course' : 'Save changes'">
          Save changes
        </button>
      </div>
    </div>
  {% endcall %}

  {% call modal(id="unassign-course", title="Unassign from course?", variant="danger", confirm_text="Unassign", cancel_text="Cancel") %}
    <p class="text-gray-800 dark:text-neutral-200">
      Students will no longer see <span class="font-medium" x-text="person ? person.name : 'this instructor'"></span> on <span class="font-medium" x-text="unassigning && unassigning.course"></span>’s page.
    </p>
    <p class="mt-2 text-gray-500 dark:text-neutral-400">Their subjects and intro video for this course are removed. Their profile and other courses stay the same.</p>
  {% endcall %}

<script>
  // Shared by pages that manage an instructor's courses. Needs `person` on the page; new subjects start from `form.subjects` when there is a form.
  function courseLinkActions() {
      const blankDraft = () => ({ isNew: true, course: "", subjects: [], video: null, videoUrl: null, visible: true });

      return {
        allLinks: facultyStore.loadLinks(),
        draft: blankDraft(),
        errors: { course: "", subjects: "" },
        unassigning: null,
        draftPlaying: false,

        get links() {
          return this.person ? this.allLinks.filter((l) => l.instructor === this.person.id) : [];
        },

        get noCourses() {
          try { return sessionStorage.getItem(FACULTY_KEY + "-no-courses") === "1"; } catch (e) { return false; }
        },

        get availableCourses() {
          if (this.noCourses) return [];
          return COURSES.filter((c) => !this.links.some((l) => l.course === c));
        },

        // New course: subjects start from the profile; the course select lists only courses they're not in.
        openAssign() {
          this.draft = { ...blankDraft(), subjects: [...((this.form && this.form.subjects) || this.person.subjects || [])] };
          this.draftPlaying = false;
          this.errors = { course: "", subjects: "" };
          this.$dispatch("set-uploaded-file", { name: "link_video", files: [] });
          this.$dispatch("open-drawer-course-link");
          this.$nextTick(() => window.lucide && window.lucide.createIcons());
          this.$nextTick(() => {
            const el = document.querySelector("#course-select > div");
            if (!el) return;
            el.dispatchEvent(new CustomEvent("set-options", { detail: this.availableCourses.map((c) => ({ value: c, label: c })) }));
            el.dispatchEvent(new CustomEvent("set-selected-values", { detail: "" }));
          });
        },

        openEdit(link) {
          this.draft = { isNew: false, course: link.course, subjects: [...link.subjects], video: link.video, videoUrl: link.videoUrl || null, visible: link.visible };
          this.draftPlaying = false;
          this.errors = { course: "", subjects: "" };
          this.$dispatch("set-uploaded-file", { name: "link_video", files: [] });
          this.$dispatch("open-drawer-course-link");
          this.$nextTick(() => window.lucide && window.lucide.createIcons());
        },

        saveDraft() {
          this.draftPlaying = false;
          if (this.draft.isNew && !this.draft.course) this.errors.course = "Pick a course.";
          if (!this.draft.subjects.length) this.errors.subjects = "Add the subjects they teach in this course.";
          if (this.errors.course || this.errors.subjects) return false;
          const link = { course: this.draft.course, instructor: this.person.id, subjects: [...this.draft.subjects], video: this.draft.video, videoUrl: this.draft.videoUrl, visible: this.draft.visible };
          const all = facultyStore.loadLinks();
          const i = all.findIndex((l) => l.course === link.course && l.instructor === link.instructor);
          if (i >= 0) all[i] = link; else all.push(link);
          facultyStore.saveLinks(all);
          this.allLinks = all;
          this.$dispatch("toast", { title: this.draft.isNew ? `Assigned to ${link.course}` : `${link.course} updated`, variant: "success" });
          return true;
        },

        askUnassign(link) {
          this.unassigning = link;
          this.$dispatch("open-modal-unassign-course");
        },

        confirmUnassign() {
          if (!this.unassigning) return;
          const course = this.unassigning.course;
          const all = facultyStore.loadLinks().filter((l) => !(l.course === course && l.instructor === this.person.id));
          facultyStore.saveLinks(all);
          this.allLinks = all;
          this.unassigning = null;
          this.$dispatch("toast", { title: `Unassigned from ${course}`, variant: "success" });
        },
      };
    }
</script>
