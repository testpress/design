{# A sample faculty card, as students see it. The picture in both empty states. #}
{% macro sample_card() %}
  <div class="relative w-64 mb-5" aria-hidden="true">
    <div class="absolute inset-x-4 -bottom-2 h-full rounded-xl bg-white border border-gray-200 dark:bg-neutral-800 dark:border-neutral-700"></div>
    <div class="relative p-3 rounded-xl bg-white border border-gray-200 shadow-sm text-start dark:bg-neutral-800 dark:border-neutral-700">
      <div class="flex items-center gap-x-2.5">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=96&h=96&fit=crop&crop=faces&q=80" alt="" class="size-9 rounded-full object-cover">
        <div class="min-w-0">
          <p class="text-xs font-semibold text-gray-800 dark:text-neutral-200">Dr. Ananya Rao</p>
          <p class="text-[11px] text-gray-500 dark:text-neutral-400">Polity · 14 years teaching</p>
        </div>
      </div>
      <p class="mt-2 text-[11px] leading-4 text-gray-500 dark:text-neutral-400">Former civil servant who teaches polity through landmark judgements.</p>
    </div>
  </div>
{% endmacro %}
