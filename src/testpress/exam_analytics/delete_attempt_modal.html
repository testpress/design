{% from "../../ui-system/components/modal.html" import modal %}

<div x-data="{ attemptName: '', attemptDate: '' }" @open-modal-delete-attempt-modal.window="attemptName = $event.detail?.attemptName || ''; attemptDate = $event.detail?.attemptDate || '';">
{% call modal(
    id="delete-attempt-modal",
    title="Delete Attempt",
    cancel_text="Keep Attempt",
    confirm_text="Delete",
    variant="danger"
) %}
    <div class="space-y-4">
        <p class="text-sm text-gray-600 dark:text-neutral-400">
            Are you sure you want to delete the attempt "<span class="font-semibold text-gray-800 dark:text-neutral-200" x-text="attemptName"></span>" taken on <span x-text="attemptDate"></span>?
        </p>
    </div>
{% endcall %}
</div>
