{% from "../../ui-system/components/card.html" import card %}

<div class="grid lg:grid-cols-3 gap-4 sm:gap-6">
  <!-- Doughnut Chart in Card -->
  <div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-sm rounded-xl">
    <!-- Header -->
    <div class="p-5 pb-4 grid grid-cols-2 items-center gap-x-4">
      <div>
        <h2 class="inline-block font-semibold text-lg text-gray-800 dark:text-neutral-200">
          Result Breakdown
        </h2>
      </div>
    </div>
    <!-- End Header -->

    <!-- Body -->
    <div class="flex-1 flex flex-col p-5 pt-0">
      <div class="flex justify-center -mb-2">
        <!-- Apex Donut Chart -->
        <div id="hs-pass-fail-donut-chart"></div>
      </div>

      <!-- List Group -->
      <ul class="mt-auto">
        <!-- List Item -->
        <li class="py-1.5 grid grid-cols-2 justify-between items-center gap-x-4">
          <div class="flex items-center">
            <span class="size-2.5 inline-block bg-green-500 rounded-full me-2"></span>
            <span class="text-gray-800 dark:text-neutral-200">Pass</span>
          </div>
          <div class="text-end">
            <span class="text-gray-500 dark:text-neutral-400">6,360 <span class="text-gray-800 dark:text-neutral-200 font-medium">(80%)</span></span>
          </div>
        </li>
        <!-- End List Item -->

        <!-- List Item -->
        <li class="py-1.5 grid grid-cols-2 justify-between items-center gap-x-4">
          <div class="flex items-center">
            <span class="size-2.5 inline-block bg-red-500 rounded-full me-2"></span>
            <span class="text-gray-800 dark:text-neutral-200">Fail</span>
          </div>
          <div class="text-end">
            <span class="text-gray-500 dark:text-neutral-400">1,590 <span class="text-gray-800 dark:text-neutral-200 font-medium">(20%)</span></span>
          </div>
        </li>
        <!-- End List Item -->
      </ul>
      <!-- End List Group -->
    </div>
    <!-- End Body -->
  </div>
  <!-- End Doughnut Chart in Card -->
  
  <!-- Column Chart Card -->
  <div class="lg:col-span-2 flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-sm rounded-xl">
    <!-- Header -->
    <div class="p-5 pb-4">
      <h2 class="inline-block font-semibold text-lg text-gray-800 dark:text-neutral-200">
        Score Distribution
      </h2>
    </div>
    <!-- End Header -->

    <!-- Body -->
    <div class="p-5 pt-0">
      <!-- Apex Column Chart -->
      <div id="hs-score-distribution-chart"></div>
    </div>
    <!-- End Body -->
  </div>
  <!-- End Column Chart Card -->
</div>
