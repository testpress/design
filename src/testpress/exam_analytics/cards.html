{% from "../../ui-system/components/card.html" import card %}

<div class="grid lg:grid-cols-2 gap-4 sm:gap-6">
  <!-- Doughnut Chart in Card -->
  <div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-sm rounded-xl">
    <!-- Header -->
    <div class="p-4 md:p-5 flex items-center gap-x-3">
      <h2 class="inline-block font-semibold text-lg text-gray-800 dark:text-neutral-200">
        Result Breakdown
      </h2>
    </div>
    <!-- End Header -->

    <!-- Body -->
    <div class="flex-1 flex flex-col p-4 md:p-5 pt-0">
      <div class="grid grid-cols-2 gap-4 items-center">
        <!-- Apex Donut Chart -->
        <div class="flex justify-center">
          <div id="hs-pass-fail-donut-chart" class="w-full flex justify-center"></div>
        </div>

        <!-- Legend -->
        <ul class="flex flex-col gap-y-2">
          <!-- List Item -->
          <li class="flex justify-between items-center group cursor-pointer py-2 transition-colors">
            <div class="flex items-center gap-x-2">
              <span class="size-3 inline-block bg-emerald-500 rounded-full"></span>
              <span class="text-sm text-gray-800 dark:text-neutral-200 font-semibold">Pass</span>
            </div>
            <div class="flex items-center gap-x-1 text-sm">
              <span class="text-gray-500 dark:text-neutral-400 text-nowrap">6,360 (80%)</span>
              <svg class="shrink-0 size-4 text-gray-300 dark:text-neutral-600 group-hover:text-gray-600 dark:group-hover:text-neutral-300 transition-colors duration-150" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>
          </li>
          <!-- End List Item -->

          <!-- List Item -->
          <li class="flex justify-between items-center group cursor-pointer py-2 transition-colors">
            <div class="flex items-center gap-x-2">
              <span class="size-3 inline-block bg-red-500 rounded-full"></span>
              <span class="text-sm text-gray-800 dark:text-neutral-200 font-semibold">Fail</span>
            </div>
            <div class="flex items-center gap-x-1 text-sm">
              <span class="text-gray-500 dark:text-neutral-400 text-nowrap">1,590 (20%)</span>
              <svg class="shrink-0 size-4 text-gray-300 dark:text-neutral-600 group-hover:text-gray-600 dark:group-hover:text-neutral-300 transition-colors duration-150" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>
          </li>
          <!-- End List Item -->
        </ul>
      </div>
    </div>
    <!-- End Body -->

    <!-- Footer Banner -->
    <div class="p-4 flex justify-between items-center gap-2 mt-auto">
      <div class="flex items-center gap-x-2 text-sm text-gray-500 dark:text-neutral-400">
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        <span>Passing score for this exam is <span class="font-semibold text-gray-700 dark:text-neutral-300">50%</span></span>
      </div>
      <a class="inline-flex items-center gap-x-1 text-sm text-emerald-600 decoration-2 hover:underline font-medium dark:text-emerald-500 whitespace-nowrap" href="#">
        View exam settings
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </div>
    <!-- End Footer Banner -->
  </div>
  <!-- End Doughnut Chart in Card -->
  
  <!-- Column Chart Card -->
  <div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-sm rounded-xl">
    <!-- Header -->
    <div class="p-5 pb-4">
      <h2 class="inline-block font-semibold text-lg text-gray-800 dark:text-neutral-200">
        Score Distribution
      </h2>
    </div>
    <!-- End Header -->

    <!-- Body -->
    <div class="p-5 pt-0">
      <!-- Apex Column Chart -->
      <div id="hs-score-distribution-chart"></div>
    </div>
    <!-- End Body -->
  </div>
  <!-- End Column Chart Card -->
</div>
