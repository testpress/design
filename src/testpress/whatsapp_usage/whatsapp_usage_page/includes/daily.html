{# Delivered per day, week or month (by how long the range is), stacked by message type; only types that went out. A bar opens its logs. #}
<section class="p-5 sm:p-6 bg-white rounded-2xl shadow-sm dark:bg-neutral-800" aria-labelledby="wu-daily-title">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 id="wu-daily-title" class="text-base font-semibold text-gray-800 dark:text-neutral-100"  x-text="'Delivered per ' + unit"></h2>
    <ul class="flex flex-wrap gap-x-4 gap-y-1 text-[13px] text-gray-600 dark:text-neutral-400">
      <template x-for="c in shown" :key="c.key">
        <li class="inline-flex items-center gap-x-1.5"><span class="size-2.5 rounded-sm" :style="'background:' + colors[c.key][0]"></span><span x-text="c.name"></span></li>
      </template>
    </ul>
  </div>
  <div id="wu-chart" class="mt-3 -mx-2 min-h-[260px]" role="img" :aria-label="'Messages delivered per ' + unit + ', ' + period + ', by message type. The same numbers are in the table above.'"></div>
</section>
