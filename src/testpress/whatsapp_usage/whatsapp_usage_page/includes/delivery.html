{# Delivery: of what we sent, how much WhatsApp confirmed, how much failed, and how much is still unconfirmed.
   Sent is not delivered, so the two are never merged. #}
<section class="p-5 sm:p-6 bg-white rounded-2xl shadow-sm dark:bg-neutral-800" aria-labelledby="wu-delivery-title">
  <div class="flex flex-wrap items-baseline justify-between gap-2">
    <h2 id="wu-delivery-title" class="text-base font-semibold text-gray-800 dark:text-neutral-100">Delivery</h2>
    <p class="text-sm text-gray-500 dark:text-neutral-400"><span class="font-medium text-gray-800 dark:text-neutral-200" x-text="rate(null)"></span> delivered</p>
  </div>

  <!-- Part of the whole, in status colours, each with its label below -->
  <div class="mt-4 flex h-2.5 gap-0.5 overflow-hidden rounded-full bg-gray-100 dark:bg-neutral-700" aria-hidden="true">
    <div class="bg-green-500 rounded-s-full" :style="'width:' + share('delivered') + '%'"></div>
    <div class="bg-amber-400" :style="'width:' + share('waiting') + '%'"></div>
    <div class="bg-red-500 rounded-e-full" :style="'width:' + share('failed') + '%'"></div>
  </div>

  <dl class="mt-5 grid grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-5">
    <div class="flex flex-col-reverse">
      <dd class="mt-1 text-2xl font-semibold tracking-tight text-gray-800 tabular-nums dark:text-neutral-100" x-text="waCount(sum(null, 'sent'))"></dd>
      <dt class="text-sm text-gray-500 dark:text-neutral-400">Sent</dt>
    </div>
    <div class="flex flex-col-reverse">
      <dd class="mt-1 text-2xl font-semibold tracking-tight text-gray-800 tabular-nums dark:text-neutral-100" x-text="waCount(sum(null, 'delivered'))"></dd>
      <dt class="flex items-center gap-x-1.5 text-sm text-gray-500 dark:text-neutral-400"><span class="size-2 rounded-full bg-green-500"></span>Delivered</dt>
    </div>
    <div class="flex flex-col-reverse">
      <dd class="mt-1 text-2xl font-semibold tracking-tight text-gray-800 tabular-nums dark:text-neutral-100" x-text="waCount(sum(null, 'waiting'))"></dd>
      <dt class="flex items-center gap-x-1.5 text-sm text-gray-500 dark:text-neutral-400"><span class="size-2 rounded-full bg-amber-400"></span>Not confirmed yet</dt>
    </div>
    <div class="flex flex-col-reverse">
      <dd class="mt-1 flex items-baseline gap-x-2">
        <span class="text-2xl font-semibold tracking-tight text-gray-800 tabular-nums dark:text-neutral-100" x-text="waCount(sum(null, 'failed'))"></span>
        <a x-show="sum(null, 'failed')" :href="logs({ status: 'failed' })" class="text-[13px] font-medium text-primary-600 hover:underline dark:text-primary-400">See why</a>
      </dd>
      <dt class="flex items-center gap-x-1.5 text-sm text-gray-500 dark:text-neutral-400"><span class="size-2 rounded-full bg-red-500"></span>Failed</dt>
    </div>
  </dl>
</section>
