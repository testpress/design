<!-- Student Details Modal -->
<div x-data="{ open: false, currentTab: 'info' }"
     @open-modal-student-details.window="open = true"
     @close-modal-student-details.window="open = false"
     class="inline-block">

  <div x-show="open"
       x-cloak
       class="fixed inset-0 z-[10000] overflow-y-auto pointer-events-none"
       role="dialog"
       aria-modal="true"
       aria-labelledby="student-details-label">
    
    <!-- Backdrop -->
    <div x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="open = false"
         class="fixed inset-0 bg-neutral-900/50 dark:bg-neutral-900/80 backdrop-blur-sm pointer-events-auto"></div>

    <!-- Centerer -->
    <div class="sm:max-w-3xl sm:w-full m-3 sm:mx-auto h-[calc(100%-56px)] min-h-[calc(100%-56px)] flex items-center pointer-events-none">
      
      <!-- Panel -->
      <div x-show="open"
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           @keydown.escape.window="open = false"
           class="w-full max-h-full flex flex-col bg-white dark:bg-neutral-800 border border-transparent rounded-xl pointer-events-auto shadow-xl relative z-10">
        
        <!-- Header -->
        <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700">
          <h2 id="student-details-label" class="font-medium text-gray-800 dark:text-neutral-200">
            Student details
          </h2>
          <button type="button" @click="open = false" class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-100 dark:bg-neutral-700 text-gray-800 dark:text-neutral-200 hover:bg-gray-200 dark:hover:bg-neutral-600 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-200 dark:focus:bg-neutral-600" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <!-- End Header -->

        <!-- Body -->
        <div class="flex flex-col lg:flex-row h-full overflow-hidden">
          <div class="shrink-0 border-b lg:border-b-0 lg:border-r border-gray-200 dark:border-neutral-700">
            <div class="size-full lg:w-60 flex flex-col">
              
              <!-- Select Nav (Mobile) -->
              <div class="py-4 px-2 lg:p-0 lg:hidden">
                <select x-model="currentTab" class="py-2 px-3 pe-9 block w-full border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:focus:ring-neutral-600">
                  <option value="info">Info</option>
                  <option value="signals">Signals</option>
                  <option value="purchases">Recent Purchases</option>
                </select>
              </div>
              <!-- End Select Nav -->

              <!-- Nav Tab (Desktop) -->
              <nav class="p-4 hidden lg:flex flex-col gap-1 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500" aria-label="Tabs">
                
                <button type="button" class="w-full flex items-center gap-x-2 p-2 text-start text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors"
                  :class="currentTab === 'info' ? 'bg-gray-100 dark:bg-neutral-700 text-gray-800 dark:text-neutral-200' : 'text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-700 focus:bg-gray-100 dark:focus:bg-neutral-700'"
                  @click="currentTab = 'info'">
                  <i data-lucide="info" class="shrink-0 size-4"></i> Info
                </button>

                <button type="button" class="w-full flex items-center gap-x-2 p-2 text-start text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors"
                  :class="currentTab === 'signals' ? 'bg-gray-100 dark:bg-neutral-700 text-gray-800 dark:text-neutral-200' : 'text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-700 focus:bg-gray-100 dark:focus:bg-neutral-700'"
                  @click="currentTab = 'signals'">
                  <i data-lucide="radio" class="shrink-0 size-4"></i> Signals
                </button>

                <button type="button" class="w-full flex items-center gap-x-2 p-2 text-start text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors"
                  :class="currentTab === 'purchases' ? 'bg-gray-100 dark:bg-neutral-700 text-gray-800 dark:text-neutral-200' : 'text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-700 focus:bg-gray-100 dark:focus:bg-neutral-700'"
                  @click="currentTab = 'purchases'">
                  <i data-lucide="shopping-bag" class="shrink-0 size-4"></i> Recent Purchases
                </button>

              </nav>
              <!-- End Nav Tab -->
            </div>
          </div>

          <div class="grow h-full overflow-hidden">
            <!-- Tab Content -->
            <div class="my-1 me-1 pt-1 sm:pt-2.5 p-4 h-[calc(55dvh)] lg:h-[calc(65dvh)] overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
              
              <div x-show="currentTab === 'info'" style="display: none;" x-transition.opacity>
                
                <div class="flex flex-col justify-center items-center text-center mb-8">
                  <div class="relative flex shrink-0 justify-center items-center size-28 rounded-full" :class="!activeChat.avatar ? getAvatarColor(activeChat.id) : 'bg-transparent'">
                    <img x-show="activeChat.avatar" :src="activeChat.avatar" class="shrink-0 size-28 rounded-full object-cover" alt="Avatar">
                    <span x-show="!activeChat.avatar" x-text="activeChat.initials" class="text-white text-4xl font-semibold uppercase"></span>
                  </div>
                  <div class="mt-4 w-full">
                    <h2 class="text-lg font-semibold text-gray-800 dark:text-neutral-200" x-text="activeChat.name"></h2>
                    <p class="mb-2 text-[13px] text-gray-500 dark:text-neutral-500">
                      Joined on <span x-text="activeChat.joinedOn || '-'"></span>
                    </p>
                  </div>
                </div>

                <!-- List -->
                <div class="space-y-4">
                  <dl class="flex flex-col sm:flex-row gap-1">
                    <dt class="min-w-40">
                      <span class="block text-sm text-gray-500 dark:text-neutral-400">Full name</span>
                    </dt>
                    <dd>
                      <ul>
                        <li class="text-sm text-gray-900 dark:text-neutral-200" x-text="activeChat.name"></li>
                      </ul>
                    </dd>
                  </dl>

                  <dl class="flex flex-col sm:flex-row gap-1" x-show="activeChat.username">
                    <dt class="min-w-40">
                      <span class="block text-sm text-gray-500 dark:text-neutral-400">Id</span>
                    </dt>
                    <dd>
                      <ul>
                        <li class="text-sm text-gray-900 dark:text-neutral-200 break-all" x-text="activeChat.username"></li>
                      </ul>
                    </dd>
                  </dl>

                  <dl class="flex flex-col sm:flex-row gap-1" x-show="activeChat.mobile">
                    <dt class="min-w-40">
                      <span class="block text-sm text-gray-500 dark:text-neutral-400">Mobile</span>
                    </dt>
                    <dd>
                      <ul>
                        <li class="text-sm text-gray-900 dark:text-neutral-200 break-all" x-text="activeChat.mobile"></li>
                      </ul>
                    </dd>
                  </dl>

                  <dl class="flex flex-col sm:flex-row gap-1" x-show="activeChat.email">
                    <dt class="min-w-40">
                      <span class="block text-sm text-gray-500 dark:text-neutral-400">Email</span>
                    </dt>
                    <dd>
                      <ul>
                        <li class="text-sm text-gray-900 dark:text-neutral-200 break-all" x-text="activeChat.email"></li>
                      </ul>
                    </dd>
                  </dl>

                  <dl class="flex flex-col sm:flex-row gap-1" x-show="activeChat.address">
                    <dt class="min-w-40">
                      <span class="block text-sm text-gray-500 dark:text-neutral-400">Address</span>
                    </dt>
                    <dd>
                      <ul>
                        <li class="text-sm text-gray-900 dark:text-neutral-200 break-words" x-text="activeChat.address"></li>
                      </ul>
                    </dd>
                  </dl>

                  <dl class="flex flex-col sm:flex-row gap-1">
                    <dt class="min-w-40">
                      <span class="block text-sm text-gray-500 dark:text-neutral-400">Report Card</span>
                    </dt>
                    <dd>
                      <ul>
                        <li>
                          <a href="https://testpress.in/student/rahul2576/report" target="_blank" rel="noopener noreferrer" class="text-sm text-primary-600 hover:text-primary-700 dark:text-primary-500 dark:hover:text-primary-400 decoration-2 hover:underline focus:outline-hidden focus:underline font-medium break-all">
                            https://testpress.in/student/rahul2576/report
                          </a>
                        </li>
                      </ul>
                    </dd>
                  </dl>
                </div>
                <!-- End List -->
              </div>
              
              <div x-show="currentTab === 'signals'" style="display: none;" x-transition.opacity>
                <h3 class="text-lg font-medium text-gray-800 dark:text-neutral-200 mb-1">Signals</h3>
                <p class="text-sm text-gray-500 dark:text-neutral-400 mb-6">Activities that highlight strong purchase interest or a need for help completing a purchase.</p>

                <div>
                  <template x-for="(group, gIdx) in activeChat.signals" :key="gIdx">
                    <div>
                      <!-- Step Item (Date Marker) -->
                      <div class="relative group pb-1 after:absolute after:top-0 first:after:top-4 after:bottom-0 after:start-4 after:w-px after:bg-gray-300 dark:after:bg-neutral-500 after:-translate-x-1/2">
                        <div class="w-full flex gap-x-4">
                          <span class="relative z-1 flex shrink-0 justify-center items-center w-8">
                            <span class="flex shrink-0 justify-center items-center size-2 bg-white dark:bg-neutral-800 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
                          </span>

                          <div class="grow">
                            <span class="text-xs text-gray-500 dark:text-neutral-400" x-text="group.date"></span>
                          </div>
                        </div>
                      </div>
                      <!-- End Step Item -->

                      <template x-for="(event, eIdx) in group.events" :key="eIdx">
                        <!-- Step Item (Event) -->
                        <div class="relative group after:absolute after:top-8 after:bottom-0 after:start-4 after:w-px after:border-s after:border-dashed after:-translate-x-1/2"
                             :class="gIdx === activeChat.signals.length - 1 && eIdx === group.events.length - 1 ? 'pb-0 after:border-transparent dark:after:border-transparent' : 'pb-10 after:border-gray-300 dark:after:border-neutral-500'">
                          <div class="w-full flex gap-x-4">

                            <!-- Event Icon -->
                            <span class="flex shrink-0 justify-center items-center size-8 bg-gray-100 dark:bg-neutral-700 text-sm font-semibold uppercase text-gray-500 dark:text-neutral-400 rounded-full">
                              
                              <template x-if="event.icon === 'mouse-pointer-click'">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 size-3.5"><path d="M14 4.1 12 6"></path><path d="m5.1 8-2.9-.8"></path><path d="m6 12-1.9 2"></path><path d="M7.2 2.2 8 5.1"></path><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"></path></svg>
                              </template>

                              <template x-if="event.icon === 'shopping-cart'">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 size-3.5"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                              </template>

                              <template x-if="event.icon === 'alert-triangle'">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 size-3.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
                              </template>

                              <template x-if="event.icon === 'message-square'">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 size-3.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                              </template>

                            </span>

                            <div class="grow mt-1">
                              <!-- Content -->
                              <div class="flex flex-col gap-y-2">

                                <!-- Event sentence -->
                                <span class="text-sm flex flex-wrap items-center gap-1">
                                  <span class="text-gray-800 dark:text-neutral-200" x-text="event.action"></span>
                                  <a :href="event.targetUrl" class="font-medium text-gray-800 dark:text-neutral-200 hover:text-primary-600 dark:hover:text-primary-500 hover:underline" x-text="event.target"></a>
                                </span>

                                <!-- Secondary metadata -->
                                <div class="flex flex-wrap items-center gap-x-3 text-xs text-gray-500 dark:text-neutral-400">
                                  <span class="inline-flex items-center gap-x-1" x-text="event.time"></span>
                                  
                                  <template x-if="event.metadata">
                                    <div class="flex items-center gap-x-3 text-xs text-gray-500 dark:text-neutral-400">
                                      <span>&middot;</span>
                                      <span x-text="event.metadata"></span>
                                    </div>
                                  </template>

                                </div>
                              </div>
                              <!-- End Content -->
                            </div>
                          </div>
                        </div>
                        <!-- End Step Item -->
                      </template>

                    </div>
                  </template>
                </div>
              </div>
              
              <div x-show="currentTab === 'purchases'" style="display: none;" x-transition.opacity>
                <h3 class="text-lg font-medium text-gray-800 dark:text-neutral-200 mb-1">Recent Purchases</h3>
                <p class="text-sm text-gray-500 dark:text-neutral-400 mb-6">Products purchased recently by <span class="capitalize" x-text="activeChat.name"></span>.</p>

                <ul role="list" class="space-y-1 max-h-60 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500 pr-1 pb-2">
                  <template x-for="(purchase, pIdx) in activeChat.purchases" :key="pIdx">
                    <li>
                      <div class="w-full text-left flex gap-x-4 py-2 group transition-colors cursor-pointer">
                        <div class="shrink-0 w-20 aspect-video bg-gray-100 dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-lg overflow-hidden">
                          <img class="w-full h-full object-cover" :src="purchase.thumbnail" alt="Course Thumbnail">
                        </div>
                        <div class="grow flex flex-col justify-center">
                          <span class="line-clamp-1 text-sm/6 font-medium text-gray-800 dark:text-neutral-200 group-hover:text-primary-600 dark:group-hover:text-primary-500 transition-colors" x-text="purchase.name"></span>
                          <p class="line-clamp-1 text-xs/5 text-gray-500 dark:text-neutral-400">
                            <span x-text="purchase.price"></span> &middot; <span x-text="purchase.includes"></span>
                          </p>
                          <p class="line-clamp-1 text-xs/5 text-gray-500 dark:text-neutral-400">
                            Purchased on <span x-text="purchase.date"></span>
                          </p>
                        </div>
                      </div>
                    </li>
                  </template>
                </ul>
              </div>

            </div>
            <!-- End Tab Content -->
          </div>
        </div>
    </div>
  </div>
</div>
<!-- End Student Details Modal -->
