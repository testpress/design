<div id="logo" class="flex items-center justify-center gap-3 sm:gap-4" aria-hidden="false">
  <div id="client-logo" class="h-14 w-14 sm:h-16 sm:w-16 rounded-xl overflow-hidden shadow-sm ring-1 ring-black/5 shrink-0">
    <img
      class="h-full w-full object-contain"
      src="{{ client_logo }}"
      alt="{{ client_name }}"
    >
  </div>

  <span class="text-gray-400 text-xl sm:text-2xl tracking-[0.3em] select-none" aria-hidden="true">...</span>

  {% if institute_logo %}
    <div id="institute-logo" class="h-14 w-14 sm:h-16 sm:w-16 rounded-xl overflow-hidden bg-white shadow-sm ring-1 ring-black/5 shrink-0 flex items-center justify-center p-1.5">
      <img
        class="max-h-full max-w-full object-contain"
        src="{{ institute_logo }}"
        alt="{{ institute_name }}"
      >
    </div>
  {% else %}
    <div id="institute-logo" class="h-14 w-14 sm:h-16 sm:w-16 rounded-xl bg-[#132962] shadow-sm shrink-0 flex items-center justify-center">
      <span class="text-white text-2xl font-semibold leading-none">{{ institute_name[0] }}</span>
    </div>
  {% endif %}
</div>
