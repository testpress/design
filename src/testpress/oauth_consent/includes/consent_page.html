<div class="relative isolate min-h-dvh w-full overflow-x-hidden bg-gradient-to-br from-sky-50 via-white to-teal-50">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(7,104,253,0.12),_transparent_55%)]"></div>

  <div class="relative z-10 flex min-h-dvh w-full items-start justify-center overflow-y-auto px-4 pb-10 pt-12 sm:items-center sm:px-6 sm:py-12 lg:px-8">
    <div class="flex w-full max-w-[28rem] flex-col items-center">
      <img
        id="testpress-wordmark"
        class="mb-8 h-8 w-auto sm:h-10"
        src="{{ '/img/oauth_consent/testpress-logo.png' | url }}"
        alt="Testpress"
      >

      <section class="w-full rounded-2xl bg-white p-5 shadow-[0_20px_50px_-24px_rgba(15,23,42,0.35)] ring-1 ring-slate-200/80 sm:rounded-3xl sm:p-8">
        <div id="logo" class="flex items-center justify-center gap-3 sm:gap-5">
          <div id="client-logo" class="h-14 w-14 shrink-0 overflow-hidden rounded-2xl shadow-sm ring-1 ring-black/5 sm:h-20 sm:w-20">
            <img class="h-full w-full object-cover" src="{{ client_logo_path | url }}" alt="{{ client_name }}">
          </div>

          <div class="flex items-center gap-1 text-slate-300 sm:gap-2" aria-hidden="true">
            <span class="hidden h-px w-4 bg-slate-200 sm:block sm:w-6"></span>
            <span class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 ring-1 ring-slate-200">
              <svg class="h-4 w-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12l-7.5 7.5M21 12H3"/>
              </svg>
            </span>
            <span class="hidden h-px w-4 bg-slate-200 sm:block sm:w-6"></span>
          </div>

          <div id="institute-logo" class="flex h-14 w-14 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-white p-2 shadow-sm ring-1 ring-black/5 sm:h-20 sm:w-20 sm:p-2.5">
            <img
              class="h-full w-full object-contain"
              src="{{ '/img/oauth_consent/testpress-mark.png' | url }}"
              alt="Testpress"
            >
          </div>
        </div>

        <h1 id="title" class="mt-6 text-balance text-center text-xl font-semibold tracking-tight text-slate-900 sm:mt-8 sm:text-2xl">
          <span id="client-name">{{ client_name }}</span> wants to access <span id="institute-name">Testpress</span>
        </h1>

        <p id="body" class="mt-3 text-center text-sm leading-relaxed text-slate-500 sm:text-base">
          Connect {{ client_name }} to your Testpress account through an AI assistant.
        </p>

        <div class="mt-6 rounded-2xl bg-slate-50 px-4 py-3 sm:mt-8 sm:px-5 sm:py-4">
          <div class="flex items-start gap-3">
            <span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white text-[#0768FD] ring-1 ring-slate-200">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.91a4.5 4.5 0 0 1 0 6.36l-3.18 3.18a4.5 4.5 0 0 1-6.36-6.36l1.76-1.76"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.81 15.09a4.5 4.5 0 0 1 0-6.36l3.18-3.18a4.5 4.5 0 0 1 6.36 6.36l-1.76 1.76"/>
              </svg>
            </span>
            <div>
              <p class="text-sm font-medium text-slate-900">Connect to Testpress</p>
              <p class="mt-0.5 text-sm text-slate-500">Use your account with {{ client_name }}.</p>
            </div>
          </div>
        </div>

        <form class="mt-6 sm:mt-8" method="POST" action="#">
          <div class="grid grid-cols-1 gap-3 min-[380px]:grid-cols-2">
            <button
              id="deny"
              type="submit"
              name="confirm"
              value="deny"
              class="order-2 inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-slate-200 bg-white px-4 text-base font-medium text-slate-800 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#0768FD]/40 focus:ring-offset-2 min-[380px]:order-1"
            >
              Cancel
            </button>
            <button
              id="allow"
              type="submit"
              name="confirm"
              value="approve"
              class="order-1 inline-flex min-h-12 w-full items-center justify-center rounded-xl bg-[#0768FD] px-4 text-base font-semibold text-white shadow-sm transition hover:bg-[#0554d1] focus:outline-none focus:ring-2 focus:ring-[#0768FD]/40 focus:ring-offset-2 min-[380px]:order-2"
            >
              Authorize
            </button>
          </div>
        </form>
      </section>

      <p class="mt-6 max-w-sm px-2 text-center text-xs leading-5 text-slate-500 sm:text-sm">
        You can revoke access later. You will return to {{ client_name }} after authorizing.
      </p>
    </div>
  </div>
</div>
