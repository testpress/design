{% from "../../../ui-system/components/card.html" import card %}
{% from "../../../ui-system/components/popover.html" import popover %}
{% from "../../../ui-system/components/empty-state.html" import empty_state %}

<div x-data="{ status: new URLSearchParams(window.location.search).get('status') }">
  
  <!-- Empty State -->
  <template x-if="status === 'empty'">
    <div>
      {{ empty_state(
        title="No access history",
        description="Access activity was not recorded for this attempt.",
        icon="history",
        extra_classes="mt-8"
      ) }}
    </div>
  </template>

  <!-- History State -->
  <template x-if="status !== 'empty'">
    <div>
      {% call card(padding="p-6", extra_classes="mt-8") %}
    <div>
      {% for date, events in attempt_access_history.access_history %}
        <!-- Date Header -->
        <div class="relative group pb-1 after:absolute after:top-0 first:after:top-4 after:bottom-0 after:start-4 after:w-px after:bg-gray-300 dark:after:bg-neutral-500 after:-translate-x-1/2">
          <div class="w-full flex gap-x-4">
            <span class="relative z-1 flex shrink-0 justify-center items-center w-8">
              <span class="flex shrink-0 justify-center items-center size-2 bg-white dark:bg-neutral-800 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
            </span>
            <div class="grow">
              <span class="text-xs text-gray-500 dark:text-neutral-400">
                {{ date }}
              </span>
            </div>
          </div>
        </div>

        {% for access in events %}
          <!-- Step Item -->
          <div class="relative group last:pb-0 last:after:hidden pb-10 after:absolute after:top-8 after:bottom-0 after:start-4 after:w-px after:border-s after:border-dashed after:border-gray-300 dark:after:border-neutral-500 after:-translate-x-1/2">
            <div class="w-full flex gap-x-4">
              
              <!-- Event Icon -->
              <span class="flex shrink-0 justify-center items-center size-8 bg-gray-100 dark:bg-neutral-700 text-sm font-semibold uppercase text-gray-500 dark:text-neutral-400 rounded-full z-10">
                {% if access.device == 'Desktop' %}
                <i data-lucide="monitor" class="shrink-0 size-3.5"></i>
                {% elif access.device == 'Mobile' %}
                <i data-lucide="smartphone" class="shrink-0 size-3.5"></i>
                {% elif access.device == 'Tablet' %}
                <i data-lucide="tablet" class="shrink-0 size-3.5"></i>
                {% else %}
                <i data-lucide="activity" class="shrink-0 size-3.5"></i>
                {% endif %}
              </span>

              <div class="grow mt-1">
                <!-- Content -->
                <div class="flex flex-col gap-y-2">
                  
                  <!-- Event sentence -->
                  <p class="text-sm text-gray-500 dark:text-neutral-400">
                    <span class="font-medium text-gray-800 dark:text-neutral-200">{{ access.type }}</span> the attempt
                    on <span class="font-medium text-gray-800 dark:text-neutral-200">{{ access.device | lower }}</span> 
                    from <span class="font-medium text-gray-800 dark:text-neutral-200">{{ access.location }}</span>
                  </p>

                  <!-- Secondary metadata -->
                  <div class="flex flex-wrap items-center gap-x-1.5 mt-0.5 text-xs text-gray-500 dark:text-neutral-400">
                    <span>{{ access.time }}</span>

                    {% if access.browser and access.operating_system %}
                    <span>&middot;</span>
                    <span class="inline-flex items-center gap-1 text-gray-500 dark:text-neutral-400">
                      {{ access.browser }} on {{ access.operating_system }}
                      
                      {% set popoverContent %}
                      <div class="p-3">
                        <p class="mb-2 font-semibold text-gray-800 dark:text-neutral-200">Browser details</p>
                        <p class="break-all font-mono text-[11px] leading-relaxed text-gray-500 dark:text-neutral-400">
                          {{ access.user_agent }}
                        </p>
                      </div>
                      {% endset %}

                      {% set popoverTrigger %}
                      <button type="button" class="inline-flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-neutral-300 focus:outline-none">
                        <i data-lucide="info" class="size-3"></i>
                      </button>
                      {% endset %}

                      {{ popover(content=popoverContent, trigger=popoverTrigger, placement="bottom", width="w-80", trigger_type="click") }}
                    </span>
                    {% endif %}

                    {% if access.ip_address %}
                    <span>&middot;</span>
                    <span>IP <a href="#" class="hover:underline">{{ access.ip_address }}</a></span>
                    {% endif %}
                  </div>

                </div>
                <!-- End Content -->
              </div>
            </div>
          </div>
          <!-- End Step Item -->
        {% endfor %}
      {% endfor %}
    </div>
    {% endcall %}
    </div>
  </template>
</div>
