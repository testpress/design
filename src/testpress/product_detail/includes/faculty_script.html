  // One entry per instructor, in the order they first appear (course order,
  // then the admin's order inside each course). An instructor who teaches in
  // several courses keeps each course's subject and video.
  function resolveFaculty(courses) {
    const byId = new Map();
    courses.forEach((course) => {
      course.faculty.forEach((link) => {
        if (!byId.has(link.instructor)) {
          byId.set(link.instructor, { ...INSTRUCTORS[link.instructor], teaches: [] });
        }
        byId.get(link.instructor).teaches.push({ course: course.title, subject: link.subject, video: link.video });
      });
    });
    return [...byId.values()].map((person) => ({
      ...person,
      subjects: [...new Set(person.teaches.map((t) => t.subject))],
      hasVideo: person.teaches.some((t) => t.video),
      initials: person.name.replace(/^Dr\.\s*/, "").split(" ").map((w) => w[0]).slice(0, 2).join(""),
    }));
  }
