<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 lg:gap-5">
  
  <!-- Overall Progress -->
  <div class="flex flex-col bg-white border border-gray-200 rounded-xl shadow-xs dark:bg-neutral-900 dark:border-neutral-800">
    <div class="p-3 md:p-4 flex justify-between items-center gap-x-3">
      <div>
        <p class="text-xs font-medium text-gray-500 dark:text-neutral-400">
          Overall Progress
        </p>
        <div class="mt-0.5 flex items-center gap-x-2">
          <h3 class="text-xl font-bold text-gray-800 dark:text-neutral-200">
            68%
          </h3>
        </div>
        <p class="mt-0.5 text-xs text-emerald-500 font-medium">
          Good going!
        </p>
        <!-- Empty State Example:
        <p class="mt-0.5 text-xs text-gray-400 font-medium">
          Start learning
        </p>
        -->
      </div>
      
      <!-- Circular Progress -->
      <div class="shrink-0 flex justify-center items-center">
        <!-- SVG Progress ring -->
        <svg class="size-10" viewBox="0 0 36 36">
          <path class="text-gray-100 dark:text-neutral-700" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="4" />
          <path class="text-emerald-500 transition-all duration-500" stroke-dasharray="68, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Learning Hours -->
  <div class="flex flex-col bg-white border border-gray-200 rounded-xl shadow-xs dark:bg-neutral-900 dark:border-neutral-800">
    <div class="p-3 md:p-4 flex justify-between items-center gap-x-3">
      <div>
        <p class="text-xs font-medium text-gray-500 dark:text-neutral-400">
          Learning Hours
        </p>
        <div class="mt-0.5 flex items-center gap-x-2">
          <h3 class="text-xl font-bold text-gray-800 dark:text-neutral-200">
            125 hrs
          </h3>
        </div>
        <p class="mt-0.5 text-xs text-gray-400 dark:text-neutral-500 font-medium">
          This Month
        </p>
        <!-- Empty State Example:
        <p class="mt-0.5 text-xs text-gray-400 font-medium">
          No activity
        </p>
        -->
      </div>
      
      <div class="shrink-0 flex justify-center items-center size-10 bg-amber-100/50 text-amber-500 rounded-full dark:bg-amber-900/20 dark:text-amber-500">
        <i data-lucide="clock" class="size-5 stroke-[2]"></i>
      </div>
    </div>
  </div>

  <!-- Certificates -->
  <div class="flex flex-col bg-white border border-gray-200 rounded-xl shadow-xs dark:bg-neutral-900 dark:border-neutral-800">
    <div class="p-3 md:p-4 flex justify-between items-center gap-x-3">
      <div>
        <p class="text-xs font-medium text-gray-500 dark:text-neutral-400">
          Certificates
        </p>
        <div class="mt-0.5 flex items-center gap-x-2">
          <h3 class="text-xl font-bold text-gray-800 dark:text-neutral-200">
            3
          </h3>
        </div>
        <p class="mt-0.5 text-xs text-emerald-500 font-medium">
          Keep it up!
        </p>
        <!-- Empty State Example:
        <p class="mt-0.5 text-xs text-gray-400 font-medium">
          Earn your first
        </p>
        -->
      </div>
      
      <div class="shrink-0 flex justify-center items-center size-10 bg-emerald-100/50 text-emerald-500 rounded-full dark:bg-emerald-900/20 dark:text-emerald-500">
        <i data-lucide="award" class="size-5 stroke-[2]"></i>
      </div>
    </div>
  </div>

  <!-- Current Streak -->
  <div class="flex flex-col bg-white border border-gray-200 rounded-xl shadow-xs dark:bg-neutral-900 dark:border-neutral-800">
    <div class="p-3 md:p-4 flex justify-between items-center gap-x-3">
      <div>
        <p class="text-xs font-medium text-gray-500 dark:text-neutral-400">
          Current Streak
        </p>
        <div class="mt-0.5 flex items-center gap-x-2">
          <h3 class="text-xl font-bold text-gray-800 dark:text-neutral-200">
            30 Days
          </h3>
        </div>
        <p class="mt-0.5 text-xs text-gray-400 dark:text-neutral-500 font-medium">
          Amazing!
        </p>
        <!-- Empty State Example:
        <p class="mt-0.5 text-xs text-gray-400 font-medium">
          Start today
        </p>
        -->
      </div>
      
      <div class="shrink-0 flex justify-center items-center size-10 bg-rose-100/50 text-rose-500 rounded-full dark:bg-rose-900/20 dark:text-rose-500">
        <i data-lucide="flame" class="size-5 stroke-[2]"></i>
      </div>
    </div>
  </div>

</div>
