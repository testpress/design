{# Every attempt, newest first. Opening one shows its steps and logs. #}
{% from "./status_icon.html" import status_icon %}
<section x-show="runs.length" class="p-2 sm:p-3 bg-white rounded-2xl shadow-sm dark:bg-neutral-800">
  <h3 class="px-3 pt-2 pb-2 text-sm font-semibold text-gray-800 dark:text-neutral-100">Runs</h3>
  <ul class="space-y-0.5">
    <template x-for="r in runs" :key="r.id">
      <li>
        <button type="button" @click="openRun(r.id)"
                class="w-full flex items-center gap-x-3 py-2.5 px-3 rounded-lg text-start hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 dark:hover:bg-neutral-900/50"
                :class="view === 'run' && run.id === r.id && 'bg-gray-50 dark:bg-neutral-900/50'">
          {{ status_icon("r.status === 'ready' ? 'waiting' : r.status") }}
          <div class="flex-1 min-w-0">
            <p class="text-sm text-gray-800 truncate dark:text-neutral-200">
              <span class="font-medium" x-text="r.domain"></span>
              <span class="text-gray-400 dark:text-neutral-500">#<span x-text="r.id"></span></span>
            </p>
            <p class="text-xs text-gray-500 truncate dark:text-neutral-400" x-text="runSummary(r)"></p>
          </div>
          <div class="hidden sm:block shrink-0 text-end text-xs text-gray-500 dark:text-neutral-400">
            <p x-text="r.started"></p>
            <p x-text="r.by"></p>
          </div>
        </button>
      </li>
    </template>
  </ul>
</section>
