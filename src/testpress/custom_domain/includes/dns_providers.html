{# How to add the record at common providers, and a way to send the steps to someone else (kept at the panel's bottom) #}
<div class="flex flex-col h-full">
  <h3 class="text-sm font-semibold text-gray-800 dark:text-neutral-100">Where is your domain managed?</h3>
  <div class="mt-3 flex flex-wrap gap-1.5" role="group" aria-label="Domain provider">
    <template x-for="p in providers" :key="p.id">
      <button type="button" @click="provider = p.id" :aria-pressed="provider === p.id"
              class="py-1 px-2.5 rounded-full border text-xs font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
              :class="provider === p.id ? 'border-primary-600 bg-primary-50 text-primary-700 dark:bg-primary-500/10 dark:text-primary-400' : 'border-gray-200 bg-white text-gray-600 hover:bg-gray-50 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-300 dark:hover:bg-neutral-700'"
              x-text="p.label"></button>
    </template>
  </div>
  <!-- Every provider's steps share one grid cell; only the chosen one is visible, so the panel keeps the height
       of the longest list and nothing jumps when switching -->
  <div class="mt-4 mb-4 grid">
    <template x-for="p in providers" :key="p.id">
      <ol class="[grid-area:1/1] space-y-3" :class="provider !== p.id && 'invisible'" :aria-hidden="provider !== p.id">
        <template x-for="(t, n) in stepsFor(p.id)" :key="n">
          <li class="flex gap-x-3 text-sm text-gray-600 dark:text-neutral-400">
            <span class="shrink-0 size-5 mt-px inline-flex items-center justify-center rounded-full bg-white text-[11px] font-semibold text-gray-600 shadow-sm dark:bg-neutral-800 dark:text-neutral-300" x-text="n + 1"></span>
            <span class="[&_b]:font-medium [&_b]:text-gray-800 dark:[&_b]:text-neutral-100" x-html="t"></span>
          </li>
        </template>
      </ol>
    </template>
  </div>
  <p class="mt-auto pt-3 border-t border-gray-200/70 text-xs text-gray-500 dark:border-neutral-700 dark:text-neutral-400">
    Someone else manages it?
    <button type="button" @click="$dispatch('open-modal-cd-share')" class="font-medium text-primary-600 hover:text-primary-700 focus:outline-none focus-visible:underline">Send them these steps</button>
  </p>
</div>
