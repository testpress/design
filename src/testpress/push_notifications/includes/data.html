{# Mock data for the push notification pages comes from src/_data/push.json (prototype only). #}
<script>
  const PN = {{ push | dump | safe }};
  const pnNum = (n) => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('en-IN');
  const pnState = () => new URLSearchParams(window.location.search).get('state');
  const pnParam = (k) => new URLSearchParams(window.location.search).get(k);
  const pnCopy = (o) => JSON.parse(JSON.stringify(o));
  const pnToast = (title, description = '', variant = 'success') =>
    window.dispatchEvent(new CustomEvent('toast', { detail: { title, description, variant } }));
  const pnIcons = () => setTimeout(() => window.lucide && lucide.createIcons(), 0);
  const pnOptLabel = (type, v) => {
    const list = { product: PN.products, course: PN.courses, batch: PN.batches, students: PN.students }[type] || [];
    const o = list.find(x => x.value === v); return o ? o.label : v;
  };
</script>
