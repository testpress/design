<script>
  window.PN_PROTO = [
    { name: 'Start', states: [['blank', 'New notification'], ['youtube', 'YouTube video (ready)'], ['product', 'Product (ready)'], ['template', 'From a template']] },
    { name: '“Opens when tapped” field', states: [['pick-root', 'Clicked the field'], ['pick-products', 'Products'], ['pick-search', 'Typed a search'], ['pick-link-empty', 'A link (empty)'], ['pick-link', 'A link: pasted YouTube'], ['pick-bad', 'Typed something not found']] },
    { name: 'Other', states: [['edit-audience', 'Who gets it'], ['no-match', 'No students match']] },
    { name: 'Sending', states: [['confirm', 'Confirm send'], ['no-app', 'Nobody has the app'], ['send-failed', 'Sending failed']] },
  ];
  window.PN_PROTO_DEFAULT = 'blank';

  const PN_LIMITS = { title: 65, message: 240 };
  const PN_YT = 'https://www.youtube.com/watch?v=k3Xq2-thermo';
  const PN_TREE = PN.courseTree;
  const PN_ACCESS = Object.fromEntries(PN_TREE.map(c => [c.id, c.access]));
  // Everything that can be opened, flat. Chapters can hold sub-chapters at any depth; `anc` lists every course and
  // chapter above an item, so a search can be limited to whatever you're inside.
  const PN_INDEX = [];
  const PN_NODES = {};
  const pnShort = (l) => l.split(' · ')[0];
  const pnCount = (n) => (n.items || []).length + (n.chapters || []).reduce((t, c) => t + pnCount(c), 0);
  PN.products.forEach(p => PN_INDEX.push({ id: 'p-' + p.value, type: 'product', label: p.label, hint: p.meta, meta: 'Product · ' + p.meta, image: p.image, path: ['Products', p.label] }));
  const pnWalk = (node, course, anc, path) => {
    (node.chapters || []).forEach(ch => {
      const cpath = [...path, ch.label], canc = [...anc, ch.id];
      PN_NODES[ch.id] = { ...ch, kind: 'chapter', course };
      PN_INDEX.push({ id: 'ch-' + ch.id, type: 'chapter', label: ch.label, hint: pnCount(ch) + ' items', meta: 'Chapter · ' + path.map(pnShort).join(' › '), image: PN_NODES[course].image, course, anc, path: cpath.map(pnShort) });
      pnWalk(ch, course, canc, cpath);
    });
    (node.items || []).forEach(it => PN_INDEX.push({ ...it, type: 'content', course, anc, hint: it.when || PN.kinds[it.kind].label,
      meta: PN.kinds[it.kind].label + ' · ' + (it.when || path.map(pnShort).join(' › ')), image: it.image || null, path: [...path.map(pnShort), it.label] }));
  };
  // Courses, chapters and content are left out for now; products and links only
  if (PN.pickCourses) PN_TREE.forEach(c => {
    PN_NODES[c.id] = { ...c, kind: 'course', course: c.id };
    PN_INDEX.push({ id: 'c-' + c.id, type: 'course', label: c.label, hint: c.access.toLocaleString('en-IN') + ' students', meta: 'Course · ' + c.access.toLocaleString('en-IN') + ' students have access', image: c.image, course: c.id, anc: [], path: [c.label] });
    pnWalk(c, c.id, [c.id], [c.label]);
  });
  const pnFind = (id) => pnCopy(PN_INDEX.find(x => x.id === id));
  const pnIsUrl = (u) => /^(https?:\/\/)?[^\s.]+\.[^\s]{2,}$/i.test((u || '').trim());
  const pnLink = (u) => {
    u = (u || '').trim();
    if (/youtu\.?be/i.test(u)) return { type: 'link', site: 'youtube', label: PN.links.youtube.title, hint: 'YouTube', meta: 'YouTube · opens in the YouTube app', image: PN.links.youtube.image, url: u, path: ['YouTube', PN.links.youtube.title] };
    const site = u.replace(/^https?:\/\//, '').split('/')[0];
    return { type: 'link', site, label: site, hint: 'Website', meta: 'Website · opens in the browser', image: PN.links.web.image, title: PN.links.web.title, url: u, path: [site] };
  };
  // Words to start from for what it opens: [title, message]
  const pnWords = (o) => {
    if (!o || o.type === 'home') return null;
    const l = o.label, when = o.when || '';
    if (o.type === 'link') return o.site === 'youtube' ? [l, 'New video on our YouTube channel. Tap to watch.'] : [o.title || l, 'Tap to read more.'];
    if (o.type === 'store') return ['New in the store', 'Courses and test series for your exam. Tap to see them.'];
    if (o.type === 'product') return [l + ' is open', 'Seats are limited. Tap to see what’s inside and join today.'];
    if (o.type === 'course') return ['New in ' + l, 'Fresh lessons are up. Tap to continue where you left off.'];
    if (o.type === 'chapter') return [l.split(' · ')[1] || l, 'A new chapter is up. Tap to start it.'];
    return ({
      video: ['New video: ' + l, 'Watch it before your next class.'],
      test: [l + ' is open', 'Take it today and see where you stand.'],
      exam: [l, when + '. Revise and be ready on time.'],
      notes: ['New notes: ' + l, 'Quick revision for the chapter.'],
      live: ['Live class: ' + l, when + '. Tap to join on time.'],
    })[o.kind];
  };
  const pnEmptyRow = () => ({ id: Date.now() + Math.random(), type: 'batch', values: [], field: '' });
  const pnEstimate = (a, noMatch) => {
    if (!a || !a.mode) return null;
    if (a.mode === 'all') return PN.allStudents;
    const rows = (a.rows || []).filter(r => r.values.length);
    if (!rows.length) return null;
    if (noMatch && a.match === 'all') return 0;
    const base = rows.reduce((t, r) => t + r.values.reduce((s, v) => s + (r.type === 'course' && PN_ACCESS[v] ? PN_ACCESS[v] : ({ product: 820, course: 1640, batch: 1180, field: 2300, students: 1 })[r.type]), 0), 0);
    return a.match === 'all' && rows.length > 1 ? Math.round(base / 3.4) : base;
  };
  const PN_HOME = { type: 'home', label: 'App home', meta: 'Opens the app’s home screen', path: [] };
  const pnPicker = () => ({ open: false, q: '', level: 'root', stack: [], index: 0 });

  document.addEventListener('alpine:init', () => {
    Alpine.data('pushSend', () => ({
      // The notification as it is now. Side panels edit a copy (`d`), so Cancel changes nothing.
      // `auto` marks fields still holding words filled from what it opens; an admin's own edits are never replaced.
      msg: { opens: pnCopy(PN_HOME), title: '', message: '', image: null, auto: { title: false, message: false, image: false } },
      audience: { mode: '', match: 'any', rows: [] },
      d: { opens: pnCopy(PN_HOME), auto: {}, title: '', message: '' },
      panel: '',
      tried: false,
      pk: pnPicker(),   // the "Opens when tapped" field
      device: 'android',
      sending: false,
      sendError: false,
      tplPick: null,
      fail: {},
      limits: PN_LIMITS,
      kinds: PN.kinds,
      templates: PN.templates,

      init() {
        const s = pnState() || 'blank';
        if (['youtube', 'confirm', 'no-app', 'send-failed', 'edit-audience'].includes(s) || pnParam('again')) this.loadYoutube();
        if (s === 'product') this.loadProduct();
        if (s === 'template' || pnParam('template')) this.applyTemplate(this.templates.find(t => t.id === Number(pnParam('template') || 2)), false);
        if (s === 'no-match') this.audience = { mode: 'some', match: 'all', rows: [{ id: 1, type: 'batch', values: ['repeaters'] }, { id: 2, type: 'product', values: ['neet-crash'] }] };
        if (s === 'no-app') this.fail.noApp = true;
        if (s === 'send-failed') this.fail.send = true;
        const picker = { 'pick-root': () => {}, 'pick-products': () => this.goLevel('products'), 'pick-search': () => { this.pk.q = 'neet'; },
          'pick-link-empty': () => this.goLevel('link'), 'pick-link': () => { this.goLevel('link'); this.pk.q = PN_YT; }, 'pick-bad': () => { this.pk.q = 'organic chemistry crash'; } }[s];
        if (picker) setTimeout(() => { this.open('msg'); setTimeout(() => { this.pk.open = true; picker(); pnIcons(); }, 350); }, 300);
        const panels = { 'edit-audience': 'audience', 'no-match': 'audience' };
        if (panels[s]) setTimeout(() => this.open(panels[s]), 400);
        if (['confirm', 'no-app', 'send-failed'].includes(s)) setTimeout(() => this.openConfirm(), 400);
        this.$watch('pk.q', () => { this.pk.index = 0; pnIcons(); });
      },
      loadYoutube() {
        const o = pnLink(PN_YT);
        this.msg = { opens: o, title: o.label, message: 'New video on our YouTube channel. Watch it before Saturday’s test.', image: { name: 'From the YouTube video', url: o.image, from: 'the video' }, auto: { title: true, message: false, image: true } };
        this.audience = { mode: 'some', match: 'any', rows: [{ id: 1, type: 'course', values: ['phy-11'] }] };
      },
      loadProduct() {
        const o = pnFind('p-neet-crash'), w = pnWords(o);
        this.msg = { opens: o, title: w[0], message: w[1], image: { name: 'From the product', url: o.image, from: 'the product' }, auto: { title: true, message: true, image: true } };
        this.audience = { mode: 'some', match: 'any', rows: [{ id: 1, type: 'batch', values: ['neet-a', 'neet-b'] }] };
      },

      // ----- Side panels -----
      open(key) {
        this.tried = false;
        this.d = pnCopy(this[key]);
        if (key === 'audience') {
          if (!this.d.mode) { const sg = this.audienceSuggestion; this.d = sg ? pnCopy(sg.audience) : { mode: 'some', match: 'any', rows: [] }; }
          if (this.d.mode === 'some' && !this.d.rows.length) this.d.rows.push(pnEmptyRow());
        }
        if (key === 'msg') this.pk = pnPicker();
        this.panel = key;
        window.dispatchEvent(new CustomEvent('open-drawer-pn-' + key));
        this.$nextTick(() => { if (key === 'msg') this.showImage(); pnIcons(); });
      },
      showImage() {
        const i = this.d.image;
        window.dispatchEvent(new CustomEvent('set-uploaded-file', { detail: { name: 'push_image', files: i ? [{ name: i.name, size: i.from ? '' : '184 KB', progress: 100, status: 'success', extension: 'png', url: i.url }] : [] } }));
      },
      close() { window.dispatchEvent(new CustomEvent('close-drawer-pn-' + this.panel)); },
      panelError(key) {
        const d = this.d; if (!this.tried || this.panel !== key) return '';
        if (key === 'msg') { if (!d.title.trim()) return 'Add a title.'; if (!d.message.trim()) return 'Add a message.'; }
        if (key === 'audience' && d.mode === 'some' && !d.rows.some(r => r.values.length)) return 'Choose at least one batch, course, product, field or student.';
        return '';
      },
      apply() {
        this.tried = true;
        if (this.panelError(this.panel)) return;
        this[this.panel] = pnCopy(this.d);
        this.close();
      },

      // ----- "Opens when tapped": click to browse (Products › … / Courses › course › chapter › content), type to search, paste a link -----
      goLevel(level) { this.pk.level = level; this.pk.q = ''; this.pk.index = 0; this.$nextTick(() => this.$refs.pkin && this.$refs.pkin.focus()); pnIcons(); },
      goNode(id) { this.pk.stack.push(id); this.goLevel('node'); },
      goCourse(id) { this.pk.stack = [id]; this.goLevel('node'); },
      up() {
        const l = this.pk.level;
        if (l === 'node') { this.pk.stack.pop(); this.goLevel(this.pk.stack.length ? 'node' : 'courses'); }
        else if (l !== 'root') this.goLevel('root');
      },
      get pkNode() { return PN_NODES[this.pk.stack[this.pk.stack.length - 1]] || { chapters: [], items: [] }; },
      // Where you are while browsing, shown in the field
      get crumbs() {
        const l = this.pk.level;
        if (l === 'products') return ['Products'];
        if (l === 'courses') return ['Courses'];
        if (l === 'link') return ['A link'];
        if (l === 'node') return this.pk.stack.map(id => pnShort(PN_NODES[id].label));
        return [];
      },
      get pkHeading() {
        const l = this.pk.level, q = this.pk.q.trim();
        if (l === 'root') return q ? 'Results' : 'What should it open?';
        if (l === 'products') return 'Products';
        if (l === 'courses') return 'Courses';
        if (l === 'link') return 'A YouTube video or any website';
        return q ? 'In ' + this.pkNode.label : this.pkNode.label;
      },
      // Dropdown rows: { head } group heading, { item } to pick, { go } to step into, { hint } a note
      get pkRows() {
        const q = this.pk.q.trim().toLowerCase(), l = this.pk.level, rows = [];
        const match = (x) => !q || (x.label + ' ' + (x.meta || '')).toLowerCase().includes(q);
        if (l === 'link') return pnIsUrl(this.pk.q) ? [{ item: pnLink(this.pk.q) }] : [{ hint: q ? 'That isn’t a full link yet. Copy it from the browser’s address bar.' : 'Paste the link, like https://youtube.com/watch?v=…' }];
        // A link pasted into search still works
        if (l === 'root' && q && pnIsUrl(this.pk.q)) return [{ item: pnLink(this.pk.q) }];
        if (l === 'root' && !q) return [
          { go: 'products', label: 'Products', side: 'Store or one product', icon: 'shopping-bag' },
          { go: 'link', label: 'A link', side: 'YouTube or any website', icon: 'link' },
        ];
        if (l === 'root') {
          [['product', 'Products']].concat(PN.pickCourses ? [['course', 'Courses'], ['chapter', 'Chapters'], ['content', 'Content']] : []).forEach(([t, h]) => {
            const found = PN_INDEX.filter(x => x.type === t && match(x)).slice(0, 5);
            if (found.length) rows.push({ head: h }, ...found.map(x => ({ item: x, sub: x.path.slice(0, -1).join(' › ') || x.hint })));
          });
          if (!rows.length) rows.push({ hint: 'No product called “' + this.pk.q.trim() + '”. For a website or YouTube video, choose A link.' });
          return rows;
        }
        if (l === 'products') {
          if (!q || 'all products store'.includes(q)) rows.push({ item: { id: 'store', type: 'store', label: 'All products (store)', hint: 'Store', meta: 'Opens your course store', image: null, path: ['All products'] } });
          PN_INDEX.filter(x => x.type === 'product' && match(x)).forEach(x => rows.push({ item: x }));
        }
        if (l === 'courses') PN_TREE.filter(c => match(c)).forEach(c => rows.push({ go: 'node', id: c.id, label: c.label, side: c.access.toLocaleString('en-IN') + ' students', icon: 'book-open' }));
        if (l === 'node') {
          const n = this.pkNode;
          if (!q) {
            rows.push({ item: pnFind((n.kind === 'course' ? 'c-' : 'ch-') + n.id), whole: n.kind === 'course' ? 'Use the whole course' : 'Use the whole chapter' });
            if (n.kind === 'course') {
              const up = PN_INDEX.filter(x => x.course === n.id && x.upcoming);
              if (up.length) rows.push({ head: 'Upcoming' }, ...up.map(x => ({ item: x })));
            }
            if ((n.chapters || []).length) rows.push({ head: n.kind === 'course' ? 'Chapters' : 'Sub-chapters' }, ...n.chapters.map(ch => ({ go: 'node', id: ch.id, label: ch.label, side: pnCount(ch) + ' items', icon: 'folder' })));
            const items = PN_INDEX.filter(x => x.type === 'content' && x.anc[x.anc.length - 1] === n.id);
            if (items.length) rows.push({ head: 'In this ' + (n.kind === 'course' ? 'course' : 'chapter') }, ...items.map(x => ({ item: x })));
          } else {
            PN_INDEX.filter(x => (x.anc || []).includes(n.id) && match(x)).forEach(x => rows.push({ item: x, sub: x.path.slice(this.pk.stack.length, -1).join(' › ') || x.hint }));
          }
        }
        if (!rows.length) rows.push({ hint: 'Nothing called “' + this.pk.q.trim() + '” here' });
        return rows;
      },
      get pkChoices() { return this.pkRows.filter(r => r.item || r.go); },
      rowKey(r) { return !r ? '' : r.go ? 'go:' + r.go + (r.id || '') : r.item ? 'item:' + (r.item.id || r.item.url) : (r.head || r.hint || ''); },
      isActive(r) { const c = this.pkChoices[this.pk.index]; return !!c && this.rowKey(c) === this.rowKey(r); },
      isPicked(o) { const p = this.d.opens; return !!o && !!p && p.type !== 'home' && (p.id ? p.id === o.id : p.url === o.url); },
      choose(r) {
        if (r.go === 'node') return this.goNode(r.id);
        if (r.go) return this.goLevel(r.go);
        this.pick(r.item);
      },
      pick(o) { this.d.opens = pnCopy(o); this.pk = pnPicker(); this.prefill(); pnIcons(); },
      clearOpens() { this.d.opens = pnCopy(PN_HOME); this.pk = pnPicker(); this.prefill(); },
      pkKeydown(ev) {
        const list = this.pkChoices;
        if (ev.key === 'ArrowDown' && list.length) { ev.preventDefault(); this.pk.open = true; this.pk.index = (this.pk.index + 1) % list.length; }
        else if (ev.key === 'ArrowUp' && list.length) { ev.preventDefault(); this.pk.index = (this.pk.index - 1 + list.length) % list.length; }
        else if (ev.key === 'Enter') { ev.preventDefault(); if (list[this.pk.index]) this.choose(list[this.pk.index]); }
        else if (ev.key === 'Backspace' && !this.pk.q) { if (this.pk.level !== 'root') this.up(); else if (this.d.opens.type !== 'home') this.clearOpens(); }
        else if (ev.key === 'Escape') this.pk.open = false;
      },
      // Fill title, message and picture from what it opens — only fields the admin hasn't written themselves
      prefill() {
        const o = this.d.opens, w = pnWords(o), a = this.d.auto || (this.d.auto = {});
        ['title', 'message'].forEach((k, i) => {
          if (!this.d[k].trim() || a[k]) { this.d[k] = w ? w[i].slice(0, k === 'title' ? 65 : 240) : ''; a[k] = !!w; }
        });
        if (!this.d.image || a.image) {
          const url = o.image || (['content', 'chapter'].includes(o.type) && o.kind !== 'test' && o.kind !== 'exam' ? (PN_TREE.find(c => c.id === o.course) || {}).image : null);
          this.d.image = url ? { name: 'From ' + (o.type === 'link' && o.site === 'youtube' ? 'the YouTube video' : this.sourceName(o)), url, from: this.sourceName(o) } : null;
          a.image = !!url;
          this.$nextTick(() => this.showImage());
        }
      },
      sourceName(o) {
        if (o.type === 'content') return 'the ' + PN.kinds[o.kind].label.toLowerCase();
        return ({ product: 'the product', store: 'the store', course: 'the course', chapter: 'the chapter', link: o.site === 'youtube' ? 'the video' : 'the page' })[o.type] || '';
      },
      edited(k) { if (this.d.auto) this.d.auto[k] = false; },
      autoNote(k) { return this.d.auto && this.d.auto[k] ? 'Filled from ' + this.sourceName(this.d.opens) : ''; },
      opensIcon(o) { if (!o) return 'circle'; return o.type === 'content' ? PN.kinds[o.kind].icon : ({ product: 'shopping-bag', store: 'store', course: 'book-open', chapter: 'folder-open', link: o.site === 'youtube' ? 'circle-play' : 'globe', home: 'house' })[o.type]; },
      opensWhere(o) { return o.type === 'link' ? (o.site === 'youtube' ? 'Opens in the YouTube app' : 'Opens in the browser') : o.type === 'home' ? 'Opens the app’s home screen' : o.type === 'store' ? 'Opens your course store' : 'Opens in the app'; },
      get opensMeta() { return this.opensWhere(this.msg.opens); },
      get opensTitle() { const o = this.msg.opens; return o.type === 'home' ? 'App home' : o.path.join(' › '); },

      // ----- Who gets it -----
      get accessCourse() { const o = this.msg.opens; return ['course', 'chapter', 'content'].includes(o.type) ? o.course : null; },
      get audienceSuggestion() {
        if (!this.accessCourse) return null;
        return { title: 'Students with access to ' + pnOptLabel('course', this.accessCourse), count: PN_ACCESS[this.accessCourse],
                 audience: { mode: 'some', match: 'any', rows: [{ id: 1, type: 'course', values: [this.accessCourse] }] } };
      },
      get cantOpen() {
        const c = this.accessCourse, a = this.audience;
        if (!c || !a.mode || !this.estimate) return 0;
        const only = a.mode === 'some' && a.rows.length && a.rows.every(r => r.type === 'course' && r.values.length === 1 && r.values[0] === c);
        return only ? 0 : Math.max(0, this.estimate - PN_ACCESS[c]);
      },
      useSuggestion() { this.audience = pnCopy(this.audienceSuggestion.audience); pnToast('Who gets it updated', 'Only students who can open it will get it.'); },
      dEstimate() { return this.panel === 'audience' ? pnEstimate(this.d, pnState() === 'no-match') : null; },
      get estimate() { return pnEstimate(this.audience, pnState() === 'no-match'); },
      withApp(n) { return this.fail.noApp ? 0 : Math.round((n || 0) * PN.appShare); },
      get audienceText() {
        if (this.audience.mode === 'all') return 'All registered students';
        const verbs = { product: 'bought ', course: 'has access to ', batch: 'in ', field: '', students: '' };
        const t = this.audience.rows.filter(r => r.values.length)
          .map(r => verbs[r.type] + r.values.map(v => pnOptLabel(r.type, v)).join(', '))
          .join(this.audience.match === 'all' ? ', and ' : ', or ');
        return t.charAt(0).toUpperCase() + t.slice(1);
      },
      addRow() { this.d.rows.push(pnEmptyRow()); pnIcons(); },
      removeRow(row) { this.d.rows = this.d.rows.filter(r => r.id !== row.id); },
      setType(row, type) { row.type = type; row.values = []; row.field = ''; },

      // ----- Status of each row: done | todo | problem | warn (a warning doesn't block sending) -----
      get rows() {
        const r = {};
        r.msg = this.msg.title && this.msg.message ? ['done', ''] : ['todo', 'What it opens, title, message and picture'];
        if (!this.audience.mode) r.audience = ['todo', 'Choose who should get it'];
        else if (this.estimate === 0) r.audience = ['problem', 'No student matches these conditions'];
        else if (this.estimate === null) r.audience = ['todo', 'Choose at least one condition'];
        else r.audience = [this.cantOpen ? 'warn' : 'done', ''];
        return r;
      },
      get leftItems() { const n = { msg: 'Message', audience: 'Who gets it' }; return Object.entries(this.rows).filter(([k, v]) => v[0] === 'todo' || v[0] === 'problem').map(([k]) => n[k]); },
      get ready() { return this.leftItems.length === 0; },

      // ----- Templates -----
      get hasContent() { return !!(this.msg.title || this.msg.message); },
      openTemplates() { this.tplPick = null; this.$dispatch('open-modal-use-template'); },
      applyTemplate(t, notify = true) {
        if (!t) return;
        this.msg = { ...this.msg, title: t.title, message: t.message, auto: { title: false, message: false, image: false },
                     image: t.image ? { name: 'template-image.png', url: PN.products[0].image } : this.msg.image };
        if (notify) pnToast('“' + t.name + '” added', 'Change anything you like. The template stays as it is.');
      },

      // ----- Test and send -----
      sendTest() { pnToast('Test sent to your phone', 'Check how it looks, and tap it to make sure it opens the right page.'); },
      openConfirm() { this.sendError = false; this.$dispatch('open-modal-confirm-send'); },
      send() {
        if (this.sending) return; // one click = one send
        this.sending = true; this.sendError = false;
        setTimeout(() => {
          if (this.fail.send) { this.fail.send = false; this.sending = false; this.sendError = true; return; }
          window.location.href = '{{ "/testpress/push_notifications/" | url }}?state=just-sent';
        }, 1200);
      },
    }));
  });
</script>
