<script>
  window.PN_PROTO = [
    { name: 'Start', states: [['blank', 'New notification'], ['youtube', 'Promote a YouTube video (ready)'], ['template', 'From a template']] },
    { name: 'When they tap (side panel)', states: [['edit-youtube', 'Pasted a YouTube link'], ['edit-testpress', 'Pasted a Testpress link'], ['edit-web', 'Pasted another website'], ['edit-bad', 'Link not valid'], ['edit-product', 'A product']] },
    { name: 'Other side panels', states: [['edit-message', 'Message'], ['edit-audience', 'Who gets it'], ['no-match', 'No students match']] },
    { name: 'Sending', states: [['confirm', 'Confirm send'], ['no-app', 'Nobody has the app'], ['send-failed', 'Sending failed']] },
  ];
  window.PN_PROTO_DEFAULT = 'blank';

  const PN_LIMITS = { title: 65, message: 240 };
  const PN_SAMPLE = {
    youtube: 'https://www.youtube.com/watch?v=k3Xq2-thermo',
    testpress: 'https://brilliantpala.testpress.in/courses/physics-11/chapter-4/thermodynamics-lecture-3/',
    web: 'https://nta.ac.in/neet-2027-notice',
    bad: 'youtube thermodynamics video',
  };
  // What a pasted link is, and what a tap will do (prototype: recognised by what's in the address)
  const pnDetect = (url) => {
    const u = (url || '').trim();
    if (!u) return null;
    if (!/^(https?:\/\/)?[^\s.]+\.[^\s]{2,}$/i.test(u)) return { kind: 'bad' };
    if (/youtu\.?be/i.test(u)) return { ...PN.links.youtube, kind: 'youtube' };
    if (/testpress|brilliantpala/i.test(u)) return { ...PN.links.testpress, kind: 'testpress' };
    return { ...PN.links.web, kind: 'web', site: u.replace(/^https?:\/\//, '').split('/')[0] };
  };
  const pnEmptyRow = () => ({ id: Date.now() + Math.random(), type: 'batch', values: [], field: '' });
  const pnEstimate = (a, noMatch) => {
    if (!a || !a.mode) return null;
    if (a.mode === 'all') return PN.allStudents;
    const rows = (a.rows || []).filter(r => r.values.length);
    if (!rows.length) return null;
    if (noMatch && a.match === 'all') return 0;
    const base = rows.reduce((t, r) => t + r.values.length * ({ product: 820, course: 1640, batch: 1180, field: 2300, students: 1 })[r.type], 0);
    return a.match === 'all' && rows.length > 1 ? Math.round(base / 3.4) : base;
  };

  document.addEventListener('alpine:init', () => {
    Alpine.data('pushSend', () => ({
      // The notification as it is now. Side panels edit a copy (`d`), so Cancel changes nothing.
      opens: { type: 'home', url: '', product: '', useLink: true },
      msg: { title: '', message: '', image: null },
      audience: { mode: '', match: 'any', rows: [] },
      d: { useLink: true },
      panel: '',
      tried: false,
      device: 'android',
      sending: false,
      sendError: false,
      tplPick: null,
      fail: {},
      limits: PN_LIMITS,
      templates: PN.templates,
      products: PN.products,

      init() {
        const s = pnState() || 'blank';
        if (['youtube', 'confirm', 'no-app', 'send-failed', 'edit-message', 'edit-audience'].includes(s)) this.loadYoutube();
        if (s === 'template' || pnParam('template')) this.applyTemplate(this.templates.find(t => t.id === Number(pnParam('template') || 2)), false);
        if (pnParam('again')) this.loadYoutube();
        if (s === 'no-match') this.audience = { mode: 'some', match: 'all', rows: [{ id: 1, type: 'batch', values: ['repeaters'] }, { id: 2, type: 'product', values: ['neet-crash'] }] };
        if (s === 'no-app') this.fail.noApp = true;
        if (s === 'send-failed') this.fail.send = true;
        const link = { 'edit-youtube': 'youtube', 'edit-testpress': 'testpress', 'edit-web': 'web', 'edit-bad': 'bad' }[s];
        if (link) setTimeout(() => { this.open('opens'); this.d.type = 'link'; this.d.url = PN_SAMPLE[link]; this.tried = link === 'bad'; }, 400);
        if (s === 'edit-product') setTimeout(() => { this.open('opens'); this.d.type = 'product'; }, 400);
        const panels = { 'edit-message': 'msg', 'edit-audience': 'audience', 'no-match': 'audience' };
        if (panels[s]) setTimeout(() => this.open(panels[s]), 400);
        if (['confirm', 'no-app', 'send-failed'].includes(s)) setTimeout(() => this.openConfirm(), 400);
      },
      loadYoutube() {
        const y = PN.links.youtube;
        this.opens = { type: 'link', url: PN_SAMPLE.youtube, product: '', useLink: true };
        this.msg = { title: y.title, message: 'New video on our YouTube channel. Watch it before Saturday’s test.', image: { name: 'YouTube thumbnail', url: y.image, from: 'youtube' } };
        this.audience = { mode: 'some', match: 'any', rows: [{ id: 1, type: 'course', values: ['phy-11'] }] };
      },

      // ----- Side panels -----
      open(key) {
        this.tried = false;
        this.d = pnCopy(this[key]);
        if (key === 'audience') {
          if (!this.d.mode) this.d.mode = 'some';
          if (this.d.mode === 'some' && !this.d.rows.length) this.d.rows.push(pnEmptyRow());
        }
        this.panel = key;
        window.dispatchEvent(new CustomEvent('open-drawer-pn-' + key));
        this.$nextTick(() => {
          if (key === 'msg') window.dispatchEvent(new CustomEvent('set-uploaded-file', { detail: { name: 'push_image', files: this.d.image ? [{ name: this.d.image.name, size: this.d.image.from === 'youtube' ? 'From the YouTube video' : this.d.image.from === 'web' ? 'From the web page' : '184 KB', progress: 100, status: 'success', extension: 'png', url: this.d.image.url }] : [] } }));
          pnIcons();
        });
      },
      close() { window.dispatchEvent(new CustomEvent('close-drawer-pn-' + this.panel)); },
      panelError(key) {
        const d = this.d; if (!this.tried || this.panel !== key) return '';
        if (key === 'opens') {
          if (d.type === 'link' && (!d.url || !this.link || this.link.kind === 'bad')) return 'Paste a full link, like https://youtube.com/watch?v=…';
          if (d.type === 'product' && !d.product) return 'Choose a product.';
        }
        if (key === 'msg') { if (!d.title.trim()) return 'Add a title.'; if (!d.message.trim()) return 'Add a message.'; }
        if (key === 'audience' && d.mode === 'some' && !d.rows.some(r => r.values.length)) return 'Choose at least one batch, course, product, field or student.';
        return '';
      },
      apply() {
        this.tried = true;
        if (this.panelError(this.panel)) return;
        const k = this.panel;
        this[k] = pnCopy(this.d);
        // A link's title and picture can fill the message
        if (k === 'opens' && this.d.type === 'link' && this.d.useLink && this.link && this.link.image !== undefined) {
          const l = this.link;
          if (!this.msg.title.trim()) this.msg.title = l.title.slice(0, 65);
          if (l.image && (!this.msg.image || this.msg.image.from)) this.msg.image = { name: l.kind === 'youtube' ? 'YouTube thumbnail' : l.site + ' – page image', url: l.image, from: l.kind };
          pnToast('Title and image added', 'Taken from the ' + (l.kind === 'youtube' ? 'video' : 'page') + '. Change them in Message.');
        }
        if (k === 'opens' && this.d.type === 'link' && this.link && this.link.kind === 'testpress' && this.d.useLink && !this.msg.title.trim()) this.msg.title = 'New: ' + this.link.title;
        this.close();
      },

      // ----- When they tap -----
      // The link being typed in the panel (or the saved one)
      get link() { return pnDetect(this.panel === 'opens' ? this.d.url : this.opens.url); },
      get savedLink() { return this.opens.type === 'link' ? pnDetect(this.opens.url) : null; },
      productLabel(v) { const p = this.products.find(p => p.value === v); return p ? p.label : ''; },
      get opensTitle() {
        const o = this.opens, l = this.savedLink;
        if (o.type === 'link' && l) return ({ youtube: 'YouTube video · ' + l.title, testpress: l.kind && l.title, web: l.site })[l.kind] || o.url;
        return ({ home: 'App home', store: 'Store', product: this.productLabel(o.product) })[o.type] || '';
      },
      get opensMeta() {
        const o = this.opens, l = this.savedLink;
        if (o.type === 'link' && l) return ({ youtube: 'Opens in the YouTube app', testpress: l.kind && ('Opens in the app · ' + PN.links.testpress.kind + ' · ' + PN.links.testpress.where), web: 'Opens in the browser' })[l.kind] || '';
        return ({ home: 'Opens the app’s home screen', store: 'Opens your course store', product: 'Opens the product page in the app' })[o.type] || '';
      },

      // ----- Who gets it -----
      dEstimate() { return this.panel === 'audience' ? pnEstimate(this.d, pnState() === 'no-match') : null; },
      get estimate() { return pnEstimate(this.audience, pnState() === 'no-match'); },
      withApp(n) { return this.fail.noApp ? 0 : Math.round((n || 0) * PN.appShare); },
      get audienceText() {
        if (this.audience.mode === 'all') return 'All registered students';
        const verbs = { product: 'bought ', course: 'has access to ', batch: 'in ', field: '', students: '' };
        const t = this.audience.rows.filter(r => r.values.length)
          .map(r => verbs[r.type] + r.values.map(v => pnOptLabel(r.type, v)).join(', '))
          .join(this.audience.match === 'all' ? ', and ' : ', or ');
        return t.charAt(0).toUpperCase() + t.slice(1);
      },
      addRow() { this.d.rows.push(pnEmptyRow()); pnIcons(); },
      removeRow(row) { this.d.rows = this.d.rows.filter(r => r.id !== row.id); },
      setType(row, type) { row.type = type; row.values = []; row.field = ''; },

      // ----- Status of each row -----
      get rows() {
        const r = {};
        r.opens = ['done', ''];
        r.msg = this.msg.title && this.msg.message ? ['done', ''] : ['todo', 'Add a title and message'];
        if (!this.audience.mode) r.audience = ['todo', 'Choose who should get it'];
        else if (this.estimate === 0) r.audience = ['problem', 'No student matches these conditions'];
        else if (this.estimate === null) r.audience = ['todo', 'Choose at least one condition'];
        else r.audience = ['done', ''];
        return r;
      },
      get leftItems() { const n = { opens: 'When they tap', msg: 'Message', audience: 'Who gets it' }; return Object.entries(this.rows).filter(([k, v]) => v[0] !== 'done').map(([k]) => n[k]); },
      get ready() { return this.leftItems.length === 0; },

      // ----- Templates -----
      get hasContent() { return !!(this.msg.title || this.msg.message); },
      openTemplates() { this.tplPick = null; this.$dispatch('open-modal-use-template'); },
      applyTemplate(t, notify = true) {
        if (!t) return;
        this.msg = { title: t.title, message: t.message, image: t.image ? { name: 'template-image.png', url: 'https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=600&h=300&q=70' } : this.msg.image };
        if (notify) pnToast('“' + t.name + '” added', 'Change anything you like. The template stays as it is.');
      },

      // ----- Test and send -----
      sendTest() { pnToast('Test sent to your phone', 'Check how it looks, and tap it to make sure it opens the right page.'); },
      openConfirm() { this.sendError = false; this.$dispatch('open-modal-confirm-send'); },
      send() {
        if (this.sending) return; // one click = one send
        this.sending = true; this.sendError = false;
        setTimeout(() => {
          if (this.fail.send) { this.fail.send = false; this.sending = false; this.sendError = true; return; }
          window.location.href = '{{ "/testpress/push_notifications/" | url }}?state=just-sent';
        }, 1200);
      },
    }));
  });
</script>
