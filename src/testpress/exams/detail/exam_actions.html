{# Exam Action states: 'start' | 'available' | 'resume' | 'retake' | 'ended' | 'retake_disabled' | 'max_attempts' | 'upcoming' #}
<div x-show="examState === 'ended'" x-cloak class="px-3 py-2 text-sm font-medium text-gray-700 dark:text-neutral-400">
  This exam has ended
</div>

<div x-show="examState === 'retake_disabled'" x-cloak class="px-3 py-2 text-sm font-medium text-gray-700 dark:text-neutral-400">
  Retakes are not permitted for exams you have already passed.
</div>

<div x-show="examState === 'max_attempts'" x-cloak class="px-3 py-2 text-sm font-medium text-gray-700 dark:text-neutral-400">
  You have reached maximum attempts for the exam
</div>

<div x-show="examState === 'upcoming'" x-cloak class="px-3 py-2 text-sm font-medium text-gray-700 dark:text-neutral-400">
  This exam has not started yet
</div>

<button x-show="examState === 'resume'" x-cloak type="button" x-on:click="showExamModeModal=true"
  class="rounded-md bg-primary-600 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
  Resume Exam
</button>

<button x-show="examState === 'retake'" x-cloak type="button" x-on:click="showExamModeModal=true"
  class="rounded-md bg-primary-600 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
  Retake Exam
</button>

<button x-show="!examState || examState === 'start' || examState === 'available'" x-cloak type="button" x-on:click="showExamModeModal=true"
  class="rounded-md bg-primary-600 px-3 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
  Start Exam
</button>
