{# Prototype only: states for the AI Chat access dialog (off-for-everyone is also picked up from the AI Chat settings page). #}
<div x-data="{ open: false }" class="fixed bottom-0.5 end-0.5 md:bottom-2 md:end-2 z-[85]" @click.outside="open = false" @keydown.escape="open = false">
  <div x-show="open" x-transition.opacity x-cloak class="absolute bottom-full end-0 mb-2 w-64 p-1 bg-white border border-gray-200 rounded-xl shadow-lg">
    <p class="px-2 pt-1 pb-1.5 text-[11px] font-medium uppercase tracking-wide text-gray-400">Prototype: AI Chat access</p>
    <template x-for="o in [['instituteOn', 'AI Chat enabled'], ['failNext', 'Next change fails']]" :key="o[0]">
      <button type="button" @click="$store.aiChatAccess[o[0]] = !$store.aiChatAccess[o[0]]" class="w-full flex items-center justify-between py-1.5 px-2 rounded-lg text-[13px] text-gray-800 hover:bg-gray-100">
        <span x-text="o[1]"></span>
        <span class="relative inline-block w-7 h-4 rounded-full transition-colors" :class="$store.aiChatAccess[o[0]] ? 'bg-primary-600' : 'bg-gray-300'">
          <span class="absolute top-0.5 start-0.5 size-3 rounded-full bg-white transition-transform" :class="$store.aiChatAccess[o[0]] && 'translate-x-3'"></span>
        </span>
      </button>
    </template>
  </div>
  <button type="button" @click="open = !open" :aria-expanded="open" aria-label="Prototype states"
          class="size-6 md:size-8 inline-flex justify-center items-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-sm opacity-60 hover:opacity-100 focus:opacity-100 focus:outline-none transition">
    <svg class="size-3.5 md:size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
  </button>
</div>
