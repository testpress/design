{% from "../../../ui-system/components/modal.html" import modal %}
{# Delete permanently: says what goes with it, and that it can't be undone #}
{% call modal(id="delete-forever", title="Delete permanently?", size="sm", variant="danger", confirm_text="Delete permanently") %}
  <template x-if="pending.length === 1">
    <div class="space-y-2">
      <p><span class="font-medium text-gray-800 dark:text-neutral-200" x-text="titleOf(pending[0])"></span> will be deleted now instead of in <span x-text="leftOf(pending[0])"></span>. You can't undo this.</p>
      <p class="text-gray-500 dark:text-neutral-400" x-text="lossOf(pending[0])"></p>
    </div>
  </template>
  <template x-if="pending.length > 1">
    <div class="space-y-2">
      <p><span class="font-medium text-gray-800 dark:text-neutral-200" x-text="pending.length + ' items'"></span> will be deleted now. You can't undo this.</p>
      <p class="text-gray-500 dark:text-neutral-400">Everything inside them and their students' attempts and progress will be deleted too.</p>
    </div>
  </template>
{% endcall %}
