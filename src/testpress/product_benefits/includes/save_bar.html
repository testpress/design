{% from "../../../ui-system/components/button.html" import button %}

<div x-show="dirty" x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-4"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-4"
     class="fixed inset-x-0 bottom-4 z-40 flex justify-center px-4 pointer-events-none">
  <div class="pointer-events-auto w-full max-w-xl flex flex-wrap items-center justify-between gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-lg" role="region" aria-label="Unsaved changes">
    <div class="flex items-center gap-x-2 text-sm">
      <span class="size-2 rounded-full bg-amber-500" aria-hidden="true"></span>
      <span class="font-medium text-gray-800">Unsaved changes</span>
    </div>
    <div class="flex items-center gap-x-2">
      {{ button(text="Discard", variant="ghost", extra_attrs='@click="discard()" :disabled="saving"') }}
      {{ button(
        text="<span x-text=\"saving ? 'Saving…' : 'Save changes'\">Save changes</span>",
        extra_attrs='@click="save()" :disabled="saving"'
      ) }}
    </div>
  </div>
</div>
