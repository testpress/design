<div x-data="imageCropper()" x-init="setup()"
  @keydown.escape.window="open && discard()"
  @keydown.enter.window="open && (mode === 'camera' ? cameraReady && capture() : ready && !processing && crop())">
  <div x-cloak x-show="open" role="dialog" aria-modal="true" aria-labelledby="crop-title"
    class="fixed inset-0 z-[80] flex sm:items-center sm:justify-center sm:p-6">
    <div class="hidden sm:block absolute inset-0 bg-gray-900/70 dark:bg-black/80"></div>

    <div
      class="relative flex flex-col w-full h-full bg-black sm:h-[min(88vh,52rem)] sm:max-w-4xl sm:rounded-xl sm:overflow-hidden sm:bg-white sm:shadow-2xl sm:dark:bg-neutral-800">

      <!-- Header -->
      <div
        class="shrink-0 flex items-center gap-2 h-14 px-2 pt-[env(safe-area-inset-top)] box-content sm:box-border sm:pt-0 sm:px-5 sm:h-16 sm:border-b sm:border-gray-200 sm:dark:border-neutral-700">
        <button type="button" @click="discard()" :aria-label="mode === 'camera' ? 'Close camera' : 'Discard image'"
          class="order-first sm:order-last inline-flex items-center justify-center size-11 sm:size-9 rounded-full text-white hover:bg-white/10 sm:text-gray-500 sm:hover:bg-gray-100 sm:hover:text-gray-700 sm:dark:text-neutral-400 sm:dark:hover:bg-neutral-700 sm:dark:hover:text-neutral-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-white sm:focus-visible:ring-[#337ab7]">
          <i data-lucide="x" class="size-6 sm:size-5"></i>
        </button>
        <div class="flex-1 min-w-0 text-center sm:text-left">
          <h2 id="crop-title" x-text="mode === 'camera' ? 'Take a photo' : 'Crop image'"
            class="text-base font-semibold text-white sm:text-lg sm:text-gray-900 sm:dark:text-neutral-100">
            Crop image
          </h2>
          <p x-show="mode === 'crop' && total > 1" x-text="`Image ${index} of ${total}`"
            class="text-xs text-white/60 sm:text-sm sm:text-gray-500 sm:dark:text-neutral-400"></p>
        </div>
        <span class="size-11 sm:hidden" aria-hidden="true"></span>
      </div>

      <!-- Camera (desktop webcams; phones use their own camera app) -->
      <div x-cloak x-show="mode === 'camera'" class="relative flex-1 min-h-0 bg-black">
        <video x-ref="video" autoplay playsinline muted class="absolute inset-0 w-full h-full object-contain"
          :class="cameraReady ? 'opacity-100' : 'opacity-0'"></video>

        <div x-show="!cameraReady && !cameraError" class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="size-8 rounded-full border-[3px] border-white/20 border-t-white animate-spin" role="status"
            aria-label="Starting camera"></span>
          <p class="mt-4 text-sm text-white/60">Allow camera access if your browser asks</p>
        </div>

        <div x-cloak x-show="cameraError" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
          <span class="inline-flex items-center justify-center size-12 rounded-full bg-white/10 text-white/80">
            <i data-lucide="camera-off" class="size-6"></i>
          </span>
          <p class="mt-4 text-base font-medium text-white"
            x-text="cameraError === 'blocked' ? 'Camera access is blocked' : 'No camera found'"></p>
          <p class="mt-1 max-w-xs text-sm text-white/60"
            x-text="cameraError === 'blocked' ? 'Allow camera access from the icon in the address bar, then try again.' : 'Connect a camera, or upload a photo instead.'"></p>
          <div class="mt-5 flex items-center gap-3">
            <button type="button" x-show="cameraError === 'blocked'" @click="startWebcam()"
              class="inline-flex items-center rounded-lg bg-white/10 px-4 py-2.5 text-sm font-medium text-white hover:bg-white/15">
              Try again
            </button>
            <button type="button" @click="uploadInstead()"
              class="inline-flex items-center rounded-lg bg-white px-4 py-2.5 text-sm font-medium text-gray-900 hover:bg-gray-100">
              Upload a photo
            </button>
          </div>
        </div>
      </div>

      <div x-cloak x-show="mode === 'camera' && !cameraError"
        class="shrink-0 grid grid-cols-3 items-center px-4 pt-3 pb-[max(1rem,env(safe-area-inset-bottom))] sm:px-5 sm:py-4 sm:border-t sm:border-gray-200 sm:dark:border-neutral-700">
        <div>
          <button type="button" @click="uploadInstead()" class="doubt-crop-tool">
            <i data-lucide="images" class="size-5 sm:size-4"></i>
            <span>Upload</span>
          </button>
        </div>
        <div class="flex justify-center">
          <button type="button" @click="capture()" :disabled="!cameraReady" aria-label="Take photo"
            class="inline-flex items-center justify-center size-16 rounded-full bg-white ring-4 ring-white/30 hover:bg-gray-100 sm:size-14 sm:bg-[#337ab7] sm:text-white sm:ring-[#337ab7]/20 sm:hover:bg-[#296292] sm:dark:bg-emerald-600 sm:dark:ring-emerald-600/20 sm:dark:hover:bg-emerald-700 disabled:opacity-40 disabled:pointer-events-none focus:outline-none focus-visible:ring-offset-2 focus-visible:ring-[#337ab7]">
            <i data-lucide="camera" class="size-6 hidden sm:block"></i>
          </button>
        </div>
        <div class="flex justify-end">
          <button type="button" x-show="cameras.length > 1" @click="switchCamera()" class="doubt-crop-tool">
            <i data-lucide="switch-camera" class="size-5 sm:size-4"></i>
            <span>Switch</span>
          </button>
        </div>
      </div>

      <!-- Stage -->
      <div x-show="mode === 'crop'" class="relative flex-1 min-h-0 flex flex-col bg-black">
        <div class="shrink-0 flex justify-center px-4 pt-3 pb-2 sm:pt-4 [@media(max-height:560px)]:hidden">
          <p
            class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3.5 py-1.5 text-sm text-white transition-opacity duration-150"
            :class="interacting ? 'opacity-0' : 'opacity-100'">
            <i data-lucide="crop" class="size-4 text-white/70"></i>
            Drag the corners to crop
          </p>
        </div>

        <div class="relative flex-1 min-h-0 mx-3 mb-3 sm:mx-6 sm:mb-5">
          <div x-ref="stage" class="absolute inset-0 doubt-cropper" :class="interacting && 'is-interacting'">
            <img x-ref="image" alt="Image to crop" class="block max-w-full opacity-0">
          </div>

          <div x-show="!ready && !failed" class="absolute inset-0 flex items-center justify-center">
            <span class="size-8 rounded-full border-[3px] border-white/20 border-t-white animate-spin" role="status"
              aria-label="Loading image"></span>
          </div>

          <div x-cloak x-show="failed" class="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
            <span class="inline-flex items-center justify-center size-12 rounded-full bg-white/10 text-white/80">
              <i data-lucide="image-off" class="size-6"></i>
            </span>
            <p class="mt-4 text-base font-medium text-white">This image couldn't be opened</p>
            <p class="mt-1 text-sm text-white/60">Try a JPG or PNG photo.</p>
            <button type="button" @click="retake()"
              class="mt-5 inline-flex items-center gap-2 rounded-lg bg-white px-4 py-2.5 text-sm font-medium text-gray-900 hover:bg-gray-100">
              <span x-text="source === 'camera' ? 'Take another photo' : 'Choose another image'"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div x-show="mode === 'crop'"
        class="shrink-0 flex flex-col gap-3 px-4 pt-2 pb-[max(1rem,env(safe-area-inset-bottom))] sm:flex-row sm:items-center sm:justify-between sm:gap-4 sm:px-5 sm:py-4 sm:border-t sm:border-gray-200 sm:dark:border-neutral-700">

        <div class="flex items-center justify-around sm:justify-start sm:gap-1" :class="failed && 'invisible'">
          <button type="button" @click="retake()" class="doubt-crop-tool">
            <i x-show="source === 'camera'" data-lucide="camera" class="size-5 sm:size-4"></i>
            <i x-show="source !== 'camera'" data-lucide="images" class="size-5 sm:size-4"></i>
            <span x-text="source === 'camera' ? 'Retake' : 'Change'"></span>
          </button>
          <span class="hidden sm:block w-px h-5 mx-2 bg-gray-200 dark:bg-neutral-700" aria-hidden="true"></span>
          <button type="button" @click="rotate()" :disabled="!ready" class="doubt-crop-tool">
            <i data-lucide="rotate-cw" class="size-5 sm:size-4"></i>
            <span>Rotate</span>
          </button>
          <button type="button" @click="zoom(-0.15)" :disabled="!ready" aria-label="Zoom out" title="Zoom out"
            class="doubt-crop-tool !hidden sm:!inline-flex">
            <i data-lucide="zoom-out" class="size-4"></i>
          </button>
          <button type="button" @click="zoom(0.15)" :disabled="!ready" aria-label="Zoom in" title="Zoom in"
            class="doubt-crop-tool !hidden sm:!inline-flex">
            <i data-lucide="zoom-in" class="size-4"></i>
          </button>
          <button type="button" @click="reset()" :disabled="!changed" class="doubt-crop-tool">
            <i data-lucide="undo-2" class="size-5 sm:size-4"></i>
            <span>Reset</span>
          </button>
        </div>

        <div class="flex items-center gap-3">
          <button type="button" @click="useFullImage()" :disabled="!ready || processing"
            class="flex-1 sm:flex-none inline-flex items-center justify-center h-12 sm:h-10 px-4 rounded-lg text-sm font-medium whitespace-nowrap bg-white/10 text-white hover:bg-white/15 sm:bg-white sm:text-gray-800 sm:border sm:border-gray-300 sm:shadow-sm sm:hover:bg-gray-50 sm:dark:bg-neutral-800 sm:dark:border-neutral-600 sm:dark:text-neutral-200 sm:dark:hover:bg-neutral-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-none focus-visible:ring-2 focus-visible:ring-[#337ab7]">
            Use full image
          </button>
          <button type="button" @click="crop()" :disabled="!ready || processing"
            class="flex-1 sm:flex-none inline-flex items-center justify-center gap-2 h-12 sm:h-10 px-5 rounded-lg text-sm font-semibold text-white bg-[#337ab7] hover:bg-[#296292] shadow-sm dark:bg-emerald-600 dark:hover:bg-emerald-700 disabled:opacity-60 disabled:pointer-events-none focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[#337ab7] focus-visible:ring-offset-black sm:focus-visible:ring-offset-white">
            <span x-show="processing" class="size-4 rounded-full border-2 border-white/40 border-t-white animate-spin"
              aria-hidden="true"></span>
            <i x-show="!processing" data-lucide="crop" class="size-4"></i>
            <span class="whitespace-nowrap" x-text="processing ? 'Attaching…' : 'Crop & attach'"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <input x-ref="cameraInput" type="file" accept="image/*" capture="environment" class="hidden"
    @change="pick($event, 'camera')">
  <input x-ref="fileInput" type="file" accept="image/*" multiple class="hidden" @change="pick($event, 'files')">
</div>
