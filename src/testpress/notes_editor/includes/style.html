<style>
  /* Notes editor prototype. Structural + ProseMirror styles live here; colours come from the
     Testpress primary scale (--color-primary-*) set in layout/base.html. */
  /* On :root, not .notes-app: the slash menu is appended to <body> and must see these too. */
  :root { --p600: rgb(var(--color-primary-600)); --p700: rgb(var(--color-primary-700)); --p50: rgb(var(--color-primary-50)); --p100: rgb(var(--color-primary-100)); }
  .notes-app {
    display: flex; height: calc(100dvh - 3.75rem); background: #fff; position: relative; color: #111827; }
  .dark .notes-app { background: #171717; color: #e5e7eb; }
  .notes-app [hidden], .notes-app[hidden] { display: none !important; }

  /* ---- list pane ---- */
  .list-pane { width: 21rem; flex: none; display: flex; flex-direction: column; border-inline-end: 1px solid #e5e7eb; background: #fafafa; min-height: 0; }
  .dark .list-pane { background: #1c1c1c; border-color: #2e2e2e; }
  .list-pane__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px 16px; }
  .btn-new { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; background: var(--p600); color: #fff; font-size: 14px; font-weight: 500; }
  .btn-new:hover { background: var(--p700); }
  .btn-new:focus-visible, .note-row:focus-visible, .tray-chip:focus-visible { outline: 2px solid var(--p600); outline-offset: 2px; }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
  .search:focus-within { border-color: var(--p600); box-shadow: 0 0 0 3px rgb(var(--color-primary-500) / .18); }
  .search__input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-size: 14px; box-shadow: none !important; }
  .search__input::-webkit-search-cancel-button { display: none; }
  .search__kbd { font: 500 11px/1 system-ui; color: #9ca3af; border: 1px solid #e5e7eb; border-radius: 4px; padding: 2px 5px; }
  .filters { display: flex; align-items: center; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  .filter-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; font-size: 13px; color: #4b5563; max-width: 11rem; }
  .filter-btn__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filter-btn:hover, .filter-btn[aria-expanded="true"] { border-color: #cbd0d6; background: #f9fafb; }
  .filter-btn.is-set { background: var(--p50); border-color: var(--p600); color: var(--p700); font-weight: 500; }
  .filter-btn:focus-visible, .filter-clear:focus-visible { outline: 2px solid var(--p600); outline-offset: 2px; }
  .filter-clear { font-size: 12px; color: #6b7280; text-decoration: underline; padding: 0 4px; }
  .list-empty__btn { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--p700); text-decoration: underline; }
  .lib-pop { width: 18rem; }
  .lib-hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .lib-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .lib-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-count { font-size: 12px; color: #9ca3af; }
  .lib-check { width: 16px; height: 16px; border: 1px solid #cbd0d6; border-radius: 4px; display: grid; place-items: center; font-size: 11px; color: #fff; flex: none; }
  .lib-check.is-on { background: var(--p600); border-color: var(--p600); }
  /* Rows have a fixed height and the rename/delete buttons overlay the right edge (no layout shift on hover) */
  .lib-pop .lib-row:not(.lib-confirm) { position: relative; height: 36px; box-sizing: border-box; padding-top: 0; padding-bottom: 0; }
  .lib-actions { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: inline-flex; gap: 2px; padding-left: 18px; opacity: 0; pointer-events: none; background: linear-gradient(to right, transparent, var(--p100) 14px); border-radius: 0 6px 6px 0; }
  .lib-row:hover .lib-actions, .lib-row.is-active .lib-actions { opacity: 1; pointer-events: auto; }
  .lib-row:hover:has(.lib-actions) .lib-count, .lib-row.is-active:has(.lib-actions) .lib-count, .lib-row:hover:has(.lib-actions) > svg, .lib-row.is-active:has(.lib-actions) > svg { visibility: hidden; }
  .lib-actions button { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 5px; color: #6b7280; }
  .lib-actions button:hover { background: rgba(0,0,0,.07); color: #111827; }
  .lib-rename { width: 100%; height: 28px; border: 1px solid var(--p600); border-radius: 6px; padding: 0 8px; font-size: 14px; outline: none; box-shadow: none !important; }
  /* inline delete confirmation: a small card that replaces the row */
  .meta-pop__list { scroll-padding-bottom: 8px; }
  .lib-confirm { margin: 3px 0; padding: 10px 12px 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; }
  .lib-confirm__text { display: flex; flex-direction: column; gap: 2px; }
  .lib-confirm__text strong { font-size: 13.5px; font-weight: 600; color: #7f1d1d; overflow-wrap: anywhere; }
  .lib-confirm__text span { font-size: 12.5px; line-height: 1.4; color: #b45454; }
  .lib-confirm__btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .lib-yes, .lib-no { height: 30px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 600; line-height: 1; }
  .lib-yes { background: #dc2626; color: #fff; }
  .lib-yes:hover { background: #b91c1c; }
  .lib-no { background: #fff; color: #374151; border: 1px solid #e5e7eb; }
  .lib-no:hover { background: #f9fafb; }
  .dark .lib-confirm { background: rgba(220,38,38,.12); border-color: rgba(248,113,113,.35); }
  .dark .lib-confirm__text strong { color: #fecaca; } .dark .lib-confirm__text span { color: #fca5a5; }
  .dark .lib-no { background: #333; border-color: #444; color: #e5e7eb; }
  .lib-yes:focus-visible, .lib-no:focus-visible { outline: 2px solid var(--p600); outline-offset: 2px; }
  .list-pane__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
  .list-pane__foot { display: flex; align-items: center; gap: 6px; padding: 10px 16px; font-size: 12px; color: #9ca3af; border-top: 1px solid #eee; }
  .list-group { padding: 14px 10px 4px; font-size: 12px; font-weight: 500; color: #9ca3af; }
  .note-row { display: block; width: 100%; text-align: start; padding: 9px 10px; border-radius: 8px; margin-bottom: 1px; }
  .note-row:hover { background: #f1f3f5; }
  .note-row.is-active { background: var(--p50); }
  .dark .note-row:hover { background: #262626; } .dark .note-row.is-active { background: rgb(var(--color-primary-500) / .15); }
  .note-row__top { display: flex; align-items: baseline; gap: 8px; }
  .note-row__title { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-row__title.is-derived { font-weight: 500; }
  .note-row__time { font-size: 12px; color: #9ca3af; flex: none; }
  .note-row__sub { display: block; font-size: 13px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .note-row mark { background: #fde68a; color: inherit; border-radius: 2px; }
  .row-warn { color: #d97706; display: inline-flex; }
  .list-empty { padding: 28px 16px; font-size: 14px; text-align: center; }

  /* ---- editor pane ---- */
  .editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .editor-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .editor-empty { flex: 1; display: grid; place-items: center; }
  .editor-top { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; flex: none; }
  .editor-top__back, .editor-top__new { display: none; }
  .save-status { display: inline-flex; align-items: center; font-size: 13px; color: #9ca3af; min-height: 20px; }
  .status-dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; margin-inline-end: 6px; }
  .save-status[data-state="saving"] .status-dot, .save-status[data-state="still"] .status-dot { animation: pulse 1s ease-in-out infinite; }
  .save-status[data-state="error"] { color: #b45309; font-weight: 500; }
  .save-status[data-state="idle"] .status-dot { background: var(--p600); }
  @keyframes pulse { 50% { opacity: .25 } }
  .editor-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 35vh; }
  .editor-scroll.is-scroll-locked { overflow-y: hidden; padding-right: var(--sbw, 0px); }
  .editor-column { max-width: 46rem; margin: 0 auto; padding: 24px 40px 0; }
  .save-strip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #fffbeb; color: #92400e; font-size: 13px; border-top: 1px solid #fde68a; }
  .save-strip__retry { margin-inline-start: auto; font-weight: 600; text-decoration: underline; }
  .toast { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; font-size: 13px; padding: 10px 14px; border-radius: 8px; max-width: 90%; z-index: 30; }

  /* ---- ProseMirror content ---- */
  .note-prose { outline: none; font-size: 17px; line-height: 1.65; color: #1f2937; caret-color: var(--p600); word-break: break-word; }
  .dark .note-prose { color: #e5e7eb; }
  .note-prose > * + * { margin-top: .6em; }
  .note-prose h1[data-title] { font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin: 0 0 .25em; color: #111827; }
  .dark .note-prose h1[data-title] { color: #fff; }
  .note-prose h1:not([data-title]) { font-size: 27px; line-height: 1.25; font-weight: 700; margin-top: 1.2em; letter-spacing: -.015em; }
  .note-prose h2 { font-size: 22px; line-height: 1.3; font-weight: 700; margin-top: 1.3em; letter-spacing: -.01em; }
  .note-prose h3 { font-size: 18px; line-height: 1.35; font-weight: 600; margin-top: 1.1em; }
  .note-prose p.is-editor-empty:first-child::before, .note-prose .is-empty::before { content: attr(data-placeholder); float: left; height: 0; pointer-events: none; color: #c0c5cc; }
  .note-prose ul { list-style: disc; padding-inline-start: 1.4em; }
  .note-prose ol { list-style: decimal; padding-inline-start: 1.5em; }
  .note-prose li > p { margin: 0; }
  .note-prose li + li { margin-top: .2em; }
  .note-prose li::marker { color: #9ca3af; }
  .note-prose ul[data-type="taskList"] { list-style: none; padding: 0; }
  .note-prose ul[data-type="taskList"] li { display: flex; align-items: flex-start; gap: 10px; }
  /* label is exactly one text line high, so the box centres on the first line and the row adds no extra height */
  .note-prose ul[data-type="taskList"] li > label { flex: none; display: flex; align-items: center; height: 1.65em; margin: 0; user-select: none; }
  .note-prose ul[data-type="taskList"] li > label input { width: 18px; height: 18px; border-radius: 5px; cursor: pointer; margin: 0; color: var(--p600); flex: none; }
  .note-prose ul[data-type="taskList"] li > div { flex: 1; min-width: 0; }
  .note-prose ul[data-type="taskList"] li[data-checked="true"] > div { color: #9ca3af; text-decoration: line-through; }
  .note-prose ul[data-type="taskList"] ul[data-type="taskList"] { margin-top: .2em; }
  .note-prose blockquote { border-inline-start: 3px solid var(--p600); padding-inline-start: 16px; color: #4b5563; }
  .note-prose hr { border: 0; border-top: 1px solid #d1d5db; margin: 1.4em 0; }
  .note-prose hr.ProseMirror-selectednode { border-top-color: var(--p600); }
  .note-prose code { font: 500 .88em ui-monospace, SFMono-Regular, Menlo, monospace; background: #f3f4f6; padding: .1em .35em; border-radius: 5px; }
  .dark .note-prose code { background: #2a2a2a; }
  .note-prose pre { background: #0f1729; color: #e5e7eb; border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.55; }
  .note-prose pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  .note-prose mark { background: #fef3c7; color: inherit; padding: .05em .1em; border-radius: 3px; }
  .note-prose a { color: var(--p700); text-decoration: underline; text-underline-offset: 2px; cursor: text; }
  .note-prose ::selection { background: rgb(var(--color-primary-500) / .25); }
  .note-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; color: #9ca3af; margin: 0 0 1.4em; font-family: inherit; line-height: 1.4; user-select: none; min-height: 24px; }
  .note-meta button { font: inherit; color: inherit; cursor: pointer; border-radius: 6px; }
  .note-meta__folder, .note-meta__add, .note-meta__hint { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; margin-inline-start: -6px; }
  .note-meta__folder:hover, .note-meta__add:hover, .note-meta__hint:hover, .note-meta__folder:focus-visible, .note-meta__add:focus-visible, .note-meta__hint:focus-visible { background: #f3f4f6; color: #374151; outline: none; }
  .note-meta__folder.is-unset, .note-meta__add { opacity: .7; }
  .note-meta__tag { display: inline-flex; align-items: center; gap: 2px; padding: 1px 4px 1px 7px; border-radius: 6px; background: #f3f4f6; color: #4b5563; }
  .note-meta__tag button { width: 16px; height: 16px; line-height: 14px; text-align: center; border-radius: 4px; color: #9ca3af; opacity: 0; font-size: 14px; }
  .note-meta__tag:hover button, .note-meta__tag:focus-within button, .meta-pop .note-meta__tag button { opacity: 1; }
  .note-meta__tag button:hover { background: #e5e7eb; color: #374151; }
  .note-meta--empty { opacity: 0; transition: opacity .15s; }
  .note-meta--empty:hover, .note-meta--empty:focus-within, .note-prose:focus-within .note-meta--empty { opacity: 1; }
  .note-meta__dot { color: #c0c5cc; }
  /* folder / tag popover */
  .meta-pop { position: fixed; z-index: 95; width: 17rem; max-width: calc(100vw - 16px); background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 12px 32px rgba(17,24,39,.16); padding: 8px; }
  .dark .meta-pop { background: #262626; border-color: #3a3a3a; }
  .meta-pop[hidden] { display: none; }
  .meta-pop__head { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #9ca3af; padding: 2px 4px 6px; }
  .meta-pop__chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 2px 6px; font-size: 13px; }
  .meta-pop__input { width: 100%; height: 34px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 10px; font-size: 14px; outline: none; box-shadow: none !important; }
  .meta-pop__input:focus { border-color: var(--p600); box-shadow: 0 0 0 3px rgb(var(--color-primary-500) / .18) !important; }
  .meta-pop__list { max-height: 14rem; overflow-y: auto; margin-top: 6px; overscroll-behavior: contain; }
  .meta-opt { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 8px; border-radius: 6px; font-size: 14px; color: #374151; text-align: start; }
  .meta-opt.is-active, .meta-opt:hover { background: var(--p100); color: #111827; }
  .meta-opt.is-create { color: var(--p700); font-weight: 500; }
  .meta-pop__empty { padding: 10px 8px; font-size: 13px; color: #6b7280; }
  .meta-pop__foot { margin-top: 6px; padding: 6px 4px 0; border-top: 1px solid #f0f1f3; font-size: 12px; color: #9ca3af; }


  /* ---- callout, toggle, table ---- */
  .note-prose .callout { position: relative; background: var(--p50); border: 1px solid var(--p100); border-radius: 10px; padding: 10px 14px 10px 44px; }
  .note-prose .callout::before { content: '💡'; position: absolute; left: 14px; top: 10px; line-height: 1.65; }
  .note-prose .callout > * + * { margin-top: .4em; }
  .dark .note-prose .callout { background: rgb(var(--color-primary-500) / .12); border-color: rgb(var(--color-primary-500) / .25); }
  .note-prose .toggle { display: flex; gap: 6px; align-items: flex-start; }
  .note-prose .toggle > button { flex: none; width: 24px; height: 28px; display: grid; place-items: center; color: #6b7280; border-radius: 6px; }
  .note-prose .toggle > button:hover { background: #f3f4f6; }
  .note-prose .toggle > button::before { content: '▸'; font-size: 15px; line-height: 1; transition: transform .12s; }
  .note-prose .toggle.is-open > button::before { transform: rotate(90deg); }
  .note-prose .toggle > div { flex: 1; min-width: 0; }
  .note-prose .toggle summary { display: block; list-style: none; font-weight: 600; cursor: text; }
  .note-prose .toggle summary::marker, .note-prose .toggle summary::-webkit-details-marker { display: none; content: ''; }
  .note-prose .toggle [data-type="detailsContent"] { padding-inline-start: 4px; margin-top: .3em; }
  .note-prose .toggle [data-type="detailsContent"] > * + * { margin-top: .5em; }
  /* the wrapper owns the scrollbar: arrow cursor there (native scrollbar behaviour), I-beam inside the cells */
  .note-prose .tableWrapper { overflow-x: auto; margin: .8em 0; cursor: default; }
  .note-prose .tableWrapper th, .note-prose .tableWrapper td { cursor: text; }
  /* auto layout: wide tables keep readable columns and scroll sideways inside .tableWrapper */
  .note-prose table { border-collapse: collapse; width: 100%; table-layout: auto; font-size: 15px; line-height: 1.5; }
  .note-prose th, .note-prose td { border: 1px solid #d1d5db; padding: 7px 10px; vertical-align: top; text-align: start; position: relative; min-width: 7rem; }
  .note-prose th { background: #f3f4f6; font-weight: 600; }
  .dark .note-prose th { background: #2a2a2a; } .dark .note-prose th, .dark .note-prose td { border-color: #3a3a3a; }
  .note-prose td > p, .note-prose th > p { margin: 0; }
  .note-prose .selectedCell::after { content: ''; position: absolute; inset: 0; background: rgb(var(--color-primary-500) / .18); pointer-events: none; }
  .note-prose .is-active-cell { outline: 2px solid var(--p600); outline-offset: -2px; }
  /* in-place table controls (positioned by table-ui.js) */
  .tbl-grip, .tbl-add, .tbl-menu { position: fixed; z-index: 45; }
  .tbl-grip { display: grid; place-items: center; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; color: #9ca3af; cursor: pointer; }
  .tbl-grip:hover, .tbl-grip[aria-expanded="true"], .tbl-grip:focus-visible { background: var(--p600); border-color: var(--p600); color: #fff; outline: none; }
  .tbl-add { display: grid; place-items: center; background: #f9fafb; border: 1px solid #eceef1; border-radius: 4px; color: #b4bac3; cursor: pointer; padding: 0; opacity: 0; pointer-events: none; transition: opacity .12s; }
  .tbl-add.is-near, .tbl-add:focus-visible { opacity: 1; pointer-events: auto; }
  .tbl-add:hover, .tbl-add:focus-visible { background: var(--p50); border-color: var(--p600); color: var(--p700); outline: none; }
  .tbl-menu { min-width: 12.5rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 10px 30px rgba(17,24,39,.14); padding: 4px; z-index: 92; }
  .dark .tbl-menu { background: #262626; border-color: #3a3a3a; }
  .tbl-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 6px; font-size: 14px; color: #374151; text-align: start; }
  .dark .tbl-item { color: #e5e7eb; }
  .tbl-item:hover, .tbl-item:focus-visible { background: var(--p50); outline: none; }
  .tbl-item.is-danger { color: #b91c1c; }
  .tbl-item__hint { margin-inline-start: auto; font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .02em; color: #374151; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 5px; padding: 3px 7px; white-space: nowrap; }
  .tbl-item { gap: 10px; }
  .tbl-grip { touch-action: none; cursor: grab; }
  .tbl-grip.is-dragging { cursor: grabbing; background: var(--p600); border-color: var(--p600); color: #fff; }
  body.tbl-dragging, body.tbl-dragging * { cursor: grabbing !important; user-select: none !important; }
  .tbl-drop { position: fixed; z-index: 46; background: var(--p600); border-radius: 3px; pointer-events: none; box-shadow: 0 0 0 1px #fff; }
  .tbl-drop[hidden] { display: none; }
  .tbl-ghost { position: fixed; z-index: 47; pointer-events: none; opacity: .88; background: #fff; border: 1px solid var(--p600); border-radius: 4px; box-shadow: 0 12px 28px rgba(17,24,39,.22); overflow: hidden; transform: rotate(-1.2deg); }
  .tbl-ghost__row { display: flex; }
  .tbl-ghost__cell { box-sizing: border-box; flex: none; padding: 7px 10px; font-size: 15px; line-height: 1.5; border: 1px solid #e5e7eb; background: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #1f2937; }
  .tbl-ghost__cell.is-head { background: #f3f4f6; font-weight: 600; }
  .tbl-menu { min-width: 15rem; }
  .dark .tbl-item__hint { color: #e5e7eb; background: #333; border-color: #444; }
  .tbl-grip[hidden], .tbl-add[hidden], .tbl-menu[hidden] { display: none !important; }

  /* ---- slash menu ---- */
  .slash-menu { position: fixed; z-index: 90; width: 15rem; max-height: min(18rem, 50vh); overflow-y: auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 10px 30px rgba(17,24,39,.14); padding: 4px; }
  .dark .slash-menu { background: #262626; border-color: #3a3a3a; }
  .slash-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 6px; font-size: 14px; text-align: start; color: #374151; }
