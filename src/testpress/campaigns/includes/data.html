{# Mock data for the Campaigns pages comes from src/_data/campaigns.json (prototype only). #}
<script>
  const CMP = {{ campaigns | dump | safe }};
  const CMP_INSTITUTE = CMP.institute;
  const CMP_ALL_STUDENTS = CMP.allStudents;
  const CMP_PRODUCTS = CMP.products;
  const CMP_FIELDS = CMP.fields;
  const CMP_TEMPLATES = CMP.templates;
  const CMP_CAMPAIGNS = CMP.campaigns;
  const CMP_CONDITION_TYPES = CMP.conditionTypes;

  // What a campaign is about, in one line (list and report)
  const cmpPurpose = (c) => {
    const d = c.dest;
    if (!d) return 'Not set what it’s about';
    if (d.type === 'product') return 'Promotes ' + d.label;
    if (d.type === 'item') return CMP.kinds[d.kind].label + ' · ' + d.label;
    return ({ store: 'Promotes the store', home: 'Announcement', link: 'Opens ' + d.label })[d.type];
  };
  const cmpNum = (n) => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('en-IN');
  const cmpMoney = (n) => (n === null || n === undefined) ? '—' : '₹' + Number(n).toLocaleString('en-IN');
  const cmpPct = (a, b) => (!b) ? '0%' : (Math.round((a / b) * 1000) / 10) + '%';
  const cmpState = () => new URLSearchParams(window.location.search).get('state');
  const cmpParam = (k) => new URLSearchParams(window.location.search).get(k);
  const cmpCopy = (o) => JSON.parse(JSON.stringify(o));
  const cmpToast = (title, description = '', variant = 'success') =>
    window.dispatchEvent(new CustomEvent('toast', { detail: { title, description, variant } }));
  const cmpIcons = (root) => setTimeout(() => window.lucide && lucide.createIcons(root ? { root } : undefined), 0);
</script>
