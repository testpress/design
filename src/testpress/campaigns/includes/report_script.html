<script>
  window.CMP_PROTO = [
    { name: 'Results', states: [['product', 'Opens a product (with sales)'], ['store', 'Opens the store (no sales)'], ['no-clicks', 'No clicks yet'], ['partial', 'Some emails failed']] },
    { name: 'Other', states: [['sending', 'Still sending'], ['legacy', 'Sent before Campaigns'], ['loading', 'Loading']] },
  ];
  window.CMP_PROTO_DEFAULT = 'product';
  const CMP_REPORT_STATE_ID = { product: 1, store: 2, 'no-clicks': 3, partial: 4, legacy: 5, sending: 6, loading: 1 };

  document.addEventListener('alpine:init', () => {
    Alpine.data('campaignReport', () => {
      const s = cmpState();
      const id = Number(cmpParam('id')) || CMP_REPORT_STATE_ID[s] || 1;
      const c = cmpCopy(CMP_CAMPAIGNS.find(x => x.id === id) || CMP_CAMPAIGNS[0]);
      if (cmpParam('name')) c.name = cmpParam('name'); // just sent from the editor
      return {
        c,
        loading: true,
        init() {
          if (s === 'loading') return;
          setTimeout(() => { this.loading = false; cmpIcons(); }, 500);
          if (c.status === 'sending') this.tick();
        },
        // Prototype: numbers grow while it sends, then it finishes
        tick() {
          const t = setInterval(() => {
            const p = this.c.push, e = this.c.email;
            if (p.sent < 2550) { p.sent += 365; p.unique += 30; p.clicks += 34; this.c.unique += 30; this.c.clicks += 34; }
            else if (e.sent < 3060) { e.sent += 765; }
            else { clearInterval(t); p.skipped = 600; e.skipped = 90; this.c.status = 'sent'; this.c.sentAt = 'Today, 11:02 AM'; cmpToast('Campaign sent', 'All messages went out.'); }
            this.c.received = Math.max(p.sent, e.sent);
          }, 1500);
        },
        get channelText() { return (this.c.channels.length === 2 ? 'Push and email' : this.c.channels[0] === 'push' ? 'Push' : 'Email'); },
        get isProduct() { return this.c.dest && this.c.dest.type === 'product'; },
        get both() { return (this.c.push && this.c.email) ? (this.c.push.unique + this.c.email.unique - this.c.unique) : 0; },
        rate(ch) { return ch && ch.sent ? cmpPct(ch.unique, ch.sent) : '—'; },
        channelRows() {
          return [['push', 'Push', 'smartphone', 'No app installed'], ['email', 'Email', 'mail', 'No email address']]
            .filter(r => this.c.channels.includes(r[0]) && this.c[r[0]]).map(r => ({ key: r[0], label: r[1], icon: r[2], skipReason: r[3], d: this.c[r[0]] }));
        },
        duplicate() {
          cmpToast('Copy saved as a draft', 'Opening it now…');
          setTimeout(() => { window.location.href = '{{ "/testpress/campaigns/new/" | url }}?id=8'; }, 900);
        },
      };
    });
  });
</script>
