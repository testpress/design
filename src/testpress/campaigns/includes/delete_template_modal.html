{% from "../../../ui-system/components/modal.html" import modal %}
<div @modal-confirmed-delete-template.window="confirmDelete()">
  {% call modal(id="delete-template", title="Delete this template?", size="sm", variant="danger", confirm_text="Delete template") %}
    <p>“<span class="font-medium text-gray-800 dark:text-neutral-200" x-text="toDelete && toDelete.name"></span>” will be removed. Campaigns that used it keep their words.</p>
  {% endcall %}
</div>
