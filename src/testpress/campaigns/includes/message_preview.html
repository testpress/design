{# The push notification and the email, as students see them. Used on a draft's review and on a sent campaign. #}
{% from "../../../ui-system/components/card.html" import card %}
{% call card(bordered=false, shadow=true, padding="p-5") %}
  <div class="flex flex-col gap-6">
    <template x-if="c.content && c.content.push">
      <div>
        <p class="mb-2 inline-flex items-center gap-x-2 text-xs font-medium text-gray-500 dark:text-neutral-400"><i data-lucide="smartphone" class="size-3.5"></i>Push notification</p>
        <div class="max-w-sm rounded-2xl bg-gray-100 p-3 dark:bg-neutral-900">
          <div class="rounded-xl bg-white p-3 shadow-sm dark:bg-neutral-800">
            <div class="flex items-center gap-x-2 text-[11px] text-gray-500 dark:text-neutral-400">
              <span class="size-4 inline-flex justify-center items-center rounded bg-primary-600 text-[9px] font-bold text-white">B</span>
              <span class="font-medium">{{ campaigns.institute }}</span><span>· now</span>
            </div>
            <p class="mt-1.5 text-[13px] font-semibold text-gray-900 dark:text-neutral-100" x-text="c.content.push.title"></p>
            <p class="text-[13px] text-gray-600 dark:text-neutral-300" x-text="c.content.push.message"></p>
            <img x-show="c.content.push.image" :src="c.content.push.imageUrl || 'https://images.unsplash.com/photo-1606326608606-aa0b62935f2b?auto=format&fit=crop&w=600&h=300&q=70'" alt="" class="mt-2 w-full aspect-[2/1] object-cover rounded-lg">
          </div>
        </div>
      </div>
    </template>
    <template x-if="c.content && c.content.email">
      <div>
        <p class="mb-2 inline-flex items-center gap-x-2 text-xs font-medium text-gray-500 dark:text-neutral-400"><i data-lucide="mail" class="size-3.5"></i>Email</p>
        <div class="rounded-xl ring-1 ring-gray-200 dark:ring-neutral-700 overflow-hidden">
          <div class="px-4 py-3 bg-gray-50 dark:bg-neutral-900/60">
            <p class="text-sm font-semibold" :class="c.content.email.subject ? 'text-gray-800 dark:text-neutral-100' : 'text-orange-600 dark:text-orange-400'" x-text="c.content.email.subject || 'No subject yet'"></p>
            <p class="mt-0.5 text-xs text-gray-500 dark:text-neutral-400">{{ campaigns.institute }} &lt;no-reply@brilliantpala.org&gt;</p>
          </div>
          <div class="px-4 py-4 text-sm text-gray-700 dark:text-neutral-300 [&_a]:font-medium [&_a]:text-primary-600 [&_a]:underline [&_p+p]:mt-2">
            <div x-html="c.content.email.body"></div>
            <div x-show="c.content.email.button" class="mt-5">
              <span class="inline-flex py-2.5 px-5 rounded-lg bg-primary-600 text-sm font-medium text-white" x-text="c.content.email.button"></span>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>
{% endcall %}
