{# Numbered step heading; the number turns into a check when the step has nothing left.
   Set `step_no`, `step_title`, `step_key` before including. Optional `step_action` (HTML) on the right. #}
<div class="flex items-center justify-between gap-x-3">
  <div class="flex items-center gap-x-3">
    <span class="shrink-0 size-7 inline-flex justify-center items-center rounded-full text-sm font-medium transition-colors"
          :class="done('{{ step_key }}') ? 'bg-primary-600 text-white' : 'bg-gray-100 text-gray-600 dark:bg-neutral-700 dark:text-neutral-300'">
      <span x-show="!done('{{ step_key }}')">{{ step_no }}</span>
      <svg x-show="done('{{ step_key }}')" x-cloak class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    <h2 class="text-lg font-semibold text-gray-800 dark:text-neutral-100">{{ step_title }}</h2>
  </div>
  {% if step_action %}{{ step_action | safe }}{% endif %}
</div>
