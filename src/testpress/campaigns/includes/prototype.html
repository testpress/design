{# Prototype only: barely visible state switcher, bottom right (same as the AI Chat admin page).
   The page sets `window.CMP_PROTO = [{ name, states: [[key, label], …] }]`; picking a state reloads with ?state=key. #}
<div x-data="{ open: false, groups: window.CMP_PROTO || [], state: cmpState() || (window.CMP_PROTO_DEFAULT || ''),
               pick(key) { const u = new URL(window.location.href); u.searchParams.set('state', key); window.location.href = u.toString(); } }"
     class="fixed bottom-20 end-0.5 md:end-2 z-[60]" @click.outside="open = false" @keydown.escape="open = false">
  <div x-show="open" x-transition.opacity x-cloak
       class="absolute bottom-full end-0 mb-2 w-64 max-h-[70vh] overflow-y-auto p-1 bg-white border border-gray-200 rounded-xl shadow-lg dark:bg-neutral-900 dark:border-neutral-700">
    <p class="px-2 pt-1 pb-1.5 text-[11px] font-medium uppercase tracking-wide text-gray-400">Prototype state</p>
    <template x-for="g in groups" :key="g.name">
      <div class="pb-1">
        <p class="px-2 pt-2 pb-1 text-xs font-medium text-gray-500 dark:text-neutral-400" x-text="g.name"></p>
        <template x-for="s in g.states" :key="s[0]">
          <button type="button" @click="pick(s[0])"
                  class="w-full flex items-center justify-between gap-x-3 py-1.5 px-2 rounded-lg text-[13px] text-start hover:bg-gray-100 dark:hover:bg-neutral-800"
                  :class="state === s[0] ? 'text-primary-700 font-medium dark:text-primary-400' : 'text-gray-800 dark:text-neutral-200'">
            <span x-text="s[1]"></span>
            <svg x-show="state === s[0]" class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
        </template>
      </div>
    </template>
  </div>
  <button type="button" @click="open = !open" :aria-expanded="open" aria-label="Prototype states"
          class="size-6 md:size-8 inline-flex justify-center items-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-sm opacity-60 hover:opacity-100 focus:opacity-100 focus:outline-none transition dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400">
    <svg class="size-3.5 md:size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
  </button>
</div>
