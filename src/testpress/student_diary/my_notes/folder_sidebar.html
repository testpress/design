<!-- Left Side: Folders Sidebar -->
<div class="lg:col-span-1 lg:sticky lg:top-[3.75rem] pt-5 lg:self-start lg:max-h-[calc(100vh-4rem)] z-10 bg-gray-50 dark:bg-neutral-900">
  <div class="flex flex-col">

    <!-- Mobile toggle button -->
    <div class="lg:hidden">
      <button @click="mobileNotesFolderOpen = true" type="button" class="py-2 px-3 w-full inline-flex justify-between items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-200 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700">
        <span class="flex items-center gap-x-2">
          <svg class="shrink-0 size-4 text-yellow-500/80" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path></svg>
          <span x-show="selectedNoteFolder === 'all'">All Notes</span>
          <span x-show="selectedNoteFolder === 'uncategorized'" x-cloak>Uncategorized</span>
          <template x-for="folder in folders" :key="folder.id">
            <span x-show="selectedNoteFolder === folder.id" x-cloak x-text="folder.name"></span>
          </template>
        </span>
        <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <!-- Desktop Sidebar -->
    <aside class="hidden lg:flex lg:flex-col border border-gray-200 dark:border-neutral-700 rounded-xl bg-white dark:bg-neutral-800 overflow-hidden lg:max-h-[calc(100vh-4rem)]">
      <div class="shrink-0 px-4 py-3 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700">
        <h2 class="text-sm font-semibold text-gray-900 dark:text-neutral-200">Folders</h2>
        <button @click="$dispatch('open-modal-add-folder')" type="button" title="New folder" class="size-6 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg text-gray-500 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none dark:text-neutral-400 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus size-4"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
      </div>
      <nav aria-label="Directory" class="min-h-0 flex-1 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:bg-gray-300 [&::-webkit-scrollbar-thumb]:rounded-full dark:[&::-webkit-scrollbar-thumb]:bg-neutral-600 dark:hover:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
        <ul role="list" class="relative z-0 divide-y divide-gray-100 dark:divide-neutral-700">

          <!-- All Notes -->
          <li @click="selectedNoteFolder = 'all'" class="relative flex items-center space-x-3 px-4 py-3 cursor-pointer transition-colors duration-150" :class="selectedNoteFolder === 'all' ? 'bg-primary-50 dark:bg-primary-500/10' : 'hover:bg-gray-50 dark:hover:bg-neutral-700/50'">
            <div class="shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-primary-500">
                <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-gray-900 dark:text-neutral-200">All Notes</p>
            </div>
          </li>

          <!-- Uncategorized -->
          <li @click="selectedNoteFolder = 'uncategorized'" class="relative flex items-center space-x-3 px-4 py-3 cursor-pointer transition-colors duration-150" :class="selectedNoteFolder === 'uncategorized' ? 'bg-primary-50 dark:bg-primary-500/10' : 'hover:bg-gray-50 dark:hover:bg-neutral-700/50'">
            <div class="shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-gray-400">
                <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-gray-900 dark:text-neutral-200">Uncategorized</p>
            </div>
          </li>

          <!-- Dynamic Folders -->
          <template x-for="folder in folders" :key="folder.id">
            <li @click="selectedNoteFolder = folder.id" class="relative flex items-center space-x-3 px-4 py-3 cursor-pointer transition-colors duration-150" :class="selectedNoteFolder === folder.id ? 'bg-primary-50 dark:bg-primary-500/10' : 'hover:bg-gray-50 dark:hover:bg-neutral-700/50'">
              <div class="shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-yellow-500/80">
                  <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path>
                </svg>
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-medium text-gray-900 dark:text-neutral-200 line-clamp-1" x-text="folder.name"></p>
              </div>
              <!-- Folder Actions Dropdown -->
              <div class="hs-dropdown [--placement:bottom-right] relative inline-flex" @click.stop>
                <button :id="'hs-pro-fldmd-' + folder.id" type="button" class="size-7 inline-flex justify-center items-center text-gray-400 hover:bg-gray-100 rounded-full dark:text-neutral-500 dark:hover:bg-neutral-800 transition-colors focus:outline-none focus:bg-gray-100 dark:focus:bg-neutral-800">
                  <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="1"></circle>
                    <circle cx="12" cy="16" r="1"></circle>
                  </svg>
                </button>
                <div class="hs-dropdown-menu hs-dropdown-open:opacity-100 w-32 z-50 transition-[opacity,margin] duration opacity-0 bg-white border border-gray-200 rounded-xl shadow-lg hidden dark:bg-neutral-900 dark:border-neutral-800" role="menu" aria-orientation="vertical" :aria-labelledby="'hs-pro-fldmd-' + folder.id">
                  <div class="p-1 space-y-0.5">
                    <button @click="$dispatch('open-modal-rename-folder')" type="button" class="w-full flex items-center py-2 px-3 rounded-lg text-sm text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800">Rename</button>
                    <button @click="$dispatch('open-modal-delete-folder')" type="button" class="w-full flex items-center py-2 px-3 rounded-lg text-sm text-red-600 dark:text-red-500 hover:bg-gray-100 dark:hover:bg-neutral-800">Delete</button>
                  </div>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </nav>
    </aside>

  </div>
</div>
