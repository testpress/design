<!-- Mobile Folders Drawer -->
<div x-show="mobileNotesFolderOpen" x-cloak
     class="fixed inset-0 z-[100] lg:hidden" role="dialog" aria-modal="true">
  <div x-show="mobileNotesFolderOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200"
       x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="mobileNotesFolderOpen = false"
       class="fixed inset-0 bg-gray-900/50 transition-opacity"></div>

  <div x-show="mobileNotesFolderOpen" x-transition:enter="transform transition ease-in-out duration-300"
       x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transform transition ease-in-out duration-300" x-transition:leave-start="translate-x-0"
       x-transition:leave-end="-translate-x-full"
       class="fixed inset-y-0 start-0 flex max-w-xs w-full bg-white shadow-xl dark:bg-neutral-900">
    <div class="flex flex-col h-full w-full bg-white dark:bg-neutral-900 overflow-hidden">
      <div class="shrink-0 py-3 px-4 flex justify-between items-center border-b border-gray-200 dark:border-neutral-800">
        <h3 class="font-medium text-gray-800 dark:text-neutral-200">Folders</h3>
        <button @click="mobileNotesFolderOpen = false" type="button"
                class="p-1 inline-flex justify-center items-center rounded-full bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-800 text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-700 focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700">
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 min-h-0 flex flex-col overflow-y-auto">
        <ul role="list" class="divide-y divide-gray-100 dark:divide-neutral-800">
          <li @click="selectedNoteFolder = 'all'; mobileNotesFolderOpen = false" class="flex items-center px-4 py-4 cursor-pointer" :class="selectedNoteFolder === 'all' ? 'bg-primary-50 dark:bg-primary-500/10' : ''">
            <span class="text-sm font-medium" :class="selectedNoteFolder === 'all' ? 'text-primary-700 dark:text-primary-400' : 'text-gray-900 dark:text-neutral-200'">All Notes</span>
          </li>
          <li @click="selectedNoteFolder = 'uncategorized'; mobileNotesFolderOpen = false" class="flex items-center px-4 py-4 cursor-pointer" :class="selectedNoteFolder === 'uncategorized' ? 'bg-primary-50 dark:bg-primary-500/10' : ''">
            <span class="text-sm font-medium" :class="selectedNoteFolder === 'uncategorized' ? 'text-primary-700 dark:text-primary-400' : 'text-gray-900 dark:text-neutral-200'">Uncategorized</span>
          </li>
          <template x-for="folder in folders" :key="folder.id">
            <li @click="selectedNoteFolder = folder.id; mobileNotesFolderOpen = false" class="flex items-center px-4 py-4 cursor-pointer" :class="selectedNoteFolder === folder.id ? 'bg-primary-50 dark:bg-primary-500/10' : ''">
              <span class="text-sm font-medium" :class="selectedNoteFolder === folder.id ? 'text-primary-700 dark:text-primary-400' : 'text-gray-900 dark:text-neutral-200'" x-text="folder.name"></span>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </div>
</div>
