{% from "../../ui-system/components/modal.html" import modal %}

<div @modal-confirmed-delete-link-modal.window="deleteLink()">
{% call modal(
    id="delete-link-modal",
    title="Delete Link",
    variant="danger",
    confirm_text="Delete"
) %}
  <p class="text-sm text-gray-700 dark:text-neutral-300">
    Delete "<strong x-text="deletingLink?.name"></strong>"? This cannot be undone.
  </p>
{% endcall %}
</div>
