<div class="flex flex-col lg:flex-row gap-5 items-start mt-2">
  <!-- LEFT: Table Card -->
  <div 
    class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-2xs rounded-xl transition-all duration-300 w-full"
    :class="selectedTaskId ? 'lg:w-7/12' : 'lg:w-full'"
  >
    <!-- Table Container (Flows naturally with full page scroll) -->
    <div class="overflow-x-auto [&::-webkit-scrollbar]:h-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-neutral-700">
        <!-- Sticky Table Header -->
        <thead class="sticky top-0 z-10 bg-gray-50 dark:bg-neutral-800 border-b border-gray-200 dark:border-neutral-700 shadow-2xs">
          <tr>
            <th scope="col" class="px-5 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider">
              Task
            </th>
            <th scope="col" class="px-4 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider hidden sm:table-cell">
              Category
            </th>
            <th scope="col" class="px-4 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider">
              Status
            </th>
            <th scope="col" class="px-4 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider" :class="selectedTaskId ? 'hidden xl:table-cell' : 'hidden md:table-cell'">
              Started
            </th>
          </tr>
        </thead>
        <!-- End Sticky Table Header -->

        <tbody class="divide-y divide-gray-200 dark:divide-neutral-700">
          <!-- Empty State -->
          <template x-if="filteredTasks.length === 0">
            <tr>
              <td colspan="4" class="px-6 py-12 text-center text-sm text-gray-500 dark:text-neutral-400">
                <div class="flex flex-col items-center justify-center space-y-2">
                  <svg class="size-8 text-gray-400 dark:text-neutral-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                  </svg>
                  <p class="font-medium text-gray-800 dark:text-neutral-200">No background tasks found</p>
                  <p class="text-xs text-gray-500 dark:text-neutral-400">Try adjusting your category tabs or search query.</p>
                </div>
              </td>
            </tr>
          </template>

          <!-- Table Rows -->
          <template x-for="task in filteredTasks" :key="task.id">
            <tr 
              @click="selectedTaskId = task.id"
              class="cursor-pointer transition-colors duration-150 hover:bg-gray-50 dark:hover:bg-neutral-700/50"
              :class="selectedTaskId === task.id ? 'bg-blue-50/70 dark:bg-neutral-700/70' : ''"
            >
              <!-- Task Name & ID -->
              <td class="px-5 py-3.5 whitespace-nowrap">
                <div class="grow min-w-0 max-w-xs">
                  <span 
                    class="text-sm font-medium text-gray-800 dark:text-neutral-200 truncate block hover:text-blue-600 dark:hover:text-blue-400"
                    x-text="task.name"
                  ></span>
                  <span class="text-xs text-gray-500 dark:text-neutral-400 font-mono truncate block" x-text="task.id"></span>
                </div>
              </td>

              <!-- Category -->
              <td class="px-4 py-3.5 whitespace-nowrap hidden sm:table-cell text-sm text-gray-600 dark:text-neutral-400" x-text="task.category"></td>

              <!-- Status & Progress -->
              <td class="px-4 py-3.5 whitespace-nowrap">
                <div class="space-y-1.5">
                  <!-- Status Badges -->
                  <template x-if="task.status === 'RUNNING'">
                    <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 border border-blue-200 dark:border-blue-800">
                      Running
                    </span>
                  </template>
                  <template x-if="task.status === 'SUCCESS'">
                    <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium bg-teal-50 text-teal-700 dark:bg-teal-900/30 dark:text-teal-400 border border-teal-200 dark:border-teal-800">
                      Completed
                    </span>
                  </template>
                  <template x-if="task.status === 'FAILURE'">
                    <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800">
                      Failed
                    </span>
                  </template>
                </div>
              </td>

              <!-- Started -->
              <td class="px-4 py-3.5 whitespace-nowrap text-sm text-gray-500 dark:text-neutral-400" :class="selectedTaskId ? 'hidden xl:table-cell' : 'hidden md:table-cell'" x-text="task.startedAt"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Table Pagination Footer -->
    <div class="p-4 border-t border-gray-200 dark:border-neutral-700 flex items-center justify-between gap-3 bg-gray-50/50 dark:bg-neutral-800/50">
      <p class="text-xs text-gray-500 dark:text-neutral-400">
        Showing <span class="font-semibold text-gray-800 dark:text-neutral-200" x-text="filteredTasks.length ? 1 : 0"></span> to <span class="font-semibold text-gray-800 dark:text-neutral-200" x-text="filteredTasks.length"></span> of <span class="font-semibold text-gray-800 dark:text-neutral-200" x-text="tasks.length"></span> tasks
      </p>

      <div class="inline-flex gap-x-2">
        <button 
          type="button" 
          disabled
          class="py-1.5 px-2.5 inline-flex items-center gap-x-1 text-xs font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs opacity-50 cursor-not-allowed dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400"
        >
          <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6" />
          </svg>
          Previous
        </button>

        <button 
          type="button" 
          class="py-1.5 px-2.5 inline-flex items-center gap-x-1 text-xs font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
        >
          Next
          <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </div>
    </div>
    <!-- End Table Pagination Footer -->
  </div>
  <!-- END LEFT: Table Card -->

  <!-- RIGHT: Side Detail Panel -->
  {% include "./detail.html" %}
</div>
<!-- End Master-Detail Tasks Section -->
