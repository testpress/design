<!-- Task Details & Execution Logs Panel -->
<!-- Preline References:
  - Card: https://preline.co/docs/card.html
  - Timeline: https://preline.co/docs/timeline.html
  - Buttons: https://preline.co/docs/buttons.html
  - Badges: https://preline.co/docs/badge.html
-->
<div 
  x-show="selectedTaskId !== null" 
  x-cloak 
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-x-4"
  x-transition:enter-end="opacity-100 translate-x-0"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100 translate-x-0"
  x-transition:leave-end="opacity-0 translate-x-4"
  class="w-full lg:w-5/12 sticky top-5 bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-2xs overflow-hidden"
>
  <template x-if="getSelectedTask()">
    <div>
      <!-- Panel Header -->
      <div class="p-4 sm:p-5 border-b border-gray-200 dark:border-neutral-700 flex items-start justify-between gap-3 bg-gray-50/50 dark:bg-neutral-800">
        <div class="grow min-w-0">
          <div class="flex items-center gap-x-2 text-xs text-gray-500 dark:text-neutral-400">
            <span class="font-medium text-gray-700 dark:text-neutral-300" x-text="getSelectedTask().category"></span>
            <span>&bull;</span>
            <span class="font-mono break-all" x-text="getSelectedTask().id"></span>
          </div>
          <h4 class="mt-1 text-base font-semibold text-gray-800 dark:text-neutral-200 truncate" x-text="getSelectedTask().name"></h4>
        </div>

        <button 
          type="button" 
          @click="selectedTaskId = null"
          class="size-8 inline-flex justify-center items-center rounded-lg text-gray-500 hover:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 focus:outline-none cursor-pointer"
          aria-label="Close task details"
        >
          <svg class="size-4 text-gray-800 dark:text-neutral-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <!-- End Panel Header -->

      <!-- Panel Body -->
      <div class="p-4 sm:p-5 space-y-5 max-h-[720px] overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
        
        <!-- Running Progress -->
        <template x-if="getSelectedTask().status === 'RUNNING'">
          <div class="space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="font-medium text-gray-800 dark:text-neutral-200">Progress</span>
              <span class="font-semibold text-gray-800 dark:text-neutral-200" x-text="getSelectedTask().progress + '%'"></span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-1.5 dark:bg-neutral-700 overflow-hidden">
              <div class="bg-blue-600 h-1.5 rounded-full transition-all duration-500" :style="`width: ${getSelectedTask().progress}%`"></div>
            </div>
          </div>
        </template>

        <!-- Failure Alert -->
        <template x-if="getSelectedTask().status === 'FAILURE'">
          <div class="space-y-1.5">
            <div class="flex items-center gap-x-2 text-xs font-semibold text-red-600 dark:text-red-400">
              <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              Task execution error
            </div>
            <p class="text-xs text-gray-700 dark:text-neutral-300 font-mono bg-gray-50 dark:bg-neutral-900/70 p-2.5 rounded-lg border border-gray-200 dark:border-neutral-700 break-all" x-text="getSelectedTask().exception"></p>
          </div>
        </template>

        <!-- Key Details Grid -->
        <div class="grid grid-cols-2 gap-3 text-xs">
          <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200/60 dark:border-neutral-700">
            <span class="text-gray-500 dark:text-neutral-400 block mb-0.5">Triggered By</span>
            <span class="font-medium text-gray-800 dark:text-neutral-200" x-text="getSelectedTask().triggeredBy"></span>
          </div>

          <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200/60 dark:border-neutral-700">
            <span class="text-gray-500 dark:text-neutral-400 block mb-0.5">Execution Duration</span>
            <span class="font-medium text-gray-800 dark:text-neutral-200" x-text="getSelectedTask().duration"></span>
          </div>

          <template x-if="getSelectedTask().candidate">
            <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200/60 dark:border-neutral-700">
              <span class="text-gray-500 dark:text-neutral-400 block mb-0.5">Candidate</span>
              <span class="font-medium text-gray-800 dark:text-neutral-200" x-text="getSelectedTask().candidate"></span>
            </div>
          </template>

          <template x-if="getSelectedTask().workspace">
            <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200/60 dark:border-neutral-700">
              <span class="text-gray-500 dark:text-neutral-400 block mb-0.5">Workspace</span>
              <span class="font-medium text-gray-800 dark:text-neutral-200" x-text="getSelectedTask().workspace"></span>
            </div>
          </template>
        </div>

        <!-- Generated Artifact Download Box -->
        <template x-if="getSelectedTask().status === 'SUCCESS' && getSelectedTask().fileName">
          <div class="p-3.5 bg-gray-50 dark:bg-neutral-700/40 rounded-xl border border-gray-200 dark:border-neutral-700 flex items-center justify-between gap-3">
            <div class="flex items-center gap-x-3 min-w-0">
              <div class="shrink-0 size-9 rounded-lg bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 flex items-center justify-center">
                <svg class="size-4 text-gray-800 dark:text-neutral-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7 10 12 15 17 10" />
                  <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
              </div>
              <div class="grow min-w-0">
                <p class="text-xs font-medium text-gray-800 dark:text-neutral-200 truncate" x-text="getSelectedTask().fileName"></p>
                <p class="text-[11px] text-gray-500 dark:text-neutral-400" x-text="getSelectedTask().fileSize"></p>
              </div>
            </div>

            <button 
              type="button" 
              class="py-1.5 px-3 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700 shadow-2xs cursor-pointer shrink-0"
            >
              Download
            </button>
          </div>
        </template>

        <!-- Execution Event Timeline (Preline Timeline) -->
        <div class="space-y-3 pt-2">
          <h5 class="text-xs font-semibold text-gray-800 dark:text-neutral-200 uppercase tracking-wider">
            Execution Logs & Events
          </h5>

          <!-- Timeline List -->
          <div class="space-y-3 border-s border-gray-200 dark:border-neutral-700 ps-4 ms-2">
            <template x-for="(event, idx) in getSelectedTask().events" :key="idx">
              <div class="relative">
                <!-- Timeline Bullet -->
                <div class="absolute -start-[21px] top-1">
                  <template x-if="event.type === 'info'">
                    <span class="size-2.5 rounded-full bg-gray-400 ring-4 ring-white dark:ring-neutral-800 inline-block"></span>
                  </template>
                  <template x-if="event.type === 'progress'">
                    <span class="size-2.5 rounded-full bg-blue-500 ring-4 ring-white dark:ring-neutral-800 inline-block"></span>
                  </template>
                  <template x-if="event.type === 'success'">
                    <span class="size-2.5 rounded-full bg-teal-500 ring-4 ring-white dark:ring-neutral-800 inline-block"></span>
                  </template>
                  <template x-if="event.type === 'error'">
                    <span class="size-2.5 rounded-full bg-red-500 ring-4 ring-white dark:ring-neutral-800 inline-block"></span>
                  </template>
                </div>

                <p class="text-[11px] text-gray-400 dark:text-neutral-500 font-mono" x-text="event.time"></p>
                <p class="text-xs text-gray-700 dark:text-neutral-300 mt-0.5" x-text="event.msg"></p>
              </div>
            </template>
          </div>
          <!-- End Timeline List -->
        </div>

        <!-- Action Buttons Footer -->
        <div class="pt-4 flex items-center justify-end gap-x-2">
          <template x-if="getSelectedTask().status === 'FAILURE'">
            <button 
              type="button" 
              class="py-2 px-3 inline-flex items-center gap-x-2 text-xs font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700 shadow-2xs cursor-pointer"
            >
              <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 16h5v5" />
              </svg>
              Retry Task
            </button>
          </template>
        </div>

      </div>
      <!-- End Panel Body -->
    </div>
  </template>
</div>
<!-- End Task Details & Execution Logs Panel -->
