<!-- KPI / Metric Cards Section -->
<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
  <!-- Card: Running Now -->
  <div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-2xs rounded-xl">
    <div class="p-4 md:p-5 flex items-center gap-x-4">
      <div class="shrink-0">
        <!-- PlayCircle Icon -->
        <svg class="shrink-0 size-6 text-gray-600 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polygon points="10 8 16 12 10 16 10 8" />
        </svg>
      </div>

      <div class="grow">
        <p class="text-xs font-medium text-gray-500 dark:text-neutral-400">
          Running now
        </p>
        <h3 class="mt-1 text-2xl font-bold text-blue-600 dark:text-blue-500">
          6
        </h3>
      </div>
    </div>

    <!-- Card Action Link (Below, same position like before) -->
    <a 
      class="py-3 px-4 md:px-5 inline-flex items-center gap-x-1 text-sm font-medium text-blue-600 dark:text-blue-500 underline hover:text-blue-700 dark:hover:text-blue-400 border-t border-gray-200 dark:border-neutral-700 rounded-b-xl cursor-pointer" 
      href="#tasks-table"
      @click.prevent="selectedStatus = 'Running'; selectedTab = 'all'; document.getElementById('tasks-table')?.scrollIntoView({ behavior: 'smooth' })"
    >
      View details
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </a>
  </div>
  <!-- End Card -->

  <!-- Card: Completed (24h) -->
  <div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-2xs rounded-xl">
    <div class="p-4 md:p-5 flex items-center gap-x-4">
      <div class="shrink-0">
        <!-- FileCheck Icon -->
        <svg class="shrink-0 size-6 text-gray-600 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          <path d="m9 15 2 2 4-4" />
        </svg>
      </div>

      <div class="grow">
        <p class="text-xs font-medium text-gray-500 dark:text-neutral-400">
          Completed (24h)
        </p>
        <h3 class="mt-1 text-2xl font-bold text-teal-600 dark:text-teal-500">
          257
        </h3>
      </div>
    </div>

    <!-- Card Action Link (Below, same position like before) -->
    <a 
      class="py-3 px-4 md:px-5 inline-flex items-center gap-x-1 text-sm font-medium text-blue-600 dark:text-blue-500 underline hover:text-blue-700 dark:hover:text-blue-400 border-t border-gray-200 dark:border-neutral-700 rounded-b-xl cursor-pointer" 
      href="#tasks-table"
      @click.prevent="selectedStatus = 'Completed'; selectedTab = 'all'; document.getElementById('tasks-table')?.scrollIntoView({ behavior: 'smooth' })"
    >
      View details
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </a>
  </div>
  <!-- End Card -->

  <!-- Card: Failed (24h) -->
  <div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-2xs rounded-xl">
    <div class="p-4 md:p-5 flex items-center gap-x-4">
      <div class="shrink-0">
        <!-- AlertTriangle Icon -->
        <svg class="shrink-0 size-6 text-gray-600 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>

      <div class="grow">
        <p class="text-xs font-medium text-gray-500 dark:text-neutral-400">
          Failed (24h)
        </p>
        <h3 class="mt-1 text-2xl font-bold text-red-600 dark:text-red-500">
          7
        </h3>
      </div>
    </div>

    <!-- Card Action Link (Below, same position like before) -->
    <a 
      class="py-3 px-4 md:px-5 inline-flex items-center gap-x-1 text-sm font-medium text-blue-600 dark:text-blue-500 underline hover:text-blue-700 dark:hover:text-blue-400 border-t border-gray-200 dark:border-neutral-700 rounded-b-xl cursor-pointer" 
      href="#tasks-table"
      @click.prevent="selectedStatus = 'Failed'; selectedTab = 'all'; document.getElementById('tasks-table')?.scrollIntoView({ behavior: 'smooth' })"
    >
      View details
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </a>
  </div>
  <!-- End Card -->
</div>
<!-- End KPI / Metric Cards Section -->
