permalink: sentinel/login/
tags: sentinel
title: Sign In
dashboard_view: Authentication

{% extends "./layout/auth_base.html" %}

{% block auth_content %}
  <!-- Logo & Heading -->
  <div class="mb-8 text-center w-full max-w-md z-10">
    <img class="h-10 w-auto mx-auto drop-shadow-sm" src="{{ '/img/sentinel/icon.png' | url }}" alt="TPSentinel Logo">
    <h2 class="mt-6 text-2xl font-bold text-gray-900 dark:text-white tracking-tight">Sign in to your account</h2>
  </div>

  <!-- Form Card -->
  <div class="relative w-full max-w-md bg-white dark:bg-neutral-800 rounded-2xl shadow-sm border border-gray-200/80 dark:border-neutral-700 px-8 sm:px-10 py-8 sm:py-10">
    {% include "./partials/login_form.html" %}
  </div>

  <!-- Footer Link -->
  <div class="mt-8 text-center z-10">
    <p class="text-sm text-gray-600 dark:text-neutral-400">
      Don't have an account? <a href="{{ '/sentinel/signup/' | url }}" class="font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-500 dark:hover:text-indigo-400 transition-colors duration-200">Sign up</a>
    </p>
  </div>
{% endblock auth_content %}
