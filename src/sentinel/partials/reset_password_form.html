<form action="#" method="POST" @submit.prevent="handleSubmit" class="space-y-6" x-data="{
  oldPwd: '',
  pwd: '',
  confirmPwd: '',
  showOldPassword: false,
  showPassword: false,
  showHints: false,
  submitted: false,
  incorrectOldPwd: false,
  get rules() {
    const p = String(this.pwd || '');
    return {
      minLength: p.length >= 8,
      lowercase: /[a-z]/.test(p),
      uppercase: /[A-Z]/.test(p),
      numbers: /[0-9]/.test(p),
      special: /[!@#$%^&*(),.?&quot;:{}|<>]/.test(p),
      differentFromOld: p.length > 0 && this.oldPwd.length > 0 && p !== this.oldPwd,
      match: p.length > 0 && p === this.confirmPwd
    };
  },
  handleSubmit() {
    this.submitted = true;
    if (this.oldPwd === 'wrong') {
      this.incorrectOldPwd = true;
    } else {
      this.incorrectOldPwd = false;
    }
  }
}">
  <!-- Old Password Field -->
  <div>
    <label for="old_password" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">Old password</label>
    <div class="mt-2 relative rounded-md shadow-sm">
      <input :type="showOldPassword ? 'text' : 'password'" id="old_password" name="old_password" x-model="oldPwd" @input="incorrectOldPwd = false" required autocomplete="current-password" placeholder="Enter old password"
        class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:ring-2 focus:ring-inset focus:ring-indigo-500 dark:focus:ring-neutral-600 sm:text-sm sm:leading-6" />
      <button type="button" @click="showOldPassword = !showOldPassword" :aria-label="showOldPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500 dark:text-neutral-500 dark:hover:text-neutral-400 focus:outline-none">
        <svg x-show="!showOldPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg x-show="showOldPassword" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      </button>
    </div>
    <!-- Incorrect Old Password Warning -->
    <div x-show="incorrectOldPwd" x-cloak class="mt-1.5 text-xs text-red-500 font-medium flex items-center gap-x-1">
      <svg class="size-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>The old password you entered is incorrect.</span>
    </div>
  </div>

  <!-- New Password Field -->
  <div>
    <label for="password" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">New password</label>
    <div class="mt-2 relative rounded-md shadow-sm">
      <input :type="showPassword ? 'text' : 'password'" id="password" name="password" x-model="pwd" @focus="showHints = true" required autocomplete="new-password" placeholder="Create new password"
        class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:ring-2 focus:ring-inset focus:ring-indigo-500 dark:focus:ring-neutral-600 sm:text-sm sm:leading-6" />
      <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500 dark:text-neutral-500 dark:hover:text-neutral-400 focus:outline-none">
        <svg x-show="!showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg x-show="showPassword" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      </button>
    </div>

    <!-- Password Checklist -->
    {% set show_different_from_old = true %}
    {% include "./password_checklist.html" %}
  </div>

  <!-- Confirm Password Field -->
  <div>
    <label for="password_confirm" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">Confirm new password</label>
    <div class="mt-2 relative rounded-md shadow-sm">
      <input :type="showPassword ? 'text' : 'password'" id="password_confirm" name="password_confirm" x-model="confirmPwd" required autocomplete="new-password" placeholder="Confirm new password"
        class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:ring-2 focus:ring-inset focus:ring-indigo-500 dark:focus:ring-neutral-600 sm:text-sm sm:leading-6" />
      <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500 dark:text-neutral-500 dark:hover:text-neutral-400 focus:outline-none">
        <svg x-show="!showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg x-show="showPassword" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      </button>
    </div>
    <!-- Password Mismatch Warning -->
    <div x-show="pwd.length > 0 && confirmPwd.length >= pwd.length && !rules.match" x-cloak class="mt-1.5 text-xs text-red-500 font-medium flex items-center gap-x-1">
      <svg class="size-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Passwords do not match</span>
    </div>
  </div>

  <div>
    <button type="submit" class="flex w-full justify-center py-2 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 shadow-sm">Reset password</button>
  </div>
</form>
