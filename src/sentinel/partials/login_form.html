<form class="space-y-4 sm:space-y-5" method="post" action="#">
  <div class="space-y-4">
    <!-- Email Field -->
    <div>
      <label for="username" class="block text-sm font-medium text-gray-700 dark:text-neutral-200">Email address</label>
      <div class="mt-1">
        <input type="email" name="username" id="username" autocomplete="email" required
          class="appearance-none block w-full px-3 py-1.5 border border-gray-300 dark:border-neutral-700 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-neutral-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 dark:focus:ring-neutral-600 dark:focus:border-neutral-600 text-sm transition-colors duration-200 bg-white dark:bg-neutral-900 text-gray-900 dark:text-neutral-100"
          placeholder="you@example.com">
      </div>
    </div>
    
    <!-- Password Field -->
    <div x-data="{ show: false }">
      <label for="password" class="block text-sm font-medium text-gray-700 dark:text-neutral-200">Password</label>
      <div class="mt-1 relative rounded-md shadow-sm">
        <input :type="show ? 'text' : 'password'" name="password" id="password" autocomplete="current-password" required
          class="appearance-none block w-full px-3 py-1.5 pr-10 border border-gray-300 dark:border-neutral-700 rounded-lg shadow-sm placeholder-gray-400 dark:placeholder-neutral-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 dark:focus:ring-neutral-600 dark:focus:border-neutral-600 text-sm transition-colors duration-200 bg-white dark:bg-neutral-900 text-gray-900 dark:text-neutral-100"
          placeholder="••••••••">
        <button type="button" @click="show = !show" :aria-label="show ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500 dark:text-neutral-500 dark:hover:text-neutral-400 focus:outline-none">
          <svg x-show="!show" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg x-show="show" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Remember Me & Forgot Password -->
    <div class="flex items-center justify-between">
      <div class="flex items-center">
        <input id="remember_me" name="remember_me" type="checkbox"
          class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 dark:focus:ring-indigo-600 dark:focus:ring-offset-neutral-800 border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-900 rounded transition-colors duration-200 cursor-pointer">
        <label for="remember_me" class="ml-2 block text-sm text-gray-700 dark:text-neutral-300 cursor-pointer">Remember me</label>
      </div>
      <div class="text-sm">
        <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-500 dark:hover:text-indigo-400 transition-colors duration-200">Forgot password?</a>
      </div>
    </div>
  </div>

  <!-- Submit Button -->
  <div>
    <button type="submit"
      class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 shadow-sm">
      Sign in
    </button>
  </div>

  <!-- Divider -->
  <div class="relative pt-1">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-gray-200 dark:border-neutral-700"></div>
    </div>
    <div class="relative flex justify-center text-sm">
      <span class="px-3 bg-white dark:bg-neutral-800 text-gray-500 dark:text-neutral-500 text-xs sm:text-sm">Or continue with</span>
    </div>
  </div>

  <!-- Google Sign In -->
  <div>
    <a href="#" class="w-full flex justify-center items-center py-2 px-4 border border-gray-300 dark:border-neutral-700 rounded-lg text-sm font-medium text-gray-700 dark:text-neutral-300 bg-white dark:bg-neutral-900 hover:bg-gray-50 dark:hover:bg-neutral-800 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-gray-200 dark:focus:ring-neutral-600 transition-all duration-200 shadow-sm">
      <svg class="h-5 w-5 mr-2" aria-hidden="true" viewBox="0 0 24 24">
        <path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"/>
        <path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"/>
        <path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"/>
        <path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26537 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853"/>
      </svg>
      Sign in with Google
    </a>
  </div>

</form>
