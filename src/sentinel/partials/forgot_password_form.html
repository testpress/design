<form action="#" method="POST" class="space-y-6">
  <div>
    <p class="text-sm leading-6 text-gray-600 dark:text-neutral-400 mb-6">
      Enter your email address and we'll send you a link to reset your password.
    </p>
    <label for="email" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">Email address</label>
    <div class="mt-2">
      <input id="email" type="email" name="email" required autocomplete="email" placeholder="you@email.com" class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:ring-2 focus:ring-inset focus:ring-indigo-500 dark:focus:ring-neutral-600 sm:text-sm sm:leading-6" />
    </div>
  </div>

  <div>
    <button type="submit" class="flex w-full justify-center py-2 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 shadow-sm">Send reset link</button>
  </div>
</form>
