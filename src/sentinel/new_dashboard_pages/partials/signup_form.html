      <!-- Sign Up Form -->
      <form action="#" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 gap-x-6 gap-y-6 sm:grid-cols-2">
          <!-- First Name -->
          <div>
            <label for="first_name" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">First name</label>
            <div class="mt-2">
              <input id="first_name" name="first_name" type="text" required autocomplete="given-name"
                class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
            </div>
          </div>

          <!-- Last Name -->
          <div>
            <label for="last_name" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Last name</label>
            <div class="mt-2">
              <input id="last_name" name="last_name" type="text" required autocomplete="family-name"
                class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
            </div>
          </div>

          <!-- Email Address -->
          <div class="sm:col-span-2">
            <label for="email" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Email address</label>
            <div class="mt-2">
              <input id="email" name="email" type="email" required autocomplete="email"
                class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
            </div>
          </div>

          <!-- Phone Number Field -->
          <div class="sm:col-span-2">
            <label for="phone" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Phone number</label>
            <div class="mt-2 flex rounded-md border border-gray-300 dark:border-neutral-700 focus-within:border-primary-600 focus-within:ring-1 focus-within:ring-primary-600 dark:focus-within:border-primary-500 dark:focus-within:ring-primary-500 transition-colors duration-200 bg-white dark:bg-neutral-900">
              <!-- Country Code Dropdown -->
              <div class="relative inline-flex shrink-0">
                <select id="country-code" name="country_code" data-hs-select='{
                  "hasSearch": true,
                  "searchPlaceholder": "Search country...",
                  "searchClasses": "block w-full text-xs bg-transparent border-gray-200 dark:border-neutral-700 rounded-lg text-gray-800 dark:text-neutral-200 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:border-primary-600 focus:ring-1 focus:ring-primary-600 dark:focus:border-primary-500 dark:focus:ring-primary-500 py-1.5 px-2.5",
                  "searchWrapperClasses": "bg-white dark:bg-neutral-900 p-2 -mx-1 sticky top-0",
                  "placeholder": "Code",
                  "toggleTag": "<button type=\"button\" aria-expanded=\"false\"><span class=\"me-1.5\" data-icon></span><span class=\"text-gray-700 dark:text-neutral-200 text-sm\" data-title></span></button>",
                  "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-1.5 ps-3 pe-8 flex items-center text-nowrap w-full cursor-pointer bg-white dark:bg-neutral-900 border-r border-gray-300 dark:border-neutral-700 rounded-l-md text-start text-sm text-gray-700 dark:text-neutral-200 hover:bg-gray-50 dark:hover:bg-neutral-800 focus:outline-none",
                  "dropdownClasses": "mt-2 max-h-72 pb-1 ps-1 pe-1.5 space-y-0.5 z-20 w-72 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-lg shadow-xl overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-1 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-600",
                  "optionClasses": "hs-selected:bg-gray-100 dark:hs-selected:bg-neutral-800 py-1.5 px-2.5 w-full text-sm text-gray-800 dark:text-neutral-300 cursor-pointer hover:bg-gray-100 dark:hover:bg-neutral-800 rounded-lg focus:outline-none focus:bg-gray-100 dark:focus:bg-neutral-800",
                  "optionTemplate": "<div><div class=\"flex items-center gap-x-2\"><div class=\"me-0\" data-icon></div><div class=\"text-gray-800 dark:text-neutral-200 text-sm font-medium truncate\" data-description></div><div class=\"text-xs text-gray-400 dark:text-neutral-500 ms-auto\" data-title></div></div></div>",
                  "extraMarkup": "<div class=\"absolute inset-y-0 end-0 flex items-center pe-2.5 pointer-events-none\"><svg class=\"shrink-0 size-4 text-gray-400 dark:text-neutral-500\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"/></svg></div>"
                }' class="hidden">
                  {% include "./country_options.html" %}
                </select>
              </div>

              <!-- Phone Input -->
              <input type="tel" id="phone" name="phone" required autocomplete="tel-national" inputmode="numeric" pattern="[0-9]*" @input="$el.value = $el.value.replace(/[^0-9]/g, '')"
                class="appearance-none block w-full px-3 py-1.5 border-0 rounded-r-md text-sm bg-transparent text-gray-900 dark:text-neutral-100 focus:outline-none focus:ring-0" />
            </div>
          </div>

          <!-- Organization Name -->
          <div class="sm:col-span-2">
            <label for="organization_name" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Organization name</label>
            <div class="mt-2">
              <input id="organization_name" name="organization_name" type="text" required autocomplete="organization"
                class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
            </div>
          </div>

          <!-- Password -->
          <div class="sm:col-span-2 space-y-4" x-data="{
            pwd: '',
            confirmPwd: '',
            showPassword: false,
            showHints: false,
            get rules() {
              const p = String(this.pwd || '');
              return {
                minLength: p.length >= 8,
                lowercase: /[a-z]/.test(p),
                uppercase: /[A-Z]/.test(p),
                numbers: /[0-9]/.test(p),
                special: /[!@#$%^&*(),.?&quot;:{}|<>]/.test(p),
                match: p.length > 0 && p === this.confirmPwd
              };
            }
          }">
            <!-- Password Field -->
            <div>
              <label for="password" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Password</label>
              <div class="mt-2 relative rounded-md">
                <input :type="showPassword ? 'text' : 'password'" id="password" name="password" x-model="pwd" @focus="showHints = true" required autocomplete="new-password"
                  class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
                <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500 dark:text-neutral-500 dark:hover:text-neutral-400 focus:outline-none">
                  <svg x-show="!showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                  <svg x-show="showPassword" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                  </svg>
                </button>
              </div>

              <!-- Password Checklist -->
              {% include "./password_checklist.html" %}
            </div>

            <!-- Confirm Password -->
            <div>
              <label for="password_confirm" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Confirm password</label>
              <div class="mt-2 relative rounded-md">
                <input :type="showPassword ? 'text' : 'password'" id="password_confirm" name="password_confirm" x-model="confirmPwd" required autocomplete="new-password"
                  class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
                <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500 dark:text-neutral-500 dark:hover:text-neutral-400 focus:outline-none">
                  <svg x-show="!showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                  <svg x-show="showPassword" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                  </svg>
                </button>
              </div>
              <div x-show="pwd.length > 0 && confirmPwd.length >= pwd.length && !rules.match" x-cloak class="mt-1.5 text-xs text-red-500 font-medium flex items-center gap-x-1">
                <svg class="size-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Passwords do not match</span>
              </div>
            </div>
          </div>
        </div>

        <div>
          <button type="submit"
            class="flex w-full justify-center py-2 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 dark:bg-primary-600 dark:hover:bg-primary-500 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-200 shadow-sm">
            Sign Up
          </button>
        </div>
      </form>
