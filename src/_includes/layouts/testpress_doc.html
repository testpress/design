{% extends "src/testpress/layout/student_layout.html" %}

{% block main_content %}
<style>.task-item{list-style:none;margin-left:-1.25em}.task-item label{display:flex;gap:.6em;align-items:flex-start;cursor:pointer}.task-item input{margin-top:.35em;flex:none;width:1.05em;height:1.05em}.task-item:has(input:checked) label{opacity:.55;text-decoration:line-through}</style>
<article class="prose prose-sm mx-auto max-w-3xl px-4 py-8 dark:prose-invert sm:prose-base">
  {{ content | safe }}
</article>
<script>
  // Remember ticked items in this browser so the list can be worked through over several sessions.
  (function () {
    var key = 'tp-qa:' + location.pathname, boxes = document.querySelectorAll('.task-check'), saved = [];
    try { saved = JSON.parse(localStorage.getItem(key) || '[]') } catch (e) {}
    boxes.forEach(function (b, i) {
      b.checked = saved.indexOf(i) > -1
      b.addEventListener('change', function () {
        var on = []; boxes.forEach(function (x, j) { if (x.checked) on.push(j) })
        try { localStorage.setItem(key, JSON.stringify(on)) } catch (e) {}
      })
    })
  })()
</script>
{% endblock main_content %}
