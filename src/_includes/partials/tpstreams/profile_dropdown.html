<!-- profile dropdown with organization switcher (Preline UI Pattern B) -->
<div class="flex shrink-0 items-center gap-x-4 lg:gap-x-6">

  {% if not hide_profile_separator %}
  <!-- Separator -->
  <div class="hidden lg:block lg:h-6 lg:w-px lg:bg-gray-200 dark:bg-neutral-700" aria-hidden="true"></div>
  {% endif %}

  <!-- Profile & Organization Dropdown -->
  <div x-data="{ 
      showDropdown: false,
      selectedOrg: { id: 'org_1', name: 'Testpress', shortName: 'TP', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300' },
      organizations: [
          { id: 'org_1', name: 'Testpress', shortName: 'TP', color: 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300' },
          { id: 'org_2', name: 'TP Streams', shortName: 'TS', color: 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300' },
          { id: 'org_3', name: 'Acme Academy', shortName: 'AA', color: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' }
      ],
      selectOrg(org) {
          this.selectedOrg = org;
          this.showDropdown = false;
      }
  }" class="relative">
    <button type="button" 
      class="-m-1.5 flex items-center p-1.5 rounded-lg hover:bg-gray-50 focus:outline-none dark:hover:bg-neutral-800 transition-colors" 
      id="user-menu-button" 
      aria-expanded="false"
      aria-haspopup="true" 
      @click="showDropdown = !showDropdown" 
      @click.away="showDropdown = false">
      <span class="sr-only">Open user menu</span>

      <!-- User Avatar -->
      <div class="relative inline-flex items-center justify-center size-8 overflow-hidden bg-blue-600 text-white rounded-full font-medium text-sm shadow-xs">
        <span>H</span>
      </div>

      <div class="hidden lg:flex lg:flex-col lg:items-start text-start ml-3">
        <span class="text-sm font-semibold leading-tight text-gray-900 dark:text-neutral-100">Hari</span>
        <span class="text-[11px] font-medium text-gray-500 dark:text-neutral-400 leading-tight flex items-center gap-x-1 mt-0.5">
          <span class="size-1.5 rounded-full bg-emerald-500 inline-block"></span>
          <span x-text="selectedOrg.name">Testpress</span>
        </span>
      </div>

      <svg class="ml-2 size-4 text-gray-400 transition-transform duration-200" :class="{ 'rotate-180': showDropdown }" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
      </svg>
    </button>

    <!-- Dropdown Menu (Preline Style) -->
    <div
      class="absolute right-0 z-50 mt-2.5 w-72 origin-top-right rounded-xl bg-white dark:bg-neutral-900 py-1.5 shadow-xl border border-gray-200 dark:border-neutral-700 focus:outline-none"
      role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1"
      x-show="showDropdown" 
      x-transition:enter="transition ease-out duration-100"
      x-transition:enter-start="transform opacity-0 scale-95"
      x-transition:enter-end="transform opacity-100 scale-100" 
      x-transition:leave="transition ease-in duration-75"
      x-transition:leave-start="transform opacity-100 scale-100" 
      x-transition:leave-end="transform opacity-0 scale-95"
      style="display: none;">

      <!-- User Info Header (Preline dropdown-with-header) -->
      <div class="px-3.5 py-3 border-b border-gray-100 dark:border-neutral-800">
        <div class="flex items-center gap-x-3">
          <div class="inline-flex items-center justify-center size-9 bg-blue-600 text-white rounded-full font-semibold text-sm">
            <span>H</span>
          </div>
          <div class="grow min-w-0">
            <p class="text-sm font-semibold text-gray-900 dark:text-neutral-100 truncate">Hari</p>
            <p class="text-xs text-gray-500 dark:text-neutral-400 truncate">hari@testpress.in</p>
          </div>
        </div>
      </div>

      <!-- Organizations Header -->
      <div class="px-3.5 pt-3 pb-1 flex items-center justify-between">
        <span class="text-[11px] font-semibold text-gray-400 dark:text-neutral-500 uppercase tracking-wider">Organizations</span>
        <span class="text-[10px] text-gray-400 dark:text-neutral-500 font-medium" x-text="organizations.length + ' available'"></span>
      </div>

      <!-- Organizations List -->
      <div class="px-1.5 py-1 space-y-0.5">
        <template x-for="org in organizations" :key="org.id">
          <button type="button" @click="selectOrg(org)"
            class="group w-full flex items-center gap-x-3 py-2 px-2.5 rounded-lg text-start transition-colors focus:outline-none"
            :class="selectedOrg.id === org.id ? 'bg-blue-50/80 dark:bg-blue-900/20' : 'hover:bg-gray-100 dark:hover:bg-neutral-800'">
            <div :class="org.color" class="relative inline-flex items-center justify-center size-7 overflow-hidden rounded-md shrink-0">
              <span class="font-semibold uppercase text-xs" x-text="org.shortName"></span>
            </div>
            <div class="grow min-w-0">
              <p class="text-xs font-semibold truncate"
                 :class="selectedOrg.id === org.id ? 'text-blue-700 dark:text-blue-300' : 'text-gray-800 dark:text-neutral-200'"
                 x-text="org.name"></p>
            </div>
            <div class="shrink-0 ms-auto" x-show="selectedOrg.id === org.id">
              <svg class="size-4 text-blue-600 dark:text-blue-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
          </button>
        </template>
      </div>

      <!-- Footer Actions -->
      <div class="my-1 border-t border-gray-100 dark:border-neutral-800"></div>

      <div class="px-1.5 py-1">
        <a href="#" class="flex items-center gap-x-3 py-2 px-2.5 rounded-lg text-xs font-medium text-gray-700 dark:text-neutral-300 hover:bg-gray-100 dark:hover:bg-neutral-800 transition-colors">
          <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 8v8"></path>
            <path d="M8 12h8"></path>
          </svg>
          Add another organization
        </a>
      </div>

      <div class="my-1 border-t border-gray-100 dark:border-neutral-800"></div>

      <div class="px-1.5 py-1">
        <a href="#" class="flex items-center gap-x-3 py-2 px-2.5 rounded-lg text-xs font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors" role="menuitem" tabindex="-1" id="user-menu-item-0">
          <svg class="shrink-0 size-4 text-red-500 dark:text-red-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" y2="12"></line>
          </svg>
          Logout
        </a>
      </div>
    </div>
  </div>
</div>
