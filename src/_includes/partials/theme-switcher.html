<!-- Logic Script -->
<script>
  (function() {
    const html = document.querySelector('html');


    // --- Dark Mode Logic ---
    const darkToggle = document.querySelector('#template-preview-dark-toggle');
    const lightToggle = document.querySelector('#template-preview-light-toggle');

    function updateDarkModeButtons() {
      if (!darkToggle || !lightToggle) return;
      if (html.classList.contains('dark')) {
        lightToggle.classList.remove('hidden');
        lightToggle.classList.add('flex');
        darkToggle.classList.add('hidden');
        darkToggle.classList.remove('flex');
      } else {
        darkToggle.classList.remove('hidden');
        darkToggle.classList.add('flex');
        lightToggle.classList.add('hidden');
        lightToggle.classList.remove('flex');
      }
    }

    if (darkToggle) {
        darkToggle.addEventListener('click', () => {
        html.classList.add('dark');
        html.classList.remove('light');
        localStorage.setItem('hs_theme', 'dark');
        updateDarkModeButtons();
        });
    }

    if (lightToggle) {
        lightToggle.addEventListener('click', () => {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('hs_theme', 'light');
        updateDarkModeButtons();
        });
    }
    
    updateDarkModeButtons();

    // --- Theme Selection Logic ---
    const themeRadios = document.querySelectorAll('input[name="hs-pro-tps-template-preview-toolbar"]');
    const brandRadios = document.querySelectorAll('input[name="hs-pro-tps-template-preview-toolbar-branding"]');
    const currentThemeIndicator = document.getElementById('template-preview-theme-controls-color');
    const savedThemeStyle = localStorage.getItem('hs_theme_style') || 'default';
    const savedBrandColor = localStorage.getItem('hs_brand_color') || 'blue';
    
    // Set initial theme
    if (savedThemeStyle !== 'default') {
      html.setAttribute('data-theme', 'theme-' + savedThemeStyle);
    }
    
    themeRadios.forEach(radio => {
      if (radio.value === savedThemeStyle) {
        radio.checked = true;
        updateThemeIndicator(radio);
      }
      
      radio.addEventListener('change', (e) => {
        const theme = e.target.value;
        if (theme === 'default') {
          html.removeAttribute('data-theme');
        } else {
          html.setAttribute('data-theme', 'theme-' + theme);
        }
        localStorage.setItem('hs_theme_style', theme);
        updateThemeIndicator(radio);
      });
    });

    function updateThemeIndicator(radio) {
      if (!currentThemeIndicator) return;
      const label = radio.closest('label');
      if (!label) return;
      const colorBox = label.querySelector('.size-5');
      if (colorBox) {
        const bgClasses = Array.from(colorBox.classList).filter(c => c.startsWith('bg-'));
        currentThemeIndicator.className = 'size-4 rounded-sm ' + bgClasses.join(' ');
      }
    }

    // --- Branding Color Logic ---
    function applyBrandColor(brand) {
      if(brand === 'default' || brand === 'blue') {
        html.style.removeProperty('--primary-50');
        html.style.removeProperty('--primary-100');
        html.style.removeProperty('--primary-200');
        html.style.removeProperty('--primary-300');
        html.style.removeProperty('--primary-400');
        html.style.removeProperty('--primary-500');
        html.style.removeProperty('--primary-600');
        html.style.removeProperty('--primary-700');
        html.style.removeProperty('--primary-800');
        html.style.removeProperty('--primary-900');
        html.style.removeProperty('--primary-950');
        html.style.removeProperty('--primary');
        html.style.removeProperty('--primary-hover');
        html.style.removeProperty('--primary-focus');
        html.style.removeProperty('--primary-active');
        html.style.removeProperty('--primary-checked');
      } else {
        const c = brand;
        html.style.setProperty('--primary-50', `var(--color-${c}-50)`);
        html.style.setProperty('--primary-100', `var(--color-${c}-100)`);
        html.style.setProperty('--primary-200', `var(--color-${c}-200)`);
        html.style.setProperty('--primary-300', `var(--color-${c}-300)`);
        html.style.setProperty('--primary-400', `var(--color-${c}-400)`);
        html.style.setProperty('--primary-500', `var(--color-${c}-500)`);
        html.style.setProperty('--primary-600', `var(--color-${c}-600)`);
        html.style.setProperty('--primary-700', `var(--color-${c}-700)`);
        html.style.setProperty('--primary-800', `var(--color-${c}-800)`);
        html.style.setProperty('--primary-900', `var(--color-${c}-900)`);
        html.style.setProperty('--primary-950', `var(--color-${c}-950)`);
        
        html.style.setProperty('--primary', `var(--color-${c}-600)`);
        html.style.setProperty('--primary-hover', `var(--color-${c}-700)`);
        html.style.setProperty('--primary-focus', `var(--color-${c}-700)`);
        html.style.setProperty('--primary-active', `var(--color-${c}-700)`);
        html.style.setProperty('--primary-checked', `var(--color-${c}-600)`);
      }
    }

    applyBrandColor(savedBrandColor);

    brandRadios.forEach(radio => {
      if (radio.value === savedBrandColor) {
        radio.checked = true;
      }
      
      radio.addEventListener('change', (e) => {
        const brand = e.target.value;
        applyBrandColor(brand);
        localStorage.setItem('hs_brand_color', brand);
      });
    });

    // --- Font Logic ---
    const savedFont = localStorage.getItem('hs_preline_font') || 'sans';
    
    // Apply initial font
    html.setAttribute('data-font', savedFont);
    
    const hsFonts = document.getElementById('hs-fonts');
    if (hsFonts) {
        hsFonts.value = savedFont;
        hsFonts.addEventListener('change', (e) => {
            const font = e.target.value;
            html.setAttribute('data-font', font);
            localStorage.setItem('hs_preline_font', font);
        });
    }

    // --- Fix Fixed Navbar Overlap ---
    function syncToolbarHeight() {
      const spacer = document.getElementById('template-preview-spacer');
      const toolbar = document.getElementById('template-preview-toolbar');
      if (toolbar && spacer) {
        const height = toolbar.offsetHeight;
        spacer.style.height = height + 'px';
        const header = document.querySelector('header.fixed');
        if (header && header.id !== 'template-preview-toolbar') {
          header.style.transition = 'top 0.2s';
          header.style.top = height + 'px';
        }
        
        // We also need to push the main content down because the header moved down
        const main = document.querySelector('main#content');
        if (main) {
          main.style.paddingTop = `calc(3.75rem + ${height}px)`;
        }
      }
    }
    
    // Run on mount and window resize
    document.addEventListener('DOMContentLoaded', syncToolbarHeight);
    window.addEventListener('resize', syncToolbarHeight);
    // run immediately in case DOM is already parsed
    setTimeout(syncToolbarHeight, 50);

    // --- Dynamic Breadcrumbs Logic ---
    const breadcrumbContainer = document.getElementById('dynamic-breadcrumbs');
    if (breadcrumbContainer) {
      const pathSegments = window.location.pathname.split('/').filter(s => s !== '');
      let currentPath = '';
      
      // Always start with Home > Testpress for the testpress project
      let breadcrumbsHTML = `
        <a class="whitespace-nowrap truncate hover:text-blue-600 focus:outline-hidden focus:text-blue-600 dark:hover:text-blue-500 dark:focus:text-blue-500" href="/">Home</a>
        <svg class="shrink-0 size-3 text-stone-400 dark:text-neutral-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
        <a class="whitespace-nowrap truncate hover:text-blue-600 focus:outline-hidden focus:text-blue-600 dark:hover:text-blue-500 dark:focus:text-blue-500" href="/testpress/">Testpress</a>
      `;

      // Filter out "testpress" from segments since it's already shown above
      const filteredSegments = pathSegments.filter(s => s.toLowerCase() !== 'testpress');

      if (filteredSegments.length > 0) {
        let segPath = pathSegments[0].toLowerCase() === 'testpress' ? '/testpress' : '';
        filteredSegments.forEach((segment, index) => {
          segPath += '/' + segment;
          const name = segment.replace(/-/g, ' ').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
          
          breadcrumbsHTML += `
            <svg class="shrink-0 size-3 text-stone-400 dark:text-neutral-600" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          `;

          if (index === filteredSegments.length - 1) {
            breadcrumbsHTML += `<span class="truncate font-medium text-stone-600 dark:text-neutral-300">${name}</span>`;
          } else {
            breadcrumbsHTML += `<a class="whitespace-nowrap truncate hover:text-blue-600 focus:outline-hidden focus:text-blue-600 dark:hover:text-blue-500 dark:focus:text-blue-500" href="${segPath}/">${name}</a>`;
          }
        });
      }
      
      breadcrumbContainer.innerHTML = breadcrumbsHTML;
    }

  })();
</script>
