{% from "src/tpsentinel/components/timeline.html" import timeline %}

<div class="flex flex-col gap-5">
  <!-- When things happened. Only what's stored: created, first and latest attempt, next retry, finish. -->
  <section class="p-5 bg-card border border-card-line shadow-2xs rounded-xl" aria-labelledby="dl-timeline">
    <h2 id="dl-timeline" class="text-base font-semibold text-foreground">Timeline</h2>
    <div class="mt-4">{{ timeline(x_items="steps") }}</div>
  </section>

  <!-- Facts a developer asks for. Labels above values, spacing between. -->
  <section class="p-5 bg-card border border-card-line shadow-2xs rounded-xl" aria-labelledby="dl-facts">
    <h2 id="dl-facts" class="text-base font-semibold text-foreground">Details</h2>
    <dl class="mt-4 flex flex-col gap-4 text-sm">
      <div>
        <dt class="text-xs text-muted-foreground-1">Webhook</dt>
        <dd class="mt-1"><a :href="detailHref()" class="text-foreground hover:underline focus:outline-hidden focus-visible:underline" x-text="w.name"></a></dd>
        <dd class="mt-0.5 text-[13px] text-muted-foreground-1 break-all" x-text="w.url"></dd>
      </div>
      <div>
        <dt class="text-xs text-muted-foreground-1">Attempts</dt>
        <dd class="mt-1 text-foreground" x-text="attemptsText()"></dd>
      </div>
      <div x-show="responseText()">
        <dt class="text-xs text-muted-foreground-1">Latest response</dt>
        <dd class="mt-1 text-foreground" x-text="responseText()"></dd>
      </div>
      <div x-show="failureLabel()">
        <dt class="text-xs text-muted-foreground-1">Failure type</dt>
        <dd class="mt-1 text-foreground" x-text="failureLabel()"></dd>
      </div>
    </dl>
    <p class="mt-5 text-[13px] leading-5 text-muted-foreground-1">Response bodies and headers from your endpoint aren't stored.</p>
    <!-- Tests only: same shield line as the Testing card -->
    <p x-show="isTest" class="mt-3 flex items-center gap-x-2 text-[13px] text-muted-foreground-1">
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      Tests don't change its status
    </p>
  </section>
</div>
