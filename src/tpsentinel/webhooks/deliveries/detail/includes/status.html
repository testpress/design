{% from "src/tpsentinel/components/button.html" import button %}

<!-- What happened, why (from the failure type), and what happens next. Colour only on the icon. No replay in V1. -->
<section class="p-5 bg-card border border-card-line shadow-2xs rounded-xl flex flex-wrap items-start gap-x-4 gap-y-3" aria-labelledby="dl-status">
  <span class="shrink-0 inline-flex items-center h-6" :class="tone()" x-html="icon(20)"></span>
  <div class="min-w-0 grow basis-72">
    <h2 id="dl-status" class="text-base font-semibold text-foreground" x-text="status().title"></h2>
    <p class="mt-1 text-sm leading-6 text-muted-foreground-1" x-text="status().text"></p>
  </div>
  <!-- The one useful next step, when there is one -->
  <div x-show="status().action" class="sm:self-center">
    {{ button(variant="secondary", href="#", extra_attrs=':href="status().action && status().action.href" x-text="status().action && status().action.label"') }}
  </div>
</section>
