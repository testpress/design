{% from "src/tpsentinel/components/button.html" import button %}

<!-- Loading -->
<div x-show="view === 'loading'" x-cloak class="flex flex-col gap-5 animate-pulse" aria-busy="true" aria-label="Loading delivery">
  <div class="space-y-2.5"><div class="h-3.5 w-40 rounded-full bg-surface"></div><div class="h-6 w-72 rounded-full bg-surface"></div><div class="h-3.5 w-44 rounded-full bg-surface"></div></div>
  <div class="h-24 rounded-xl bg-surface"></div>
  <div class="grid lg:grid-cols-[minmax(0,1fr)_20rem] gap-5"><div class="h-96 rounded-xl bg-surface"></div><div class="h-96 rounded-xl bg-surface"></div></div>
</div>

<!-- Unavailable: removed after the retention period (or a bad link). No payload is shown once it's gone. -->
<div x-show="view === 'missing'" x-cloak class="bg-card border border-card-line shadow-2xs rounded-xl p-5 min-h-[320px] flex flex-col justify-center items-center text-center">
  <p class="font-medium text-foreground">This delivery isn't available</p>
  <p class="mt-1 max-w-sm text-sm text-muted-foreground-1" x-text="`Deliveries are removed after ${retention} days, or the link is wrong.`"></p>
  <div class="mt-4">{{ button(text="Back to deliveries", variant="secondary", size="sm", href="#", extra_attrs=':href="listHref()"') }}</div>
</div>
