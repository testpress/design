<!-- Back to this webhook's deliveries; the event is the title, the delivery ID (what developers quote) under it -->
<div>
  <a :href="listHref()" class="inline-flex items-center gap-x-1 text-sm text-muted-foreground-1 hover:text-foreground focus:outline-hidden focus-visible:underline">
    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span x-text="`${w.name} deliveries`"></span>
  </a>
  <h1 class="mt-2 text-lg md:text-xl font-semibold text-foreground" x-text="d.event"></h1>
  <p class="mt-1 flex items-center gap-x-1.5 text-sm text-muted-foreground-1">
    <span x-text="d.id"></span>
    <button type="button" @click="copy('id', d.id)" :aria-label="copied === 'id' ? 'Copied' : 'Copy delivery ID'" :title="copied === 'id' ? 'Copied' : 'Copy'"
            class="shrink-0 inline-flex p-0.5 rounded-sm hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
      <svg x-show="copied !== 'id'" class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <svg x-show="copied === 'id'" x-cloak class="size-3.5 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </p>
</div>
