<!-- The frozen request body, exactly as sent on every attempt. Copy for the developer. -->
<section class="bg-card border border-card-line shadow-2xs rounded-xl min-w-0" aria-labelledby="dl-payload">
  <div class="flex items-center justify-between gap-3 min-h-14 py-2 ps-5 pe-3 border-b border-card-line">
    <div class="min-w-0">
      <h2 id="dl-payload" class="text-base font-semibold text-foreground">Payload</h2>
      <p class="text-[13px] text-muted-foreground-1">Sent the same on every attempt</p>
    </div>
    <button type="button" @click="copy('payload', body)"
            class="shrink-0 inline-flex items-center gap-x-1.5 py-1.5 px-2.5 rounded-lg text-[13px] font-medium bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
      <svg x-show="copied !== 'payload'" class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <svg x-show="copied === 'payload'" x-cloak class="size-3.5 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span x-text="copied === 'payload' ? 'Copied' : 'Copy'"></span>
    </button>
  </div>
  <pre class="p-5 overflow-x-auto font-mono text-[12.5px] leading-6 text-foreground [&::-webkit-scrollbar]:h-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb"><code x-html="highlighted"></code></pre>
</section>
