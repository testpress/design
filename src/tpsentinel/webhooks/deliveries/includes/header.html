<!-- Back to the webhook, then the title. Tests live on the Test page, so say where. -->
<div x-show="view !== 'missing'">
  <a :href="detailHref()" class="inline-flex items-center gap-x-1 text-sm text-muted-foreground-1 hover:text-foreground focus:outline-hidden focus-visible:underline">
    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span x-text="w.name"></span>
  </a>
  <div class="mt-2 flex flex-wrap items-end justify-between gap-3">
    <h1 class="text-lg md:text-xl font-semibold text-foreground">Deliveries</h1>
    <p class="text-[13px] text-muted-foreground-1">
      <span x-text="`Kept for ${retention} days`"></span>
      <span aria-hidden="true">·</span>
      <a href="#" class="hover:text-foreground hover:underline focus:outline-hidden focus-visible:underline">Test deliveries are on the Test page</a>
    </p>
  </div>
</div>
