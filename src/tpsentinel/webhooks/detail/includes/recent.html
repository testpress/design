<!-- Recent deliveries: the latest 5 business deliveries (tests excluded), rows like Review Cases, link to the full history -->
<section class="bg-card border border-card-line shadow-2xs rounded-xl" aria-labelledby="wh-recent">
  <div class="flex items-center justify-between gap-3 min-h-14 py-2 ps-5 pe-4 border-b border-card-line">
    <h2 id="wh-recent" class="text-base font-semibold text-foreground">Recent deliveries</h2>
    <a x-show="w.recent.length" :href="`/tpsentinel/webhooks/deliveries/?id=${w.id}`" class="inline-flex items-center gap-x-1 text-sm font-medium text-primary hover:text-primary-hover hover:underline focus:outline-hidden focus-visible:underline">
      View all
      <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>
  </div>

  <ul x-show="w.recent.length" role="list">
    <template x-for="r in w.recent" :key="r.id">
      <li>
        <a href="#" class="group flex items-start gap-x-3 py-3 ps-5 pe-4 hover:bg-muted-hover border-t border-card-line first:border-t-0 focus:outline-hidden focus-visible:bg-muted-hover">
          <span class="shrink-0 flex items-center h-6" :class="dTone(r)" x-html="dIcon(r)" aria-hidden="true"></span>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 min-h-6">
              <span class="font-medium text-foreground" x-text="r.event"></span>
              <span class="text-sm text-muted-foreground-1" x-text="r.id"></span>
            </div>
            <p class="mt-0.5 text-[13px] leading-5 text-muted-foreground-1">
              <span class="font-medium text-foreground" x-text="dWord(r)"></span>
              <span aria-hidden="true">·</span>
              <span :title="exact(r.at)" x-text="ago(r.at)"></span>
            </p>
          </div>
          <svg class="self-center shrink-0 size-4 text-muted-foreground-2 group-hover:text-foreground transition-colors" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </li>
    </template>
  </ul>

  <!-- None yet -->
  <div x-show="!w.recent.length" class="p-5 min-h-[180px] flex flex-col justify-center items-center text-center">
    <p class="font-medium text-foreground">No deliveries yet</p>
    <p class="mt-1 max-w-sm text-sm text-muted-foreground-1">They show here when one of its events happens. Tests are listed on the Test page.</p>
  </div>
</section>
