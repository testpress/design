{% from "src/tpsentinel/components/button.html" import button %}

<!-- Loading: same shape as the page -->
<div x-show="simulate === 'loading'" x-cloak class="flex flex-col gap-5 animate-pulse" aria-busy="true" aria-label="Loading webhook">
  <div class="space-y-2.5"><div class="h-3.5 w-20 rounded-full bg-surface"></div><div class="h-6 w-56 rounded-full bg-surface"></div><div class="h-3.5 w-80 max-w-full rounded-full bg-surface"></div></div>
  <div class="h-24 rounded-xl bg-surface"></div>
  <div class="grid lg:grid-cols-[minmax(0,1fr)_20rem] gap-5"><div class="h-72 rounded-xl bg-surface"></div><div class="h-72 rounded-xl bg-surface"></div></div>
</div>

<!-- Not found: deleted by cleanup, another organization's, or a bad link. Says so without guessing which. -->
<div x-show="simulate === 'missing'" x-cloak class="bg-card border border-card-line shadow-2xs rounded-xl p-5 min-h-[320px] flex flex-col justify-center items-center text-center">
  <p class="font-medium text-foreground">This webhook isn't available</p>
  <p class="mt-1 max-w-sm text-sm text-muted-foreground-1">It may have been removed, or the link is wrong.</p>
  <div class="mt-4">{{ button(text="Back to webhooks", variant="secondary", size="sm", href="/tpsentinel/webhooks/") }}</div>
</div>
