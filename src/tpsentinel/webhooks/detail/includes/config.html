{% from "src/tpsentinel/components/popover.html" import popover %}

<!-- What it sends and where. Labels above values, spacing between, no table lines. -->
<section class="p-5 bg-card border border-card-line shadow-2xs rounded-xl" aria-labelledby="wh-config">
  <div class="flex items-center justify-between gap-3">
    <h2 id="wh-config" class="text-base font-semibold text-foreground">Settings</h2>
    <a x-show="!readOnly" :href="`/tpsentinel/webhooks/edit/?id=${w.id}`" class="text-sm font-medium text-primary hover:text-primary-hover hover:underline focus:outline-hidden focus-visible:underline">Edit</a>
  </div>

  <dl class="mt-4 flex flex-col gap-4 text-sm">
    <div>
      <dt class="text-xs text-muted-foreground-1" x-text="w.events === 'all' ? `All ${allEvents.length} events, and new ones` : `${w.events.length} of ${allEvents.length} events`"></dt>
      <dd class="mt-1.5 flex flex-col gap-1">
        <template x-for="e in (w.events === 'all' ? allEvents : w.events)" :key="e"><span class="text-foreground break-all" x-text="e"></span></template>
      </dd>
    </div>
    <div>
      <dt class="text-xs text-muted-foreground-1">Workspaces</dt>
      <dd class="mt-1.5 flex flex-col gap-1 text-foreground">
        <template x-if="w.workspaces === 'all'"><span>All workspaces, and new ones</span></template>
        <template x-if="w.workspaces !== 'all'">
          <div class="flex flex-col gap-1">
            <template x-for="s in w.workspaces" :key="s"><span x-text="s"></span></template>
          </div>
        </template>
      </dd>
    </div>
    <div>
      <dt class="text-xs text-muted-foreground-1">Signing secret</dt>
      <dd class="mt-1.5 font-mono text-[13px] text-foreground">whsec_••••••••</dd>
      <dd class="mt-0.5 text-[13px] text-muted-foreground-1">Shown only when it was added</dd>
    </div>
  </dl>

  <p class="mt-5 text-[13px] leading-5 text-muted-foreground-1">
    <span :title="exact(w.createdAt)" x-text="`Added ${ago(w.createdAt)}${w.createdBy ? ' by ' + w.createdBy : ''}`"></span>
    <template x-if="w.updatedAt && w.updatedAt - w.createdAt > 60000">
      <span> · <span :title="exact(w.updatedAt)" x-text="`Updated ${ago(w.updatedAt)}`"></span></span>
    </template>
  </p>
</section>
