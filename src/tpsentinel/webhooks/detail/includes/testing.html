<!-- Testing: the latest test and the way in. Tests never change health. -->
<section class="p-5 bg-card border border-card-line shadow-2xs rounded-xl" aria-labelledby="wh-test">
  <div class="flex items-center justify-between gap-3">
    <h2 id="wh-test" class="text-base font-semibold text-foreground">Testing</h2>
    <a x-show="!readOnly" :href="`/tpsentinel/webhooks/test/?id=${w.id}`" class="inline-flex items-center gap-x-1 text-sm font-medium text-primary hover:text-primary-hover hover:underline focus:outline-hidden focus-visible:underline">
      Open
      <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>
  </div>

  <!-- Latest test: result first, then what happened and when -->
  <template x-if="lastTest">
    <div class="mt-4">
      <p class="text-xs text-muted-foreground-1">Last test</p>
      <div class="mt-1.5 flex items-start gap-x-2.5">
        <span class="shrink-0 flex items-center h-5" :class="dTone(lastTest)" x-html="dIcon(lastTest)"></span>
        <div class="min-w-0">
          <p class="text-sm font-medium text-foreground" x-text="testHeadline(lastTest)"></p>
          <p class="mt-0.5 text-[13px] text-muted-foreground-1">
            <span x-text="testDetail(lastTest)"></span><span x-show="testDetail(lastTest)" aria-hidden="true"> · </span><span :title="exact(lastTest.at)" x-text="ago(lastTest.at)"></span>
          </p>
        </div>
      </div>
    </div>
  </template>
  <p x-show="!lastTest" class="mt-4 text-sm text-muted-foreground-1">No tests sent yet</p>

  <!-- What a test never does: short, with a neutral icon, set apart by spacing -->
  <p x-show="!readOnly" class="mt-5 flex items-center gap-x-2 text-[13px] text-muted-foreground-1">
    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    Tests don't change its status
  </p>
</section>
