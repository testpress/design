<!-- Testing: last test result and the way in. Tests never change health. -->
<section class="p-5 bg-card border border-card-line shadow-2xs rounded-xl" aria-labelledby="wh-test">
  <div class="flex items-center justify-between gap-3">
    <h2 id="wh-test" class="text-base font-semibold text-foreground">Testing</h2>
    <a x-show="!readOnly" href="#" class="inline-flex items-center gap-x-1 text-sm font-medium text-primary hover:text-primary-hover hover:underline focus:outline-hidden focus-visible:underline">
      Open
      <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>
  </div>
  <template x-if="w.lastTest">
    <p class="mt-3 flex items-center gap-x-2 text-sm">
      <svg class="shrink-0 size-4" :class="w.lastTest.ok ? 'text-teal-600 dark:text-teal-500' : 'text-red-600 dark:text-red-500'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path x-show="w.lastTest.ok" d="m9 12 2 2 4-4"/><path x-show="!w.lastTest.ok" d="m15 9-6 6M9 9l6 6"/></svg>
      <span class="text-foreground" x-text="`Last test ${w.lastTest.ok ? 'delivered' : 'failed'} · ${w.lastTest.status}`"></span>
      <span class="text-muted-foreground-1" :title="exact(w.lastTest.at)" x-text="ago(w.lastTest.at)"></span>
    </p>
  </template>
  <p x-show="!w.lastTest" class="mt-3 text-sm text-muted-foreground-1">No tests sent yet</p>
  <p x-show="!readOnly" class="mt-1 text-[13px] text-muted-foreground-1">A test doesn't change the status or reactivate the webhook.</p>
</section>
