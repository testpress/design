<script>
  // Shared prototype data for the Webhooks pages (list, details, and later deliveries/test), as Review Cases does
  // with review_cases/data.html. Changes made on a page (disable, reactivate, archive) are kept in sessionStorage,
  // so the list and the details page agree. Field names follow the PRD's subscription representation.
  window.WH = (function () {
    const KEY = 'tpsentinel.webhooks';
    const MIN = 60e3, HR = 36e5, DAY = 864e5;
    const EVENTS = ['candidate.integrity_updated', 'review_case.completed', 'session.completed'];
    const THRESHOLD = 10;

    function seed() {
      const now = Date.now();
      const ok = (ago) => ({ ok: true, status: 200, at: now - ago });
      return [
        { id: 'wh_01', name: 'Testpress exam attempts', url: 'https://icai.testpress.in/api/webhooks/tpsentinel/', state: 'active',
          events: 'all', workspaces: 'all', failures: 0, lastSuccess: now - 4 * MIN, lastFailure: now - 6 * DAY,
          createdAt: now - 41 * DAY, createdBy: 'Hari', updatedAt: now - 41 * DAY, lastTest: ok(6 * DAY) },
        { id: 'wh_02', name: 'Certificate service', url: 'https://certs.icai.org/hooks/proctoring', state: 'unhealthy',
          events: ['candidate.integrity_updated'], workspaces: ['CA Final · Nov 2026', 'CA Intermediate · Nov 2026'],
          failures: 10, lastSuccess: now - 3 * DAY, lastFailure: now - 2 * HR,
          createdAt: now - 34 * DAY, createdBy: 'Hari', updatedAt: now - 3 * DAY, lastTest: { ok: false, status: 500, at: now - 5 * MIN } },
        { id: 'wh_03', name: 'Exam operations alerts', url: 'https://hooks.zapier.com/hooks/catch/18273/abx9k2/', state: 'active',
          events: ['review_case.completed', 'candidate.integrity_updated'], workspaces: 'all',
          failures: 4, lastSuccess: now - 5 * HR, lastFailure: now - 12 * MIN,
          createdAt: now - 19 * DAY, createdBy: 'Priya Nair', updatedAt: now - 19 * DAY, lastTest: ok(19 * DAY) },
        { id: 'wh_04', name: 'Analytics warehouse', url: 'https://ingest.icai-analytics.in/v1/events/tpsentinel', state: 'active',
          events: 'all', workspaces: ['CA Foundation · Dec 2026'], failures: 0, lastSuccess: now - 26 * MIN, lastFailure: null,
          createdAt: now - 12 * DAY, createdBy: 'Hari', updatedAt: now - 5 * DAY, lastTest: ok(12 * DAY) },
        { id: 'wh_05', name: 'Audit log forwarder', url: 'https://audit.icai.org/ingest/tpsentinel', state: 'active',
          events: ['candidate.integrity_updated', 'review_case.completed', 'session.completed'], workspaces: 'all',
          failures: 0, lastSuccess: null, lastFailure: null,
          createdAt: now - 2 * HR, createdBy: 'Priya Nair', updatedAt: now - 2 * HR, lastTest: null },
        { id: 'wh_06', name: 'Testpress staging', url: 'https://staging.icai.testpress.in/api/webhooks/tpsentinel/', state: 'disabled',
          events: 'all', workspaces: 'all', failures: 0, lastSuccess: now - 9 * DAY, lastFailure: null,
          createdAt: now - 60 * DAY, createdBy: 'Hari', updatedAt: now - 8 * DAY, lastTest: ok(9 * DAY) },
        { id: 'wh_07', name: 'Old certificate service', url: 'https://legacy-certs.icai.org/hook', state: 'archived',
          events: ['candidate.integrity_updated'], workspaces: 'all', failures: 0, lastSuccess: now - 22 * DAY, lastFailure: null,
          createdAt: now - 90 * DAY, createdBy: 'Hari', updatedAt: now - 20 * DAY, archivedAt: now - 20 * DAY, lastTest: ok(60 * DAY) },
        { id: 'wh_08', name: 'Pilot test endpoint', url: 'https://webhook.site/7f1c2a9e-1b0d-4c55', state: 'archived',
          events: 'all', workspaces: ['CA Foundation · Jun 2026'], failures: 0, lastSuccess: now - 50 * DAY, lastFailure: null,
          createdAt: now - 120 * DAY, createdBy: 'Priya Nair', updatedAt: now - 48 * DAY, archivedAt: now - 48 * DAY, lastTest: ok(118 * DAY) },
      ];
    }

    function load() {
      try { const s = JSON.parse(sessionStorage.getItem(KEY)); if (Array.isArray(s) && s.length) return s; } catch (e) {}
      return seed();
    }
    function save(list) { try { sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { /* not remembered */ } }
    function reset() { try { sessionStorage.removeItem(KEY); } catch (e) {} }

    // What the status words and icons follow
    function kind(w) {
      if (w.state === 'archived') return 'archived';
      if (w.state === 'disabled') return 'disabled';
      if (w.state === 'unhealthy') return 'stopped';
      if (w.failures) return 'failing';
      return w.lastSuccess ? 'delivering' : 'new';
    }

    // Business-delivery history for a webhook, newest first, consistent with its health. Prototype stand-in for the
    // delivery list API (tests excluded, kept for RETENTION_DAYS). The details page shows the first 5.
    const RETENTION_DAYS = 30;
    function history(w) {
      const k = kind(w);
      if (k === 'new') return [];
      const now = Date.now();
      const ev = w.events === 'all' ? EVENTS : w.events;
      const n = parseInt(String(w.id).replace(/\D/g, ''), 10) || 7;
      let seed = n * 9301 + 49297;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const ID = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
      const mkId = () => 'dlv_01JD' + Array.from({ length: 6 }, () => ID[Math.floor(rnd() * ID.length)]).join('');
      const out = [];
      // t = when the last attempt ran (or when it was cancelled). Created time works back along the 5 / 20 / 60 min retry schedule.
      const BACK = [0, 0, 5, 20, 60];
      const add = (state, status, attempts, t, extra = {}) => out.push(Object.assign({
        id: mkId(), event: ev[Math.floor(rnd() * ev.length)], state, status, attempts,
        at: t - (BACK[attempts] || 0) * MIN, lastAttemptAt: attempts ? t : null,
      }, extra));
      const ls = w.lastSuccess || now, lf = w.lastFailure;
      let t;
      if (k === 'failing') {
        add('retry', null, 2, now - 4 * MIN, { failure: 'Timed out after 10s', nextAt: now + 11 * MIN });
        add('failed', 500, 4, lf); add('failed', 503, 4, lf - 48 * MIN); add('failed', 500, 4, lf - 2 * HR);
        add('failed', 410, 1, lf - 3 * HR);
        t = ls;
      } else if (k === 'stopped') {
        add('cancelled', null, 0, lf, { failure: 'Cancelled when the webhook stopped' });
        add('cancelled', null, 1, lf - MIN, { failure: 'Cancelled when the webhook stopped' });
        for (let i = 0; i < 9; i++) add('failed', i % 4 === 3 ? null : (i % 3 ? 500 : 502), 4, lf - (i * 37 + 3) * MIN, i % 4 === 3 ? { failure: 'Connection refused' } : {});
        add('failed', 301, 1, lf - 6 * HR);
        t = ls;
      } else if (k === 'disabled') {
        add('cancelled', null, 0, w.updatedAt, { failure: 'Cancelled when the webhook was disabled' });
        add('cancelled', null, 0, w.updatedAt - 2 * MIN, { failure: 'Cancelled when the webhook was disabled' });
        t = ls;
      } else if (k === 'delivering') {
        add('pending', null, 0, now - 4 * 1000);
        add('processing', null, 1, now - 20 * 1000);
        t = ls;
      } else { t = ls; }
      // Older traffic, mostly delivered, the odd retry, within the retention window
      const oldest = now - RETENTION_DAYS * DAY;
      while (t > oldest && out.length < 86) {
        const r = rnd();
        if (r < 0.06) add('failed', 500, 4, t);
        else if (r < 0.14) add('succeeded', 200, 2, t);
        else add('succeeded', 200, 1, t);
        t -= (25 + rnd() * 260) * MIN;
      }
      return out;
    }
    function recent(w) { return history(w).slice(0, 5); }
    // webhook.test deliveries for a webhook, newest first: a few seeded ones plus any sent in this session.
    // Same fields and states as business deliveries (tests use the normal send and retry path).
    const TKEY = 'tpsentinel.webhookTests';
    function sentTests() { try { return JSON.parse(sessionStorage.getItem(TKEY)) || {}; } catch (e) { return {}; } }
    function saveTest(wid, t) {
      const all = sentTests(); all[wid] = (all[wid] || []).filter(x => x.id !== t.id); all[wid].unshift(t);
      try { sessionStorage.setItem(TKEY, JSON.stringify(all)); } catch (e) {}
    }
    function tests(w) {
      const now = Date.now(), n = parseInt(String(w.id).replace(/\D/g, ''), 10) || 7;
      const id = (i) => 'dlv_01JT' + ((n * 31 + i * 7) * 7919).toString(36).toUpperCase().slice(-6).padStart(6, '0');
      const T = (i, state, status, attempts, at, extra = {}) => Object.assign({ id: id(i), event: 'webhook.test', state, status, attempts,
        at: at - ([0, 0, 5, 20, 60][attempts] || 0) * MIN, lastAttemptAt: attempts ? at : null }, extra);
      const seeded = [];
      const lt = w.lastTest;
      if (lt && !lt.ok) {
        seeded.push(Object.assign(T(0, 'retry', 500, 3, now - 5 * MIN), { failure: '500 Internal Server Error', nextAt: now + 35 * MIN }));
        seeded.push(T(1, 'failed', 500, 4, now - 2 * HR));
      } else if (lt) {
        seeded.push(T(0, 'succeeded', 200, 1, lt.at));
      }
      if (lt && now - (w.createdAt || now) > 2 * DAY) seeded.push(T(2, 'succeeded', 200, 1, w.createdAt + 3 * MIN));
      const oldest = now - RETENTION_DAYS * DAY;
      return [...(sentTests()[w.id] || []), ...seeded.filter(t => t.at > oldest)].sort((a, b) => b.at - a.at);
    }

    function findDelivery(w, id) { return history(w).find(d => d.id === id) || null; }
    function findTest(w, id) { return tests(w).find(d => d.id === id) || null; }

    // Generic failure type, from what the worker records (latest status or the connection error)
    function failureType(d) {
      if (d.state === 'cancelled') return null;
      if (d.status >= 300 && d.status < 400) return 'redirect';
      if (d.status === 408 || d.status === 429 || d.status >= 500) return 'server';
      if (d.status >= 400) return 'client';
      if (/timed out/i.test(d.failure || '')) return 'timeout';
      if (/refused|connect/i.test(d.failure || '')) return 'connection';
      if (/tls|certificate/i.test(d.failure || '')) return 'tls';
      if (/private|blocked/i.test(d.failure || '')) return 'blocked';
      return null;
    }

    // Frozen JSON body for a delivery (prototype sample; the real one comes from the event producer)
    function payload(w, d) {
      const ws = w.workspaces === 'all' ? 'CA Final · Nov 2026' : w.workspaces[0];
      const n = d.id.slice(-4);
      const data = {
        'candidate.integrity_updated': {
          workspace: { id: 'ws_7Q2K', name: ws },
          candidate: { id: 'cand_' + n, external_id: 'ICAI-SRO04' + n.replace(/\D/g, '7').slice(0, 4) },
          integrity: { result: 'flagged', review_required: true, anomalies: ['multiple_faces', 'looking_away'] },
          review_url: 'https://app.tpsentinel.com/review/RC-2' + n.replace(/\D/g, '4').slice(0, 3),
        },
        'review_case.completed': {
          workspace: { id: 'ws_7Q2K', name: ws },
          review_case: { id: 'RC-2' + n.replace(/\D/g, '4').slice(0, 3), decision: 'clear', decided_by: 'Meera Sharma' },
          candidate: { id: 'cand_' + n },
        },
        'webhook.test': {
          message: 'This is a test request from TPSentinel. No action is needed.',
          webhook: { id: w.id, name: w.name },
        },
        'session.completed': {
          workspace: { id: 'ws_7Q2K', name: ws },
          session: { id: 'ses_' + n, ended_reason: 'submitted', duration_seconds: 5420 },
          candidate: { id: 'cand_' + n },
        },
      }[d.event];
      return JSON.stringify({ id: d.id, type: d.event, created_at: new Date(d.at).toISOString(), data }, null, 2);
    }



    // Lucide icons for empty states (inline: Lucide tags don't render in markup that appears after load)
    const ICONS = {
      inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
      search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
      filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
      history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
      ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
      pause: '<circle cx="12" cy="12" r="10"/><path d="M10 15V9"/><path d="M14 15V9"/>',
      archive: '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
      zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
      send: '<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
      check: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
      x: '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>',
      unlink: '<path d="m18.84 12.25 1.72-1.71h-.02a5.004 5.004 0 0 0-.12-7.07 5.006 5.006 0 0 0-6.95 0l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5.004 5.004 0 0 0 .12 7.07 5.006 5.006 0 0 0 6.95 0l1.71-1.71"/><line x1="8" x2="8" y1="2" y2="5"/><line x1="2" x2="5" y1="8" y2="8"/><line x1="16" x2="16" y1="19" y2="22"/><line x1="19" x2="22" y1="16" y2="16"/>',
      cloudOff: '<path d="m2 2 20 20"/><path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193"/><path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07"/>',
    };
    function icon(name) {
      return `<svg class="shrink-0 size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ICONS.inbox}</svg>`;
    }

    return { icon, load, save, reset, seed, kind, recent, history, tests, saveTest, findDelivery, findTest, failureType, payload, RETENTION_DAYS, EVENTS, THRESHOLD, MIN, HR, DAY };
  })();
</script>
