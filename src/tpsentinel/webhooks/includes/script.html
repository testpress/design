<script>
  // Prototype data. Fields follow the PRD's subscription representation:
  // name, endpoint, state, event scope, workspace scope, consecutive failures, last success, last failure.
  const WH_NOW = Date.now();
  const MIN = 60e3, HR = 36e5, DAY = 864e5;
  const WH_THRESHOLD = 10; // consecutive failed business deliveries before a webhook stops

  function whSample(kind) {
    const base = [
      { id: 'wh_01', name: 'Testpress exam attempts', url: 'https://icai.testpress.in/api/webhooks/tpsentinel/', state: 'active',
        events: 'all', workspaces: 'all', failures: 0, lastSuccess: WH_NOW - 4 * MIN, lastFailure: WH_NOW - 6 * DAY },
      { id: 'wh_02', name: 'Certificate service', url: 'https://certs.icai.org/hooks/proctoring', state: 'unhealthy',
        events: ['candidate.integrity_updated'], workspaces: ['CA Final · Nov 2026', 'CA Intermediate · Nov 2026'],
        failures: 10, lastSuccess: WH_NOW - 3 * DAY, lastFailure: WH_NOW - 2 * HR },
      { id: 'wh_03', name: 'Exam operations alerts', url: 'https://hooks.zapier.com/hooks/catch/18273/abx9k2/', state: 'active',
        events: ['review_case.completed', 'candidate.integrity_updated'], workspaces: 'all',
        failures: 4, lastSuccess: WH_NOW - 5 * HR, lastFailure: WH_NOW - 12 * MIN },
      { id: 'wh_04', name: 'Analytics warehouse', url: 'https://ingest.icai-analytics.in/v1/events/tpsentinel', state: 'active',
        events: 'all', workspaces: ['CA Foundation · Dec 2026'], failures: 0, lastSuccess: WH_NOW - 26 * MIN, lastFailure: null },
      { id: 'wh_05', name: 'Audit log forwarder', url: 'https://audit.icai.org/ingest/tpsentinel', state: 'active',
        events: ['candidate.integrity_updated', 'review_case.completed', 'session.completed'], workspaces: 'all',
        failures: 0, lastSuccess: null, lastFailure: null },
      { id: 'wh_06', name: 'Testpress staging', url: 'https://staging.icai.testpress.in/api/webhooks/tpsentinel/', state: 'disabled',
        events: 'all', workspaces: 'all', failures: 0, lastSuccess: WH_NOW - 9 * DAY, lastFailure: null, updatedAt: WH_NOW - 8 * DAY },
      { id: 'wh_07', name: 'Old certificate service', url: 'https://legacy-certs.icai.org/hook', state: 'archived',
        events: ['candidate.integrity_updated'], workspaces: 'all', failures: 0, lastSuccess: WH_NOW - 22 * DAY, lastFailure: null, archivedAt: WH_NOW - 20 * DAY },
      { id: 'wh_08', name: 'Pilot test endpoint', url: 'https://webhook.site/7f1c2a9e-1b0d-4c55', state: 'archived',
        events: 'all', workspaces: ['CA Foundation · Jun 2026'], failures: 0, lastSuccess: WH_NOW - 50 * DAY, lastFailure: null, archivedAt: WH_NOW - 48 * DAY },
    ];
    if (kind === 'healthy') {
      return base.map(w => w.state === 'archived' || w.state === 'disabled' ? w
        : Object.assign({}, w, { state: 'active', failures: 0, lastSuccess: w.lastSuccess || WH_NOW - 40 * MIN }));
    }
    if (kind === 'allArchived') {
      return base.filter(w => w.state === 'archived');
    }
    if (kind === 'noArchived') {
      return base.filter(w => w.state !== 'archived');
    }
    return base;
  }

  function webhooksPage() {
    return {
      simulate: 'data',          // data | empty | loading | error
      protoState: 'mixed',
      // One tab per state. Archived is never shown unless its tab is picked (PRD: hidden by default).
      view: 'active',
      views: [{ key: 'active', label: 'Active' }, { key: 'unhealthy', label: 'Stopped' }, { key: 'disabled', label: 'Disabled' }, { key: 'archived', label: 'Archived' }],
      filters: { event: '', workspace: '' },
      filterLabel: { status: 'Status', event: 'Event', workspace: 'Workspace' },
      all: whSample('mixed'),

      protoGroups: [
        { name: 'List', states: [
          ['mixed', 'One stopped, one failing'],
          ['healthy', 'All delivering'],
          ['stopped', 'Stopped tab'],
          ['archived', 'Archived tab'],
          ['noArchived', 'Archived tab, none'],
          ['allArchived', 'Everything archived'],
        ] },
        { name: 'Page', states: [
          ['empty', 'First use (no webhooks)'],
          ['loading', 'Loading'],
          ['error', "Couldn't load"],
        ] },
      ],

      pickState(s) {
        this.protoState = s;
        this.filters = { event: '', workspace: '' };
        this.view = s === 'archived' || s === 'noArchived' ? 'archived' : s === 'stopped' ? 'unhealthy' : 'active';
        if (['empty', 'loading', 'error'].includes(s)) { this.simulate = s; return; }
        this.simulate = 'data';
        this.all = whSample(s === 'archived' || s === 'stopped' ? 'mixed' : s);
      },
      retry() {
        this.simulate = 'loading';
        setTimeout(() => { this.simulate = 'data'; this.protoState = 'mixed'; }, 900);
      },
      setFilter(key, v) { this.filters[key] = v; },
      clearFilters() { this.filters = { event: '', workspace: '' }; },
      setView(v) { this.view = v; },
      inView(w, v) { return w.state === v; },
      inStatus(w) { return this.inView(w, this.view); },
      viewCount(v) { return this.all.filter(w => this.inView(w, v) && this.matchesFilters(w)).length; },
      optionLabel(key, o) {
        return key === 'status' ? { active: 'Active', unhealthy: 'Stopped', disabled: 'Disabled', archived: 'Archived' }[o] : o;
      },
      matchesFilters(w) {
        const f = this.filters;
        if (f.event && w.events !== 'all' && !w.events.includes(f.event)) return false;
        if (f.workspace && w.workspaces !== 'all' && !w.workspaces.includes(f.workspace)) return false;
        return true;
      },
      filterOptions(key) {
        const set = new Set();
        if (key === 'status') return ['active', 'unhealthy', 'disabled'];
        if (key === 'event') { ['candidate.integrity_updated', 'review_case.completed', 'session.completed'].forEach(e => set.add(e)); }
        else { this.all.forEach(w => w.workspaces !== 'all' && w.workspaces.forEach(x => set.add(x))); }
        return [...set].sort();
      },

      // Needs attention first: stopped, then failing, then active, then never delivered, then disabled
      rank(w) {
        if (w.state === 'unhealthy') return 0;
        if (w.state === 'active' && w.failures) return 1;
        if (w.state === 'active' && w.lastSuccess) return 2;
        if (w.state === 'active') return 3;
        if (w.state === 'disabled') return 4;
        return 5;
      },
      get rows() {
        const list = this.all.filter(w => this.inStatus(w) && this.matchesFilters(w));
        return this.view === 'archived'
          ? list.sort((a, b) => b.archivedAt - a.archivedAt)
          : list.sort((a, b) => this.rank(a) - this.rank(b));
      },
      emptyTitle() {
        if (this.filters.event || this.filters.workspace) return 'No webhooks match these filters';
        return `No ${this.views.find(v => v.key === this.view).label.toLowerCase()} webhooks`;
      },
      emptyText() {
        if (this.filters.event || this.filters.workspace) return '';
        return {
          active: 'Nothing is being sent right now.',
          unhealthy: 'A webhook stops after 10 failed deliveries in a row and shows up here.',
          disabled: 'Disable a webhook to pause it. Nothing is sent until you reactivate it.',
          archived: 'Archive a webhook you no longer need. Its delivery history stays here until cleanup.',
        }[this.view];
      },

      // Status word for the icon tooltip
      statusWord(w) {
        if (w.state === 'unhealthy') return 'Stopped';
        if (w.state === 'disabled') return 'Disabled';
        if (w.state === 'archived') return 'Archived';
        if (w.failures) return 'Active, failing';
        return w.lastSuccess ? 'Active' : 'Active, no deliveries yet';
      },
      // Meta line: what is happening (bold), then when / what happens next
      health(w) {
        const ex = t => t ? this.exact(t) : '';
        if (w.state === 'archived') return { title: `Archived ${this.ago(w.archivedAt)}`, more: [`Last delivered ${this.ago(w.lastSuccess)}`], exact: ex(w.archivedAt) };
        if (w.state === 'disabled') return { title: `Disabled ${this.ago(w.updatedAt)}`, more: [], exact: ex(w.updatedAt) };
        if (w.state === 'unhealthy') return {
          title: `Stopped after ${WH_THRESHOLD} failed deliveries`,
          more: [w.lastSuccess ? `Last delivered ${this.ago(w.lastSuccess)}` : 'Never delivered'],
          exact: ex(w.lastFailure),
        };
        if (w.failures) return {
          title: `${w.failures} failed in a row`,
          more: [`Stops at ${WH_THRESHOLD}`, `Last delivered ${this.ago(w.lastSuccess)}`],
          exact: ex(w.lastFailure),
        };
        if (w.lastSuccess) return { title: `Delivered ${this.ago(w.lastSuccess)}`, more: [], exact: ex(w.lastSuccess) };
        return { title: 'No deliveries yet', more: [], exact: '' };
      },
      tone(w) {
        if (w.state === 'unhealthy') return 'text-red-600 dark:text-red-500';
        if (w.state === 'active' && w.failures) return 'text-amber-500 dark:text-amber-400';
        if (w.state === 'active' && w.lastSuccess) return 'text-teal-600 dark:text-teal-500';
        return 'text-muted-foreground-2';
      },
      icon(w) {
        const s = p => `<svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
        if (w.state === 'unhealthy') return s('<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>');
        if (w.state === 'disabled') return s('<circle cx="12" cy="12" r="10"/><path d="M10 15V9"/><path d="M14 15V9"/>');
        if (w.state === 'archived') return s('<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>');
        if (w.failures) return s('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>');
        if (w.lastSuccess) return s('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>');
        return s('<path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 21.818a10 10 0 0 1-3.8 0"/><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"/><path d="M2.182 13.9a10 10 0 0 1 0-3.8"/><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"/><path d="M21.818 10.1a10 10 0 0 1 0 3.8"/><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"/><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"/>');
      },

      // Opens the webhook. Disable / reactivate / archive / test live on the details page (next round, PR 14).
      openWebhook(w) {},

      // Formatting
      shortUrl(u) { return u.replace(/^https:\/\//, ''); },
      ago(t) {
        if (!t) return 'never';
        const d = Date.now() - t;
        if (d < MIN) return 'just now';
        if (d < HR) return `${Math.round(d / MIN)} min ago`;
        if (d < DAY) return `${Math.round(d / HR)} h ago`;
        const days = Math.round(d / DAY);
        return days === 1 ? 'yesterday' : days < 30 ? `${days} days ago` : new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
      },
      exact(t) { return new Date(t).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); },
    };
  }
</script>
