        View all workspaces →
      </a>

  <!-- End Footer -->
</div>
<!-- End Active Workspaces Card -->

<script>
  function activeWorkspacesCard() {
    return {
      workspaces: [],
      loading: true,
      fetching: false,
      hasData: false,
      error: null,
      lastUpdated: null,
      refreshInterval: null,
      isInitialized: false,

      async init() {
        if (this.isInitialized) {
          return;
        }
        this.isInitialized = true;

        await this.fetchData();
        // Auto-refresh every 60 seconds
        this.refreshInterval = setInterval(() => this.fetchData(), 60000);

        return () => {
          if (this.refreshInterval) {
            clearInterval(this.refreshInterval);
          }
        };
      },

      async fetchData() {
        // Prevent concurrent fetches
        if (this.fetching) {
          return;
        }

        this.fetching = true;
        if (!this.hasData) {
          this.loading = true;
        }

        try {
          this.error = null;

          const data = {
            workspaces: [
              {
                id: 1,
                name: 'Engineering Workspace',
                candidate_count: 1250,
                flag_count: 8,
                percentage: 65
              },
              {
                id: 2,
                name: 'Product Development',
                candidate_count: 890,
                flag_count: 5,
                percentage: 45
              },
              {
                id: 3,
                name: 'Quality Assurance',
                candidate_count: 620,
                flag_count: 12,
                percentage: 32
              },
              {
                id: 4,
                name: 'Design Team',
                candidate_count: 430,
                flag_count: 3,
                percentage: 22
              },
              {
                id: 5,
                name: 'Operations',
                candidate_count: 310,
                flag_count: 7,
                percentage: 16
              }
            ],
            updated_at: '2026-03-17T09:30:00Z'
          };
          this.workspaces = data.workspaces || [];
          this.error = null;
          this.hasData = true;
          this.loading = false;
        } catch (err) {
          console.error('Error fetching workspace data:', err);
          this.error = err.message || 'Failed to load workspace data';
          this.workspaces = [];
          this.hasData = true;
          this.loading = false;
        } finally {
          this.fetching = false;
        }
      }
    };
  }
</script>
