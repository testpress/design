{% from "./icons.html" import icon, play %}

{#- One evidence thumbnail. `m` is the item in the surrounding Alpine loop; `click` is the handler. -#}
{% macro evidence_tile(click) %}
<button type="button" @click="{{ click }}"
  class="group text-start rounded-lg focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
  :aria-label="'Open ' + (m.anomaly || m.label) + ' at ' + formatEvidenceTime(m)">
  <span class="relative block aspect-video rounded-lg overflow-hidden bg-surface">
    <template x-if="m.src && !m.reference">
      <img class="size-full object-cover group-hover:opacity-90" :src="m.src" alt="" loading="lazy">
    </template>
    <template x-if="m.reference">
      <span class="size-full grid grid-cols-2 gap-0.5 group-hover:opacity-90">
        <img class="size-full object-cover" :src="m.reference" alt="" loading="lazy">
        <img class="size-full object-cover" :src="m.src" alt="" loading="lazy">
      </span>
    </template>
    <template x-if="!m.src">
      <span class="size-full flex flex-col items-center justify-center gap-1 text-surface-foreground">
        {{ icon("mic", "size-5") }}
        <span class="text-xs">Audio</span>
      </span>
    </template>
    <template x-if="m.length">
      <span class="absolute bottom-1.5 end-1.5 inline-flex items-center gap-x-1 py-0.5 px-1.5 rounded-md bg-gray-900/70 text-[11px] font-medium text-white">
        {{ play() }}<span x-text="m.length"></span>
      </span>
    </template>
  </span>
  <span class="mt-1.5 block text-xs font-medium text-foreground" x-text="m.anomaly || m.label"></span>
  <span class="block text-xs text-muted-foreground" x-text="formatEvidenceTime(m)"></span>
</button>
{% endmacro %}
