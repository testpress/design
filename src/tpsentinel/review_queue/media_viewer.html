<!-- Media Viewer -->
<div x-show="viewer.open" x-transition.opacity class="fixed inset-0 z-[80] overflow-y-auto" role="dialog"
  aria-modal="true" aria-labelledby="media-viewer-label">
  <div class="fixed inset-0 bg-gray-900/70" @click="closeViewer()"></div>
  <div class="relative sm:max-w-3xl sm:w-full m-3 sm:mx-auto min-h-[calc(100%-56px)] flex items-center">
    <div class="w-full flex flex-col bg-white shadow-sm rounded-xl dark:bg-neutral-800">
      <div class="flex justify-between items-center py-3 px-4 border-b border-gray-200 dark:border-neutral-700">
        <div>
          <h3 id="media-viewer-label" class="font-semibold text-gray-800 dark:text-neutral-200" x-text="viewer.title"></h3>
          <p class="text-xs text-gray-500 dark:text-neutral-400" x-show="viewerItem"
            x-text="viewerItem && (viewerItem.label + ' · ' + viewerItem.time + (viewerItem.length ? ' · ' + viewerItem.length : ''))"></p>
        </div>
        <button type="button" @click="closeViewer()" aria-label="Close"
          class="size-8 inline-flex justify-center items-center rounded-full bg-gray-100 text-gray-800 hover:bg-gray-200 focus:outline-none focus:bg-gray-200 dark:bg-neutral-700 dark:text-neutral-200 dark:hover:bg-neutral-600">
          <span class="sr-only">Close</span>
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="p-4">
        <template x-if="viewerItem && viewerItem.src">
          <div class="relative">
            <img class="w-full max-h-[60vh] object-contain rounded-lg bg-gray-100 dark:bg-neutral-900" :src="viewerItem.src"
              :alt="viewerItem.label + ' at ' + viewerItem.time">
            <span x-show="viewerItem.length" class="absolute inset-0 flex items-center justify-center">
              <span class="inline-flex justify-center items-center size-14 rounded-full bg-gray-900/70 text-white">
                <svg class="shrink-0 size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </span>
            </span>
          </div>
        </template>
        <template x-if="viewerItem && !viewerItem.src">
          <div class="flex flex-col items-center justify-center gap-2 py-16 rounded-lg bg-gray-100 text-gray-600 dark:bg-neutral-900 dark:text-neutral-400">
            <svg class="shrink-0 size-8" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            <span class="text-sm" x-text="'Audio clip · ' + viewerItem.length"></span>
          </div>
        </template>
      </div>

      <div class="flex justify-between items-center gap-x-2 py-3 px-4 border-t border-gray-200 dark:border-neutral-700">
        <span class="text-xs text-gray-500 dark:text-neutral-400"
          x-text="(viewer.index + 1) + ' / ' + viewer.items.length + ' · use ← → to browse'"></span>
        <div class="flex gap-x-2">
          <button type="button" @click="stepViewer(-1)" :disabled="viewer.index === 0"
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-white border border-gray-200 text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-700">Previous</button>
          <button type="button" @click="stepViewer(1)" :disabled="viewer.index >= viewer.items.length - 1"
            class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-white border border-gray-200 text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-700">Next</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- End Media Viewer -->
