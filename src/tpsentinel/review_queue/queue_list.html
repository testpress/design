<!-- Queue List -->
<aside
  class="lg:w-96 shrink-0 flex flex-col lg:sticky lg:top-[3.75rem] lg:h-[calc(100vh-3.75rem)] lg:self-start bg-white border-b lg:border-b-0 lg:border-e border-gray-200 dark:bg-neutral-800 dark:border-neutral-700">
  <div class="p-4 space-y-4 border-b border-gray-200 dark:border-neutral-700">
    <h1 class="flex items-center gap-x-2 text-lg font-semibold text-gray-800 dark:text-neutral-200">
      My review queue
      <span class="inline-flex items-center py-0.5 px-2 rounded-full text-xs font-medium bg-gray-100 text-gray-500 dark:bg-neutral-700 dark:text-neutral-400"
        x-text="cases.length" :aria-label="cases.length + ' cases left'"></span>
    </h1>

    <!-- Search -->
    <div class="relative">
      <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none ps-3.5">
        <svg class="shrink-0 size-4 text-gray-400 dark:text-white/60" xmlns="http://www.w3.org/2000/svg" width="24"
          height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </div>
      <input type="search" x-model="search" aria-label="Search cases"
        class="py-2 ps-10 pe-3 block w-full bg-white border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder:text-neutral-500"
        placeholder="Search name, case ID or workspace">
    </div>
    <!-- End Search -->
  </div>

  <!-- Case List -->
  <ul class="flex-1 lg:overflow-y-auto max-h-80 lg:max-h-none p-2 space-y-1" aria-label="Assigned cases">
    <template x-for="c in filtered" :key="c.id">
      <li>
        <button type="button" :id="'case-' + c.id" @click="select(c.id)" :aria-current="c.id === selectedId"
          class="w-full flex gap-x-3 p-3 text-start rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          :class="c.id === selectedId ? 'bg-gray-100 dark:bg-neutral-700' : 'hover:bg-gray-50 dark:hover:bg-neutral-700/50'">
          <img class="shrink-0 size-10 rounded-full object-cover" :src="c.candidate.photo"
            :alt="'Enrolment photo of ' + c.candidate.name">
          <span class="grow min-w-0">
            <span class="flex items-center justify-between gap-x-2">
              <span class="truncate text-sm font-medium text-gray-800 dark:text-neutral-200" x-text="c.candidate.name"></span>
              <span class="shrink-0 inline-flex items-center py-0.5 px-2 rounded-full text-xs font-medium"
                :class="severityClass(c.risk)" x-text="c.risk"></span>
            </span>
            <span class="block truncate text-xs text-gray-500 dark:text-neutral-400"
              x-text="c.id + ' · ' + c.workspace"></span>
            <span class="mt-1 block truncate text-xs text-gray-700 dark:text-neutral-300" x-text="c.reason"></span>
            <span x-show="c.stale" class="mt-1 block text-xs font-medium text-gray-500 dark:text-neutral-400">
              Out of date · refresh before deciding
            </span>
          </span>
        </button>
      </li>
    </template>

    <li x-show="cases.length && !filtered.length" class="p-4 text-sm text-gray-500 dark:text-neutral-400">
      No cases match “<span x-text="search"></span>”.
    </li>
    <li x-show="!cases.length" class="p-4 text-sm text-gray-500 dark:text-neutral-400">
      No cases left in your queue.
    </li>
  </ul>
  <!-- End Case List -->

  <!-- Keyboard Hint -->
  <div class="hidden lg:flex flex-wrap items-center gap-x-3 gap-y-1 p-3 border-t border-gray-200 text-xs text-gray-500 dark:border-neutral-700 dark:text-neutral-400">
    <span class="inline-flex items-center gap-x-1">
      <kbd class="min-h-6 inline-flex justify-center items-center py-0.5 px-1.5 bg-white border border-gray-200 font-mono text-xs text-gray-800 rounded-md dark:bg-neutral-800 dark:border-neutral-700 dark:text-white">J</kbd>
      <kbd class="min-h-6 inline-flex justify-center items-center py-0.5 px-1.5 bg-white border border-gray-200 font-mono text-xs text-gray-800 rounded-md dark:bg-neutral-800 dark:border-neutral-700 dark:text-white">K</kbd>
      Move
    </span>
    <span class="inline-flex items-center gap-x-1">
      <kbd class="min-h-6 inline-flex justify-center items-center py-0.5 px-1.5 bg-white border border-gray-200 font-mono text-xs text-gray-800 rounded-md dark:bg-neutral-800 dark:border-neutral-700 dark:text-white">C</kbd>
      Clear
    </span>
    <span class="inline-flex items-center gap-x-1">
      <kbd class="min-h-6 inline-flex justify-center items-center py-0.5 px-1.5 bg-white border border-gray-200 font-mono text-xs text-gray-800 rounded-md dark:bg-neutral-800 dark:border-neutral-700 dark:text-white">F</kbd>
      Flagged
    </span>
    <span class="inline-flex items-center gap-x-1">
      <kbd class="min-h-6 inline-flex justify-center items-center py-0.5 px-1.5 bg-white border border-gray-200 font-mono text-xs text-gray-800 rounded-md dark:bg-neutral-800 dark:border-neutral-700 dark:text-white">Enter</kbd>
      Submit
    </span>
  </div>
  <!-- End Keyboard Hint -->
</aside>
<!-- End Queue List -->
