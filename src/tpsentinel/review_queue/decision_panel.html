{% from "src/ui-system/components/radio.html" import radio %}
{% from "src/ui-system/components/textarea.html" import textarea %}
{% from "src/ui-system/components/button.html" import button %}

<!-- Decision: Clear/Flagged sit side by side only when the panel is wide enough -->
<div class="@container">
  <h2 class="font-semibold text-foreground">Your decision</h2>

  <!-- Stale review: refreshing is the only action -->
  <template x-if="current.stale">
    <div class="mt-4 p-4 rounded-lg bg-surface text-sm" role="alert">
      <p class="font-medium text-foreground">New evidence is available</p>
      <p class="mt-1 text-muted-foreground-1">
        <span x-text="current.stale.session"></span> ended <span x-text="current.stale.ended"></span>,
        after this case was opened. Refresh to review it before deciding.
      </p>
      <div class="mt-3">
        {{ button(text="Refresh evidence", variant="primary", extra_attrs='@click="refresh()"') }}
      </div>
    </div>
  </template>

  <template x-if="!current.stale">
    <div class="mt-4 space-y-4">
      <div class="grid @lg:grid-cols-2 gap-2" role="radiogroup" aria-label="Integrity result">
        {{ radio(name="decision", id="decision-clear", value="clear", label="Clear", description="The evidence doesn't show an integrity issue.", x_model="choice", variant="card") }}
        {{ radio(name="decision", id="decision-flagged", value="flagged", label="Flagged", description="The evidence shows an integrity issue.", x_model="choice", variant="card", extra_attrs='@change="$nextTick(() => $refs.notes && $refs.notes.focus())"') }}
      </div>

      <div>
        <label for="decision-notes" class="block mb-2 text-sm font-medium text-foreground">
          Notes <span class="font-normal text-muted-foreground-1" x-text="choice === 'flagged' ? '(required for Flagged)' : '(optional)'"></span>
        </label>
        {{ textarea(name="notes", id="decision-notes", rows="3", placeholder="What did you see in the evidence?", x_model="notes", x_ref="notes") }}
      </div>

      <div class="flex flex-wrap items-center gap-3">
        {{ button(text="Submit decision", variant="primary", extra_attrs='@click="submit()" :disabled="!canSubmit" x-text="submitLabel"') }}
        <span class="text-xs text-muted-foreground-1" x-text="submitHint"></span>
      </div>
    </div>
  </template>
</div>
<!-- End Decision -->
