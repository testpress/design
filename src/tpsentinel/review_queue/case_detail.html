{% from "./icons.html" import icon, play %}
{% from "src/ui-system/components/dropdown.html" import dropdown %}
{% set rq = tpsentinel_review_queue %}

<!-- Case Detail -->
<template x-if="current">
  <div class="p-4 sm:p-6 lg:p-8">
    <div class="max-w-5xl mx-auto space-y-10">
      <!-- Candidate Header -->
      <div class="grid grid-cols-[auto_1fr_auto] lg:flex items-center gap-x-3 -mt-2">
        <div class="flex items-center lg:hidden">
          <button type="button" @click="backToList()" aria-label="Back to My Assignments"
            class="-ms-2 size-9 inline-flex justify-center items-center rounded-full text-foreground hover:bg-muted-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
            <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>

        <div class="min-w-0 lg:grow flex items-center justify-center lg:justify-start gap-x-3">
          <button type="button" @click="openCandidate('details')" class="hidden sm:block shrink-0 rounded-full focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
            :aria-label="'View details for ' + current.candidate.name">
            <img class="size-10 rounded-full object-cover" :src="current.candidate.photo" alt="">
          </button>
          <div class="min-w-0 text-center lg:text-start">
            <button type="button" @click="openCandidate('details')"
              class="block w-full truncate text-center lg:text-start text-lg font-semibold text-foreground hover:underline underline-offset-4 focus:outline-hidden focus-visible:underline"
              x-text="current.candidate.name"></button>
            <p class="truncate text-sm text-muted-foreground-1">
              <span x-text="current.workspace"></span><span x-show="courseStatus" x-text="' · ' + courseStatus"></span>
            </p>
          </div>
        </div>

        <div class="flex items-center justify-end gap-x-1">
          <template x-if="view.focus">
            <div class="hidden lg:flex items-center gap-x-1 me-1">
              <span class="text-xs text-muted-foreground-1 tabular-nums" x-text="position.total + ' left'"></span>
              <button type="button" @click="step(-1)" :disabled="position.index <= 1" class="inline-flex justify-center items-center size-8 rounded-full text-muted-foreground-1 hover:bg-muted-hover hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary disabled:opacity-40 disabled:pointer-events-none" aria-label="Previous case"><svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
              <button type="button" @click="step(1)" :disabled="position.index >= position.total" class="inline-flex justify-center items-center size-8 rounded-full text-muted-foreground-1 hover:bg-muted-hover hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary disabled:opacity-40 disabled:pointer-events-none" aria-label="Next case"><svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
            </div>
          </template>
          <button type="button" @click="view.focus = !view.focus" class="hidden lg:inline-flex shrink-0 justify-center items-center size-8 rounded-full text-muted-foreground-1 hover:bg-muted-hover hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary disabled:opacity-40 disabled:pointer-events-none"
            :aria-pressed="view.focus" :aria-label="view.focus ? 'Show list' : 'Focus on this case'" :title="view.focus ? 'Show list' : 'Focus on this case'">
            <span x-show="!view.focus"><svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></span>
            <span x-show="view.focus"><svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></span>
          </button>
          {% set i_user = icon("user", "size-4 text-muted-foreground-1") | string %}
          {% set i_sessions = icon("sessions", "size-4 text-muted-foreground-1") | string %}
          {% set i_activity = icon("activity", "size-4 text-muted-foreground-1") | string %}
          {% set i_history = icon("history", "size-4 text-muted-foreground-1") | string %}
          {% set i_external = icon("external", "size-4 text-muted-foreground-1") | string %}
          {{ dropdown(trigger="⋮", width="large", items=[
            {"label": "Candidate details", "icon": i_user, "x_on": "@click=\"open = false; openCandidate('details')\""},
            {"label": "Sessions", "icon": i_sessions, "x_on": "@click=\"open = false; openCandidate('sessions')\""},
            {"label": "Activity", "icon": i_activity, "x_on": "@click=\"open = false; openCandidate('activity')\""},
            {"label": "Review history", "icon": i_history, "x_on": "@click=\"open = false; openCandidate('history')\""},
            {"divider": true},
            {"label": "Open full audit page", "icon": i_external, "url": "/tpsentinel/audit/detail/"}
          ]) }}
        </div>
      </div>

      <!-- Why -->
      <div>
        <div class="pb-2">
          <h2 class="font-semibold text-foreground">Why this needs review</h2>
        </div>
        <ul class="-mx-3">
          <template x-for="a in current.anomalies" :key="current.id + a.type">
            <li>
              <button type="button" @click="showEvidence(a.type)"
                class="w-full flex items-start gap-x-3 p-3 text-start rounded-lg focus:outline-hidden focus:ring-2 focus:ring-primary"
                :class="filter === a.type ? 'bg-surface' : 'hover:bg-muted-hover'">
                <span class="shrink-0 inline-flex justify-center items-center size-8 rounded-lg bg-surface text-surface-foreground">
                  {% for t in rq.anomaly_types %}<template x-if="a.type === '{{ t.key }}'">{{ icon(t.key) }}</template>{% endfor %}<template x-if="a.type === 'identity'">{{ icon("identity") }}</template>
                </span>
                <span class="grow min-w-0">
                  <span class="flex flex-wrap items-baseline gap-x-2">
                    <span class="text-sm font-medium text-foreground" x-text="a.label"></span>
                  </span>
                  <span class="block text-sm text-muted-foreground-1" x-text="a.explanation"></span>
                  <span class="mt-0.5 block text-xs text-muted-foreground" x-text="(a.meta ? a.meta + ' · ' : '') + timingText(a.timing)"></span>
                </span>
                <span class="shrink-0 self-center text-xs font-medium text-muted-foreground-1" x-text="evidenceLabel(a)"></span>
              </button>
            </li>
          </template>
        </ul>
      </div>
      <!-- End Why -->

      {% include "./evidence.html" %}

      <!-- Decision -->
      <div>
        {% include "./decision_panel.html" %}
      </div>
    </div>
  </div>
</template>
<!-- End Case Detail -->
