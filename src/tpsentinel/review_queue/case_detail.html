{% from "./icons.html" import icon, play %}
{% from "src/ui-system/components/dropdown.html" import dropdown %}
{% set rq = tpsentinel_review_queue %}

<!-- Case Detail -->
<template x-if="current">
  <div class="p-4 sm:p-6 lg:p-8 min-[1920px]:flex min-[1920px]:items-start">
  <div class="flex-1 min-w-0 space-y-10 max-w-5xl">
    <button type="button" @click="backToList()"
      class="lg:hidden -ms-1 p-1 inline-flex items-center gap-x-1 text-sm font-medium rounded-lg text-foreground hover:bg-muted-hover focus:outline-hidden focus:bg-muted-hover">
      {{ icon("back") }}
      My Assignments
    </button>

    <!-- Candidate Header -->
    <div class="flex items-center gap-x-4">
      <button type="button" @click="openCandidate('details')" class="shrink-0 rounded-full focus:outline-hidden focus:ring-2 focus:ring-primary"
        :aria-label="'View details for ' + current.candidate.name">
        <img class="size-12 rounded-full object-cover" :src="current.candidate.photo" alt="">
      </button>
      <div class="grow min-w-0">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <button type="button" @click="openCandidate('details')"
            class="text-xl font-semibold text-foreground hover:underline underline-offset-4 focus:outline-hidden focus:underline"
            x-text="current.candidate.name"></button>
        </div>
        <p class="truncate text-sm text-muted-foreground-1" x-text="current.workspace"></p>
      </div>
      {% set i_user = icon("user", "size-4 text-muted-foreground-1") | string %}
      {% set i_sessions = icon("sessions", "size-4 text-muted-foreground-1") | string %}
      {% set i_activity = icon("activity", "size-4 text-muted-foreground-1") | string %}
      {% set i_history = icon("history", "size-4 text-muted-foreground-1") | string %}
      {% set i_external = icon("external", "size-4 text-muted-foreground-1") | string %}
      {{ dropdown(trigger="⋮", width="large", items=[
        {"label": "Candidate details", "icon": i_user, "x_on": "@click=\"open = false; openCandidate('details')\""},
        {"label": "Sessions", "icon": i_sessions, "x_on": "@click=\"open = false; openCandidate('sessions')\""},
        {"label": "Activity", "icon": i_activity, "x_on": "@click=\"open = false; openCandidate('activity')\""},
        {"label": "Review history", "icon": i_history, "x_on": "@click=\"open = false; openCandidate('history')\""},
        {"divider": true},
        {"label": "Open full audit page", "icon": i_external, "url": "/tpsentinel/audit/detail/"}
      ]) }}
    </div>
    <!-- End Candidate Header -->

    <!-- Why -->
    <div>
      <div class="pb-2">
        <h2 class="font-semibold text-foreground">Why this needs review</h2>
      </div>
      <ul class="-mx-3">
        <template x-for="a in current.anomalies" :key="current.id + a.type">
          <li>
            <button type="button" @click="showEvidence(a.type)"
              class="w-full flex items-start gap-x-3 p-3 text-start rounded-lg focus:outline-hidden focus:ring-2 focus:ring-primary"
              :class="filter === a.type ? 'bg-surface' : 'hover:bg-muted-hover'">
              <span class="shrink-0 inline-flex justify-center items-center size-8 rounded-lg bg-surface text-surface-foreground">
                {% for t in rq.anomaly_types %}<template x-if="a.type === '{{ t.key }}'">{{ icon(t.key) }}</template>{% endfor %}<template x-if="a.type === 'identity'">{{ icon("identity") }}</template>
              </span>
              <span class="grow min-w-0">
                <span class="flex flex-wrap items-baseline gap-x-2">
                  <span class="text-sm font-medium text-foreground" x-text="a.label"></span>
                </span>
                <span class="block text-sm text-muted-foreground-1" x-text="a.explanation"></span>
                <span class="mt-0.5 block text-xs text-muted-foreground" x-text="(a.meta ? a.meta + ' · ' : '') + timingText(a.timing)"></span>
              </span>
              <span class="shrink-0 self-center text-xs font-medium text-muted-foreground-1" x-text="evidenceLabel(a)"></span>
            </button>
          </li>
        </template>

      </ul>
    </div>
    <!-- End Why -->

    {% include "./evidence.html" %}
  </div>

  <!-- Decision: pinned right only when the main column still has room, at the bottom otherwise -->
  <div class="mt-10 max-w-5xl min-[1920px]:mt-0 min-[1920px]:ms-16 min-[1920px]:w-[24rem] shrink-0 min-[1920px]:sticky min-[1920px]:top-0">
    {% include "./decision_panel.html" %}
  </div>
  </div>
</template>
<!-- End Case Detail -->
