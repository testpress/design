{% from "./icons.html" import icon, play %}

<!-- Evidence -->
<div x-ref="evidence" class="@container scroll-mt-6">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="font-semibold text-foreground">Evidence</h2>

    <!-- Filters -->
    <div class="flex flex-wrap gap-1.5" role="group" aria-label="Filter evidence">
      <template x-for="f in evidenceFilters" :key="f.key">
        <button type="button" @click="filter = f.key" :aria-pressed="filter === f.key"
          class="py-1.5 px-3 inline-flex items-center rounded-full text-xs font-medium focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
          :class="filter === f.key ? 'bg-primary-100 text-primary-800 dark:bg-primary-500/20 dark:text-primary-300' : 'text-muted-foreground-1 hover:text-foreground hover:bg-muted-hover'"
          x-text="f.label"></button>
      </template>
    </div>
  </div>

  <div class="pt-4 space-y-4">

    <!-- Gallery -->
    <div x-show="evidenceItems.length" class="grid grid-cols-1 @sm:grid-cols-2 @2xl:grid-cols-3 @4xl:grid-cols-4 gap-4">
      <template x-for="(m, mi) in evidenceItems" :key="filter + mi">
        <button type="button" @click="openViewer(mi)"
          class="group text-start rounded-lg focus:outline-hidden focus:ring-2 focus:ring-primary"
          :aria-label="'Open ' + m.label + ' at ' + m.time">
          <span class="relative block aspect-video rounded-lg overflow-hidden bg-surface">
            <template x-if="m.src && !m.reference">
              <img class="size-full object-cover group-hover:opacity-90" :src="m.src" alt="">
            </template>
            <template x-if="m.reference">
              <span class="size-full grid grid-cols-2 gap-0.5 group-hover:opacity-90">
                <img class="size-full object-cover" :src="m.reference" alt="">
                <img class="size-full object-cover" :src="m.src" alt="">
              </span>
            </template>
            <template x-if="!m.src">
              <span class="size-full flex flex-col items-center justify-center gap-1 text-surface-foreground">
                {{ icon("mic", "size-5") }}
                <span class="text-xs">Audio</span>
              </span>
            </template>
            <template x-if="m.length">
              <span class="absolute bottom-1.5 end-1.5 inline-flex items-center gap-x-1 py-0.5 px-1.5 rounded-md bg-gray-900/70 text-[11px] font-medium text-white">
                {{ play() }}<span x-text="m.length"></span>
              </span>
            </template>
          </span>
          <span x-show="m.anomaly" class="mt-1.5 block text-xs font-medium text-foreground" x-text="m.anomaly"></span>
          <span class="block text-xs text-muted-foreground-1" :class="m.anomaly ? '' : 'mt-1.5 font-medium text-foreground'" x-text="m.label"></span>
          <span class="block text-xs text-muted-foreground" x-text="m.session + ' · ' + m.time"></span>
        </button>
      </template>
    </div>

    <p x-show="!evidenceItems.length" class="text-sm text-muted-foreground-1">
      No evidence for this filter.
    </p>
  </div>
</div>
<!-- End Evidence -->
