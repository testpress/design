<!-- Chart tooltip: Preline tooltip styling, follows whichever bar is hovered or focused -->
<div x-show="tip" x-cloak role="tooltip"
     @scroll.window.passive="hideTip()"
     x-transition:enter="transition-opacity duration-100" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
     class="fixed z-[90] -translate-x-1/2 -translate-y-full pointer-events-none"
     :style="tip && `left: ${Math.min(Math.max(tip.x, 120), window.innerWidth - 120)}px; top: ${tip.y - 8}px`">
  <div class="min-w-48 max-w-64 py-2.5 px-3 rounded-lg bg-tooltip border border-tooltip-line shadow-md text-xs text-tooltip-foreground">
    <p class="font-semibold" x-text="tip?.title"></p>
    <dl class="mt-1.5 flex flex-col gap-y-1">
      <template x-for="row in (tip?.rows || [])" :key="row[0]">
        <div class="flex items-center justify-between gap-x-4">
          <dt class="inline-flex items-center gap-x-1.5 opacity-80">
            <span x-show="row[2]" class="size-2 rounded-sm" :class="row[2]"></span>
            <span x-text="row[0]"></span>
          </dt>
          <dd class="font-semibold tabular-nums" x-text="typeof row[1] === 'number' ? row[1].toLocaleString() : row[1]"></dd>
        </div>
      </template>
    </dl>
    <p x-show="tip?.note" class="mt-1.5 pt-1.5 border-t border-tooltip-line opacity-70" x-text="tip?.note"></p>
  </div>
</div>
