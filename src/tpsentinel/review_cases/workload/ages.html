<!-- How long open work has been waiting: shows if the backlog is old, and how much of the old work has no owner -->
<div class="grid lg:grid-cols-2 gap-5 items-stretch">
<section class="flex flex-col bg-card border border-card-line rounded-xl p-4 sm:p-5" x-show="!loadFailed" aria-labelledby="ages-heading" :class="stale && 'opacity-70'">
  <h2 id="ages-heading" class="font-semibold text-foreground">How long cases have waited</h2>
  <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-muted-foreground-1">
    <span class="inline-flex items-center gap-x-1.5"><span class="size-2.5 rounded-sm bg-primary-300 dark:bg-primary-600"></span>With a reviewer</span>
    <span class="inline-flex items-center gap-x-1.5"><span class="size-2.5 rounded-sm bg-amber-400"></span>Unassigned</span>
  </div>

  <div x-show="loading" x-cloak class="mt-5 h-44 flex items-end gap-3 animate-pulse">
    <template x-for="h in [40, 70, 55, 85, 60]" :key="h"><div class="grow rounded bg-surface" :style="`height: ${h}%`"></div></template>
  </div>

  <template x-if="ready">
    <div class="grow flex flex-col">
      <p x-show="noOpenWork" class="mt-6 mb-4 text-sm text-muted-foreground-1">Nothing is waiting.</p>
      <div x-show="!noOpenWork" class="mt-5 mb-6 grid grid-cols-5 gap-2 sm:gap-4" role="list">
        <template x-for="a in ages" :key="a.key">
          <div class="flex flex-col items-center gap-y-1.5 rounded-lg cursor-default" role="listitem" tabindex="0"
               :aria-label="`${a.label}: ${num(a.owned)} with a reviewer, ${num(a.unowned)} unassigned`"
               @mouseenter="showTip($event, a.label, [['With a reviewer', a.owned, 'bg-primary-300 dark:bg-primary-600'], ['Unassigned', a.unowned, 'bg-amber-400']], `${num(a.total)} open`)" @mouseleave="hideTip()"
               @focus="showTip($event, a.label, [['With a reviewer', a.owned, 'bg-primary-300 dark:bg-primary-600'], ['Unassigned', a.unowned, 'bg-amber-400']], `${num(a.total)} open`)" @blur="hideTip()">
            <span class="text-xs font-semibold text-foreground tabular-nums" x-text="num(a.total)"></span>
            <div class="w-full h-28 lg:h-44 flex flex-col justify-end">
              <div class="w-full flex flex-col rounded overflow-hidden" :style="`height: ${(a.total / ageMax) * 100}%`">
                <span class="w-full bg-amber-400" :style="`height: ${a.total ? (a.unowned / a.total) * 100 : 0}%`"></span>
                <span class="w-full bg-primary-300 dark:bg-primary-600" :class="a.unowned && 'border-t-2 border-card'" :style="`height: ${a.total ? (a.owned / a.total) * 100 : 0}%`"></span>
              </div>
            </div>
            <span class="text-[11px] text-muted-foreground-1 whitespace-nowrap" x-text="a.short"></span>
          </div>
        </template>
      </div>
      <p x-show="!noOpenWork && ages[4].unowned" class="mt-auto pt-4 border-t border-card-line text-sm text-muted-foreground-1">
        <span class="font-medium text-foreground" x-text="plural(ages[4].unowned, 'unassigned case')"></span> <span x-text="ages[4].unowned === 1 ? 'has' : 'have'"></span> waited over 2 weeks.
        <button type="button" @click="openMove('unassigned', 'old')" x-show="eligible.length" class="font-medium text-primary hover:underline underline-offset-4 focus:outline-hidden focus-visible:underline">Assign them</button>
      </p>
    </div>
  </template>
</section>

<!-- Where open work comes from: the busiest workspaces; picking one focuses the whole page on it -->
<section class="bg-card border border-card-line rounded-xl p-4 sm:p-5" x-show="!loadFailed" aria-labelledby="ws-heading" :class="stale && 'opacity-70'">
  <div class="flex items-center justify-between gap-3">
    <h2 id="ws-heading" class="font-semibold text-foreground">Where open work comes from</h2>
    <span x-show="ready && byWorkspace.length > 6" class="text-xs text-muted-foreground-1" x-text="`Top 6 of ${byWorkspace.length} workspaces`"></span>
  </div>
  <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-muted-foreground-1">
    <span class="inline-flex items-center gap-x-1.5"><span class="size-2.5 rounded-sm bg-primary-300 dark:bg-primary-600"></span>With a reviewer</span>
    <span class="inline-flex items-center gap-x-1.5"><span class="size-2.5 rounded-sm bg-amber-400"></span>Unassigned</span>
  </div>

  <div x-show="loading" x-cloak class="mt-5 flex flex-col gap-4 animate-pulse">
    <template x-for="w in [90, 75, 60, 50, 40, 30]" :key="w"><div class="h-3 rounded bg-surface" :style="`width: ${w}%`"></div></template>
  </div>

  <template x-if="ready">
    <div>
      <p x-show="noOpenWork" class="mt-6 mb-4 text-sm text-muted-foreground-1">Nothing is waiting.</p>
      <ul x-show="!noOpenWork" class="mt-4 flex flex-col gap-1">
        <template x-for="w in byWorkspace.slice(0, 6)" :key="w.id">
          <li>
            <button type="button" @click="workspace = workspace === w.id ? '' : w.id"
                    :aria-label="workspace === w.id ? 'Show all workspaces' : `Show workload for ${w.name}`"
                    @mouseenter="showTip($event, w.name, [['With a reviewer', w.owned, 'bg-primary-300 dark:bg-primary-600'], ['Unassigned', w.unowned, 'bg-amber-400']], workspace === w.id ? 'Click to show all workspaces' : 'Click to focus on this workspace')" @mouseleave="hideTip()"
                    :class="workspace === w.id ? 'bg-primary-50 dark:bg-primary-500/10' : 'hover:bg-layer-hover'"
                    class="w-full grid grid-cols-[minmax(0,1fr)_auto] gap-x-3 gap-y-1.5 py-2 px-2 -mx-2 rounded-lg text-start focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
              <span class="truncate text-sm text-foreground" x-text="w.name"></span>
              <span class="text-xs tabular-nums text-muted-foreground-1">
                <span class="font-semibold text-foreground" x-text="num(w.total)"></span>
                <span x-show="w.unowned" x-text="`· ${num(w.unowned)} unassigned`"></span>
              </span>
              <span class="col-span-2 flex h-2 rounded-full overflow-hidden bg-surface">
                <span class="h-full bg-primary-300 dark:bg-primary-600" :style="`width: ${(w.owned / workspaceMax) * 100}%`"></span>
                <span class="h-full bg-amber-400" :class="w.owned && 'border-s-2 border-card'" :style="`width: ${(w.unowned / workspaceMax) * 100}%`"></span>
              </span>
            </button>
          </li>
        </template>
      </ul>
    </div>
  </template>
</section>
</div>
