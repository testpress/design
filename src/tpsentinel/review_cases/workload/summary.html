<!-- Thin summary: organisation-level totals for the current scope. Reviewer-level numbers live only in the table. -->
<section x-show="!loadFailed" aria-label="Workload summary">
  <div class="grid grid-cols-2 sm:grid-cols-4 bg-card border border-card-line rounded-xl overflow-hidden"
       :class="stale && 'opacity-70'">
    <template x-for="(m, i) in [
        ['open', 'Open cases', summary.open],
        ['unassigned', 'Unassigned', summary.unassigned],
        ['high', 'High priority', summary.high],
        ['completed', 'Completed today', summary.completed],
      ]" :key="m[0]">
      <a :href="casesHref(m[0], null)" :title="casesTitle(m[0], null)"
         :class="[i % 2 && 'border-s', i > 1 && 'border-t sm:border-t-0', i === 2 && 'sm:border-s']"
         class="group relative py-3 px-4 border-card-line hover:bg-layer-hover focus:outline-hidden focus-visible:bg-layer-hover focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary">
        <p class="text-sm text-muted-foreground-1" x-text="m[1]"></p>
        <p class="mt-0.5 text-xl font-semibold text-foreground tabular-nums" x-text="num(m[2])"></p>
        <svg class="absolute top-3 end-3 shrink-0 size-4 text-muted-foreground-1 opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100 transition-opacity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
      </a>
    </template>
  </div>

  <!-- What each measure counts -->
  <dl class="mt-2.5 flex flex-wrap gap-x-5 gap-y-1 px-1 text-xs text-muted-foreground-1">
    <div class="flex gap-x-1"><dt class="font-medium text-muted-foreground-2">Open</dt><dd>awaiting a human decision</dd></div>
    <div class="flex gap-x-1"><dt class="font-medium text-muted-foreground-2">High priority</dt><dd>Critical or High</dd></div>
    <div class="flex gap-x-1"><dt class="font-medium text-muted-foreground-2">Completed today</dt><dd>decisions since 12:00 am IST</dd></div>
  </dl>
</section>
