<!-- Why this candidate needs review: reasons first, then the evidence for each. No counts. -->
<section class="bg-card border border-card-line shadow-2xs rounded-xl p-4 sm:p-5" aria-labelledby="why-heading">
  <h2 id="why-heading" class="text-base font-semibold text-foreground"
      x-text="c.state === 'completed' ? 'Why this candidate was reviewed' : 'Why this candidate needs review'"></h2>

  <!-- Primary reason -->
  <div class="mt-3 p-4 rounded-lg bg-muted">
    <p class="text-sm text-foreground" x-text="summary"></p>
    <template x-if="d.request">
      <p class="mt-2 ps-3 border-s-2 border-line-3 text-sm text-muted-foreground-2">
        <span x-text="`“${d.request.note}”`"></span> <span class="text-muted-foreground-1" x-text="`— ${d.request.by}`"></span>
      </p>
    </template>
  </div>

  <!-- Requested review: the evidence they asked to check comes first. It covers every Session, latest first. -->
  <template x-if="d.request">
    <div class="mt-6">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h3 class="text-sm font-medium text-muted-foreground-1"
            x-text="`Requested evidence: ${d.request.what === 'snapshots' ? 'periodic snapshots' : 'session recordings'} · all ${d.sessions.length} sessions`"></h3>
        <button type="button" @click="openRequestedEvidence()"
                class="inline-flex items-center gap-x-1 text-sm text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">
          <span x-text="d.request.what === 'snapshots' ? 'Open in Snapshots' : 'Open in Recordings'"></span>
          <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div x-show="requestedEvidence.length" class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
        <template x-for="a in requestedEvidence.slice(0, 8)" :key="a.id">
          <div>
            {% include "./artifact_thumb.html" %}
            <p class="mt-1 text-xs text-muted-foreground-1" x-text="`Session ${a.session} · ${day(a.at)}`"></p>
          </div>
        </template>
      </div>
      <p x-show="!requestedEvidence.length" class="mt-2 text-sm text-muted-foreground-2">
        Nothing of this kind was collected for this candidate. See Evidence coverage below.
      </p>
    </div>
  </template>

  <!-- Anomalies: what AI saw, and required evidence that's missing, in one list. On a requested review AI didn't flag these, so they're labelled as other findings. -->
  <template x-if="anomalies.length">
    <div class="mt-6">
      <h3 class="text-sm font-medium text-muted-foreground-1" x-text="d.request ? 'Other anomalies AI recorded' : 'Anomalies'"></h3>
      <p x-show="d.request" class="mt-0.5 text-xs text-muted-foreground-1">AI recorded these but didn’t flag the candidate.</p>
      <ul class="mt-3 flex flex-col gap-6">
        <template x-for="k in anomalies" :key="k.key">
          <li>
            <div class="flex gap-3">
              <span class="mt-0.5 text-muted-foreground-1" x-html="k.icon"></span>
              <div class="min-w-0 grow">
                <div class="flex flex-wrap items-baseline gap-x-2">
                  <p class="font-medium text-foreground" x-text="k.label"></p>
                </div>
                <p class="mt-0.5 text-sm text-muted-foreground-1" x-text="k.timing"></p>

                <!-- Missing evidence: nothing to show, so say what's missing and why -->
                <template x-if="k.gap">
                  <p class="mt-2 text-sm text-muted-foreground-2" x-text="`${k.detail} Cause: ${k.cause}.`"></p>
                </template>
                <template x-if="!k.gap && k.artifacts.length">
                  <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <template x-for="a in k.artifacts.slice(0, 4)" :key="a.id">
                      <div>{% include "./artifact_thumb.html" %}</div>
                    </template>
                  </div>
                </template>
                <template x-if="!k.gap && !k.artifacts.length">
                  <p class="mt-2 text-sm text-muted-foreground-1">No media was captured for this event. It’s recorded in Activity.</p>
                </template>

                <button type="button" @click="k.gap ? openGapSession(k) : openEvidenceFor(k.key)"
                        class="mt-2 inline-flex items-center gap-x-1 text-sm text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">
                  <span x-text="k.gap ? `Open Session ${k.session}` : 'View all evidence for this anomaly'"></span>
                  <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </template>

  <!-- Nothing qualified -->
  <template x-if="!anomalies.length">
    <p class="mt-5 text-sm text-muted-foreground-2">
      No qualifying anomalies were found in the available evidence.
      <span x-show="coverage.some(r => r.gap)">Some evidence is incomplete; see Evidence coverage below.</span>
    </p>
  </template>

  <!-- AI isn't proof -->
  <p class="mt-5 pt-4 border-t border-card-line text-xs text-muted-foreground-1">
    Anomalies show what to inspect. They aren’t proof of misconduct on their own.
  </p>
</section>
