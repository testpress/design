<!-- Evidence summary: a preview of the evidence a reviewer can inspect for the session picked on the session card.
     Session selection stays on the session card; this card follows it. -->
<section class="bg-card border border-card-line shadow-2xs rounded-xl p-4 sm:p-5" aria-labelledby="evidence-summary-heading">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <h2 id="evidence-summary-heading" class="text-base font-semibold text-foreground">Evidence summary</h2>
    <span class="text-sm text-muted-foreground-1" x-text="`Session ${session.n} of ${d.sessions.length}`"></span>
  </div>

  <!-- Section-level error (prototype): the rest of the page keeps working -->
  <template x-if="condition === 'error'">
    <div class="mt-3 p-4 rounded-lg bg-muted">
      <p class="text-sm font-medium text-foreground">Couldn’t load the evidence summary</p>
      <p class="mt-1 text-sm text-muted-foreground-2">The anomalies, sessions and history on this page are up to date. Submitting a decision is blocked until evidence loads, because missing evidence can change the decision.</p>
      <button type="button" @click="setCondition('normal')" class="mt-2 text-sm font-medium text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">Try again</button>
    </div>
  </template>

  <template x-if="condition !== 'error'">
    <div class="mt-4 flex flex-col gap-6">
      <template x-for="g in sessionEvidence" :key="g.key">
        <div>
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="text-sm font-medium text-muted-foreground-1" x-text="g.label"></h3>
            <!-- Hidden when there's nothing to view -->
            <button type="button" x-show="g.items.length" @click="openEvidence(g.view, g.filter)"
                    class="inline-flex items-center gap-x-1 text-sm text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">
              View all
              <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
          <div x-show="g.items.length" class="mt-2 grid grid-cols-2 sm:grid-cols-4 gap-2">
            <template x-for="a in g.items.slice(0, 4)" :key="a.id">
              <div>
                {% include "./artifact_thumb.html" %}
                <p class="mt-1 text-xs text-muted-foreground-1 tabular-nums"
                   x-text="a.kind === 'recording' ? `${dur(a.length)}${a.partial ? ` of ${dur(a.span)}` : ''}` : time(a.at)"></p>
              </div>
            </template>
          </div>
          <!-- Empty state -->
          <div x-show="!g.items.length" class="mt-2 py-5 px-4 rounded-lg bg-muted text-center">
            <p class="text-sm text-muted-foreground-2" x-text="g.empty"></p>
          </div>
        </div>
      </template>
    </div>
  </template>
</section>
