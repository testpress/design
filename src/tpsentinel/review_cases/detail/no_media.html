<!-- Anomalies with no media: shown on Snapshots and Recordings so nothing is silently missing. Expects `noMedia` in scope. -->
<template x-if="noMedia.length">
  <div class="mt-8">
    <h3 class="text-sm font-medium text-muted-foreground-1">Anomalies with no media</h3>
    <ul class="mt-2 divide-y divide-card-line">
      <template x-for="e in noMedia" :key="e.id">
        <li class="py-2.5 flex items-start gap-3 text-sm">
          <span class="mt-0.5 text-muted-foreground-1" x-html="icons[e.key]"></span>
          <span>
            <span class="text-foreground" x-text="indicatorLabel(e.key)"></span>
            <span class="text-muted-foreground-1" x-text="`· Session ${e.session} · ${dayTime(e.at)} · no media was captured`"></span>
          </span>
        </li>
      </template>
    </ul>
  </div>
</template>
