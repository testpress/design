{% from "src/tpsentinel/components/button.html" import button %}
{% set icon_download %}<svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>{% endset %}
{% set icon_report %}<svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>{% endset %}
<!-- Evidence export: how much evidence there is across all of the candidate's sessions in this workspace, and export it without leaving the review.
     The Evidence summary card covers one session; this card covers all of them. -->
<section class="bg-card border border-card-line shadow-2xs rounded-xl p-4 sm:p-5" aria-labelledby="evidence-export-heading">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <h2 id="evidence-export-heading" class="text-base font-semibold text-foreground">Exports &amp; reports</h2>
    <span class="text-sm text-muted-foreground-1" x-text="d.sessions.length === 1 ? '1 session' : `All ${d.sessions.length} sessions`"></span>
  </div>

  <template x-if="evidenceTotals.files">
    <div>
      <p class="mt-3 flex items-baseline gap-x-2">
        <span class="text-2xl font-semibold text-foreground tabular-nums" x-text="evidenceTotals.size"></span>
        <span class="text-sm text-muted-foreground-1 tabular-nums" x-text="`${evidenceTotals.files.toLocaleString()} files`"></span>
      </p>

      <!-- Export runs in the background; its state stays here, in the card -->
      <p x-show="exportState === 'preparing'" class="mt-3 flex items-start gap-x-2 text-sm text-muted-foreground-2">
        <span class="mt-0.5 shrink-0 animate-spin inline-block size-3.5 border-2 border-current border-t-transparent rounded-full text-primary" role="status" aria-label="Preparing"></span>
        Preparing a ZIP of all sessions. You can keep reviewing.
      </p>
      <p x-show="exportState === 'ready'" x-cloak class="mt-3 text-sm text-foreground">
        Your ZIP is ready. <span class="text-muted-foreground-1">The link works for 24 hours.</span>
      </p>

      <div class="mt-4 flex flex-wrap gap-2">
        <template x-if="exportState !== 'ready'">
          {{ button(text=icon_download ~ "Export evidence", variant="secondary", size="sm", extra_attrs='@click="exportEvidence()" :disabled="exportState === \'preparing\'"') }}
        </template>
        <template x-if="exportState === 'ready'">
          {{ button(text=icon_download ~ "Download ZIP", variant="secondary", size="sm", href="#", extra_attrs='@click.prevent') }}
        </template>
        {{ button(text=icon_report ~ "PDF report", variant="ghost", size="sm", href="#", extra_attrs='@click.prevent') }}
      </div>
    </div>
  </template>

  <!-- Empty: nothing to size or export -->
  <template x-if="!evidenceTotals.files">
    <p class="mt-3 text-sm text-muted-foreground-2">No evidence was collected for this candidate, so there’s nothing to export.</p>
  </template>
</section>
