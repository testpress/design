{% from "src/tpsentinel/components/timeline.html" import timeline %}

<!-- Latest assessment and recent case changes -->
<section class="bg-card border border-card-line shadow-2xs rounded-xl p-4 sm:p-5" aria-labelledby="recent-history-heading">
  <h2 id="recent-history-heading" class="text-base font-semibold text-foreground">Recent history</h2>
  <div class="mt-3">
    {{ timeline(x_items="recentHistory", empty_text="No prior assessment or review-case changes exist.") }}
  </div>
  <button type="button" @click="resetHistory(); tab = 'history'"
          class="inline-flex items-center gap-x-1 text-sm text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">
    View full history
    <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</section>
