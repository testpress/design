<!-- Page identity -->
<div class="flex items-center justify-between gap-3 pt-2">
  <h1 class="text-xl font-semibold text-foreground">Review cases</h1>
  <button type="button"
          @click.stop="openMenu('guide', $event, { align: 'right', width: 340 })"
          class="inline-flex items-center gap-x-1.5 py-1.5 px-2.5 rounded-lg text-sm text-muted-foreground-1 hover:text-foreground hover:bg-muted-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    Indicator guide
  </button>
</div>

<!-- Search: free text plus GitHub-style qualifiers (priority:high, workspace:nism-8 ...) -->
<div class="relative" @click.outside="searchFocused = false">
  <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
    <svg class="shrink-0 size-4 text-muted-foreground-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  </div>
  <input x-ref="search"
         type="text"
         autocomplete="off"
         spellcheck="false"
         x-model="query"
         @focus="searchFocused = true; trackCaret($el)"
         @input="onSearchInput($el)"
         @click="searchFocused = true; trackCaret($el)"
         @keyup="if (!['ArrowUp','ArrowDown','Enter'].includes($event.key)) trackCaret($el)"
         @keydown="onSearchKeydown($event)"
         @keydown.tab="searchFocused = false"
         placeholder="Search name, email, ID or workspace"
         aria-label="Search cases"
         class="py-2.5 ps-10 pe-20 block w-full bg-layer border border-layer-line rounded-lg text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary focus:ring-1 focus:ring-primary">
  <div class="absolute inset-y-0 end-0 flex items-center gap-x-1 pe-2">
    <button type="button" x-show="query" x-cloak @click="query = ''; $refs.search.focus()"
            class="inline-flex justify-center items-center size-7 rounded-full text-muted-foreground-1 hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
            aria-label="Clear search">
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
    </button>
    <kbd x-show="!query" class="hidden sm:inline-flex items-center py-0.5 px-1.5 rounded-md border border-layer-line text-[11px] font-sans text-muted-foreground-1">
      <span x-text="/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K'">Ctrl K</span>
    </kbd>
  </div>

  <!-- Suggestions -->
  <div x-show="suggestions.length" x-cloak
       class="absolute z-[70] top-full start-0 mt-1.5 w-full sm:w-80 bg-dropdown border border-dropdown-line rounded-xl shadow-xl overflow-hidden">
    <p class="px-3 pt-2.5 pb-1 text-xs text-muted-foreground-1" x-text="suggestHeading"></p>
    <ul class="p-1 max-h-72 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb" role="listbox">
      <template x-for="(s, i) in suggestions" :key="s.id">
        <li role="option" :aria-selected="i === suggestIndex">
          <button type="button" tabindex="-1"
                  @mousedown.prevent="applySuggestion(s)"
                  @mouseenter="suggestIndex = i"
                  :class="i === suggestIndex ? 'bg-dropdown-item-hover' : ''"
                  class="w-full flex items-center gap-x-2.5 py-2 px-2.5 rounded-lg text-sm text-start text-dropdown-item-foreground">
            <span class="text-muted-foreground-1" x-html="s.icon"></span>
            <span class="truncate" x-text="s.label"></span>
            <span class="ms-auto shrink-0 text-xs text-muted-foreground-1" x-text="s.hint"></span>
          </button>
        </li>
      </template>
    </ul>
  </div>
</div>
