<div class="pt-8 space-y-6">
    <!-- Filters -->
    <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
    <label for="status-filter" class="text-sm font-medium text-foreground">Status:</label>
    <select id="status-filter" onchange="applyFilters()" class="py-2 px-3 pe-9 block border border-layer-line bg-layer text-layer-foreground rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none">
        <option value="">All Statuses</option>
        
        <option value="0">
        Active
        </option>
        
        <option value="1">
        Completed
        </option>
        
        <option value="2">
        Failed
        </option>
        
    </select>

    <label for="verdict-filter" class="text-sm font-medium text-foreground ml-4">Integrity:</label>
    <select id="verdict-filter" onchange="applyFilters()" class="py-2 px-3 pe-9 block border border-layer-line bg-layer text-layer-foreground rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none">
        <option value="">All Verdicts</option>
        
        <option value="0">
        Clean
        </option>
        
        <option value="1">
        Suspicious
        </option>
        
        <option value="2">
        Compromised
        </option>
        
        <option value="3">
        Inconclusive
        </option>
        
        <option value="4">
        Failed Verification
        </option>
        
    </select>
    </div>


    <!-- Sessions Table -->
    <div class="flex flex-col">
    <div class="-m-1.5 overflow-x-auto">
        <div class="p-1.5 min-w-full inline-block align-middle">
        <div class="border border-table-line rounded-lg shadow-xs overflow-hidden">
            <table class="min-w-full divide-y divide-table-line">
            <thead class="bg-layer border-b border-table-line">
                <tr>
                <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-muted-foreground-1 uppercase">Session</th>
                <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-muted-foreground-1 uppercase">Device</th>
                <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-muted-foreground-1 uppercase">Status</th>
                <th scope="col" class="px-6 py-3 text-start text-xs font-medium text-muted-foreground-1 uppercase">Integrity</th>
                <th scope="col" class="px-6 py-3 text-end text-xs font-medium text-muted-foreground-1 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-table-line">

                {% for i in range(1, 21) %}
                <tr class="hover:bg-table-row-hover">
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-foreground">
                    <div class="flex flex-col">
                    <span class="text-sm">
                        Mar {{ 16 - i }}, 2026
                    </span>
                    <span class="text-xs text-muted-foreground-1">
                        ID: {{ 250000 + i }}
                    </span>
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-foreground">
                    <div class="flex flex-col">
                    <span>Unknown -</span>
                    <span class="text-xs text-muted-foreground-1">Unknown OS</span>
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200">Active</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-surface text-surface-foreground">Pending</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-end text-sm font-medium">
                    <div class="hs-dropdown relative inline-flex">
                    <button type="button" class="hs-dropdown-toggle inline-flex items-center gap-x-2 text-sm text-muted-foreground-1 hover:text-foreground">
                        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                        </svg>
                    </button>
                    <div class="hs-dropdown-menu hs-dropdown-open:opacity-100 hidden z-10 bg-dropdown border border-dropdown-line rounded-lg shadow-xl" role="menu" tabindex="-1">
                        <div class="p-1">
                        <a href="/audit/39007/activity/?session={{ 250000 + i }}" class="flex items-center gap-x-3 px-4 py-2 text-sm text-dropdown-item-foreground hover:bg-dropdown-item-hover">View Activity</a>
                        <button type="button" class="w-full flex items-center gap-x-3 px-4 py-2 text-sm text-dropdown-item-foreground hover:bg-dropdown-item-hover" data-session-id="{{ 250000 + i }}" data-verdict="None" data-progress-id="39007" data-action="open-verdict">Update Verdict</button>
                        </div>
                    </div>
                    </div>
                </td>
                </tr>
                {% endfor %}

            </tbody>
            </table>
        </div>
        </div>
    </div>
    </div>
          
    <div class="mt-5 flex flex-wrap justify-between items-center gap-2">
    <div class="inline-flex items-center space-x-2" >
    <input type="number" min="1" :max="10" class="appearance-none [&amp;::-webkit-inner-spin-button]:appearance-none [&amp;::-webkit-outer-spin-button]:appearance-none [-moz-appearance:textfield] py-1.5 sm:py-2 px-3 block w-16 bg-transparent border-layer-line rounded-lg sm:text-sm font-medium text-layer-foreground placeholder:text-muted-foreground-1 placeholder:font-normal focus:border-blue-500 focus:ring-0 disabled:opacity-50 disabled:pointer-events-none" placeholder="Go to" max="2">
    <p class="text-sm text-foreground">
      Showing
      <span class="font-medium">1</span>
      to
      <span class="font-medium">20</span>
      of
      <span class="font-medium">26</span>
      <span class="text-muted-foreground-1">results</span>
    </p>
    </div>

    <!-- Pagination -->
    <nav class="flex justify-end items-center gap-x-1" aria-label="Pagination">
      
        <span class="min-h-9.5 min-w-9.5 py-2 px-2.5 inline-flex justify-center items-center gap-x-2 text-sm rounded-lg text-foreground hover:bg-muted-hover disabled:opacity-50 disabled:pointer-events-none opacity-50 cursor-not-allowed" aria-label="Previous">
          <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
          <span class="sr-only">Previous</span>
        </span>
      
      <div class="flex items-center gap-x-1">
        <span class="min-h-9.5 min-w-9.5 flex justify-center items-center bg-surface text-surface-foreground py-2 px-3 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none" aria-current="page">1</span>
        <span class="min-h-9.5 flex justify-center items-center text-muted-foreground-1 py-2 px-1.5 text-sm">of</span>
        <span class="min-h-9.5 flex justify-center items-center text-muted-foreground-1 py-2 px-1.5 text-sm">2</span>
      </div>
      
        <a href="?page=2" class="min-h-9.5 min-w-9.5 py-2 px-2.5 inline-flex justify-center items-center gap-x-2 text-sm rounded-lg text-foreground hover:bg-muted-hover focus:outline-hidden focus:bg-muted-focus" aria-label="Next">
          <span class="sr-only">Next</span>
          <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      
    </nav>
    <!-- End Pagination -->
 </div>

          
</div>
