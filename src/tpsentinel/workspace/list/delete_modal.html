<div id="delete-workspace-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[90] overflow-x-hidden overflow-y-auto [--close-when-click-inside:true] pointer-events-none" role="dialog" tabindex="-1" aria-labelledby="delete-workspace-modal-label">
  <div class="hs-overlay-open:mt-7 hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-0 opacity-0 ease-out transition-all sm:max-w-md sm:w-full m-3 sm:mx-auto h-[calc(100%-56px)] min-h-[calc(100%-56px)] flex items-center">
    <div class="relative w-full max-h-full overflow-hidden flex flex-col bg-overlay border border-overlay-line rounded-xl pointer-events-auto shadow-xl">

      <div class="absolute top-3 end-3">
        <button type="button" class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-muted text-muted-foreground-1 hover:bg-muted-hover hover:text-foreground disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted-hover" aria-label="Close" data-hs-overlay="#delete-workspace-modal">
          <span class="sr-only">Close</span>
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="p-5 sm:p-10">
        <h3 id="delete-workspace-modal-label" class="text-lg font-medium text-foreground">
          Delete Advanced Mathematics?
        </h3>
        <p class="mt-2 text-sm text-muted-foreground-1">
          Are you sure you want to permanently delete the workspace <strong class="text-foreground">"Advanced Mathematics"</strong>? 
          All associated data will be permanently removed.
        </p>
      </div>

      <div class="pb-5 px-5 sm:px-10 flex justify-center items-center gap-x-3">
        <button type="button" class="py-2.5 px-3 w-full inline-flex justify-center items-center gap-x-1.5 text-sm font-medium rounded-xl border border-card-line bg-card text-foreground shadow-2xs hover:bg-muted disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted" data-hs-overlay="#delete-workspace-modal">
          Cancel
        </button>
        <button type="button" class="py-2.5 px-3 w-full inline-flex justify-center items-center gap-x-1.5 text-sm font-medium rounded-xl border border-transparent bg-danger text-danger-foreground hover:bg-danger-hover disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-danger-focus" data-hs-overlay="#delete-workspace-modal">
          Confirm
        </button>
      </div>

    </div>
  </div>
</div>
