      status: 'completed',
      is_default: false,
      is_active: false,
      size: '20.1 MB',
      duration: '04:32'
    }
  ],

  get activeTrackCount() {
    return this.tracks.filter(t => t.is_active && t.status === 'completed').length;
  },

  setAsDefault(targetTrack) {
    if (!targetTrack.is_active || targetTrack.status !== 'completed') return;
    this.tracks.forEach(t => {
      t.is_default = (t.id === targetTrack.id);
    });
  },

  toggleTrackStatus(targetTrack) {
    // Cannot disable the default active track directly
    if (targetTrack.is_default && targetTrack.is_active) {
      return;
    }
    targetTrack.is_active = !targetTrack.is_active;
  },

  openEditModal(track) {
    this.editingTrack = JSON.parse(JSON.stringify(track));
    this.showEditModal = true;
  },

  saveTrackEdit() {
    if (!this.editingTrack) return;
    const index = this.tracks.findIndex(t => t.id === this.editingTrack.id);
    if (index !== -1) {
      if (this.editingTrack.is_default) {
        this.tracks.forEach(t => t.is_default = false);
      }
      this.tracks[index] = {
        ...this.tracks[index],
        name: this.editingTrack.name,
        language: this.editingTrack.language,
        lang_code: this.editingTrack.lang_code,
        is_default: this.editingTrack.is_default,
        is_active: this.editingTrack.is_default ? true : this.tracks[index].is_active
      };
    }
  },

  openDeleteModal(track) {
    this.deletingTrack = track;
    this.showDeleteModal = true;
  },

  confirmDeleteTrack() {
    if (!this.deletingTrack) return;
    this.tracks = this.tracks.filter(t => t.id !== this.deletingTrack.id);
    this.deletingTrack = null;
  }

<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showUploadModal" class="relative z-50" aria-labelledby="upload-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Blur -->
  <div x-show="showUploadModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div x-show="showUploadModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="if(!isUploading) showUploadModal = false"
        class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-gray-100">
        
        <div x-data="{ 
          selectedFile: null, 
          fileName: '', 
          fileSizeFormatted: '',
          fileInput: null,
          language: '',
          trackName: '',
          isDefault: false,
          isDragging: false,
          
          resetForm() {
            this.selectedFile = null;
            this.fileName = '';
            this.fileSizeFormatted = '';
            this.language = '';
            this.trackName = '';
            this.isDefault = false;
            this.isDragging = false;
            if (this.fileInput) this.fileInput.value = '';
          }
        }">
          
          <!-- Modal Header -->
          <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4">
            <div>
              <h3 class="text-base font-semibold text-gray-900" id="upload-modal-title">Upload Audio Track</h3>
              <p class="mt-0.5 text-xs text-gray-500">Add audio tracks in different languages to this video.</p>
            </div>
            <button type="button" @click="if (!isUploading) { resetForm(); showUploadModal = false; }" :disabled="isUploading"
              class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition focus:outline-none">
              <span class="sr-only">Close</span>
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- Modal Body -->
          <div class="px-6 py-5 space-y-5">
            
            <!-- Grid: Language (Required First) & Track Name (Optional Second) -->
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div>
                <label for="audio-language" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                  Language <span class="text-red-500">*</span>
                </label>
                <select id="audio-language" x-model="language"
                  @change="if (!trackName) trackName = language"
                  class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                  <option value="" disabled selected>Select Language</option>
                  <option value="English">English</option>
                  <option value="Spanish">Spanish</option>
                  <option value="Tamil">Tamil</option>
                  <option value="Hindi">Hindi</option>
                  <option value="Telugu">Telugu</option>
                  <option value="Malayalam">Malayalam</option>
                  <option value="Kannada">Kannada</option>
                  <option value="Marathi">Marathi</option>
                  <option value="Bengali">Bengali</option>
                  <option value="French">French</option>
                  <option value="German">German</option>
                  <option value="Arabic">Arabic</option>
                  <option value="Japanese">Japanese</option>
                  <option value="Portuguese">Portuguese</option>
                  <option value="Russian">Russian</option>
                  <option value="Chinese">Chinese</option>
                </select>
              </div>

              <!-- Track Label / Name Input -->
              <div>
                <label for="track-name" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                  Track Label / Name <span class="text-gray-400 font-normal lowercase">(optional)</span>
                </label>
                <input type="text" id="track-name" x-model="trackName" :placeholder="language ? language : 'e.g., Director\'s Commentary'"
                  class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
              </div>
            </div>

            <!-- Preline Pro Drag & Drop Audio Upload Zone -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                Audio File <span class="text-red-500">*</span>
              </label>

              <!-- State 1: Dropzone (No File Selected) -->
              <div x-show="!selectedFile"
                @dragover.prevent="isDragging = true"
                @dragleave.prevent="isDragging = false"
                @drop.prevent="
                  isDragging = false;
                  if ($event.dataTransfer.files.length) {
                    selectedFile = $event.dataTransfer.files[0];
                    fileName = selectedFile.name;
                    fileSizeFormatted = (selectedFile.size / (1024 * 1024)).toFixed(1) + ' MB';
                    if (!trackName && language) trackName = language;
                  }
                "
                :class="isDragging ? 'border-blue-500 bg-blue-50/50 ring-2 ring-blue-500/20' : 'border-gray-300 bg-gray-50/60 hover:bg-gray-50 hover:border-gray-400'"
                class="relative border-2 border-dashed rounded-xl p-6 transition flex flex-col items-center justify-center text-center cursor-pointer group">
                
                <input type="file" id="audioFilePicker" accept=".mp3,.aac,.m4a,.wav,audio/*"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                  x-on:change="
                    if ($event.target.files.length) {
                      selectedFile = $event.target.files[0];
                      fileName = selectedFile.name;
                      fileSizeFormatted = (selectedFile.size / (1024 * 1024)).toFixed(1) + ' MB';
                      fileInput = $event.target;
                      if (!trackName && language) trackName = language;
                    }
                  ">
                
                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center mb-3">
                  <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
                  </svg>
                </div>
                <p class="text-sm font-medium text-gray-700">
                  <span class="text-blue-600 font-semibold group-hover:underline">Click to upload</span> or drag and drop
                </p>
                <p class="text-xs text-gray-500 mt-1">
                  Supported formats: MP3, AAC, M4A, WAV (Max 500MB)
                </p>
              </div>

              <!-- State 2: Attached File Card with Preline In-Card Progress -->
              <div x-show="selectedFile" x-cloak
                class="p-3.5 bg-gray-50/80 border border-gray-200 rounded-xl space-y-2.5">
                
                <div class="flex items-center justify-between gap-x-3">
                  <div class="flex items-center gap-x-3 min-w-0">
                    <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m9 9 10.5-3m0 6.553v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 1 1-.99-3.467l2.31-.66a2.25 2.25 0 0 0 1.632-2.163Zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 0 1-1.632 2.163l-1.32.377a1.803 1.803 0 0 1-.99-3.467l2.31-.66A2.25 2.25 0 0 0 9 15.553Z" />
                      </svg>
                    </div>
                    <div class="min-w-0">
                      <p class="text-sm font-semibold text-gray-900 truncate" x-text="fileName"></p>
                      <div class="flex items-center gap-x-2 text-xs text-gray-500 mt-0.5">
                        <span x-text="fileSizeFormatted"></span>
                        <span>&bull;</span>
                        <span x-show="!isUploading" class="inline-flex items-center text-emerald-600 font-medium">
                          <svg class="w-3.5 h-3.5 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                          </svg>
                          Ready for upload
                        </span>
                        <span x-show="isUploading" class="inline-flex items-center text-blue-600 font-medium" x-cloak>
                          Uploading...
                        </span>
                      </div>
                    </div>
                  </div>

                  <!-- Remove Action (hidden during active upload) -->
                  <button x-show="!isUploading" type="button" 
                    x-on:click="
                      selectedFile = null;
                      fileName = '';
                      fileSizeFormatted = '';
                      if (fileInput) fileInput.value = '';
                    "
                    class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition shrink-0"
                    title="Remove file">
                    <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <!-- Preline In-Card Progress Bar -->
                <div x-show="isUploading" class="flex items-center gap-x-3 whitespace-nowrap pt-1" x-cloak>
                  <div class="flex w-full h-2 bg-gray-200/80 rounded-full overflow-hidden" role="progressbar" :aria-valuenow="uploadProgress" aria-valuemin="0" aria-valuemax="100">
                    <div class="flex flex-col justify-center rounded-full overflow-hidden bg-blue-600 text-xs text-white text-center whitespace-nowrap transition-all duration-300 ease-out"
                      :style="'width: ' + uploadProgress + '%'"></div>
                  </div>
                  <div class="w-10 text-end">
                    <span class="text-xs font-semibold text-gray-700" x-text="uploadProgress + '%'"></span>
                  </div>
                </div>

              </div>

            </div>

            <!-- Default Track Setting (TPStreams Checkbox Pattern) -->
            <div class="relative flex items-start gap-x-3 pt-1">
              <div class="flex h-6 items-center">
                <input id="set-default-audio" type="checkbox" x-model="isDefault" :disabled="isUploading"
                  class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
              </div>
              <div class="text-sm leading-6">
                <label for="set-default-audio" class="font-medium text-gray-900 cursor-pointer select-none" :class="isUploading ? 'opacity-50 cursor-not-allowed' : ''">Set as default audio track</label>
                <p class="text-xs text-gray-500">Will automatically play for viewers who haven't selected an alternate language.</p>
              </div>
            </div>

          </div>

          <!-- Modal Footer -->
          <div class="flex items-center justify-end gap-x-3 border-t border-gray-100 px-6 py-4 bg-gray-50/50 rounded-b-2xl">
            <button type="button" @click="resetForm(); showUploadModal = false;" :disabled="isUploading"
              class="py-2 px-4 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none transition disabled:opacity-50 disabled:cursor-not-allowed">
              Cancel
            </button>
            <button type="button" 
              @click="
                if (!selectedFile || !language) {
                  alert('Please select an audio file and language.');
                  return;
                }
                isUploading = true;
                uploadProgress = 15;
                let interval = setInterval(() => {
                  uploadProgress = Math.min(100, uploadProgress + 25);
                  if (uploadProgress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                      if (isDefault) {
                        tracks.forEach(t => t.is_default = false);
                      }
                      tracks.unshift({
                        id: 'trk_' + Date.now(),
                        name: trackName || language,
                        language: language,
                        lang_code: language.toLowerCase().slice(0, 2),
                        status: 'processing',
                        is_default: isDefault,
                        is_active: true,
                        size: (selectedFile.size / (1024 * 1024)).toFixed(1) + ' MB',
                        duration: '04:32'
                      });
                      resetForm();
                      isUploading = false;
                      uploadProgress = 0;
                      showUploadModal = false;
                    }, 400);
                  }
                }, 250);
              "
              :disabled="isUploading || !selectedFile || !language"
              class="py-2 px-4 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1.5">
              <template x-if="isUploading">
                <span class="inline-flex items-center gap-1.5">
                  <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Uploading...
                </span>
              </template>
              <template x-if="!isUploading">
                <span class="inline-flex items-center gap-1.5">
                  <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                  </svg>
                  Upload Audio Track
                </span>
              </template>
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>
</div>




  <!-- Preline Pro Modal: Edit Audio Track -->
<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showEditModal" class="relative z-50" aria-labelledby="edit-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Blur -->
  <div x-show="showEditModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div x-show="showEditModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="showEditModal = false"
        class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-xl border border-gray-100">
        
        <template x-if="editingTrack">
          <div>
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4">
              <div>
                <h3 class="text-base font-semibold text-gray-900" id="edit-modal-title">Edit Audio Track</h3>
                <p class="mt-0.5 text-xs text-gray-500">Update track label, language, or default audio settings.</p>
              </div>
              <button type="button" @click="showEditModal = false"
                class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition focus:outline-none">
                <span class="sr-only">Close</span>
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Modal Body -->
            <div class="px-6 py-5 space-y-4">
              
              <!-- Language Select -->
              <div>
                <label for="edit-audio-language" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                  Language <span class="text-red-500">*</span>
                </label>
                <select id="edit-audio-language" x-model="editingTrack.language"
                  @change="editingTrack.lang_code = editingTrack.language.toLowerCase().slice(0, 2)"
                  class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                  <option value="English">English</option>
                  <option value="Spanish">Spanish</option>
                  <option value="Tamil">Tamil</option>
                  <option value="Hindi">Hindi</option>
                  <option value="Telugu">Telugu</option>
                  <option value="Malayalam">Malayalam</option>
                  <option value="Kannada">Kannada</option>
                  <option value="Marathi">Marathi</option>
                  <option value="Bengali">Bengali</option>
                  <option value="French">French</option>
                  <option value="German">German</option>
                  <option value="Arabic">Arabic</option>
                  <option value="Japanese">Japanese</option>
                  <option value="Portuguese">Portuguese</option>
                  <option value="Russian">Russian</option>
                  <option value="Chinese">Chinese</option>
                </select>
              </div>

              <!-- Track Label / Name Input -->
              <div>
                <label for="edit-track-name" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                  Track Label / Name <span class="text-gray-400 font-normal lowercase">(optional)</span>
                </label>
                <input type="text" id="edit-track-name" x-model="editingTrack.name" placeholder="e.g., Director's Commentary"
                  class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
              </div>

              <!-- Default Track Setting (TPStreams Checkbox Pattern) -->
              <div class="relative flex items-start gap-x-3 pt-1">
                <div class="flex h-6 items-center">
                  <input id="edit-set-default-audio" type="checkbox" x-model="editingTrack.is_default"
                    :disabled="!editingTrack.is_active"
                    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600 cursor-pointer disabled:cursor-not-allowed disabled:opacity-50">
                </div>
                <div class="text-sm leading-6">
                  <label for="edit-set-default-audio" class="font-medium text-gray-900 cursor-pointer select-none"
                    :class="!editingTrack.is_active ? 'opacity-60 cursor-not-allowed' : ''">
                    Set as default audio track
                  </label>
                  <p class="text-xs text-gray-500" x-text="editingTrack.is_active ? 'Will be played automatically as the default audio track.' : 'Track must be enabled before setting as default.'"></p>
                </div>
              </div>

            </div>

            <!-- Modal Footer -->
            <div class="flex items-center justify-end gap-x-3 border-t border-gray-100 px-6 py-4 bg-gray-50/50 rounded-b-2xl">
              <button type="button" @click="showEditModal = false"
                class="py-2 px-4 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none transition">
                Cancel
              </button>
              <button type="button" 
                @click="
                  saveTrackEdit();
                  showEditModal = false;
                "
                class="py-2 px-4 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">
                Save Changes
              </button>
            </div>

          </div>
        </template>

      </div>
    </div>
  </div>
</div>



  <!-- Preline Modal: Delete Audio Track -->
<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showDeleteModal" class="relative z-50" aria-labelledby="delete-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Blur -->
  <div x-show="showDeleteModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <!-- Modal Panel -->
      <div x-show="showDeleteModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="showDeleteModal = false"
        class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-gray-100">
        
        <template x-if="deletingTrack">
          <div class="p-6 text-center">
            
            <!-- Guard: When trying to delete the only active track -->
            <template x-if="activeTrackCount <= 1 && deletingTrack.is_active">
              <div>
                <!-- Warning Amber Badge -->
                <div class="flex items-center justify-center w-12 h-12 mx-auto rounded-2xl bg-amber-50 text-amber-600 border border-amber-200 shadow-sm mb-4">
                  <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                  </svg>
                </div>
                
                <h3 class="text-base font-semibold text-gray-900" id="delete-modal-title">Cannot Delete Audio Track</h3>
                <p class="mt-2 text-sm text-gray-600">
                  <span class="font-semibold text-gray-900" x-text="deletingTrack.name"></span> is the only active audio track. A video must always retain at least one active audio track.
                </p>

                <div class="mt-6 flex items-center justify-center">
                  <button type="button" @click="showDeleteModal = false"
                    class="py-2 px-5 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none transition">
                    Got it
                  </button>
                </div>
              </div>
            </template>

            <!-- Standard Deletion Confirmation -->
            <template x-if="activeTrackCount > 1 || !deletingTrack.is_active">
              <div>
                <!-- Trash Red Badge -->
                <div class="flex items-center justify-center w-12 h-12 mx-auto rounded-2xl bg-red-50 text-red-600 border border-red-200 shadow-sm mb-4">
                  <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                  </svg>
                </div>
                
                <h3 class="text-base font-semibold text-gray-900" id="delete-modal-title">Delete Audio Track?</h3>
                <p class="mt-2 text-sm text-gray-600">
                  Are you sure you want to delete <span class="font-semibold text-gray-900" x-text="deletingTrack.name"></span>? This will permanently remove this audio track from player playback.
                </p>

                <div class="mt-6 flex items-center justify-center gap-x-3">
                  <button type="button" @click="showDeleteModal = false"
                    class="py-2 px-4 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none transition">
                    Cancel
                  </button>
                  <button type="button" 
                    @click="
                      confirmDeleteTrack();
                      showDeleteModal = false;
                    "
                    class="py-2 px-4 text-sm font-semibold rounded-lg bg-red-600 text-white shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition">
                    Delete Track
                  </button>
                </div>
              </div>
            </template>

          </div>
        </template>

      </div>
    </div>
  </div>
</div>




</div>
