<form id="advanceSettingsForm" method="post" action="#">
  <div class="space-y-12">
    <div class="border-b border-gray-900/10 pb-12">
      <h2 class="mt-6 text-base font-semibold leading-7 text-gray-900">Settings</h2>
      <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
        <div class="sm:col-span-3">
          <div class="relative flex gap-x-3">
            <div class="flex h-6 items-center">
              <input id="disable_domain_restriction" name="disable_domain_restriction" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600" />
            </div>
            <div class="text-sm leading-6">
              <label for="disable_domain_restriction" class="font-medium text-gray-900">Make public</label>
              <p class="text-gray-500">Allow video access across all sites.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6 flex items-center justify-end gap-x-6">
      <button type="button" class="text-sm font-semibold leading-6 text-gray-900">Cancel</button>
      <button type="submit" class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Save</button>
    </div>
  </div>
</form>
