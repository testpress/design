<!-- Preline Pro Modal: Edit Audio Track -->
<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showEditModal" class="relative z-50" aria-labelledby="edit-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Blur -->
  <div x-show="showEditModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div x-show="showEditModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="showEditModal = false"
        class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-xl border border-gray-100">
        
        <template x-if="editingTrack">
          <div>
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4">
              <div>
                <h3 class="text-base font-semibold text-gray-900" id="edit-modal-title">Edit Audio Track</h3>
                <p class="mt-0.5 text-xs text-gray-500">Update track label, language, or default audio settings.</p>
              </div>
              <button type="button" @click="showEditModal = false"
                class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition focus:outline-none">
                <span class="sr-only">Close</span>
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Modal Body -->
            <div class="px-6 py-5 space-y-4">
              
              <!-- Language Select (First) -->
              <div>
                <label for="edit-audio-language" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                  Language <span class="text-red-500">*</span>
                </label>
                <select id="edit-audio-language" x-model="editingTrack.language"
                  class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                  <option value="English">English</option>
                  <option value="Spanish">Spanish</option>
                  <option value="Tamil">Tamil</option>
                  <option value="Hindi">Hindi</option>
                  <option value="Malayalam">Malayalam</option>
                  <option value="French">French</option>
                  <option value="German">German</option>
                  <option value="Arabic">Arabic</option>
                  <option value="Japanese">Japanese</option>
                  <option value="Portuguese">Portuguese</option>
                </select>
              </div>

              <!-- Track Label / Name (Optional Second) -->
              <div>
                <label for="edit-track-name" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
                  Track Label / Name <span class="text-gray-400 font-normal lowercase">(optional)</span>
                </label>
                <input type="text" id="edit-track-name" x-model="editingTrack.name" placeholder="e.g., Director's Commentary"
                  class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 shadow-sm placeholder-gray-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
              </div>

              <!-- Set as Default (Accessible Toggle Switch) -->
              <div class="flex items-center justify-between p-3.5 bg-gray-50/70 border border-gray-200 rounded-xl mt-4"
                :class="!editingTrack.is_active ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'"
                @click="if (editingTrack.is_active) editingTrack.is_default = !editingTrack.is_default">
                <div>
                  <span class="block text-sm font-medium text-gray-900">Set as default audio track</span>
                  <span class="block text-xs text-gray-500" x-text="editingTrack.is_active ? 'Will be played automatically as the default audio track.' : 'Track must be enabled before setting as default.'"></span>
                </div>
                <button type="button" 
                  @click.stop="if (editingTrack.is_active) editingTrack.is_default = !editingTrack.is_default"
                  :disabled="!editingTrack.is_active"
                  :class="editingTrack.is_default ? 'bg-blue-600' : 'bg-gray-300'"
                  class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 ml-4 disabled:pointer-events-none"
                  role="switch" :aria-checked="editingTrack.is_default">
                  <span class="sr-only">Set as default audio track</span>
                  <span 
                    :class="editingTrack.is_default ? 'translate-x-5' : 'translate-x-0'"
                    class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out">
                  </span>
                </button>
              </div>

            </div>

            <!-- Modal Footer -->
            <div class="flex items-center justify-end gap-x-3 border-t border-gray-100 px-6 py-4 bg-gray-50/50 rounded-b-2xl">
              <button type="button" @click="showEditModal = false"
                class="py-2 px-4 text-sm font-medium rounded-lg border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-50 focus:outline-none transition">
                Cancel
              </button>
              <button type="button" 
                @click="
                  saveTrackEdit();
                  showEditModal = false;
                "
                class="py-2 px-4 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">
                Save Changes
              </button>
            </div>

          </div>
        </template>

      </div>
    </div>
  </div>
</div>
