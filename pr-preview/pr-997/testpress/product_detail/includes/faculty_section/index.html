




<section id="faculty" x-show="faculty.length" x-cloak class="scroll-mt-20">
  <h2 class="text-xl font-semibold text-gray-800 dark:text-neutral-200">Meet your faculty</h2>

  <ul class="mt-4 grid sm:grid-cols-2 gap-4">
    <template x-for="person in visibleFaculty" :key="person.id">
      <li>
        <button type="button" @click="openProfile(person)"
          class="group h-full w-full flex flex-col text-left p-4 bg-white border border-gray-200 rounded-xl hover:border-gray-300 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition dark:bg-neutral-800 dark:border-neutral-700 dark:hover:border-neutral-600"
          :aria-label="'View profile of ' + person.name">
          <div class="w-full flex items-center gap-x-3.5">
            <div class="relative shrink-0">
              
  <template x-if="person.photo">
    <img :src="person.photo" :alt="person.name" class="size-14 rounded-full object-cover bg-gray-100 dark:bg-neutral-700">
  </template>
  <template x-if="!person.photo">
    <span class="size-14 inline-flex items-center justify-center rounded-full bg-gray-100 text-base font-semibold text-gray-600 dark:bg-neutral-700 dark:text-neutral-300" x-text="person.initials" aria-hidden="true"></span>
  </template>

              <span x-show="person.hasVideo" class="absolute -bottom-0.5 -right-0.5 size-6 inline-flex items-center justify-center rounded-full bg-gray-900 text-white ring-2 ring-white dark:bg-white dark:text-gray-900 dark:ring-neutral-800" aria-hidden="true">
                <i data-lucide="play" class="size-3 fill-current"></i>
              </span>
            </div>
            <div class="min-w-0">
              <p class="font-semibold text-gray-800 truncate dark:text-neutral-200" x-text="person.name"></p>
              <p class="mt-0.5 text-sm font-medium text-primary-600 line-clamp-1 dark:text-primary-400" x-text="person.subjects.join(' · ')"></p>
            </div>
            <i data-lucide="chevron-right" class="ms-auto shrink-0 size-4 text-gray-400 group-hover:text-gray-600 dark:text-neutral-500 dark:group-hover:text-neutral-300"></i>
          </div>

          <p x-show="person.short_description" class="mt-3 text-sm text-gray-600 line-clamp-2 dark:text-neutral-400" x-text="person.short_description"></p>

          <div class="mt-auto pt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-500 dark:text-neutral-400">
            <span x-show="person.years_of_experience" class="inline-flex items-center gap-x-1.5">
              <i data-lucide="briefcase" class="size-3.5 text-gray-400"></i><span x-text="person.years_of_experience + ' years teaching'"></span>
            </span>
            <span x-show="person.hasVideo" class="inline-flex items-center gap-x-1.5">
              <i data-lucide="circle-play" class="size-3.5 text-gray-400"></i>Intro video
            </span>
          </div>
        </button>
      </li>
    </template>
  </ul>

  <div x-show="faculty.length > 4" class="mt-4">
    <button type="button" @click="showAllFaculty = !showAllFaculty"
      class="inline-flex items-center gap-x-1.5 text-sm font-medium text-primary-600 hover:text-primary-700 focus:outline-none focus:underline dark:text-primary-400">
      <span x-text="showAllFaculty ? 'Show fewer' : 'Show all ' + faculty.length + ' faculty'"></span>
      <i data-lucide="chevron-down" class="size-4 transition-transform" :class="showAllFaculty && 'rotate-180'"></i>
    </button>
  </div>
</section>










<div x-data="{ 
        open: false,
        init() {
            this.$watch('open', value => {
                if (value) {
                    document.body.classList.add('overflow-hidden');
                } else {
                    document.body.classList.remove('overflow-hidden');
                }
            });
        }
     }" 
     @open-drawer-faculty-profile.window="open = true" 
     @close-drawer-faculty-profile.window="open = false"
     @keydown.window.escape="open = false">

    
    <div x-show="open" 
         x-cloak 
         x-transition:enter="transition-opacity ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="open = false"
         class="fixed inset-0 bg-gray-900/50 dark:bg-neutral-900/80 backdrop-blur-sm z-[80]"></div>
    

    <div id="faculty-profile" 
         x-show="open"
         x-cloak
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0 translate-y-0"
         x-transition:leave="transition ease-in duration-300 transform"
         x-transition:leave-start="translate-x-0 translate-y-0"
         x-transition:leave-end="translate-x-full"
         
         class="fixed z-[81] bg-white dark:bg-neutral-800 flex flex-col shadow-xl top-0 right-0 h-full border-l border-gray-200 dark:border-neutral-700 max-w-[480px] w-full "
         role="dialog" 
         tabindex="-1"
         aria-labelledby="faculty-profile-title">
        
        <!-- Header -->
        
        <div class="py-3 px-6 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700 shrink-0">
            <div>
                <div class="flex items-center gap-x-2">
                    <h3 id="faculty-profile-title" class="font-medium text-gray-800 dark:text-neutral-200">
                        Faculty profile
                    </h3>
                    
                </div>
                
            </div>
            
            <div class="flex items-center gap-2">

                <button type="button" 
                        @click="open = false"
                        class="size-8 inline-flex shrink-0 justify-center items-center gap-x-2 rounded-full border border-gray-200 text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:hover:bg-neutral-700 dark:text-neutral-200 dark:focus:bg-neutral-700">
                    <span class="sr-only">Close drawer</span>
                    <i data-lucide="x" class="size-4 shrink-0"></i>
                </button>
            </div>
        </div>
        

        <!-- Body & Footer (caller handles overflow and sticky elements) -->
        <div class="flex flex-col flex-1 overflow-hidden">
            
  <div class="flex-1 overflow-y-auto" x-effect="if (!open && $refs.facultyVideo) $refs.facultyVideo.pause()">
    <template x-if="profile">
      <div>
        <template x-if="profileVideo">
          <div class="bg-black">
            <video x-ref="facultyVideo" :src="profileVideo.video" :poster="profile.photo" controls playsinline preload="metadata" class="w-full aspect-video object-contain"></video>
            <p x-show="profile.teaches.filter((t) => t.video).length > 1" class="px-6 py-2 text-xs text-neutral-300 bg-neutral-900" x-text="'Intro for ' + profileVideo.course"></p>
          </div>
        </template>

        <div class="p-6">
          <div class="flex items-center gap-x-4">
            <template x-if="profile.photo">
              <img :src="profile.photo" :alt="profile.name" class="shrink-0 size-16 rounded-full object-cover bg-gray-100 dark:bg-neutral-700">
            </template>
            <template x-if="!profile.photo">
              <span class="shrink-0 size-16 inline-flex items-center justify-center rounded-full bg-gray-100 text-lg font-semibold text-gray-600 dark:bg-neutral-700 dark:text-neutral-300" x-text="profile.initials" aria-hidden="true"></span>
            </template>
            <div class="min-w-0">
              <h3 class="text-xl font-semibold text-gray-900 dark:text-white" x-text="profile.name"></h3>
              <p class="mt-0.5 text-sm font-medium text-primary-600 dark:text-primary-400" x-text="profile.subjects.join(' · ')"></p>
              <p x-show="profile.years_of_experience" class="mt-1 text-sm text-gray-500 dark:text-neutral-400" x-text="profile.years_of_experience + ' years teaching'"></p>
            </div>
          </div>

          <p x-show="profile.short_description" class="mt-5 text-base text-gray-700 dark:text-neutral-300" x-text="profile.short_description"></p>

          <div x-show="profile.highlights.length" class="mt-6">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">Highlights</h4>
            <ul class="mt-3 space-y-2.5">
              <template x-for="item in profile.highlights" :key="item">
                <li class="flex gap-x-2.5 text-sm text-gray-700 dark:text-neutral-300">
                  <i data-lucide="award" class="shrink-0 mt-0.5 size-4 text-amber-500 dark:text-amber-400"></i>
                  <span x-text="item"></span>
                </li>
              </template>
            </ul>
          </div>

          <div x-show="profile.qualifications.length" class="mt-6">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">Qualifications</h4>
            <ul class="mt-3 space-y-2.5">
              <template x-for="item in profile.qualifications" :key="item">
                <li class="flex gap-x-2.5 text-sm text-gray-700 dark:text-neutral-300">
                  <i data-lucide="graduation-cap" class="shrink-0 mt-0.5 size-4 text-gray-400"></i>
                  <span x-text="item"></span>
                </li>
              </template>
            </ul>
          </div>

          <div x-show="profile.bio" class="mt-6">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">About</h4>
            <p class="mt-2 text-sm leading-6 text-gray-600 dark:text-neutral-400" x-text="profile.bio"></p>
          </div>

          
          <div x-show="facultyCourseCount > 1" class="mt-6 pt-6 border-t border-gray-200 dark:border-neutral-700">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">Teaches in this product</h4>
            <ul class="mt-3 divide-y divide-gray-100 dark:divide-neutral-700">
              <template x-for="item in profile.teaches" :key="item.course">
                <li class="py-2.5 flex items-center justify-between gap-x-3">
                  <div class="min-w-0">
                    <p class="text-sm font-medium text-gray-800 dark:text-neutral-200" x-text="item.course"></p>
                    <p class="text-xs text-gray-500 dark:text-neutral-400" x-text="item.subject"></p>
                  </div>
                  <template x-if="item.video && profile.teaches.filter((t) => t.video).length > 1">
                    <button type="button" @click="profileVideo = item; $nextTick(() => $refs.facultyVideo && $refs.facultyVideo.play())"
                      :disabled="profileVideo === item"
                      class="shrink-0 inline-flex items-center gap-x-1.5 py-1 px-2 rounded-lg text-xs font-medium text-gray-700 border border-gray-200 hover:bg-gray-50 disabled:text-gray-400 disabled:hover:bg-transparent focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-neutral-300 dark:border-neutral-700 dark:hover:bg-neutral-700 dark:disabled:text-neutral-500">
                      <i data-lucide="circle-play" class="size-3.5"></i><span x-text="profileVideo === item ? 'Now showing' : 'Watch intro'"></span>
                    </button>
                  </template>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </div>
    </template>
  </div>

        </div>

    </div>
</div>
