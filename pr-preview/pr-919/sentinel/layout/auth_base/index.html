<body class="h-full"
  x-data="{ previewPath: window.location.pathname.match(/(\/pr-preview\/pr-\d+)?/)[0] || '' }">
    
<div class="min-h-full flex flex-col items-center justify-center py-6 sm:py-8 px-4 sm:px-6 lg:px-8 bg-gray-50 dark:bg-neutral-900 relative overflow-hidden"
  x-data="{ 
    isDark: localStorage.getItem('hs_theme') === 'dark' || (!localStorage.getItem('hs_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
  }"
  x-init="
    if (isDark) document.documentElement.classList.add('dark');
    $watch('isDark', val => { 
      const theme = val ? 'dark' : 'light';
      localStorage.setItem('hs_theme', theme);
      if (val) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })
  ">
  
  <div class="fixed top-4 right-4 z-50">
    <button x-show="!isDark" @click="isDark = true" type="button" class="flex items-center gap-x-1.5 text-sm text-gray-500 hover:text-gray-900 focus:outline-none transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <span class="sr-only">Dark mode</span>
    </button>
    <button x-show="isDark" x-cloak @click="isDark = false" type="button" class="flex items-center gap-x-1.5 text-sm text-neutral-400 hover:text-white focus:outline-none transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

      </svg>
      <span class="sr-only">Light mode</span>
    </button>
  </div>

  
  

</div>
