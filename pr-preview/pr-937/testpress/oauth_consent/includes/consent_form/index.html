<form id="body" class="space-y-6" method="POST" action="#">
  <p class="text-center text-gray-600 leading-relaxed">
    This lets
    <span id="client-name"></span>
    use your
    <span id="institute-name"></span>
    account through an AI assistant.
  </p>
  <p class="text-center text-sm text-gray-500">
    You can revoke access later.
  </p>

  <div class="flex flex-col-reverse sm:flex-row gap-3">
    <button
      id="deny"
      type="submit"
      name="confirm"
      value="deny"
      class="w-full min-h-[44px] flex justify-center py-3.5 px-4 bg-white border border-gray-300 rounded-md shadow-sm text-base font-medium text-gray-900 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 leading-5 tracking-[-0.33px]"
    >
      Deny
    </button>
    <button
      id="allow"
      type="submit"
      name="confirm"
      value="approve"
      class="w-full min-h-[44px] flex justify-center py-3.5 px-4 bg-[#58bc98] border border-transparent rounded-md shadow-sm text-base font-bold text-white hover:bg-opacity-80 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 leading-5 tracking-[-0.33px]"
    >
      Allow
    </button>
  </div>
</form>
