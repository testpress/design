            Export Scores

            Export Scores (Excl. Retakes)
          </a>
          <a href="#" class="flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm text-gray-800 hover:bg-gray-100 whitespace-nowrap dark:text-neutral-300 dark:hover:bg-neutral-800">

<script>
function toggleExportDropdown() {
  const menu = document.getElementById('export-dropdown-menu');
  menu.classList.toggle('hidden');
}
// Close when clicking outside
document.addEventListener('click', function(e) {
  const wrapper = document.getElementById('export-dropdown-wrapper');
  if (wrapper && !wrapper.contains(e.target)) {
    document.getElementById('export-dropdown-menu').classList.add('hidden');
  }
});
</script>
