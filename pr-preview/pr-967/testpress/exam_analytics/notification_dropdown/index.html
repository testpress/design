<!-- Notification Dropdown -->
<div class="hs-dropdown relative inline-flex [--placement:bottom-right] mb-2 z-20 mr-2">
    <button id="hs-dropdown-attention" type="button" class="hs-dropdown-toggle group relative shrink-0 h-8 w-8 inline-flex justify-center items-center border border-transparent text-gray-500 dark:text-neutral-400 hover:bg-gray-100 dark:hover:bg-neutral-700 focus:bg-gray-100 dark:focus:bg-neutral-700 rounded-full disabled:opacity-50 disabled:pointer-events-none focus:outline-none" aria-label="Messages">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-alert shrink-0 size-5 mr-2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <span class="flex absolute top-0 right-0 z-10 -mt-1.5 -mr-1.5">
        <span class="animate-ping absolute inline-flex size-full rounded-full bg-red-400 opacity-75 dark:bg-red-600"></span>
        <span class="relative min-w-[1.125rem] min-h-[1.125rem] inline-flex justify-center items-center text-[10px] bg-red-500 text-white rounded-full px-1">
          2
        </span>
      </span>
      <span class="absolute top-1/2 -translate-y-1/2 right-full mr-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-20 py-1.5 px-2.5 bg-gray-900 border border-gray-700 text-xs text-white rounded-lg dark:bg-white dark:border-neutral-200 dark:text-neutral-800 whitespace-nowrap shadow-sm" role="tooltip">
        Needs Your Attention
      </span>
    </button>


  
  <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 hidden min-w-[350px] bg-white shadow-xl rounded-xl p-2 mt-2 dark:bg-neutral-800 dark:border dark:border-neutral-700" aria-labelledby="hs-dropdown-attention">
    
    <a herf="#" class="flex items-start gap-x-3 py-2 px-3 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-700 focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700 cursor-pointer mb-1 group">
      <div class="flex shrink-0 justify-center items-center size-8 rounded-lg bg-gray-100 text-gray-500 dark:bg-neutral-700 dark:text-neutral-400 mt-0.5">
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v4"/><path d="M8 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 11h8"/><path d="M8 15h8"/></svg>
      </div>
      <div class="grow">
        <p class="text-sm font-semibold text-gray-800 dark:text-neutral-200">2 attempts pending evaluation</p>
        <p class="text-xs text-gray-500 dark:text-neutral-400 mt-0.5">Evaluate and publish results</p>
      </div>
    </a>
    
    <a herf="#" class="flex items-start gap-x-3 py-2 px-3 rounded-lg hover:bg-gray-100 dark:hover:bg-neutral-700 focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700 cursor-pointer group">
      <div class="flex shrink-0 justify-center items-center size-8 rounded-lg bg-gray-100 text-gray-500 dark:bg-neutral-700 dark:text-neutral-400 mt-0.5">
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="grow">
        <p class="text-sm font-semibold text-gray-800 dark:text-neutral-200">1 attempt flagged for review</p>
        <p class="text-xs text-gray-500 dark:text-neutral-400 mt-0.5">Possible malpractice detected</p>
      </div>
    </a>
  </div>
</div>
