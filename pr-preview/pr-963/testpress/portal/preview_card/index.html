








<div class="flex flex-col bg-white dark:bg-neutral-800 rounded-xl border border-gray-200 dark:border-neutral-700  p-4 sm:p-5 ">
  
  

  <div>
    
      
  <div class="space-y-4">
    <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
      <h3 class="font-semibold text-gray-800 dark:text-white">Preview</h3>
      <div class="bg-gray-100 dark:bg-neutral-800 p-1 rounded-lg inline-flex">
        <button @click="currentView = 'logged'" :class="{'bg-white shadow-xs text-primary-600 dark:bg-neutral-700 dark:text-primary-400': currentView === 'logged', 'text-gray-500 hover:text-gray-700 dark:text-neutral-400 dark:hover:text-neutral-300': currentView !== 'logged'}" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors focus:outline-hidden">Logged in</button>
        <button @click="currentView = 'guest'" :class="{'bg-white shadow-xs text-primary-600 dark:bg-neutral-700 dark:text-primary-400': currentView === 'guest', 'text-gray-500 hover:text-gray-700 dark:text-neutral-400 dark:hover:text-neutral-300': currentView !== 'guest'}" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors focus:outline-hidden">Not logged in</button>
      </div>
    </div>
    
    <!-- Logged in view (Sidebar) -->
    <div x-show="currentView === 'logged'" class="border border-gray-200 dark:border-neutral-700 rounded-lg bg-white dark:bg-neutral-900 overflow-hidden relative shadow-sm flex h-[240px]">
      <!-- Sidebar Preview -->
      <div class="w-[45%] bg-[#172033] flex flex-col py-3 px-2 space-y-1 overflow-y-auto">
         <!-- Dummy Item -->
         <div class="flex items-center gap-2.5 px-2 py-1.5 rounded-md text-gray-400 hover:bg-white/10 hover:text-white">
           <i data-lucide="home" class="size-3.5 shrink-0"></i>
           <span class="text-xs truncate">Dashboard</span>
         </div>
         
         <!-- Portals -->
         <div x-show="settings.enabled" x-cloak class="flex flex-col">
           <div class="flex items-center justify-between px-2 py-1.5 bg-white/10 text-gray-200 rounded-md">
             <div class="flex items-center gap-2.5 min-w-0">
               <i data-lucide="door-open" class="size-3.5 shrink-0 text-gray-400"></i>
               <span class="text-xs truncate" x-text="settings.label || 'Portals'"></span>
             </div>
             <i data-lucide="chevron-up" class="size-3 shrink-0 text-gray-400"></i>
           </div>
           
           <div class="flex flex-col mt-1 ml-[18px] pl-3 border-l border-gray-700 space-y-0.5">
              <template x-if="visibleLinks.length === 0">
                <div class="px-2 py-1 text-[10px] text-gray-500 italic">No links</div>
              </template>
              <template x-for="link in visibleLinks" :key="link.id">
                <div class="px-2 py-1.5 rounded-md text-xs text-gray-400 hover:text-white hover:bg-white/5 truncate" x-text="link.name"></div>
              </template>
           </div>
         </div>

         <!-- Dummy Item -->
         <div class="flex items-center gap-2.5 px-2 py-1.5 rounded-md text-gray-400 hover:bg-white/10 hover:text-white">
           <i data-lucide="layers" class="size-3.5 shrink-0"></i>
           <span class="text-xs truncate">My Courses</span>
         </div>
      </div>

      <!-- Main content placeholder -->
      <div class="flex-1 bg-gray-50 dark:bg-neutral-800/50 p-4">
         <div class="h-2.5 bg-gray-200 dark:bg-neutral-700 rounded w-3/4 mb-3"></div>
         <div class="h-2.5 bg-gray-200 dark:bg-neutral-700 rounded w-1/2 mb-3"></div>
         <div class="h-2.5 bg-gray-200 dark:bg-neutral-700 rounded w-5/6"></div>
      </div>
    </div>

    <!-- Guest view (Navbar) -->
    <div x-show="currentView === 'guest'" x-cloak class="border border-gray-200 dark:border-neutral-700 rounded-lg bg-white dark:bg-neutral-900 overflow-hidden relative shadow-sm h-[240px] flex flex-col">
      <!-- Navbar -->
      <div class="flex items-center justify-around gap-2 px-2 py-3 border-b border-gray-200 dark:border-neutral-700 text-[11px] text-gray-600 dark:text-neutral-400 shrink-0">
        <span>Home</span>
        <span>Courses</span>
        <span>Exams</span>
        
        <div x-show="settings.enabled" class="relative">
          <button class="flex items-center gap-1 px-2 py-1 bg-gray-100 dark:bg-neutral-800 text-gray-700 dark:text-neutral-300 rounded-md font-medium">
            <span x-text="settings.label || 'Portals'"></span>
            <i data-lucide="chevron-down" class="size-3"></i>
          </button>
          
          <div class="absolute right-0 mt-1 w-32 p-1 border border-gray-200 dark:border-neutral-700 rounded-lg shadow-lg bg-white dark:bg-neutral-800 z-10 flex flex-col">
            <template x-if="visibleLinks.length === 0">
              <div class="p-2 text-center text-[10px] text-gray-400 italic">No links</div>
            </template>
            <template x-for="link in visibleLinks" :key="link.id">
              <div class="px-2 py-1.5 text-[11px] text-gray-700 dark:text-neutral-300 rounded hover:bg-gray-50 dark:hover:bg-neutral-700 truncate" x-text="link.name"></div>
            </template>
          </div>
        </div>
      </div>
      
      <!-- Main content placeholder -->
      <div class="flex-1 bg-gray-50 dark:bg-neutral-800/50 p-4">
        <div class="h-2.5 bg-gray-200 dark:bg-neutral-700 rounded w-3/4 mb-3"></div>
        <div class="h-2.5 bg-gray-200 dark:bg-neutral-700 rounded w-1/2"></div>
      </div>
    </div>

    <p class="text-xs text-gray-500 dark:text-neutral-400 mt-2 text-center" x-text="previewNote"></p>
  </div>

    
  </div>
  
</div>
