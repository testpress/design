<!-- Result of an assign or move, with Undo -->
<div x-show="toast" x-cloak role="status" aria-live="polite"
     x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
     class="fixed bottom-20 inset-x-0 lg:ps-65 z-[70] flex justify-center px-4 pointer-events-none">
  <div class="pointer-events-auto flex items-center gap-x-4 py-2.5 ps-4 pe-2 rounded-xl bg-gray-900 text-white text-sm shadow-lg dark:bg-white dark:text-gray-900">
    <span x-text="toast?.text"></span>
    <button x-show="toast?.undo" type="button" @click="undoMove()"
            class="py-1 px-2 rounded-lg font-medium text-primary-300 hover:bg-white/10 dark:text-primary-700 dark:hover:bg-gray-900/10 focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">Undo</button>
    <button type="button" @click="toast = null" aria-label="Dismiss"
            class="inline-flex justify-center items-center size-7 rounded-lg opacity-70 hover:opacity-100 focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
      <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
</div>
