<!doctype html>
<html class=" ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="generator" content="Eleventy v3.0.0">
  <title></title>
  <link rel="stylesheet" href="/pr-preview/pr-952/css/sentinel.css" />
  
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <script>
    sans = [
      'ui-sans-serif',
      'system-ui',
      '-apple-system',
      'BlinkMacSystemFont',
      '"Segoe UI"',
      'Roboto',
      '"Helvetica Neue"',
      'Arial',
      '"Noto Sans"',
      'sans-serif',
      '"Apple Color Emoji"',
      '"Segoe UI Emoji"',
      '"Segoe UI Symbol"',
      '"Noto Color Emoji"',
    ]
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter var', ...sans],
          },
        }
      }
    }
  </script>
   
  
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"></script>

  <style>
    [x-cloak] {
      display: none !important;
    }
  </style>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();
    });
  </script>
</head>



<body x-data="{ 
    mobileMenuOpen: false, 
    searchOpen: false, 
    previewPath: window.location.pathname.match(/(\/pr-preview\/pr-\d+)?/)[0] || '',
    isDark: localStorage.getItem('hs_theme') === 'dark' || (!localStorage.getItem('hs_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches) 
  }" x-init="$watch('isDark', val => { 
    const theme = val ? 'dark' : 'light';
    localStorage.setItem('hs_theme', theme);
    if (val) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  })"
  class="bg-background-1 text-foreground transition-colors duration-300 antialiased">
  
  
  <main id="content">
    <div class="fixed top-4 right-4 z-50">

      <!-- Dark Mode -->
      <button x-show="!isDark" @click="isDark = true" type="button"
        class="flex items-center gap-x-1.5 text-sm text-muted-foreground hover:text-foreground focus:outline-hidden">
        <i class="shrink-0 size-4" data-lucide="moon"></i>

        <span class="sr-only">Dark mode</span>
      </button>

      <!-- Light Mode -->
      <button x-show="isDark" @click="isDark = false" type="button"
        class="flex items-center gap-x-1.5 text-sm text-muted-foreground hover:text-foreground focus:outline-hidden">
        <i class="shrink-0 size-4" data-lucide="sun"></i>

        <span class="sr-only">Light mode</span>
      </button>

    </div>

    <div>

      <!-- ========== MAIN CONTENT ========== -->
      <div class="flex min-h-full">


        <!-- Content -->
        <div class="grow px-5">

          <div class="h-full min-h-screen sm:w-112 flex flex-col justify-center mx-auto space-y-5 py-10">
            <div class="flex justify-center mb-8">
              <img src="/pr-preview/pr-952/img/sentinel/logo.png" alt="TPSentinel Logo" class="mx-auto h-10 w-auto">
            </div>
            
<div x-data="forgotPassword">
  <!-- Forgot Password Form -->
  <div x-show="!isSent" x-cloak class="space-y-5">
    <div class="p-5 flex flex-col bg-card border border-card-line shadow-xs rounded-2xl space-y-5">
    <div class="text-center mb-8">
      <h1 class="text-xl sm:text-2xl font-semibold text-foreground">
        Forgot password?
      </h1>
      <p class="mt-1 text-sm text-muted-foreground-1">
        Enter your email and we’ll send you a reset link.
      </p>
    </div>

    <form @submit.prevent="submit()">
      <div class="space-y-5">
        <div>
          <label for="email" class="block mb-2 text-sm font-medium text-foreground">
            Email
          </label>
          <input type="email" id="email" x-model="email" required
            class="py-2 sm:py-2.5 px-3 block w-full bg-layer border-layer-line rounded-lg sm:text-sm text-foreground placeholder:text-muted-foreground focus:border-primary-focus focus:ring-primary-focus disabled:opacity-50 disabled:pointer-events-none"
            placeholder="you@email.com">
        </div>

        <button type="submit" :disabled="isSending"
          class="py-2.5 px-3 w-full inline-flex justify-center items-center gap-x-2 bg-primary border border-primary-line text-primary-foreground text-sm font-medium rounded-lg shadow-2xs hover:bg-primary-hover focus:outline-hidden focus:ring-1 focus:ring-primary-focus disabled:opacity-70 disabled:pointer-events-none transition-all">
          <i x-show="isSending" class="animate-spin size-4 text-primary-foreground" data-lucide="loader-2"></i>
          <span x-text="isSending ? 'Sending...' : 'Send email'"></span>
        </button>
      </div>
    </form>
    </div>

    <p class="text-sm text-muted-foreground-1 text-center">
      You didn’t forget your password?
      <a class="inline-flex items-center gap-x-1 text-sm text-primary decoration-2 hover:underline font-medium focus:outline-hidden focus:underline" :href="previewPath + '/sentinel/authentication/login/'">
        Sign in
        <i class="shrink-0 size-4" data-lucide="chevron-right"></i>
      </a>
    </p>
  </div>

  <!-- Success Message -->
  <div x-show="isSent" x-cloak x-transition class="p-5 flex flex-col bg-card border border-card-line shadow-xs rounded-2xl space-y-5">
    <div class="text-center mb-8">
        <div class="mb-5 sm:mb-7 text-center">
            <span class="shrink-0 size-14 md:size-16 mx-auto flex justify-center items-center border-2 border-primary text-primary rounded-full">
                <i class="shrink-0 size-8" data-lucide="check"></i>
            </span>
        </div>
      <h1 class="text-xl sm:text-2xl font-semibold text-foreground">
        Reset link sent
      </h1>
      <p class="mt-1 text-sm text-muted-foreground-1">
        We’ve sent a password reset link to <span class="font-semibold text-foreground" x-text="email"></span>.
      </p>
    </div>

    <div class="space-y-4">
      <a :href="previewPath + '/sentinel/authentication/login/'"
        class="py-2.5 px-3 w-full inline-flex justify-center items-center gap-x-2 bg-primary border border-primary-line text-primary-foreground text-sm font-medium rounded-lg shadow-2xs hover:bg-primary-hover focus:outline-hidden focus:ring-1 focus:ring-primary-focus">
        Back to Login
      </a>
      
      <p class="text-sm text-muted-foreground-1 text-center">
        Didn't receive an email?
        <button @click="submit()" :disabled="isSending" class="inline-flex items-center gap-x-1 text-sm text-primary decoration-2 hover:underline font-medium focus:outline-hidden focus:underline disabled:opacity-50">
          <span x-text="isSending ? 'Resending...' : 'Resend'"></span>
          <i x-show="!isSending" class="shrink-0 size-4" data-lucide="chevron-right"></i>
        </button>
      </p>
    </div>
  </div>
</div>

          </div>
        </div>
        <!-- End Content -->
      </div>
    </div>
  </main>
  

  

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('forgotPassword', () => ({
      email: '',
      isSending: false,
      isSent: false,
      
      submit() {
        if (!this.email) return;
        this.isSending = true;
        
        // Simulate email sending delay
        setTimeout(() => {
          this.isSending = false;
          this.isSent = true;
        }, 1500);
      }
    }))
  })
</script>

</body>


</html>
