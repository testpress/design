<!-- Preline Pro Modal: Edit Audio Track -->
<!-- Preline Docs: https://preline.co/docs/overlay.html -->
<div x-show="showEditModal" class="relative z-50" aria-labelledby="edit-modal-title" role="dialog" aria-modal="true" x-cloak>
  <!-- Backdrop Overlay -->
  <div x-show="showEditModal" 
    x-transition:enter="ease-out duration-300" 
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" 
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100" 
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 bg-gray-500/75 transition-opacity"></div>

  <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
      <div x-show="showEditModal" 
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100 sm:scale-100"
        x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
        @click.away="showEditModal = false"
        class="w-full sm:max-w-xl bg-white border border-gray-200 rounded-xl pointer-events-auto shadow-xl transition-all text-left">
        
        <template x-if="editingTrack">
          <div>
            <!-- Header -->
            <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200">
              <h2 id="edit-modal-title" class="font-medium text-gray-800 text-base">
                Edit audio track
              </h2>
              <button type="button" @click="showEditModal = false"
                class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-100 text-gray-800 hover:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none focus:outline-none focus:bg-gray-200" aria-label="Close">
                <span class="sr-only">Close</span>
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
            <!-- End Header -->

            <!-- Body -->
            <div class="p-4 space-y-4">
              
              <!-- Language Select (Reusable Preline Component) -->
              <!-- Reusable Preline Searchable Language Select Component (Exact Preline Advanced Select Styling) -->
<div class="relative" x-data="{
  open: false,
  search: '',
  languages: [
    { name: 'English', code: 'en' },
    { name: 'Spanish', code: 'es' },
    { name: 'Tamil', code: 'ta' },
    { name: 'Hindi', code: 'hi' },
    { name: 'Telugu', code: 'te' },
    { name: 'Malayalam', code: 'ml' },
    { name: 'Kannada', code: 'kn' },
    { name: 'Marathi', code: 'mr' },
    { name: 'Bengali', code: 'bn' },
    { name: 'French', code: 'fr' },
    { name: 'German', code: 'de' },
    { name: 'Arabic', code: 'ar' },
    { name: 'Japanese', code: 'ja' },
    { name: 'Portuguese', code: 'pt' },
    { name: 'Russian', code: 'ru' },
    { name: 'Chinese', code: 'zh' }
  ],
  get selectedLang() {
    return (typeof editingTrack !== 'undefined' && editingTrack) ? editingTrack.language : language;
  },
  get filteredLanguages() {
    if (!this.search) return this.languages;
    return this.languages.filter(l => l.name.toLowerCase().includes(this.search.toLowerCase()));
  },
  select(lang) {
    if (typeof editingTrack !== 'undefined' && editingTrack) {
      editingTrack.language = lang.name;
      editingTrack.lang_code = lang.code;
    } else {
      language = lang.name;
      if (!trackName) trackName = lang.name;
    }
    this.open = false;
    this.search = '';
  }
}" @click.away="open = false">
  
  <label class="block mb-1.5 text-sm font-medium text-gray-800">
    Language <span class="text-red-500">*</span>
  </label>

  <!-- Trigger Button (Exact Preline style, properly aligned) -->
  <button type="button" 
    @click="open = !open; if (open) $nextTick(() => $refs.searchInput.focus());"
    :disabled="typeof isUploading !== 'undefined' && isUploading"
    class="relative py-2 px-3 pe-9 flex items-center justify-between w-full cursor-pointer bg-white border border-gray-200 text-gray-800 rounded-lg text-start text-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-xs"
    aria-haspopup="listbox" :aria-expanded="open">
    <span x-text="selectedLang || 'Select language...'" :class="!selectedLang ? 'text-gray-400' : 'text-gray-800'" class="truncate text-sm"></span>
    <div class="absolute top-1/2 end-3 -translate-y-1/2 pointer-events-none flex items-center">
      <svg class="shrink-0 size-3.5 text-gray-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>
      </svg>
    </div>
  </button>

  <!-- Dropdown Menu Panel (Exact Preline dropdownClasses) -->
  <div x-show="open" x-cloak
    x-transition:enter="transition ease-out duration-100"
    x-transition:enter-start="transform opacity-0 scale-95"
    x-transition:enter-end="transform opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-75"
    x-transition:leave-start="transform opacity-100 scale-100"
    x-transition:leave-end="transform opacity-0 scale-95"
    class="mt-2 max-h-72 pb-1 px-1 space-y-0.5 z-20 w-full bg-white border border-gray-200 rounded-lg shadow-xl overflow-hidden overflow-y-auto focus:outline-hidden absolute [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300">
    
    <!-- Search Input Wrapper (Exact Preline searchWrapperClasses & searchClasses) -->
    <div class="bg-white p-2 -mx-1 sticky top-0">
      <input type="text" x-ref="searchInput" x-model="search" placeholder="Search..."
        class="block w-full sm:text-sm bg-transparent border border-gray-200 rounded-lg text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:ring-blue-500 py-1.5 sm:py-2 px-3">
    </div>

    <!-- Options List (Exact Preline optionClasses & optionTemplate - NO checkmark) -->
    <template x-for="lang in filteredLanguages" :key="lang.name">
      <button type="button" @click="select(lang)"
        class="py-2 px-4 w-full text-sm text-gray-800 cursor-pointer hover:bg-gray-100 rounded-lg focus:outline-hidden focus:bg-gray-100 text-start flex items-center"
        :class="selectedLang === lang.name ? 'bg-gray-100 font-medium' : ''"
        role="option" :aria-selected="selectedLang === lang.name">
        <span class="text-gray-800" x-text="lang.name"></span>
      </button>
    </template>
    
    <template x-if="filteredLanguages.length === 0">
      <div class="py-3 px-4 text-center text-xs text-gray-400">
        No matching results
      </div>
    </template>
  </div>
</div>


              <!-- Track Label / Name Input -->
              <div>
                <label for="edit-track-name" class="block mb-1.5 text-sm font-medium text-gray-800">
                  Track Label / Name <span class="text-gray-400 font-normal lowercase">(optional)</span>
                </label>
                <input type="text" id="edit-track-name" x-model="editingTrack.name" placeholder="e.g., Director's Commentary"
                  class="py-2 px-3 block w-full bg-white border border-gray-200 rounded-lg text-sm text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
              </div>

              <!-- Default Track Setting (TPStreams Checkbox Pattern) -->
              <div class="relative flex items-start gap-x-3 pt-1">
                <div class="flex h-6 items-center">
                  <input id="edit-set-default-audio" type="checkbox" x-model="editingTrack.is_default"
                    class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600 cursor-pointer">
                </div>
                <div class="text-sm leading-6">
                  <label for="edit-set-default-audio" class="font-medium text-gray-800 cursor-pointer select-none">
                    Set as default audio track
                  </label>
                  <p class="text-xs text-gray-500">Plays by default when a viewer starts the video.</p>
                </div>
              </div>

            </div>
            <!-- End Body -->

            <!-- Footer -->
            <div class="p-4 flex justify-end items-center gap-x-2 border-t border-gray-200">
              <button type="button" @click="showEditModal = false"
                class="py-2 px-3 inline-flex justify-center items-center text-center bg-white border border-gray-200 text-gray-800 text-sm font-medium rounded-lg shadow-2xs hover:bg-gray-50 focus:outline-none disabled:opacity-50 disabled:pointer-events-none">
                Cancel
              </button>
              <button type="button" 
                @click="
                  saveTrackEdit();
                  showEditModal = false;
                "
                class="py-2 px-3 inline-flex justify-center items-center gap-x-2 text-center bg-blue-600 border border-transparent text-white text-sm font-medium rounded-lg shadow-2xs hover:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-none">
                Save changes
              </button>
            </div>
            <!-- End Footer -->

          </div>
        </template>

      </div>
    </div>
  </div>
</div>
