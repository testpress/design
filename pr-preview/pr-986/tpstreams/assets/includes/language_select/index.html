<!-- Reusable Preline Searchable Language Select Component (Exact Preline Advanced Select Styling) -->
<div class="relative" x-data="{
  open: false,
  search: '',
  languages: [
    { name: 'English', code: 'en' },
    { name: 'Spanish', code: 'es' },
    { name: 'Tamil', code: 'ta' },
    { name: 'Hindi', code: 'hi' },
    { name: 'Telugu', code: 'te' },
    { name: 'Malayalam', code: 'ml' },
    { name: 'Kannada', code: 'kn' },
    { name: 'Marathi', code: 'mr' },
    { name: 'Bengali', code: 'bn' },
    { name: 'French', code: 'fr' },
    { name: 'German', code: 'de' },
    { name: 'Arabic', code: 'ar' },
    { name: 'Japanese', code: 'ja' },
    { name: 'Portuguese', code: 'pt' },
    { name: 'Russian', code: 'ru' },
    { name: 'Chinese', code: 'zh' }
  ],
  get selectedLang() {
    return (typeof editingTrack !== 'undefined' && editingTrack) ? editingTrack.language : language;
  },
  get filteredLanguages() {
    if (!this.search) return this.languages;
    return this.languages.filter(l => l.name.toLowerCase().includes(this.search.toLowerCase()));
  },
  select(lang) {
    if (typeof editingTrack !== 'undefined' && editingTrack) {
      editingTrack.language = lang.name;
      editingTrack.lang_code = lang.code;
    } else {
      language = lang.name;
      if (!trackName) trackName = lang.name;
    }
    this.open = false;
    this.search = '';
  }
}" @click.away="open = false">
  
  <label class="block mb-1.5 text-sm font-medium text-gray-800">
    Language <span class="text-red-500">*</span>
  </label>

  <!-- Trigger Button (Exact Preline style, properly aligned) -->
  <button type="button" 
    @click="open = !open; if (open) $nextTick(() => $refs.searchInput.focus());"
    :disabled="typeof isUploading !== 'undefined' && isUploading"
    class="relative py-2 px-3 pe-9 flex items-center justify-between w-full cursor-pointer bg-white border border-gray-200 text-gray-800 rounded-lg text-start text-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-xs"
    aria-haspopup="listbox" :aria-expanded="open">
    <span x-text="selectedLang || 'Select language...'" :class="!selectedLang ? 'text-gray-400' : 'text-gray-800'" class="truncate text-sm"></span>
    <div class="absolute top-1/2 end-3 -translate-y-1/2 pointer-events-none flex items-center">
      <svg class="shrink-0 size-3.5 text-gray-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>
      </svg>
    </div>
  </button>

  <!-- Dropdown Menu Panel (Exact Preline dropdownClasses) -->
  <div x-show="open" x-cloak
    x-transition:enter="transition ease-out duration-100"
    x-transition:enter-start="transform opacity-0 scale-95"
    x-transition:enter-end="transform opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-75"
    x-transition:leave-start="transform opacity-100 scale-100"
    x-transition:leave-end="transform opacity-0 scale-95"
    class="mt-2 max-h-72 pb-1 px-1 space-y-0.5 z-20 w-full bg-white border border-gray-200 rounded-lg shadow-xl overflow-hidden overflow-y-auto focus:outline-hidden absolute [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300">
    
    <!-- Search Input Wrapper (Exact Preline searchWrapperClasses & searchClasses) -->
    <div class="bg-white p-2 -mx-1 sticky top-0">
      <input type="text" x-ref="searchInput" x-model="search" placeholder="Search..."
        class="block w-full sm:text-sm bg-transparent border border-gray-200 rounded-lg text-gray-800 placeholder:text-gray-400 focus:border-blue-500 focus:ring-blue-500 py-1.5 sm:py-2 px-3">
    </div>

    <!-- Options List (Exact Preline optionClasses & optionTemplate - NO checkmark) -->
    <template x-for="lang in filteredLanguages" :key="lang.name">
      <button type="button" @click="select(lang)"
        class="py-2 px-4 w-full text-sm text-gray-800 cursor-pointer hover:bg-gray-100 rounded-lg focus:outline-hidden focus:bg-gray-100 text-start flex items-center"
        :class="selectedLang === lang.name ? 'bg-gray-100 font-medium' : ''"
        role="option" :aria-selected="selectedLang === lang.name">
        <span class="text-gray-800" x-text="lang.name"></span>
      </button>
    </template>
    
    <template x-if="filteredLanguages.length === 0">
      <div class="py-3 px-4 text-center text-xs text-gray-400">
        No matching results
      </div>
    </template>
  </div>
</div>
