

<!-- Navigation Buttons Bar (Outside the main white card container, without top border line) -->
<div class="mt-6 flex justify-between items-center gap-x-3">
  

  
  
  

  
  

  

  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-white border border-gray-200 text-gray-800 hover:bg-gray-50 focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"   @click="resetUpload()" data-hs-stepper-back-btn="">
  

    
    
      <i data-lucide="chevron-left" class="shrink-0 size-3.5"></i>
    

    Back

    

  
    </button>
  



  <div class="flex items-center gap-x-2">
    <!-- Next Step Button -->
    

  
  
  

  
  

  

  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   data-hs-stepper-next-btn="" :disabled="assets.length === 0 || (hasPdf && !pdfSettings.showInPdfViewer && !pdfSettings.allowDownload)">
  

    
    

    Next

    
      <i data-lucide="chevron-right" class="shrink-0 size-3.5"></i>
    

  
    </button>
  



    <!-- Start Upload Button -->
    

  
  
  

  
  

  

  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   @click="startUpload(); $el.style.display = 'none';" data-hs-stepper-finish-btn="" style="display: none;">
  

    
    
      <i data-lucide="upload" class="shrink-0 size-3.5"></i>
    

    Start Upload

    

  
    </button>
  



    <!-- Finish / Submit Button (Shown after upload completes) -->
    

  
  
  

  
  

  

  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   x-cloak x-show="isAllUploaded" :disabled="!isAllCompleted || uploadStarted">
  

    
    

    Submit

    

  
    </button>
  


  </div>
</div>
