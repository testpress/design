



<div data-hs-stepper-content-item='{"index": 1}'>
  <!-- Hidden file input triggered by Add Attachments button -->
  <input id="assetsInput" x-ref="assetsInput" @change="selectFile" type="file" multiple class="hidden"
    accept=".pdf,.docx,.xlsx,.pptx,.zip,.txt,.png,.jpg,.jpeg" />

  <!-- Section Title (Left Side above table) -->
  

  

  

  
<div class="flex flex-col bg-white dark:bg-neutral-800 border-y sm:border-y sm:border-x border-gray-200 dark:border-neutral-700 shadow-2xs rounded-none sm:rounded-xl p-5 space-y-4">
  
  
  

  
  
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 md:gap-5 ">
      <div class="w-full flex-1 flex flex-col sm:flex-row items-center gap-3">
        
          <div class="w-full sm:w-auto">
            
    <h2 class="text-base font-semibold leading-7 text-gray-900 dark:text-neutral-100">Attachment Files</h2>
  
          </div>
        
        
      </div>
      
      <div class="flex flex-wrap md:justify-end items-center gap-2">
        
          
    <div class="flex items-center gap-2">
      <!-- Remove Selected Button -->
      <button type="button" x-cloak x-show="assets.some(item => item.isSelected)" @click="removeSelected()"
        class="whitespace-nowrap py-2 px-2.5 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-lg border border-gray-200 bg-white text-red-600 shadow-2xs hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-red-400 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700 transition-colors">
        <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
        Remove selected
      </button>

      <!-- Add Attachments Button -->
      

  
  
  

  
  

  

  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   @click="$refs.assetsInput.click();">
  

    
    
      <i data-lucide="plus" class="shrink-0 size-3.5"></i>
    

    Add Attachments

    

  
    </button>
  


    </div>
  
        
      </div>
    </div>
  

  
  

  
  <div class="overflow-x-auto [&::-webkit-scrollbar]:h-2 [&::-webkit-scrollbar-thumb]:rounded-full dark:[&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500   sm:rounded-b-xl ">
    <div class="min-w-full inline-block align-middle">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-neutral-700">
        
          <thead class="bg-white dark:bg-neutral-800">
            <tr class="border-t border-gray-200 dark:border-neutral-700">
              
    <th scope="col" class="px-5 py-2.5 w-8">
      <div class="flex items-center h-5">
        <input type="checkbox" x-model="isSelectAllChecked" @change="isSelectAllChecked ? selectAll() : unSelectAll()" class="border-gray-200 rounded text-emerald-600 focus:ring-emerald-500 dark:bg-neutral-800 dark:border-neutral-700 dark:checked:bg-emerald-500 cursor-pointer">
      </div>
    </th>
    
  
    <th scope="col" class="px-5 py-2.5 text-start text-sm font-normal text-gray-500 dark:text-neutral-400 " >
      Name
    </th>
  

    
  
    <th scope="col" class="px-5 py-2.5 text-start text-sm font-normal text-gray-500 dark:text-neutral-400 " >
      File Type
    </th>
  

    
  
    <th scope="col" class="px-5 py-2.5 text-start text-sm font-normal text-gray-500 dark:text-neutral-400 " >
      Size
    </th>
  

    
  
    <th scope="col" class="px-5 py-2.5 text-start text-sm font-normal text-gray-500 dark:text-neutral-400 text-end" >
      Action
    </th>
  

  
            </tr>
          </thead>
        
        <tbody class="divide-y divide-gray-200 dark:divide-neutral-700 bg-white dark:bg-neutral-900">
          
            
    <!-- Table Rows -->
    <template x-for="asset in assets" :key="asset.id">
      <tr class="group">
        
  <td class="px-5 py-3 whitespace-nowrap align-middle text-sm px-5 py-2.5 w-8" >
    
      
          <div class="flex items-center h-5">
            <input type="checkbox" x-model="asset.isSelected" class="border-gray-200 rounded text-emerald-600 focus:ring-emerald-500 dark:bg-neutral-800 dark:border-neutral-700 dark:checked:bg-emerald-500 cursor-pointer">
          </div>
        
    
  </td>


        
  <td class="px-5 py-3 whitespace-nowrap align-middle text-sm " >
    
      
          <div class="flex items-center gap-x-3">
            <template x-if="asset.isPdf">
              <span class="shrink-0 size-8 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800/80 flex items-center justify-center text-red-600 dark:text-red-400">
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path>
                  <path d="M14 2v5a1 1 0 0 0 1 1h5"></path>
                  <path d="M10 9H8"></path>
                  <path d="M16 13H8"></path>
                  <path d="M16 17H8"></path>
                </svg>
              </span>
            </template>
            <template x-if="!asset.isPdf">
              <span class="shrink-0 size-8 rounded-lg bg-gray-100 dark:bg-neutral-700 border border-gray-200 dark:border-neutral-600 flex items-center justify-center text-gray-500 dark:text-neutral-400">
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path>
                  <path d="M14 2v5a1 1 0 0 0 1 1h5"></path>
                  <path d="M10 9H8"></path>
                  <path d="M16 13H8"></path>
                  <path d="M16 17H8"></path>
                </svg>
              </span>
            </template>
            <span class="text-sm font-medium text-gray-800 dark:text-neutral-200 truncate" x-text="asset.name"></span>
          </div>
        
    
  </td>


        
  <td class="px-5 py-3 whitespace-nowrap align-middle text-sm " >
    
      
          <span class="text-sm text-gray-600 dark:text-neutral-400" x-text="asset.ext ? asset.ext.toUpperCase() : 'FILE'"></span>
        
    
  </td>


        
  <td class="px-5 py-3 whitespace-nowrap align-middle text-sm " >
    
      
          <span class="text-sm text-gray-600 dark:text-neutral-400" x-text="humanizeBytes(asset.size)"></span>
        
    
  </td>


        
  <td class="px-5 py-3 whitespace-nowrap align-middle text-sm text-end" >
    
      
          <button @click="removeFile(asset.id)" type="button"
            class="py-1 px-2 inline-flex items-center gap-x-1 text-xs font-medium rounded-md text-gray-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 focus:outline-hidden transition-colors" aria-label="Remove attachment">
            <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
            Remove
          </button>
        
    
  </td>

      </tr>
    </template>

    <!-- Empty State -->
    <tr x-cloak x-show="assets.length === 0">
      <td colspan="5" class="p-0 border-b-0">
        
  
  

  
    
  <div class="p-5 min-h-100 flex flex-col justify-center items-center text-center">
    
    
      <div class="mx-auto flex justify-center items-center size-12 bg-gray-100 dark:bg-neutral-800 rounded-full">
        <i data-lucide="file-text" class="shrink-0 size-6 text-gray-500 dark:text-neutral-400"></i>
      </div>
    

    <div class="max-w-sm mx-auto">
      <p class="mt-2 font-medium text-gray-800 dark:text-neutral-200">
        No attachments added yet
      </p>
      
      <p class="mb-5 mt-1 text-sm text-gray-500 dark:text-neutral-400">
        Click Add Attachments to select files from your device
      </p>
      
    </div>

    
    <div class="flex items-center gap-x-2 ">
      
      
      
        

  
  
  

  
  

  

  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   @click="$refs.assetsInput.click()">
  

    
    
      <i data-lucide="plus" class="shrink-0 size-3.5"></i>
    

    Add Attachments

    

  
    </button>
  


      
    </div>
    

  </div>
  
  


      </td>
    </tr>
  
          
        </tbody>
      </table>
    </div>
  </div>

  
  

</div>

</div>
