<!-- Table Controls & Filter Section -->
<!-- Preline References:
  - Searchbox: https://preline.co/docs/searchbox.html
  - Dropdown: https://preline.co/docs/dropdown.html
  - Tabs: https://preline.co/docs/tabs.html
-->
<div class="space-y-4">
  <!-- Top Bar: Tabs -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 border-b border-gray-200 dark:border-neutral-700 pb-3">
    <!-- Segmented Filter Tabs -->
    <nav class="flex gap-x-1 overflow-x-auto" aria-label="Tabs" role="tablist" aria-orientation="horizontal">
      <button 
        type="button" 
        @click="selectedCategory = 'All tasks'"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg focus:outline-none shrink-0 transition-colors cursor-pointer" 
        :class="selectedCategory === 'All tasks' ? 'bg-gray-100 text-gray-800 dark:bg-neutral-700 dark:text-neutral-200' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-100 dark:text-neutral-400 dark:hover:text-neutral-200 dark:hover:bg-neutral-700'"
        id="tab-all-tasks" 
        role="tab"
      >
        All tasks
        <span 
          class="py-0.5 px-1.5 rounded-full text-xs font-medium"
          :class="selectedCategory === 'All tasks' ? 'bg-gray-200 text-gray-800 dark:bg-neutral-600 dark:text-neutral-300' : 'bg-gray-100 text-gray-600 dark:bg-neutral-700 dark:text-neutral-400'"
          x-text="getCounts('All tasks')"
        >20</span>
      </button>

      <button 
        type="button" 
        @click="selectedCategory = 'Exports'"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg focus:outline-none shrink-0 transition-colors cursor-pointer" 
        :class="selectedCategory === 'Exports' ? 'bg-gray-100 text-gray-800 dark:bg-neutral-700 dark:text-neutral-200' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-100 dark:text-neutral-400 dark:hover:text-neutral-200 dark:hover:bg-neutral-700'"
        id="tab-exports" 
        role="tab"
      >
        Exports
        <span 
          class="py-0.5 px-1.5 rounded-full text-xs font-medium"
          :class="selectedCategory === 'Exports' ? 'bg-gray-200 text-gray-800 dark:bg-neutral-600 dark:text-neutral-300' : 'bg-gray-100 text-gray-600 dark:bg-neutral-700 dark:text-neutral-400'"
          x-text="getCounts('Exports')"
        >7</span>
      </button>

      <button 
        type="button" 
        @click="selectedCategory = 'Video processing'"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg focus:outline-none shrink-0 transition-colors cursor-pointer" 
        :class="selectedCategory === 'Video processing' ? 'bg-gray-100 text-gray-800 dark:bg-neutral-700 dark:text-neutral-200' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-100 dark:text-neutral-400 dark:hover:text-neutral-200 dark:hover:bg-neutral-700'"
        id="tab-video" 
        role="tab"
      >
        Video processing
        <span 
          class="py-0.5 px-1.5 rounded-full text-xs font-medium"
          :class="selectedCategory === 'Video processing' ? 'bg-gray-200 text-gray-800 dark:bg-neutral-600 dark:text-neutral-300' : 'bg-gray-100 text-gray-600 dark:bg-neutral-700 dark:text-neutral-400'"
          x-text="getCounts('Video processing')"
        >7</span>
      </button>

      <button 
        type="button" 
        @click="selectedCategory = 'Scheduled tasks'"
        class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg focus:outline-none shrink-0 transition-colors cursor-pointer" 
        :class="selectedCategory === 'Scheduled tasks' ? 'bg-gray-100 text-gray-800 dark:bg-neutral-700 dark:text-neutral-200' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-100 dark:text-neutral-400 dark:hover:text-neutral-200 dark:hover:bg-neutral-700'"
        id="tab-scheduled" 
        role="tab"
      >
        Scheduled tasks
        <span 
          class="py-0.5 px-1.5 rounded-full text-xs font-medium"
          :class="selectedCategory === 'Scheduled tasks' ? 'bg-gray-200 text-gray-800 dark:bg-neutral-600 dark:text-neutral-300' : 'bg-gray-100 text-gray-600 dark:bg-neutral-700 dark:text-neutral-400'"
          x-text="getCounts('Scheduled tasks')"
        >6</span>
      </button>
    </nav>
    <!-- End Segmented Filter Tabs -->
  </div>

  <!-- Filter & Search Controls Row -->
  <div class="grid sm:grid-cols-12 gap-3">
    <!-- Search Input (sm:col-span-6 lg:col-span-7) -->
    <div class="sm:col-span-6 lg:col-span-7">
      <div class="relative">
        <div class="absolute inset-y-0 start-0 flex items-center pointer-events-none z-20 ps-3.5">
          <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        </div>
        <input 
          type="text" 
          id="tasks-search-input"
          x-model="searchQuery"
          class="py-2 ps-10 pe-4 block w-full bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-lg text-sm text-gray-800 dark:text-neutral-200 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none shadow-2xs" 
          placeholder="Search by task name, ID, candidate, or workspace..."
        >
      </div>
    </div>
    <!-- End Search Input -->

    <!-- Filter Buttons Container (sm:col-span-6 lg:col-span-5) -->
    <div class="sm:col-span-6 lg:col-span-5 flex items-center justify-start sm:justify-end gap-2">
      <!-- Status Filter Dropdown -->
      <div class="hs-dropdown relative inline-flex">
        <button 
          id="status-filter-btn" 
          type="button" 
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
          aria-haspopup="menu" 
          aria-expanded="false" 
          aria-label="Filter by Status"
          @click="statusOpen = !statusOpen"
          @click.away="statusOpen = false"
        >
          <svg class="shrink-0 size-4 text-gray-800 dark:text-neutral-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
          </svg>
          <span x-text="selectedStatus">All statuses</span>
          <svg class="shrink-0 size-3.5 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        <!-- Status Menu -->
        <div 
          x-show="statusOpen" 
          x-cloak 
          x-transition 
          class="absolute end-0 top-full mt-2 min-w-48 bg-white border border-gray-200 rounded-xl shadow-lg p-1.5 z-50 dark:bg-neutral-800 dark:border-neutral-700" 
          role="menu"
        >
          <button 
            type="button" 
            @click="selectedStatus = 'All statuses'; statusOpen = false"
            class="w-full flex items-center gap-x-3 py-1.5 px-2.5 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
          >
            <span class="size-2 rounded-full bg-gray-400"></span>
            All statuses
          </button>
          <button 
            type="button" 
            @click="selectedStatus = 'Running'; statusOpen = false"
            class="w-full flex items-center gap-x-3 py-1.5 px-2.5 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
          >
            <span class="size-2 rounded-full bg-blue-500"></span>
            Running
          </button>
          <button 
            type="button" 
            @click="selectedStatus = 'Completed'; statusOpen = false"
            class="w-full flex items-center gap-x-3 py-1.5 px-2.5 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
          >
            <span class="size-2 rounded-full bg-teal-500"></span>
            Completed
          </button>
          <button 
            type="button" 
            @click="selectedStatus = 'Failed'; statusOpen = false"
            class="w-full flex items-center gap-x-3 py-1.5 px-2.5 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
          >
            <span class="size-2 rounded-full bg-red-500"></span>
            Failed
          </button>
        </div>
      </div>
      <!-- End Status Filter Dropdown -->

      <!-- Date Range Dropdown -->
      <div class="hs-dropdown relative inline-flex">
        <button 
          id="date-filter-btn" 
          type="button" 
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-2xs hover:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
          aria-haspopup="menu" 
          aria-expanded="false" 
          aria-label="Filter by Date Range"
          @click="dateOpen = !dateOpen"
          @click.away="dateOpen = false"
        >
          <svg class="shrink-0 size-4 text-gray-800 dark:text-neutral-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
            <line x1="16" x2="16" y1="2" y2="6" />
            <line x1="8" x2="8" y1="2" y2="6" />
            <line x1="3" x2="21" y1="10" y2="10" />
          </svg>
          <span x-text="selectedDate">Last 7 days</span>
          <svg class="shrink-0 size-3.5 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        <!-- Date Menu -->
        <div 
          x-show="dateOpen" 
          x-cloak 
          x-transition 
          class="absolute end-0 top-full mt-2 min-w-44 bg-white border border-gray-200 rounded-xl shadow-lg p-1.5 z-50 dark:bg-neutral-800 dark:border-neutral-700" 
          role="menu"
        >
          <template x-for="range in ['Today', 'Last 24 hours', 'Last 7 days', 'Last 30 days', 'All time']" :key="range">
            <button 
              type="button" 
              @click="selectedDate = range; dateOpen = false"
              class="w-full flex items-center justify-between py-1.5 px-2.5 rounded-lg text-sm text-gray-800 hover:bg-gray-100 dark:text-neutral-300 dark:hover:bg-neutral-700 cursor-pointer"
            >
              <span x-text="range"></span>
              <template x-if="selectedDate === range">
                <svg class="size-4 text-blue-600 dark:text-blue-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </template>
            </button>
          </template>
        </div>
      </div>
      <!-- End Date Range Dropdown -->
    </div>
    <!-- End Filter Buttons Container -->
  </div>
  <!-- End Filter & Search Controls Row -->
</div>
<!-- End Table Controls & Filter Section -->
