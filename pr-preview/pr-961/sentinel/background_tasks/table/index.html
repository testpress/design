<div class="flex flex-col lg:flex-row gap-5 items-start mt-2">
  <!-- LEFT: Table Card -->
  <div 
    class="p-5 space-y-4 flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-2xs rounded-xl transition-all duration-300 w-full"
    :class="selectedTaskId ? 'lg:w-7/12' : 'lg:w-full'"
  >
    <!-- Nav Tab -->
    <nav class="flex gap-1 relative after:absolute after:bottom-0 after:inset-x-0 after:border-b after:border-gray-200 dark:after:border-neutral-700" aria-label="Tabs" role="tablist" aria-orientation="horizontal">
      <button 
        type="button" 
        @click="selectedTab = 'all'"
        :class="selectedTab === 'all' ? 'after:bg-gray-800 dark:after:bg-neutral-200 text-gray-800 dark:text-neutral-200 font-semibold' : 'text-gray-500 dark:text-neutral-400 hover:text-gray-800 dark:hover:text-neutral-200 font-medium hover:bg-gray-100 dark:hover:bg-neutral-700'"
        class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700 focus:text-gray-800 dark:focus:text-neutral-200 after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none transition cursor-pointer" 
        aria-selected="true" 
        role="tab"
      >
        All
        <span 
          class="py-0.5 px-2 text-xs font-medium rounded-full bg-gray-100 text-gray-800 dark:bg-neutral-700 dark:text-neutral-200"
          x-text="tasks.length"
        ></span>
      </button>

      <button 
        type="button" 
        @click="selectedTab = 'created_by_me'"
        :class="selectedTab === 'created_by_me' ? 'after:bg-gray-800 dark:after:bg-neutral-200 text-gray-800 dark:text-neutral-200 font-semibold' : 'text-gray-500 dark:text-neutral-400 hover:text-gray-800 dark:hover:text-neutral-200 font-medium hover:bg-gray-100 dark:hover:bg-neutral-700'"
        class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700 focus:text-gray-800 dark:focus:text-neutral-200 after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none transition cursor-pointer" 
        aria-selected="false" 
        role="tab"
      >
        Created by me
        <span 
          class="py-0.5 px-2 text-xs font-medium rounded-full bg-gray-100 text-gray-800 dark:bg-neutral-700 dark:text-neutral-200"
          x-text="tasks.filter(t => t.isCreatedByMe || t.createdBy === 'James Collison').length"
        ></span>
      </button>
    </nav>
    <!-- End Nav Tab -->

    <!-- Filter Group -->
    <div class="pb-4 grid md:grid-cols-2 gap-y-2 md:gap-y-0 md:gap-x-5 border-b border-gray-200 dark:border-neutral-700">
      <div>
        <!-- Search Input -->
        <div class="relative">
          <div class="absolute inset-y-0 inset-s-0 flex items-center pointer-events-none z-20 ps-3.5">
            <svg class="shrink-0 size-4 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
          </div>
          <input 
            type="text" 
            x-model="searchQuery"
            class="py-1.5 sm:py-2 ps-10 pe-8 block w-full bg-gray-100 dark:bg-neutral-700 border-transparent rounded-lg sm:text-sm text-gray-800 dark:text-neutral-200 placeholder:text-gray-500 dark:placeholder:text-neutral-400 focus:bg-white dark:focus:bg-neutral-800 focus:border-blue-700 dark:focus:border-blue-600 focus:ring-blue-700 dark:focus:ring-blue-600 checked:border-blue-700 dark:checked:border-blue-600 disabled:opacity-50 disabled:pointer-events-none" 
            placeholder="Search tasks by name or ID"
          >
        </div>
        <!-- End Search Input -->
      </div>
      <!-- End Col -->

      <div class="flex md:justify-end items-center gap-x-2">
        <!-- Status Filter Dropdown -->
        <div class="hs-dropdown relative inline-flex">
          <button 
            type="button" 
            class="py-2 px-2.5 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-lg bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 text-gray-800 dark:text-white shadow-2xs hover:bg-gray-50 dark:hover:bg-neutral-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-50 dark:focus:bg-neutral-700 cursor-pointer" 
            @click="statusOpen = !statusOpen"
            @click.away="statusOpen = false"
            aria-haspopup="menu" 
            aria-expanded="false" 
            aria-label="Filter by Status"
          >
            <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
            </svg>
            <span x-text="selectedStatus">All statuses</span>
            <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>

          <!-- Status Dropdown Menu -->
          <div 
            x-show="statusOpen" 
            x-cloak 
            x-transition 
            class="absolute end-0 top-full mt-2 min-w-44 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-xl p-1 z-20" 
            role="menu"
          >
            <button 
              type="button" 
              @click="selectedStatus = 'All statuses'; statusOpen = false"
              class="w-full flex items-center gap-x-2.5 py-1.5 px-2.5 rounded-lg text-xs text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800 cursor-pointer"
            >
              <span class="size-2 rounded-full bg-gray-400"></span>
              All statuses
            </button>
            <button 
              type="button" 
              @click="selectedStatus = 'Queued'; statusOpen = false"
              class="w-full flex items-center gap-x-2.5 py-1.5 px-2.5 rounded-lg text-xs text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800 cursor-pointer"
            >
              <span class="size-2 rounded-full bg-amber-500"></span>
              Queued
            </button>
            <button 
              type="button" 
              @click="selectedStatus = 'Running'; statusOpen = false"
              class="w-full flex items-center gap-x-2.5 py-1.5 px-2.5 rounded-lg text-xs text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800 cursor-pointer"
            >
              <span class="size-2 rounded-full bg-blue-500"></span>
              Running
            </button>
            <button 
              type="button" 
              @click="selectedStatus = 'Completed'; statusOpen = false"
              class="w-full flex items-center gap-x-2.5 py-1.5 px-2.5 rounded-lg text-xs text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800 cursor-pointer"
            >
              <span class="size-2 rounded-full bg-teal-500"></span>
              Completed
            </button>
            <button 
              type="button" 
              @click="selectedStatus = 'Failed'; statusOpen = false"
              class="w-full flex items-center gap-x-2.5 py-1.5 px-2.5 rounded-lg text-xs text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800 cursor-pointer"
            >
              <span class="size-2 rounded-full bg-red-500"></span>
              Failed
            </button>
          </div>
        </div>
        <!-- End Status Filter Dropdown -->

        <!-- Date Range Filter Dropdown -->
        <div class="hs-dropdown relative inline-flex">
          <button 
            type="button" 
            class="py-2 px-2.5 inline-flex items-center gap-x-1.5 text-xs font-medium rounded-lg bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 text-gray-800 dark:text-white shadow-2xs hover:bg-gray-50 dark:hover:bg-neutral-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-50 dark:focus:bg-neutral-700 cursor-pointer" 
            @click="dateOpen = !dateOpen"
            @click.away="dateOpen = false"
            aria-haspopup="menu" 
            aria-expanded="false" 
            aria-label="Filter by Date"
          >
            <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
              <line x1="16" x2="16" y1="2" y2="6" />
              <line x1="8" x2="8" y1="2" y2="6" />
              <line x1="3" x2="21" y1="10" y2="10" />
            </svg>
            <span x-text="selectedDate">Last 7 days</span>
            <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>

          <!-- Date Dropdown Menu -->
          <div 
            x-show="dateOpen" 
            x-cloak 
            x-transition 
            class="absolute end-0 top-full mt-2 min-w-40 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-xl p-1 z-20" 
            role="menu"
          >
            <template x-for="range in ['Today', 'Last 24 hours', 'Last 7 days', 'Last 30 days', 'All time']" :key="range">
              <button 
                type="button" 
                @click="selectedDate = range; dateOpen = false"
                class="w-full flex items-center justify-between py-1.5 px-2.5 rounded-lg text-xs text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800 cursor-pointer"
              >
                <span x-text="range"></span>
                <template x-if="selectedDate === range">
                  <svg class="size-3.5 text-blue-600 dark:text-blue-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </template>
              </button>
            </template>
          </div>
        </div>
        <!-- End Date Range Filter Dropdown -->
      </div>
      <!-- End Col -->
    </div>
    <!-- End Filter Group -->

    <!-- Table Container -->
    <div class="overflow-x-auto [&::-webkit-scrollbar]:h-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
      <div class="min-w-full inline-block align-middle">
        <table class="min-w-full divide-y divide-gray-200 dark:divide-neutral-700">
          <thead>
            <tr>
              <th scope="col" class="px-5 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider">
                Task
              </th>
              <th scope="col" class="px-4 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider" :class="selectedTaskId ? 'hidden xl:table-cell' : 'hidden sm:table-cell'">
                Created by
              </th>
              <th scope="col" class="px-4 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider">
                Status
              </th>
              <th scope="col" class="px-4 py-3.5 text-start text-xs font-semibold text-gray-600 dark:text-neutral-400 uppercase tracking-wider" :class="selectedTaskId ? 'hidden 2xl:table-cell' : 'hidden md:table-cell'">
                Started
              </th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-200 dark:divide-neutral-700">
            <!-- Empty State -->
            <template x-if="filteredTasks.length === 0">
              <tr>
                <td colspan="4" class="px-6 py-12 text-center text-sm text-gray-500 dark:text-neutral-400">
                  <div class="flex flex-col items-center justify-center space-y-2">
                    <svg class="size-8 text-gray-400 dark:text-neutral-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="8" />
                      <path d="m21 21-4.3-4.3" />
                    </svg>
                    <p class="font-medium text-gray-800 dark:text-neutral-200">No Background Jobs found</p>
                    <p class="text-xs text-gray-500 dark:text-neutral-400">Try adjusting your filters or search query.</p>
                  </div>
                </td>
              </tr>
            </template>

            <!-- Table Rows -->
            <template x-for="task in paginatedTasks" :key="task.id">
              <tr 
                @click="selectedTaskId = task.id"
                class="cursor-pointer transition-colors duration-150 hover:bg-gray-50 dark:hover:bg-neutral-700/50"
                :class="selectedTaskId === task.id ? 'bg-blue-50 dark:bg-neutral-700' : ''"
              >
                <!-- Task Name & ID -->
                <td class="px-5 py-3.5 whitespace-nowrap">
                  <div class="grow min-w-0 max-w-xs">
                    <span 
                      class="text-sm font-medium text-gray-800 dark:text-neutral-200 truncate block hover:text-blue-600 dark:hover:text-blue-400"
                      x-text="task.name"
                    ></span>
                    <span class="text-xs text-gray-500 dark:text-neutral-400 font-mono truncate block" x-text="task.id"></span>
                  </div>
                </td>

                <!-- Created by -->
                <td class="px-4 py-3.5 whitespace-nowrap text-sm text-gray-700 dark:text-neutral-300" :class="selectedTaskId ? 'hidden xl:table-cell' : 'hidden sm:table-cell'" x-text="task.createdBy"></td>

                <!-- Status & Progress -->
                <td class="px-4 py-3.5 whitespace-nowrap">
                  <div class="space-y-1.5">
                    <template x-if="task.status === 'QUEUED' || task.status === 'PENDING'">
                      <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium bg-amber-50 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400 border border-amber-200 dark:border-amber-800">
                        Queued
                      </span>
                    </template>
                    <template x-if="task.status === 'RUNNING'">
                      <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 border border-blue-200 dark:border-blue-800">
                        Running
                      </span>
                    </template>
                    <template x-if="task.status === 'SUCCESS'">
                      <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium bg-teal-50 text-teal-700 dark:bg-teal-900/30 dark:text-teal-400 border border-teal-200 dark:border-teal-800">
                        Completed
                      </span>
                    </template>
                    <template x-if="task.status === 'FAILURE'">
                      <span class="inline-flex items-center gap-x-1.5 py-0.5 px-2 rounded-full text-xs font-medium bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800">
                        Failed
                      </span>
                    </template>
                  </div>
                </td>

                <!-- Started -->
                <td class="px-4 py-3.5 whitespace-nowrap text-sm text-gray-500 dark:text-neutral-400" :class="selectedTaskId ? 'hidden 2xl:table-cell' : 'hidden md:table-cell'" x-text="task.startedAt"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Table Pagination Footer -->
    <div class="pt-4 border-t border-gray-200 dark:border-neutral-700 flex flex-wrap justify-between items-center gap-2">
      <!-- Left: Go To & Results Count -->
      <div class="inline-flex items-center space-x-2">
        <input 
          type="number" 
          min="1" 
          :max="totalPages" 
          x-model="goToPage"
          @keydown.enter="handleGoToPage()"
          @change="handleGoToPage()"
          class="appearance-none [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none [-moz-appearance:textfield] py-1.5 sm:py-2 px-3 block w-16 border-gray-200 rounded-lg sm:text-sm font-medium text-gray-700 placeholder:text-gray-400 placeholder:font-normal focus:border-blue-600 focus:ring-0 disabled:opacity-50 disabled:pointer-events-none dark:bg-transparent dark:border-neutral-700 dark:text-neutral-200 dark:placeholder:text-white/60 dark:focus:ring-neutral-600" 
          placeholder="Go to"
        >
        <p class="text-sm text-gray-700 dark:text-neutral-400">
          Showing <span class="font-medium text-gray-800 dark:text-neutral-200" x-text="filteredTasks.length ? (currentPage - 1) * pageSize + 1 : 0"></span> to <span class="font-medium text-gray-800 dark:text-neutral-200" x-text="Math.min(currentPage * pageSize, filteredTasks.length)"></span> of <span class="font-medium text-gray-800 dark:text-neutral-200" x-text="filteredTasks.length"></span> results
        </p>
      </div>

      <!-- Right: Pagination Navigation Controls -->
      <nav class="flex justify-end items-center gap-x-1" aria-label="Pagination">
        <button 
          type="button" 
          @click="if (currentPage > 1) currentPage--"
          :disabled="currentPage <= 1"
          class="min-h-9.5 min-w-9.5 py-2 px-2.5 inline-flex justify-center items-center gap-x-2 text-sm rounded-lg text-gray-800 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed focus:outline-hidden focus:bg-gray-100 dark:text-white dark:hover:bg-white/10 dark:focus:bg-neutral-700 cursor-pointer" 
          aria-label="Previous"
        >
          <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          <span class="sr-only">Previous</span>
        </button>

        <div class="flex items-center gap-x-1">
          <span class="min-h-9.5 min-w-9.5 flex justify-center items-center bg-gray-100 text-gray-800 py-2 px-3 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-700 dark:text-white font-medium" aria-current="page" x-text="currentPage">1</span>
          <span class="min-h-9.5 flex justify-center items-center text-gray-500 py-2 px-1.5 text-sm dark:text-neutral-500">of</span>
          <span class="min-h-9.5 flex justify-center items-center text-gray-500 py-2 px-1.5 text-sm dark:text-neutral-500 font-medium" x-text="totalPages">1</span>
        </div>

        <button 
          type="button" 
          @click="if (currentPage < totalPages) currentPage++"
          :disabled="currentPage >= totalPages"
          class="min-h-9.5 min-w-9.5 py-2 px-2.5 inline-flex justify-center items-center gap-x-2 text-sm rounded-lg text-gray-800 hover:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none disabled:cursor-not-allowed focus:outline-hidden focus:bg-gray-100 dark:text-white dark:hover:bg-white/10 dark:focus:bg-neutral-700 cursor-pointer" 
          aria-label="Next"
        >
          <span class="sr-only">Next</span>
          <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </nav>
    </div>
    <!-- End Table Pagination Footer -->
  </div>
  <!-- END LEFT: Table Card -->

  <!-- RIGHT: Side Detail Panel -->
  <!-- Task Details & Execution Logs Panel -->
<div 
  x-show="selectedTaskId !== null" 
  x-cloak 
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-x-4"
  x-transition:enter-end="opacity-100 translate-x-0"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100 translate-x-0"
  x-transition:leave-end="opacity-0 translate-x-4"
  class="w-full lg:w-5/12 bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-2xs overflow-hidden"
>
  <template x-if="getSelectedTask()">
    <div x-data="{ copied: false }">
      <!-- Panel Header -->
      <div class="p-4 sm:p-5 border-b border-gray-200 dark:border-neutral-700 flex items-start justify-between gap-3 bg-white dark:bg-neutral-800">
        <div class="grow min-w-0">
          <div class="flex items-center gap-x-2 text-xs text-gray-500 dark:text-neutral-400">
            <span class="font-mono break-all" x-text="getSelectedTask().id"></span>
            <button 
              type="button" 
              @click="navigator.clipboard.writeText(getSelectedTask().id); copied = true; setTimeout(() => copied = false, 2000)"
              class="shrink-0 inline-flex items-center gap-x-1 text-gray-400 hover:text-gray-700 dark:text-neutral-500 dark:hover:text-neutral-300 transition cursor-pointer"
              title="Copy task UUID"
            >
              <svg x-show="!copied" class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              <svg x-show="copied" x-cloak class="size-3.5 text-teal-600 dark:text-teal-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
          <h4 class="mt-1 text-base font-semibold text-gray-800 dark:text-neutral-200 truncate" x-text="getSelectedTask().name"></h4>
        </div>

        <button 
          type="button" 
          @click="selectedTaskId = null"
          class="size-8 inline-flex justify-center items-center rounded-lg text-gray-500 hover:bg-gray-100 dark:text-neutral-400 dark:hover:bg-neutral-700 focus:outline-none cursor-pointer"
          aria-label="Close task details"
        >
          <svg class="size-4 text-gray-800 dark:text-neutral-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <!-- End Panel Header -->

      <!-- Panel Body -->
      <div class="p-4 sm:p-5 space-y-5 overflow-y-auto [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-gray-100 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
        
        <!-- Queued State Notice -->
        <template x-if="getSelectedTask().status === 'QUEUED' || getSelectedTask().status === 'PENDING'">
          <div class="p-3 bg-amber-50 dark:bg-amber-900/30 rounded-lg border border-amber-200 dark:border-amber-800 flex items-center gap-x-2.5">
            <svg class="size-4 text-amber-600 dark:text-amber-400 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <p class="text-xs text-amber-800 dark:text-amber-300">
              Task is queued and waiting for worker allocation.
            </p>
          </div>
        </template>

        <!-- Running Progress -->
        <template x-if="getSelectedTask().status === 'RUNNING'">
          <div class="space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="font-medium text-gray-800 dark:text-neutral-200">Progress</span>
              <span class="font-semibold text-gray-800 dark:text-neutral-200" x-text="getSelectedTask().progress + '%'"></span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-1.5 dark:bg-neutral-700 overflow-hidden">
              <div class="bg-blue-600 h-1.5 rounded-full transition-all duration-500" :style="`width: ${getSelectedTask().progress}%`"></div>
            </div>
          </div>
        </template>

        <!-- Failure Alert -->
        <template x-if="getSelectedTask().status === 'FAILURE'">
          <div class="space-y-1.5">
            <div class="flex items-center gap-x-2 text-xs font-semibold text-red-600 dark:text-red-400">
              <svg class="size-4 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              Task execution error
            </div>
            <p class="text-xs text-gray-700 dark:text-neutral-300 font-mono bg-gray-50 dark:bg-neutral-900 p-2.5 rounded-lg border border-gray-200 dark:border-neutral-700 break-all" x-text="getSelectedTask().exception"></p>
          </div>
        </template>

        <!-- Key Details Grid (4 Cards: Status, Created by, Started, Duration) -->
        <div class="grid grid-cols-2 gap-3 text-xs">
          <!-- Status Card -->
          <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200 dark:border-neutral-700">
            <span class="text-gray-500 dark:text-neutral-400 block mb-1">Status</span>
            <div class="flex items-center gap-x-1.5">
              <template x-if="getSelectedTask().status === 'QUEUED' || getSelectedTask().status === 'PENDING'">
                <span class="size-2 rounded-full bg-amber-500"></span>
              </template>
              <template x-if="getSelectedTask().status === 'RUNNING'">
                <span class="size-2 rounded-full bg-blue-500"></span>
              </template>
              <template x-if="getSelectedTask().status === 'SUCCESS'">
                <span class="size-2 rounded-full bg-teal-500"></span>
              </template>
              <template x-if="getSelectedTask().status === 'FAILURE'">
                <span class="size-2 rounded-full bg-red-500"></span>
              </template>
              <span 
                class="font-medium text-gray-800 dark:text-neutral-200" 
                x-text="getSelectedTask().status === 'SUCCESS' ? 'Completed' : (getSelectedTask().status === 'FAILURE' ? 'Failed' : (getSelectedTask().status === 'RUNNING' ? 'Running' : 'Queued'))"
              ></span>
            </div>
          </div>

          <!-- Created by Card -->
          <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200 dark:border-neutral-700">
            <span class="text-gray-500 dark:text-neutral-400 block mb-1">Created by</span>
            <span class="font-medium text-gray-800 dark:text-neutral-200 truncate block" x-text="getSelectedTask().createdBy"></span>
          </div>

          <!-- Started Card -->
          <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200 dark:border-neutral-700">
            <span class="text-gray-500 dark:text-neutral-400 block mb-1">Started</span>
            <span class="font-medium text-gray-800 dark:text-neutral-200 truncate block" x-text="getSelectedTask().startedAt"></span>
          </div>

          <!-- Duration Card -->
          <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-lg border border-gray-200 dark:border-neutral-700">
            <span class="text-gray-500 dark:text-neutral-400 block mb-1">Duration</span>
            <span class="font-medium text-gray-800 dark:text-neutral-200 truncate block" x-text="getSelectedTask().duration"></span>
          </div>
        </div>

        <!-- Generated Artifacts / Output Files Box -->
        <template x-if="getSelectedTask().status === 'SUCCESS' && ((getSelectedTask().files && getSelectedTask().files.length > 0) || getSelectedTask().fileName)">
          <div class="space-y-2.5">
            <h5 class="text-xs font-semibold text-gray-800 dark:text-neutral-200 uppercase tracking-wider">
              Output Files <span class="text-gray-400 dark:text-neutral-500 font-normal" x-text="'&bull; ' + (getSelectedTask().files ? getSelectedTask().files.length : 1)"></span>
            </h5>

            <div class="space-y-2">
              <template x-if="getSelectedTask().files && getSelectedTask().files.length > 0">
                <template x-for="(file, idx) in getSelectedTask().files" :key="idx">
                  <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-xl border border-gray-200 dark:border-neutral-700 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-x-3 min-w-0">
                      <svg class="shrink-0 size-5 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                      </svg>
                      <div class="grow min-w-0">
                        <p class="text-xs font-medium text-gray-800 dark:text-neutral-200 truncate" x-text="file.name"></p>
                        <p class="text-xs text-gray-500 dark:text-neutral-400" x-text="file.size"></p>
                      </div>
                    </div>

                    <button 
                      type="button" 
                      class="py-1.5 px-3 inline-flex justify-center items-center gap-x-1.5 text-xs font-medium rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 focus:outline-hidden focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none shadow-2xs cursor-pointer shrink-0"
                    >
                      <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                      </svg>
                      Download
                    </button>
                  </div>
                </template>
              </template>

              <template x-if="!getSelectedTask().files && getSelectedTask().fileName">
                <div class="p-3 bg-gray-50 dark:bg-neutral-700/50 rounded-xl border border-gray-200 dark:border-neutral-700 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-x-3 min-w-0">
                    <svg class="shrink-0 size-5 text-gray-500 dark:text-neutral-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                      <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                    </svg>
                    <div class="grow min-w-0">
                      <p class="text-xs font-medium text-gray-800 dark:text-neutral-200 truncate" x-text="getSelectedTask().fileName"></p>
                      <p class="text-xs text-gray-500 dark:text-neutral-400" x-text="getSelectedTask().fileSize"></p>
                    </div>
                  </div>

                  <button 
                    type="button" 
                    class="py-1.5 px-3 inline-flex justify-center items-center gap-x-1.5 text-xs font-medium rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 focus:outline-hidden focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none shadow-2xs cursor-pointer shrink-0"
                  >
                    <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                      <polyline points="7 10 12 15 17 10" />
                      <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Download
                  </button>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Event History Timeline -->
        <div class="space-y-3 pt-2">
          <h5 class="text-xs font-semibold text-gray-800 dark:text-neutral-200 uppercase tracking-wider">
            Event History
          </h5>

          <!-- Timeline Container -->
          <div class="w-full">
            <template x-for="(event, idx) in getSelectedTask().events" :key="idx">
              <!-- Item -->
              <div class="flex gap-x-3">
                <!-- Left Content -->
                <div class="min-w-14 text-end">
                  <span class="text-xs text-gray-500 dark:text-neutral-400" x-text="event.time"></span>
                </div>
                <!-- End Left Content -->

                <!-- Icon -->
                <div class="relative last:after:hidden after:absolute after:top-7 after:bottom-0 after:inset-s-3.5 after:-translate-x-[0.5px] after:border-s after:border-gray-200 dark:after:border-neutral-700">
                  <div class="relative z-10 size-7 flex justify-center items-center">
                    <div class="size-2 rounded-full bg-gray-400 dark:bg-neutral-600"></div>
                  </div>
                </div>
                <!-- End Icon -->

                <!-- Right Content -->
                <div class="grow pt-0.5 pb-8">
                  <h3 class="flex gap-x-1.5 font-medium text-gray-800 dark:text-neutral-200" x-text="event.title || event.msg"></h3>
                  <template x-if="event.desc">
                    <p class="mt-1 text-sm text-gray-600 dark:text-neutral-300" x-text="event.desc"></p>
                  </template>
                </div>
                <!-- End Right Content -->
              </div>
              <!-- End Item -->
            </template>
          </div>
          <!-- End Timeline Container -->
        </div>

        <!-- Action Buttons Footer -->
        <div class="pt-4 flex items-center justify-end gap-x-2">
          <template x-if="getSelectedTask().status === 'FAILURE'">
            <button 
              type="button" 
              class="py-2 px-3 inline-flex items-center gap-x-2 text-xs font-medium rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 focus:outline-hidden focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none shadow-2xs cursor-pointer"
            >
              <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 16h5v5" />
              </svg>
              Retry Task
            </button>
          </template>
        </div>

      </div>
      <!-- End Panel Body -->
    </div>
  </template>
</div>
<!-- End Task Details & Execution Logs Panel -->

</div>
