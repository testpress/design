


<div class="fixed bottom-3 right-3 z-50">
  




<div x-data="{ 
       open: false,
       top: 0,
       left: 'auto',
       right: 'auto',
       _triggerEl: null,
       _menuEl: null,
       _scrollHandler: null,
       init() {
         this.$watch('open', value => {
           console.log('Watch open value:', value);
           if (value) {
             this.$dispatch('dropdown-opened');
             console.log('Trigger ref:', this.$refs.trigger, 'Menu ref:', this.$refs.menu);
             this._triggerEl = this.$refs.trigger;
             this._menuEl = this.$refs.menu;
             this._scrollHandler = this._scrollHandler || this.updatePosition.bind(this);
             setTimeout(() => { 
               console.log('Calling updatePosition from setTimeout');
               this.updatePosition(); 
             }, 0);
             window.addEventListener('scroll', this._scrollHandler, true);
             window.addEventListener('resize', this._scrollHandler, true);
           } else {
             if (this._scrollHandler) {
               window.removeEventListener('scroll', this._scrollHandler, true);
               window.removeEventListener('resize', this._scrollHandler, true);
             }
           }
         });
       },
       updatePosition() {
         const trigger = this._triggerEl;
         console.log('updatePosition called, trigger:', trigger);
         if (!trigger) {
           console.log('No trigger element found!');
           return;
         }
         const rect = trigger.getBoundingClientRect();
         console.log('Trigger bounding rect:', rect);
         this.top = rect.bottom + 4;
         const placement = 'top-end';
         const adaptive = true;
         console.log('Placement:', placement);
          const menuWidth = this._menuEl ? this._menuEl.offsetWidth : 224;
          const menuHeight = this._menuEl ? this._menuEl.offsetHeight : 160;
          
          if (placement === 'bottom-end' || placement === 'top-end') {
            if (adaptive && rect.right < menuWidth) {
              this.left = rect.left;
              this.right = 'auto';
            } else {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            }
            this.top = placement === 'bottom-end' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          } else if (placement === 'bottom-start' || placement === 'top-start') {
            let leftPos = rect.left;
            if (adaptive && (window.innerWidth - leftPos < menuWidth)) {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            } else {
              this.left = leftPos;
              this.right = 'auto';
            }
            this.top = placement === 'bottom-start' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          }
       }
     }" 
     @keydown.escape.window="open = false"
     @dropdown-opened.window="if ($event.target !== $el) open = false"
     class="inline-flex ">
  
  <!-- Trigger -->
  <div @click="open = !open" class="cursor-pointer" x-ref="trigger">
    
      
  <button type="button" class="size-8 inline-flex justify-center items-center rounded-full border border-gray-200 bg-white text-gray-500 shadow-sm opacity-60 hover:opacity-100 focus:opacity-100 focus:outline-none transition dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400" aria-label="Prototype states" @click="setTimeout(() => updatePosition(), 150)">
    <i data-lucide="sliders-horizontal" class="size-4"></i>
  </button>

    
  </div>

  <!-- Dropdown Menu -->
  <div x-show="open" 
       x-ref="menu"
       x-cloak
       @click.outside="open = false"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-95"
       class="fixed z-[9999] w-56 bg-white dark:bg-neutral-900 border border-transparent rounded-xl shadow-xl p-1"
       x-bind:style="{ top: top + 'px', left: left === 'auto' ? 'auto' : left + 'px', right: right === 'auto' ? 'auto' : right + 'px' }"
       role="menu"
       aria-orientation="vertical">
    
      
        
    <p class="px-2 pt-1 pb-1.5 text-[11px] font-medium uppercase tracking-wide text-gray-400">Prototype state</p>
    <button type="button" @click="setState('sample'); open = false" class="w-full flex items-center justify-between gap-x-3 py-1.5 px-2 rounded-lg text-[13px] text-gray-800 hover:bg-gray-100 dark:text-neutral-200 dark:hover:bg-neutral-800">
      Sample instructors
    </button>
    <button type="button" @click="setState('empty'); open = false" class="w-full flex items-center justify-between gap-x-3 py-1.5 px-2 rounded-lg text-[13px] text-gray-800 hover:bg-gray-100 dark:text-neutral-200 dark:hover:bg-neutral-800">
      No instructors yet
    </button>
    <button type="button" @click="setState('no-courses'); open = false" class="w-full flex items-center justify-between gap-x-3 py-1.5 px-2 rounded-lg text-[13px] text-gray-800 hover:bg-gray-100 dark:text-neutral-200 dark:hover:bg-neutral-800">
      No courses yet
    </button>
  
      
  </div>
</div>

</div>
