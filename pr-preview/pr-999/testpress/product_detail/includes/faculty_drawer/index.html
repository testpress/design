










<div x-data="{ 
        open: false,
        init() {
            this.$watch('open', value => {
                if (value) {
                    document.body.classList.add('overflow-hidden');
                } else {
                    document.body.classList.remove('overflow-hidden');
                }
            });
        }
     }" 
     @open-drawer-faculty-profile.window="open = true" 
     @close-drawer-faculty-profile.window="open = false"
     @keydown.window.escape="open = false">

    
    <div x-show="open" 
         x-cloak 
         x-transition:enter="transition-opacity ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="open = false"
         class="fixed inset-0 bg-gray-900/50 dark:bg-neutral-900/80 backdrop-blur-sm z-[80]"></div>
    

    <div id="faculty-profile" 
         x-show="open"
         x-cloak
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0 translate-y-0"
         x-transition:leave="transition ease-in duration-300 transform"
         x-transition:leave-start="translate-x-0 translate-y-0"
         x-transition:leave-end="translate-x-full"
         
         class="fixed z-[81] bg-white dark:bg-neutral-800 flex flex-col shadow-xl top-0 right-0 h-full border-l border-gray-200 dark:border-neutral-700 max-w-[480px] w-full "
         role="dialog" 
         tabindex="-1"
         aria-labelledby="faculty-profile-title">
        
        <!-- Header -->
        
        <div class="py-3 px-6 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700 shrink-0">
            <div>
                <div class="flex items-center gap-x-2">
                    <h3 id="faculty-profile-title" class="font-medium text-gray-800 dark:text-neutral-200">
                        Faculty profile
                    </h3>
                    
                </div>
                
            </div>
            
            <div class="flex items-center gap-2">

                <button type="button" 
                        @click="open = false"
                        class="size-8 inline-flex shrink-0 justify-center items-center gap-x-2 rounded-full border border-gray-200 text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-700 dark:hover:bg-neutral-700 dark:text-neutral-200 dark:focus:bg-neutral-700">
                    <span class="sr-only">Close drawer</span>
                    <i data-lucide="x" class="size-4 shrink-0"></i>
                </button>
            </div>
        </div>
        

        <!-- Body & Footer (caller handles overflow and sticky elements) -->
        <div class="flex flex-col flex-1 overflow-hidden">
            
  <div class="flex-1 min-h-0 flex flex-col" x-effect="if (!open && $refs.facultyVideo) $refs.facultyVideo.pause()">
    
    <template x-if="profile && profileVideo">
      <div class="shrink-0 bg-black">
        <video x-ref="facultyVideo" :src="profileVideo.video" :poster="profile.photo" controls playsinline preload="metadata" class="w-full aspect-video object-contain"></video>
        <p x-show="hasManyIntros" class="px-6 py-2 text-xs text-neutral-300 bg-neutral-900" x-text="'Intro for ' + profileVideo.course"></p>
      </div>
    </template>

    <div class="flex-1 min-h-0 overflow-y-auto">
      <template x-if="profile">
        <div class="p-6">
          <div class="flex items-center gap-x-4">
            <template x-if="profile.photo">
              <img :src="profile.photo" :alt="profile.name" class="shrink-0 size-16 rounded-full object-cover bg-gray-100 dark:bg-neutral-700">
            </template>
            <template x-if="!profile.photo">
              <span class="shrink-0 size-16 inline-flex items-center justify-center rounded-full bg-gray-100 text-lg font-semibold text-gray-600 dark:bg-neutral-700 dark:text-neutral-300" x-text="profile.initials" aria-hidden="true"></span>
            </template>
            <div class="min-w-0">
              <h3 class="text-xl font-semibold text-gray-900 dark:text-white" x-text="profile.name"></h3>
              <p class="mt-0.5 text-sm">
                <span class="font-medium text-gray-500 dark:text-neutral-400" x-text="profile.subjects.join(' · ')"></span><template x-if="profile.years_of_experience"><span class="text-gray-500 dark:text-neutral-400"><span class="mx-1 text-gray-300 dark:text-neutral-600" aria-hidden="true">·</span><span x-text="profile.years_of_experience + ' years teaching'"></span></span></template>
              </p>
            </div>
          </div>

          <p x-show="profile.short_description" class="mt-5 text-base text-gray-700 dark:text-neutral-300" x-text="profile.short_description"></p>

          <div x-show="profile.highlights.length" class="mt-6">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">Highlights</h4>
            <ul class="mt-3 space-y-2.5">
              <template x-for="item in profile.highlights" :key="item">
                <li class="flex gap-x-2.5 text-sm text-gray-700 dark:text-neutral-300">
                  <i data-lucide="award" class="shrink-0 mt-0.5 size-4 text-amber-500 dark:text-amber-400"></i>
                  <span x-text="item"></span>
                </li>
              </template>
            </ul>
          </div>

          <div x-show="profile.qualifications.length" class="mt-6">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">Qualifications</h4>
            <ul class="mt-3 space-y-2.5">
              <template x-for="item in profile.qualifications" :key="item">
                <li class="flex gap-x-2.5 text-sm text-gray-700 dark:text-neutral-300">
                  <i data-lucide="graduation-cap" class="shrink-0 mt-0.5 size-4 text-gray-400"></i>
                  <span x-text="item"></span>
                </li>
              </template>
            </ul>
          </div>

          <div x-show="profile.bio" class="mt-6">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">About</h4>
            <p class="mt-2 text-sm leading-6 text-gray-600 dark:text-neutral-400" x-text="profile.bio"></p>
          </div>

          
          <div x-show="facultyCourseCount > 1" class="mt-6">
            <h4 class="text-sm font-semibold text-gray-800 dark:text-neutral-200">Teaches in this product</h4>
            
            <ul class="mt-3 border border-gray-200 rounded-lg overflow-hidden dark:border-neutral-700">
              <template x-for="(item, i) in profile.teaches" :key="item.course">
                <li :class="i ? 'border-t border-gray-200 dark:border-neutral-700' : ''">
                  
                  <button type="button" :disabled="!(item.video && hasManyIntros)"
                    @click="profileVideo = item; $nextTick(() => $refs.facultyVideo && $refs.facultyVideo.play())"
                    class="w-full flex items-center justify-between gap-x-4 py-3 px-4 text-left transition-colors focus:outline-none disabled:cursor-default"
                    :class="profileVideo === item && hasManyIntros ? 'bg-gray-50 dark:bg-neutral-700/40' : (item.video && hasManyIntros ? 'group hover:bg-gray-50 focus:bg-gray-50 dark:hover:bg-neutral-700/40 dark:focus:bg-neutral-700/40' : '')"
                    :aria-label="item.video && hasManyIntros ? 'Play intro for ' + item.course : null">
                    <span class="min-w-0">
                      <span class="block text-sm font-medium text-gray-800 truncate dark:text-neutral-200" x-text="item.course"></span>
                      <span class="block mt-0.5 text-sm text-gray-500 truncate dark:text-neutral-400" x-text="item.subject"></span>
                    </span>
                    <template x-if="item.video && hasManyIntros">
                      <span class="shrink-0 inline-flex items-center gap-x-1.5 text-sm font-medium whitespace-nowrap"
                        :class="profileVideo === item ? 'text-primary-600 dark:text-primary-400' : 'text-gray-500 group-hover:text-primary-600 group-focus:text-primary-600 dark:text-neutral-400 dark:group-hover:text-primary-400 dark:group-focus:text-primary-400'">
                        <i data-lucide="circle-play" class="size-4"></i><span x-text="profileVideo === item ? 'Now showing' : 'Watch intro'"></span>
                      </span>
                    </template>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </template>
    </div>
  </div>

        </div>

    </div>
</div>
