<div class="flex flex-wrap gap-2" x-data="{
  filters: [
    
    
    
    
    { name: 'All', count: 15 },
    { name: 'Needs attention', count: 8 },
    { name: 'Follow-ups due today', count: 6 },
    { name: 'Upcoming follow-ups', count: 7 }
  ]
}">
  <template x-for="filter in filters" :key="filter.name">
    <button type="button" 
      @click="activeFilter = filter.name"
      class="py-1.5 px-3 inline-flex items-center gap-x-1.5 text-xs rounded-md border cursor-pointer transition-colors"
      :class="activeFilter === filter.name 
        ? 'font-medium bg-emerald-100 dark:bg-emerald-900 border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300' 
        : 'bg-white dark:bg-neutral-800 border-gray-200 dark:border-neutral-700 text-gray-700 dark:text-neutral-300 hover:bg-gray-50 dark:hover:bg-neutral-700'"
    >
      <span x-text="filter.name"></span>
      <span class="ml-1" 
        :class="activeFilter === filter.name 
          ? 'text-emerald-600 dark:text-emerald-400 font-normal' 
          : 'text-gray-500 dark:text-neutral-400'" 
        x-text="filter.count"></span>
    </button>
  </template>
</div>
<!-- End Quick Filter Tags Group -->
