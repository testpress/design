

<div x-show="dirty" x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 translate-y-4"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-4"
     class="fixed inset-x-0 bottom-4 z-40 flex justify-center px-4 pointer-events-none">
  <div class="pointer-events-auto w-full max-w-xl flex flex-wrap items-center justify-between gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-lg" role="region" aria-label="Unsaved changes">
    <div class="flex items-center gap-x-2 text-sm">
      <span class="size-2 rounded-full bg-amber-500" aria-hidden="true"></span>
      <span class="font-medium text-gray-800">Unsaved changes</span>
    </div>
    <div class="flex items-center gap-x-2">
      

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm border border-transparent text-gray-500 hover:bg-gray-100 hover:text-gray-800 focus:bg-gray-100 focus:text-gray-800 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-300 dark:focus:bg-neutral-800 dark:focus:text-neutral-300"   @click="discard()" :disabled="saving">
  

    
    

    Discard

    

  
    </button>
  


      

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   @click="save()" :disabled="saving">
  

    
    

    <span x-text="saving ? 'Saving…' : 'Save changes'">Save changes</span>

    

  
    </button>
  


    </div>
  </div>
</div>
