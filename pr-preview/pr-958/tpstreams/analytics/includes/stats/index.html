


<div class="grid grid-cols-2 lg:grid-cols-4 gap-2 md:gap-3 lg:gap-5">
  <!-- 1. Total Content Views -->
  <div class="p-4 sm:p-5 bg-white border border-gray-200 rounded-xl shadow-2xs dark:bg-neutral-800 dark:border-neutral-700">
    <div class="sm:flex sm:gap-x-3">
      <i data-lucide="play-circle" stroke-width="1.5" class="sm:order-2 mb-2 sm:mb-0 shrink-0 size-6 text-gray-500 dark:text-neutral-400"></i>
      <div class="sm:order-1 grow space-y-1">
        <h2 class="sm:mb-3 text-sm text-gray-500 dark:text-neutral-400">Total Views</h2>
        <p class="text-lg md:text-xl font-semibold text-gray-800 dark:text-neutral-200" x-text="stats.totalViews"></p>
      </div>
    </div>
    <div class="mt-1 flex items-center gap-x-2">
      <span class="text-sm leading-5 text-gray-500 dark:text-neutral-400">
        vs previous period
      </span>
      <span class="inline-flex items-center gap-x-1 text-xs font-medium text-green-500 rounded-full">
        <i data-lucide="trending-up" class="shrink-0 size-4"></i>
        <span x-text="stats.trends.totalViews.value"></span>
      </span>
    </div>
  </div>

  <!-- 2. Unique Viewers -->
  <div class="p-4 sm:p-5 bg-white border border-gray-200 rounded-xl shadow-2xs dark:bg-neutral-800 dark:border-neutral-700">
    <div class="sm:flex sm:gap-x-3">
      <i data-lucide="users" stroke-width="1.5" class="sm:order-2 mb-2 sm:mb-0 shrink-0 size-6 text-gray-500 dark:text-neutral-400"></i>
      <div class="sm:order-1 grow space-y-1">
        <h2 class="sm:mb-3 text-sm text-gray-500 dark:text-neutral-400 flex items-center">
          Unique Viewers
          
  
  
  
  
  

  <div x-data="{
         active: false,
         top: 0, left: 0,
         arrowOffset: '50%',
         updatePosition() {
           const trigger = this.$refs.trigger;
           const tip = this.$refs.tip;
           if (!trigger || !tip) return;
           const r = trigger.getBoundingClientRect();
           const placement = 'bottom';
           const gap = 8;
           // Force display to measure real dimensions (tip may still be hidden via x-show)
           const wasHidden = tip.style.display === 'none' || getComputedStyle(tip).display === 'none';
           if (wasHidden) tip.style.setProperty('display', 'block', 'important');
           const tipW = tip.offsetWidth || 100;
           const tipH = tip.offsetHeight || 28;
           if (wasHidden) tip.style.removeProperty('display');
           console.log('[tooltip] placement:', placement, '| trigger rect:', r, '| tipW:', tipW, '| tipH:', tipH);
           if (placement === 'top') {
             this.top  = r.top - tipH - gap;
             this.left = r.left + (r.width - tipW) / 2;
           } else if (placement === 'bottom') {
             this.top  = r.bottom + gap;
             this.left = r.left + (r.width - tipW) / 2;
           } else if (placement === 'left') {
             this.top  = r.top + (r.height - tipH) / 2;
             this.left = r.left - tipW - gap;
           } else if (placement === 'right') {
             this.top  = r.top + (r.height - tipH) / 2;
             this.left = r.right + gap;
           }
           // Clamp to viewport
           const minL = 8, maxL = window.innerWidth - tipW - 8;
           const origLeft = this.left;
           this.left = Math.max(minL, Math.min(this.left, maxL));
           if (placement === 'top' || placement === 'bottom') {
             const triggerCenter = r.left + r.width / 2;
             const shift = triggerCenter - this.left;
             this.arrowOffset = Math.max(8, Math.min(shift, tipW - 8)) + 'px';
           }
           console.log('[tooltip] final top:', this.top, '| left:', this.left);
         }
       }"
       @mouseenter="active = true; $nextTick(() => updatePosition())"
       @mouseleave="active = false"
       @focusin="active = true; $nextTick(() => updatePosition())"
       @focusout="active = false"
       @click="active = !active; if(active) $nextTick(() => updatePosition())"
       @click.outside="active = false"
       @keydown.escape.window="active = false"
       @scroll.window.capture.passive="if(active) updatePosition()"
       @resize.window.passive="if(active) updatePosition()"
       class="relative inline-flex items-center align-middle cursor-pointer">

    <!-- Trigger -->
    <div x-ref="trigger"
         class="inline-flex items-center justify-center"
         aria-describedby="tooltip-3915">
      <i data-lucide="info" class="size-3.5 ml-1.5 cursor-pointer text-gray-400 dark:text-neutral-500 hover:text-gray-600 dark:hover:text-neutral-300"></i>
    </div>

    <!-- Tooltip Card (fixed, escapes overflow containers) -->
    <div x-show="active"
         x-cloak
         x-ref="tip"
         id="tooltip-3915"
         role="tooltip"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         :style="{ top: top + 'px', left: left + 'px' }"
         class="fixed z-[9999] py-1.5 px-2.5 bg-gray-900 dark:bg-white text-xs font-medium text-white dark:text-neutral-800 rounded-md shadow-2xs break-words whitespace-normal max-w-xs">

      Number of distinct viewers who watched your videos during the selected period.

      <!-- Arrow -->
      
        <span class="absolute bottom-full -translate-x-1/2 border-4 border-transparent border-b-gray-900 dark:border-b-white" :style="{ left: arrowOffset }"></span>
      
    </div>
  </div>

        </h2>
        <p class="text-lg md:text-xl font-semibold text-gray-800 dark:text-neutral-200" x-text="stats.uniqueViewers"></p>
      </div>
    </div>
    <div class="mt-1 flex items-center gap-x-2">
      <span class="text-sm leading-5 text-gray-500 dark:text-neutral-400">
        vs previous period
      </span>
      <span class="inline-flex items-center gap-x-1 text-xs font-medium text-green-500 rounded-full">
        <i data-lucide="trending-up" class="shrink-0 size-4"></i>
        <span x-text="stats.trends.uniqueViewers.value"></span>
      </span>
    </div>
  </div>

  <div class="p-4 sm:p-5 bg-white border border-gray-200 rounded-xl shadow-2xs dark:bg-neutral-800 dark:border-neutral-700">
    <div class="sm:flex sm:gap-x-3">
      <i data-lucide="check-circle" stroke-width="1.5" class="sm:order-2 mb-2 sm:mb-0 shrink-0 size-6 text-gray-500 dark:text-neutral-400"></i>
