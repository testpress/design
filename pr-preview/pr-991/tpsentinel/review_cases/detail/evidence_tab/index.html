

<section class="bg-card border border-card-line shadow-2xs rounded-xl" aria-label="Evidence">
  <!-- Local search and filters: scoped to this candidate's evidence -->
  <div class="flex flex-wrap items-center gap-2 p-4 sm:px-5 border-b border-card-line">
    
<label class="relative block grow sm:max-w-xs">
  <span class="sr-only">Search evidence</span>
  <svg class="absolute start-3 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 pointer-events-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  <input type="text" x-model="evidenceFilter.q" placeholder="Search evidence"
         class="py-1.5 ps-9 pe-3 block w-full bg-layer border border-layer-line rounded-lg text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary focus:ring-1 focus:ring-primary">
</label>

    
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="evidenceFilter.session ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Session: </span>
    <span class="truncate" x-text="((d.sessions.map(s =&gt; [String(s.n), `Session ${s.n}`])).find(o => String(o[0]) === String(evidenceFilter.session)) || [null, 'All sessions'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Session'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'All sessions'], ...(d.sessions.map(s =&gt; [String(s.n), `Session ${s.n}`]))]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(evidenceFilter.session) === String(v)"
              @click="evidenceFilter.session = v; open = false"
              :class="String(evidenceFilter.session) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(evidenceFilter.session) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

    
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="evidenceFilter.anomaly ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Anomaly: </span>
    <span class="truncate" x-text="(([[&#39;*&#39;, &#39;Any anomaly&#39;], ...evidenceAnomalies.map(a =&gt; [a.key, a.label])]).find(o => String(o[0]) === String(evidenceFilter.anomaly)) || [null, 'All evidence'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Anomaly'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'All evidence'], ...([[&#39;*&#39;, &#39;Any anomaly&#39;], ...evidenceAnomalies.map(a =&gt; [a.key, a.label])])]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(evidenceFilter.anomaly) === String(v)"
              @click="evidenceFilter.anomaly = v; open = false"
              :class="String(evidenceFilter.anomaly) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(evidenceFilter.anomaly) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

    
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="evidenceFilter.source ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Source: </span>
    <span class="truncate" x-text="(([[&#39;webcam&#39;, &#39;Webcam&#39;], [&#39;screen&#39;, &#39;Screen&#39;], [&#39;microphone&#39;, &#39;Microphone&#39;]]).find(o => String(o[0]) === String(evidenceFilter.source)) || [null, 'All sources'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Source'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'All sources'], ...([[&#39;webcam&#39;, &#39;Webcam&#39;], [&#39;screen&#39;, &#39;Screen&#39;], [&#39;microphone&#39;, &#39;Microphone&#39;]])]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(evidenceFilter.source) === String(v)"
              @click="evidenceFilter.source = v; open = false"
              :class="String(evidenceFilter.source) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(evidenceFilter.source) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

    
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="evidenceFilter.availability ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Availability: </span>
    <span class="truncate" x-text="(([[&#39;available&#39;, &#39;Available&#39;], [&#39;processing&#39;, &#39;Processing&#39;], [&#39;upload_failed&#39;, &#39;Upload failed&#39;], [&#39;retention&#39;, &#39;Removed by retention&#39;]]).find(o => String(o[0]) === String(evidenceFilter.availability)) || [null, 'Any availability'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Availability'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'Any availability'], ...([[&#39;available&#39;, &#39;Available&#39;], [&#39;processing&#39;, &#39;Processing&#39;], [&#39;upload_failed&#39;, &#39;Upload failed&#39;], [&#39;retention&#39;, &#39;Removed by retention&#39;]])]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(evidenceFilter.availability) === String(v)"
              @click="evidenceFilter.availability = v; open = false"
              :class="String(evidenceFilter.availability) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(evidenceFilter.availability) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

    <button type="button" x-show="evidenceFiltered" @click="resetEvidence()"
            class="ms-auto py-1.5 px-2 rounded-lg text-sm text-muted-foreground-1 hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">Reset filters</button>
  </div>

  <div class="p-4 sm:p-5">
    <p class="text-sm text-muted-foreground-1" x-show="filteredEvidence.length">
      <span x-text="filteredEvidence.length"></span> <span x-text="filteredEvidence.length === 1 ? 'item' : 'items'"></span>, newest first
    </p>

    <div x-show="filteredEvidence.length" class="mt-3 grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
      <template x-for="a in filteredEvidence" :key="a.id">
        <div>
          <!-- One Artifact thumbnail. Expects `a` in scope. States other than Available are plain text, not fake media. -->
<button type="button" @click="openViewer(a)" :disabled="a.state !== 'available'"
        :aria-label="`${artifactLabel(a)}, Session ${a.session}${a.state !== 'available' ? ', ' + stateLabel(a) : ''}`"
        class="group relative block w-full aspect-video rounded-lg overflow-hidden bg-surface border border-card-line text-start disabled:cursor-default focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
  <template x-if="a.state === 'available' && a.media !== 'audio'">
    <img :src="a.poster || a.src" alt="" loading="lazy" class="size-full object-cover transition-transform group-hover:scale-[1.02]">
  </template>
  <template x-if="a.state === 'available' && a.media === 'audio'">
    <span class="flex size-full items-center justify-center text-muted-foreground-1" x-html="icons.mic"></span>
  </template>
  <template x-if="a.state !== 'available'">
    <span class="flex size-full flex-col items-center justify-center gap-1 p-2 text-center">
      <span class="text-xs font-medium text-foreground" x-text="stateLabel(a)"></span>
      <span class="text-[11px] leading-4 text-muted-foreground-1 line-clamp-2" x-text="stateNote(a)"></span>
    </span>
  </template>
  <template x-if="a.state === 'available' && a.media === 'video'">
    <span class="absolute inset-0 flex items-center justify-center">
      <span class="flex items-center justify-center size-9 rounded-full bg-black/55 text-white" x-html="ic('play', 'size-4 ms-0.5 fill-current')"></span>
    </span>
  </template>
  <span x-show="a.state === 'available'" class="absolute bottom-1.5 start-1.5 py-0.5 px-1.5 rounded-md bg-black/60 text-[11px] font-medium text-white" x-text="artifactLabel(a)"></span>
</button>

          <p class="mt-1.5 text-sm text-foreground" x-text="a.anomaly ? `${indicatorLabel(a.anomaly)}` : artifactLabel(a)"></p>
          <p class="text-xs text-muted-foreground-1">
            <span x-text="a.anomaly ? `${artifactLabel(a)} · ` : ''"></span><span x-text="`Session ${a.session} · ${dayTime(a.at)}`"></span><span x-show="a.length" x-text="` · ${dur(a.length || 0)}`"></span><span x-show="a.partial"> · incomplete</span>
          </p>
        </div>
      </template>
    </div>

    <!-- Events with no media still show, so nothing is silently missing -->
    <template x-if="eventsWithoutMedia.length">
      <div class="mt-6">
        <h3 class="text-sm font-medium text-muted-foreground-1">Anomalies with no media</h3>
        <ul class="mt-2 divide-y divide-card-line">
          <template x-for="e in eventsWithoutMedia" :key="e.id">
            <li class="py-2.5 flex items-start gap-3 text-sm">
              <span class="mt-0.5 text-muted-foreground-1" x-html="icons[e.key]"></span>
              <span>
                <span class="text-foreground" x-text="indicatorLabel(e.key)"></span>
                <span class="text-muted-foreground-1" x-text="`· Session ${e.session} · ${dayTime(e.at)} · no media was captured`"></span>
              </span>
            </li>
          </template>
        </ul>
      </div>
    </template>

    <!-- No results -->
    <div x-show="!filteredEvidence.length && !eventsWithoutMedia.length" class="py-12 text-center">
      <p class="font-medium text-foreground">No evidence matches</p>
      <p class="mt-1 text-sm text-muted-foreground-1">The current search or filters found nothing for this candidate.</p>
      <button type="button" @click="resetEvidence()" class="mt-3 text-sm font-medium text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">Reset filters</button>
    </div>
  </div>
</section>
