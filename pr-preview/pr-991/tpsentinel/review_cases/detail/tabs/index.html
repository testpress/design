





<div  id="case-tabs">
  
  
  <div class="sm:hidden relative w-full"
       x-data="{ 
         open: false,
         top: 0,
         left: 0,
         width: 0,
         _scrollHandler: null,
         init() {
           this.$watch('open', value => {
             if (value) {
               this._scrollHandler = this._scrollHandler || (() => this.updatePosition());
               setTimeout(() => this.updatePosition(), 0);
               window.addEventListener('scroll', this._scrollHandler, true);
               window.addEventListener('resize', this._scrollHandler, true);
             } else {
               window.removeEventListener('scroll', this._scrollHandler, true);
               window.removeEventListener('resize', this._scrollHandler, true);
             }
           });
         },
         updatePosition() {
           const rect = this.$refs.trigger.getBoundingClientRect();
           this.top = rect.bottom + 4;
           this.left = rect.left;
           this.width = rect.width;
         }
       }">
    
    <button type="button" @click="open = !open" x-ref="trigger" class="py-2 px-3 inline-flex items-center justify-between w-full gap-x-2 text-sm font-medium rounded-lg border border-layer-line bg-layer text-layer-foreground hover:bg-layer-hover focus:outline-hidden focus:bg-layer-focus" aria-haspopup="menu" :aria-expanded="open.toString()">
      <span x-html="
        
          tab === 'overview' ? 'Overview' :
        
          tab === 'evidence' ? 'Evidence' :
        
          tab === 'activity' ? 'Activity' :
        
          tab === 'history' ? 'History' :
         'Select tab'
      "></span>
      <svg class="shrink-0 size-4 transition-transform duration-200" :class="open ? 'rotate-180' : ''" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <div x-show="open" 
         @click.outside="open = false"
         @keydown.escape.window="open = false"
         x-cloak
         x-transition:enter="transition ease-out duration-100"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-75"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="fixed z-[9999] bg-dropdown border border-dropdown-line rounded-lg shadow-xl p-1"
         x-bind:style="{ top: top + 'px', left: left + 'px', width: width + 'px' }"
         role="menu"
         aria-orientation="vertical">
      
        
          <button type="button"
                  class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm font-normal text-start focus:outline-hidden hover:bg-dropdown-item-hover focus:bg-dropdown-item-focus text-dropdown-item-foreground"
                  @click="tab = 'overview'; open = false"
                  >
            
            <span>Overview</span>
          </button>
        
      
        
          <button type="button"
                  class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm font-normal text-start focus:outline-hidden hover:bg-dropdown-item-hover focus:bg-dropdown-item-focus text-dropdown-item-foreground"
                  @click="tab = 'evidence'; open = false"
                  >
            
            <span>Evidence</span>
          </button>
        
      
        
          <button type="button"
                  class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm font-normal text-start focus:outline-hidden hover:bg-dropdown-item-hover focus:bg-dropdown-item-focus text-dropdown-item-foreground"
                  @click="tab = 'activity'; open = false"
                  >
            
            <span>Activity</span>
          </button>
        
      
        
          <button type="button"
                  class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm font-normal text-start focus:outline-hidden hover:bg-dropdown-item-hover focus:bg-dropdown-item-focus text-dropdown-item-foreground"
                  @click="tab = 'history'; open = false"
                  >
            
            <span>History</span>
          </button>
        
      
    </div>
  </div>

  
  
  <nav class="--prevent-on-load-init hidden sm:flex  gap-1 relative after:absolute after:bottom-0 after:inset-x-0 after:border-b after:border-layer-line" aria-label="Tabs" role="tablist" aria-orientation="horizontal">
    
    
      
        <button type="button"
                
                  @click="tab = 'overview'"
                
                class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted-focus focus:text-foreground after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none hover:bg-muted-hover hover:text-foreground "
                :class="tab === 'overview' 
                          ? 'after:bg-foreground text-foreground' 
                          : 'text-muted-foreground-1'"
                :aria-selected="tab === 'overview'"
                id="case-tabs-item-overview"
                aria-controls="case-tabs-panel-overview"
                role="tab"
                >
          
          Overview
          
        </button>
      
    
      
        <button type="button"
                
                  @click="tab = 'evidence'"
                
                class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted-focus focus:text-foreground after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none hover:bg-muted-hover hover:text-foreground "
                :class="tab === 'evidence' 
                          ? 'after:bg-foreground text-foreground' 
                          : 'text-muted-foreground-1'"
                :aria-selected="tab === 'evidence'"
                id="case-tabs-item-evidence"
                aria-controls="case-tabs-panel-evidence"
                role="tab"
                >
          
          Evidence
          
        </button>
      
    
      
        <button type="button"
                
                  @click="tab = 'activity'"
                
                class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted-focus focus:text-foreground after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none hover:bg-muted-hover hover:text-foreground "
                :class="tab === 'activity' 
                          ? 'after:bg-foreground text-foreground' 
                          : 'text-muted-foreground-1'"
                :aria-selected="tab === 'activity'"
                id="case-tabs-item-activity"
                aria-controls="case-tabs-panel-activity"
                role="tab"
                >
          
          Activity
          
        </button>
      
    
      
        <button type="button"
                
                  @click="tab = 'history'"
                
                class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted-focus focus:text-foreground after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none hover:bg-muted-hover hover:text-foreground "
                :class="tab === 'history' 
                          ? 'after:bg-foreground text-foreground' 
                          : 'text-muted-foreground-1'"
                :aria-selected="tab === 'history'"
                id="case-tabs-item-history"
                aria-controls="case-tabs-panel-history"
                role="tab"
                >
          
          History
          
        </button>
      
    
  </nav>

  
  
    
  
    
  
    
  
    
  

  
</div>
