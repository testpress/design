
<script>
  (function () {
    const SR = window.SentinelReview;
    const { MIN, HOUR, DAY, NOW, svg, ICONS, INDICATOR_BY_KEY, BEHAVIOUR_KEYS, PRIORITIES, ME, REVIEWERS, REVIEWER_BY_ID, WORKSPACE_BY_ID, MONTHS, clock, relative, exact } = SR;

    // ---------- Icons used on this page (lucide paths) ----------
    const I = {
      ...ICONS,
      result_clear: ICONS.state_clear,
      result_flagged: ICONS.state_flagged,
      result_none: ICONS.state_queued,
      play: '<polygon points="6 3 20 12 6 21 6 3"/>',
      image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>',
      video: '<path d="m16 13 5.22 3.48a.5.5 0 0 0 .78-.42V7.94a.5.5 0 0 0-.78-.42L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
      mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
      monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
      webcam: '<circle cx="12" cy="10" r="8"/><circle cx="12" cy="10" r="3"/><path d="M7 22h10"/><path d="M12 22v-4"/>',
      camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
      session_start: '<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>',
      session_end: '<circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
      warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      ai: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
      user: ICONS.reviewer,
    };
    const ic = (k, cls = 'size-4') => svg(I[k], cls);

    // ---------- Vocabulary ----------
    const SEVERITY = ['High', 'Medium', 'Low'];
    const EXPLAIN = {
      multi_face: 'Another face appeared on the webcam while the candidate was answering.',
      no_face: 'The candidate left the webcam frame, so no face was visible.',
      looking_away: 'The candidate looked away from the screen for an extended stretch.',
      phone_usage: 'A phone was visible on the webcam.',
      browser_focus_lost: 'The candidate switched to another tab or window.',
    };
    const CONTINUOUS = ['no_face', 'looking_away', 'browser_focus_lost', 'multi_face'];
    const ARTIFACT_STATE = {
      available: { label: 'Available' },
      processing: { label: 'Processing', note: 'Still processing. Check back in a few minutes.' },
      upload_failed: { label: 'Upload failed', note: 'The upload failed, so this file was never stored.' },
      retention: { label: 'Removed by retention', note: 'Deleted by the workspace’s retention policy.' },
    };
    const FLAG_REASONS = [
      ['confirmed_behaviour', 'Confirmed suspicious behaviour'],
      ['evidence_missing', 'Required evidence missing'],
      ['recording_incomplete', 'Recording incomplete or interrupted'],
      ['conflicting', 'Conflicting evidence'],
      ['other', 'Other'],
    ];
    const CLEAR_REASONS = [
      ['false_positive', 'Signal was a false positive'],
      ['explainable', 'Behaviour was permitted or explainable'],
      ['gap_ok', 'Evidence gap did not prevent a defensible assessment'],
      ['sufficient', 'Available evidence was sufficient'],
      ['other', 'Other'],
    ];
    const MEDIA = {
      webcam: SR.url('/img/webcam_snapshot.jpg'),
      noface: SR.url('/img/no_person_detected.jpg'),
      screen: SR.url('/img/screen_capture_snapshot.jpg'),
      clip: 'https://ableplayer.github.io/ableplayer/media/wwa.mp4',
    };

    // ---------- Time helpers ----------
    const dur = ms => {
      const s = Math.round(ms / 1000);
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60), r = s % 60;
      if (m < 60) return r ? `${m}m ${r}s` : `${m}m`;
      const h = Math.floor(m / 60), mm = m % 60;
      return mm ? `${h}h ${mm}m` : `${h}h`;
    };
    const day = ts => { const d = new Date(ts); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
    const dayTime = ts => `${day(ts)}, ${clock(new Date(ts))}`;
    const span = (a, b) => `${clock(new Date(a))}–${clock(new Date(b))}`;

    // ---------- Case detail, generated from the case ID so every visit shows the same data ----------
    function buildDetail(c) {
      let seed = parseInt(c.id.replace(/\D/g, ''), 10) * 7919 % 2147483647 || 1;
      const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const pick = a => a[Math.floor(rand() * a.length)];
      const between = (a, b) => a + rand() * (b - a);

      // Why a case exists: AI flagged it (most), or the client asked to check the evidence of an AI-cleared candidate
      const origin = rand() < 0.15 ? 'client' : 'ai_flagged';
      const recordingEnabled = rand() < 0.6;
      // Candidate profile details shown on the page
      const profile = {
        phone: `+91 ${Math.floor(between(70000, 99999))} ${Math.floor(between(10000, 99999))}`,
        enrolledDaysBefore: Math.floor(between(20, 90)),
      };
      const device = pick([
        { type: 'Laptop', os: 'Windows 11', browser: 'Chrome 129' },
        { type: 'Laptop', os: 'macOS 14.6', browser: 'Safari 17.6' },
        { type: 'Desktop', os: 'Windows 10', browser: 'Edge 128' },
        { type: 'Laptop', os: 'Ubuntu 22.04', browser: 'Firefox 131' },
      ]);
      const ip = `103.${Math.floor(between(10, 250))}.${Math.floor(between(1, 250))}.${Math.floor(between(1, 250))}`;

      // Sessions: a course runs over days, each visit is a new Session
      const count = 3 + Math.floor(rand() * 10);
      const lastEnd = (c.createdAt || NOW) - Math.floor(between(0.2, 3) * HOUR);
      const sessions = [];
      let end = lastEnd;
      for (let i = count; i >= 1; i--) {
        const length = Math.floor(between(25, 120) * MIN);
        const start = end - length;
        sessions.unshift({
          n: i, start, end, length,
          status: 'Completed',
          device: { ...device, sdk: 'Web SDK 2.4.1', ip, timezone: 'Asia/Kolkata (UTC+05:30)' },
          identity: { status: 'Verified', score: +between(98.2, 99.8).toFixed(1) },
          coverage: {
            webcam: recordingEnabled ? { status: 'complete', got: length, expected: length } : { status: 'not_required' },
            screen: recordingEnabled ? { status: 'complete', got: length, expected: length } : { status: 'not_required' },
            snapshots: { expected: Math.max(1, Math.round(length / (5 * MIN))) },
            mic: { status: 'not_required' },
          },
        });
        end = start - Math.floor(between(6, 40) * HOUR);
      }
      sessions.forEach(s => { s.coverage.snapshots.got = s.coverage.snapshots.expected - (rand() < 0.2 ? 1 : 0); });

      // Identity: a Conditional match needs a person to confirm it (Session context, not a v1 concern)
      if (c.indicators.includes('identity')) {
        const s = pick(sessions);
        s.identity = { status: 'Conditional', score: +between(84, 96).toFixed(1) };
      }

      // Anomaly Events from the case's indicators
      const events = [];
      let eid = 1;
      c.indicators.filter(k => BEHAVIOUR_KEYS.includes(k)).forEach(key => {
        const times = 1 + Math.floor(rand() * 3);
        for (let t = 0; t < times; t++) {
          const s = pick(sessions);
          const at = s.start + Math.floor(rand() * (s.length - 5 * MIN));
          const length = CONTINUOUS.includes(key) ? Math.floor(between(12, key === 'browser_focus_lost' ? 200 : 260) * 1000) : 0;
          const severity = t === 0 && origin === 'ai_flagged' ? pick(['High', 'High', 'Medium']) : pick(SEVERITY);
          const artifacts = [];
          if (rand() > 0.12) {
            const state = () => { const r = rand(); return r < 0.08 ? 'processing' : r < 0.12 ? 'upload_failed' : r < 0.16 ? 'retention' : 'available'; };
            const snap = key === 'no_face' ? MEDIA.noface : key === 'browser_focus_lost' ? MEDIA.screen : MEDIA.webcam;
            artifacts.push({ kind: 'snapshot', source: key === 'browser_focus_lost' ? 'screen' : 'webcam', media: 'image', src: snap, state: state() });
            if (rand() < 0.7) artifacts.push({ kind: 'clip', source: key === 'browser_focus_lost' ? 'screen' : 'webcam', media: 'video', src: MEDIA.clip, poster: snap, state: state() });
            if (rand() < 0.15) artifacts.push({ kind: 'clip', source: 'microphone', media: 'audio', src: MEDIA.clip, state: state() });
          }
          events.push({ id: `E${eid++}`, key, session: s.n, at, length, severity, confidence: Math.round(between(62, 97)), artifacts });
        }
      });
      events.sort((a, b) => a.at - b.at);
      events.forEach(e => e.artifacts.forEach((a, i) => { a.id = `${e.id}-${i}`; a.event = e.id; a.session = e.session; a.at = e.at; a.anomaly = e.key; }));

      // Evidence gaps: required evidence that's missing or incomplete
      const gaps = [];
      // An AI flag always has a reason: with no behaviour events, the reason is an evidence gap
      if (c.indicators.includes('missing_evidence') || (origin === 'ai_flagged' && !events.length)) {
        const s = pick(sessions.slice(-Math.min(3, sessions.length)));
        const source = recordingEnabled ? pick(['screen', 'webcam']) : 'snapshots';
        if (source === 'snapshots') {
          const missing = Math.max(3, Math.round(s.coverage.snapshots.expected * between(0.3, 0.6)));
          s.coverage.snapshots.got = Math.max(0, s.coverage.snapshots.expected - missing);
          const from = s.end - missing * 5 * MIN;
          gaps.push({ id: 'G1', source, session: s.n, from, to: s.end, cause: 'Camera permission was revoked', label: 'Periodic snapshots stopped', detail: `${missing} of ${s.coverage.snapshots.expected} expected snapshots weren’t taken.` });
        } else {
          const lost = Math.floor(between(0.25, 0.6) * s.length);
          s.coverage[source] = { status: 'partial', got: s.length - lost, expected: s.length };
          const from = s.end - lost;
          gaps.push({ id: 'G1', source, session: s.n, from, to: s.end, cause: pick(['Upload failed', 'Recording stopped when the browser crashed']), label: source === 'screen' ? 'Screen recording incomplete' : 'Webcam recording incomplete', detail: `${dur(lost)} of the session has no ${source} recording.` });
        }
      }

      // Session-wide evidence: periodic snapshots and full recordings
      const sessionMedia = [];
      sessions.forEach(s => {
        for (let k = 0; k < Math.min(s.coverage.snapshots.got, 4); k++) {
          sessionMedia.push({ id: `S${s.n}-${k}`, kind: 'periodic', source: 'webcam', media: 'image', src: MEDIA.webcam, state: 'available', session: s.n, at: s.start + Math.floor((k + 1) * s.length / 5) });
        }
        ['webcam', 'screen'].forEach(src => {
          const cov = s.coverage[src];
          if (cov.status === 'not_required') return;
          sessionMedia.push({ id: `R${s.n}-${src}`, kind: 'recording', source: src, media: 'video', src: MEDIA.clip, poster: src === 'screen' ? MEDIA.screen : MEDIA.webcam, state: 'available', session: s.n, at: s.start, length: cov.got, partial: cov.status === 'partial' });
        });
      });

      // Technical Events for Activity
      const technical = [];
      gaps.forEach(g => technical.push({ id: `T-${g.id}`, kind: 'technical', session: g.session, at: g.from, title: g.cause, description: g.detail }));

      const latest = sessions[sessions.length - 1];
      const behaviour = events.length > 0;
      const concernType = origin !== 'ai_flagged' ? null : behaviour ? 'behaviour' : 'evidence';
      const aiResult = origin === 'ai_flagged' ? 'flagged' : 'clear';
      const aiAt = latest.end + Math.floor(between(3, 25) * MIN);

      // History: AI assessments and case changes (newest added last; the page sorts)
      const history = [];
      history.push({ id: 'h-ai', at: aiAt, kind: 'assessment', actor: 'AI', title: aiResult === 'flagged' ? 'AI flagged the candidate' : 'AI cleared the candidate', description: `Assessed through Session ${latest.n}.` });
      if (sessions.length > 1) {
        const prev = sessions[sessions.length - 2];
        history.push({ id: 'h-ai-prev', at: prev.end + 12 * MIN, kind: 'assessment', actor: 'AI', title: 'AI cleared the candidate', description: `Assessed through Session ${prev.n}.` });
      }
      const created = c.createdAt || aiAt + 2 * MIN;
      // A client request names what to check: periodic snapshots, or recordings when the policy records sessions
      const request = origin !== 'client' ? null : {
        what: recordingEnabled && rand() < 0.5 ? 'recordings' : 'snapshots',
        session: pick(sessions).n,
        by: 'Anita Kumar',
        note: pick(['Client wants to see the candidate was alone for this session.', 'Client asked for a look at this session before issuing the certificate.', 'Candidate scored unusually high here; client wants the evidence checked.']),
      };
      const why = request ? `Client asked to check the ${request.what === 'snapshots' ? 'periodic snapshots' : 'session recordings'} of Session ${request.session}` : 'Opened because AI flagged the candidate';
      history.push({ id: 'h-open', at: created, kind: 'case', actor: request ? request.by : 'TPSentinel', title: 'Review case opened', description: why });
      if (c.assignedAt && c.reviewer) history.push({ id: 'h-assign', at: c.assignedAt, kind: 'case', actor: c.reviewer === ME ? 'Divya Menon' : 'Anita Kumar', title: `Assigned to ${REVIEWER_BY_ID[c.reviewer].name}`, description: '' });
      if (c.state === 'completed') {
        history.push({ id: 'h-done', at: c.completedAt, kind: 'case', actor: REVIEWER_BY_ID[c.reviewer].name, title: `Marked ${c.result === 'clear' ? 'Clear' : 'Flagged'}`, description: c.reason || '' });
      }

      return { origin, request, profile, recordingEnabled, sessions, events, gaps, sessionMedia, technical, aiResult, aiAt, concernType, history, assessedThrough: latest.n };
    }

    function loadRole() {
      try { return (JSON.parse(sessionStorage.getItem('tpsentinel.reviewCases')) || {}).role || 'reviewer'; } catch (e) { return 'reviewer'; }
    }
    function saveRole(role) {
      try {
        const s = JSON.parse(sessionStorage.getItem('tpsentinel.reviewCases')) || {};
        s.role = role;
        sessionStorage.setItem('tpsentinel.reviewCases', JSON.stringify(s));
      } catch (e) { /* not remembered */ }
    }

    window.caseDetailPage = function () {
      const params = new URLSearchParams(location.search);
      const all = SR.loadCases();
      const found = all.find(x => x.id === params.get('case'));
      // Reactive, so assigning or deciding updates every part of the page that reads them
      const c = Alpine.reactive(found || all.find(x => x.state === 'assigned' && x.reviewer === ME));
      const d = Alpine.reactive(buildDetail(c));

      return {
        role: loadRole(),
        condition: 'normal', // normal | stale | restricted | error
        icons: Object.fromEntries(Object.keys(I).map(k => [k, ic(k)])),
        ic,
        c, d, all,
        missing: !found,
        tab: ['overview', 'evidence', 'activity', 'history'].includes(params.get('tab')) ? params.get('tab') : 'overview',
        sessionIdx: d.sessions.length - 1,
        menu: null,
        viewer: null,
        newReview: null,
        decision: { choice: '', reason: '', notes: '', confirming: false, error: '', submitting: false },
        justSubmitted: false,
        evidenceFilter: { session: '', anomaly: '', source: '', availability: '', q: '' },
        activityFilter: { session: '', type: '', q: '' },
        historyFilter: { type: '', actor: '' },
        flagReasons: FLAG_REASONS,
        clearReasons: CLEAR_REASONS,
        priorities: PRIORITIES,
        reviewers: REVIEWERS,

        init() {
          document.title = `${c.name} · Review cases`;
          this.$watch('tab', t => {
            const u = new URL(location.href);
            u.searchParams.set('tab', t);
            history.replaceState(null, '', u);
          });
          // Warn before leaving with a chosen decision or notes that weren't submitted
          window.addEventListener('beforeunload', e => {
            if (this.dirty) { e.preventDefault(); e.returnValue = ''; }
          });
        },
        setRole(role) { this.role = role; saveRole(role); this.menu = null; },

        // ---------- who can do what ----------
        get isAdmin() { return this.role === 'admin'; },
        get isMine() { return c.state === 'assigned' && c.reviewer === ME; },
        // Stale pages and missing coverage both make a decision unsafe
        get canDecide() { return this.isMine && this.condition !== 'stale' && this.condition !== 'error'; },
        get dirty() { return !this.justSubmitted && (this.decision.choice || this.decision.notes.trim()); },
        reviewerName(id) { return id === ME ? 'you' : REVIEWER_BY_ID[id]?.name; },
        reviewerFull(id) { return REVIEWER_BY_ID[id]?.name; },
        avatar(id) { return REVIEWER_BY_ID[id]?.avatar; },
        get workspace() { return WORKSPACE_BY_ID[c.workspace].name; },
        initialsOf(name) { return name.split(' ').map(s => s[0]).join('').slice(0, 2); },
        // Candidate's profile photo (same one the list uses); initials only if it can't load
        get candidatePhoto() { return SR.candidates().find(p => p.identifier === c.identifier)?.avatar?.replace('/80?', '/160?') || ''; },
        get identityImage() { return MEDIA.webcam; },
        // The one ownership action shown at the top, if any
        get headerAction() { return c.state === 'queued' || (c.state === 'assigned' && this.isAdmin); },

        // ---------- result, review requirement, case state: kept separate ----------
        get result() {
          if (c.state === 'completed') return { value: c.result, source: 'human', by: this.reviewerFull(c.reviewer), at: c.completedAt, through: c.assessedThrough || d.assessedThrough };
          return { value: d.aiResult, source: 'ai', at: d.aiAt, through: d.assessedThrough };
        },
        get resultLabel() { return this.result.value === 'clear' ? 'Clear' : this.result.value === 'flagged' ? 'Flagged' : 'Not evaluated'; },
        get resultIcon() { return ic(this.result.value === 'clear' ? 'result_clear' : this.result.value === 'flagged' ? 'result_flagged' : 'result_none', 'size-5'); },
        get resultClass() { return this.result.value === 'clear' ? 'text-violet-600 dark:text-violet-400' : this.result.value === 'flagged' ? 'text-amber-600 dark:text-amber-500' : 'text-muted-foreground-1'; },
        get needsReview() { return c.state !== 'completed'; },
        get caseLabel() {
          if (c.state === 'queued') return 'Queued';
          if (c.state === 'assigned') return 'Assigned';
          return 'Completed';
        },
        get originLabel() {
          return d.origin === 'client' ? 'Requested by client' : 'AI flagged';
        },
        relative, exact, day, dayTime, dur, span,

        // ---------- queue: Previous / Next follow the list the case was opened from ----------
        get sequence() {
          if (params.get('sequence') === 'selected' && params.get('cases')) {
            return { source: 'selected', label: 'Selected cases', ids: params.get('cases').split(',') };
          }
          const s = SR.loadSequence();
          if (s && s.ids && s.ids.includes(c.id)) return s;
          return null;
        },
        get position() { return this.sequence ? this.sequence.ids.indexOf(c.id) : -1; },
        caseHref(id) {
          const p = new URLSearchParams({ case: id });
          if (this.sequence?.source === 'selected') { p.set('sequence', 'selected'); p.set('cases', this.sequence.ids.join(',')); }
          return SR.url(`/tpsentinel/review_cases/detail/?${p}`);
        },
        get prevHref() { return this.position > 0 ? this.caseHref(this.sequence.ids[this.position - 1]) : null; },
        get nextHref() { return this.sequence && this.position < this.sequence.ids.length - 1 ? this.caseHref(this.sequence.ids[this.position + 1]) : null; },
        get listHref() { return SR.url('/tpsentinel/review_cases/'); },
        // After a decision: the next case in this queue still assigned to you
        get nextAssignedHref() {
          if (!this.sequence) return null;
          const fresh = SR.loadCases();
          const next = this.sequence.ids.slice(this.position + 1).find(id => { const x = fresh.find(f => f.id === id); return x && x.state === 'assigned' && x.reviewer === ME; });
          return next ? this.caseHref(next) : null;
        },

        // ---------- sessions ----------
        get session() { return d.sessions[this.sessionIdx]; },
        get sessionSpanLabel() {
          const a = d.sessions[0], b = d.sessions[d.sessions.length - 1];
          return d.sessions.length === 1 ? day(a.start) : `${day(a.start)} – ${day(b.end)}`;
        },
        prevSession() { if (this.sessionIdx > 0) this.sessionIdx--; },
        nextSession() { if (this.sessionIdx < d.sessions.length - 1) this.sessionIdx++; },

        // ---------- why this candidate needs review ----------
        get summary() {
          if (d.origin === 'client') {
            const what = d.request.what === 'snapshots' ? 'periodic snapshots' : 'session recordings';
            return `The client asked to check the ${what} from Session ${d.request.session}. AI cleared this candidate, so review the requested evidence directly and record a decision.`;
          }
          if (d.concernType === 'behaviour') {
            const top = this.behaviourConcerns[0];
            return `AI flagged this candidate${top ? ` because of \u201c${INDICATOR_BY_KEY[top.key].label}\u201d` : ''}. A reviewer must confirm whether it was a real integrity issue or has an innocent explanation.`;
          }
          return 'AI flagged this candidate because required evidence is missing, so the attempt can’t be fully assessed. A reviewer must decide whether the available evidence is still enough.';
        },
        // Client request: the evidence they asked about, from the requested Session
        get requestedEvidence() {
          if (!d.request) return [];
          const kind = d.request.what === 'snapshots' ? 'periodic' : 'recording';
          return d.sessionMedia.filter(m => m.session === d.request.session && m.kind === kind).sort((a, b) => a.at - b.at);
        },
        openRequestedEvidence() {
          this.evidenceFilter = { session: String(d.request.session), anomaly: '', source: '', availability: '', q: d.request.what === 'snapshots' ? 'Periodic' : 'recording' };
          this.tab = 'evidence';
          this.$nextTick(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
        },
        get enrolledOn() {
          const t = d.sessions[0].start - d.profile.enrolledDaysBefore * DAY;
          const dt = new Date(t);
          return `${MONTHS[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
        },
        copied: '',
        copy(text, key) {
          try { navigator.clipboard?.writeText(text); } catch (e) { /* clipboard unavailable */ }
          this.copied = key;
          setTimeout(() => { if (this.copied === key) this.copied = ''; }, 1500);
        },
        // One entry per anomaly type, most decision-relevant first (severity, then most recent)
        get behaviourConcerns() {
          const byKey = {};
          d.events.forEach(e => { (byKey[e.key] = byKey[e.key] || []).push(e); });
          const rank = s => SEVERITY.indexOf(s);
          return Object.entries(byKey).map(([key, evs]) => {
            const severity = evs.map(e => e.severity).sort((a, b) => rank(a) - rank(b))[0];
            const sessions = [...new Set(evs.map(e => e.session))];
            const artifacts = evs.flatMap(e => e.artifacts);
            const longest = Math.max(...evs.map(e => e.length));
            let timing;
            if (evs.length === 1) {
              const e = evs[0];
              timing = `Session ${e.session} · ${dayTime(e.at)}${e.length ? ` · lasted ${dur(e.length)}` : ''}`;
            } else {
              timing = `${sessions.length === 1 ? 'Session' : 'Sessions'} ${sessions.join(', ')} · ${day(evs[0].at)}${day(evs[0].at) !== day(evs[evs.length - 1].at) ? ` – ${day(evs[evs.length - 1].at)}` : ''}${longest ? ` · longest ${dur(longest)}` : ''}`;
            }
            return { key, label: INDICATOR_BY_KEY[key].label, icon: ic(key, 'size-5'), severity, explanation: EXPLAIN[key], timing, events: evs, artifacts, latest: evs[evs.length - 1].at };
          }).sort((a, b) => rank(a.severity) - rank(b.severity) || b.latest - a.latest);
        },
        get evidenceConcerns() {
          return d.gaps.map(g => ({ ...g, icon: ic('missing_evidence', 'size-5'), timing: `Session ${g.session} · ${day(g.from)}, ${span(g.from, g.to)}` }));
        },
        artifactLabel(a) {
          if (a.kind === 'snapshot') return a.source === 'screen' ? 'Screen snapshot' : 'Webcam snapshot';
          if (a.kind === 'periodic') return 'Periodic snapshot';
          if (a.kind === 'recording') return a.source === 'screen' ? 'Screen recording' : 'Webcam recording';
          return a.media === 'audio' ? 'Microphone clip' : a.source === 'screen' ? 'Screen clip' : 'Webcam clip';
        },
        indicatorLabel(key) { return INDICATOR_BY_KEY[key].label; },
        stateLabel(a) { return ARTIFACT_STATE[a.state].label; },
        stateNote(a) { return ARTIFACT_STATE[a.state].note; },
        openEvidenceFor(key) {
          this.evidenceFilter = { session: '', anomaly: key, source: '', availability: '', q: '' };
          this.tab = 'evidence';
          this.$nextTick(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
        },
        openGapSession(g) {
          this.sessionIdx = d.sessions.findIndex(s => s.n === g.session);
          this.$nextTick(() => document.getElementById('session-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
        },

        // ---------- coverage: did TPSentinel collect what the policy expected ----------
        get coverage() {
          const ss = d.sessions;
          const rec = src => {
            if (ss.every(s => s.coverage[src].status === 'not_required')) return { status: 'Not required', measure: 'Recording is off in this workspace’s policy' };
            const complete = ss.filter(s => s.coverage[src].status === 'complete').length;
            const got = ss.reduce((t, s) => t + s.coverage[src].got, 0), exp = ss.reduce((t, s) => t + s.coverage[src].expected, 0);
            return complete === ss.length
              ? { status: 'Complete', measure: `${complete} of ${ss.length} sessions` }
              : { status: 'Partial', measure: `${dur(got)} of ${dur(exp)} expected`, gap: true };
          };
          const got = ss.reduce((t, s) => t + s.coverage.snapshots.got, 0), exp = ss.reduce((t, s) => t + s.coverage.snapshots.expected, 0);
          return [
            { key: 'webcam', label: 'Webcam recordings', icon: ic('webcam'), ...rec('webcam') },
            { key: 'screen', label: 'Screen recordings', icon: ic('monitor'), ...rec('screen') },
            { key: 'snapshots', label: 'Periodic snapshots', icon: ic('camera'), status: got === exp ? 'Complete' : 'Partial', measure: `${got} of ${exp} expected`, gap: got < exp },
            { key: 'mic', label: 'Microphone', icon: ic('mic'), status: 'Not required', measure: 'Not part of this workspace’s policy' },
          ];
        },
        sessionCoverage(s) {
          const rec = (src, label) => {
            const cv = s.coverage[src];
            if (cv.status === 'not_required') return { label, status: 'Not required', measure: '' };
            return { label, status: cv.status === 'complete' ? 'Complete' : 'Partial', measure: `${dur(cv.got)} of ${dur(cv.expected)}`, gap: cv.status === 'partial' };
          };
          const sn = s.coverage.snapshots;
          return [
            rec('webcam', 'Webcam recording'),
            rec('screen', 'Screen recording'),
            { label: 'Periodic snapshots', status: sn.got === sn.expected ? 'Complete' : 'Partial', measure: `${sn.got} of ${sn.expected}`, gap: sn.got < sn.expected },
            { label: 'Microphone', status: 'Not required', measure: '' },
          ];
        },
        coverageClass(row) {
          if (row.status === 'Complete') return 'text-foreground';
          if (row.status === 'Partial' || row.status === 'Missing') return 'text-amber-700 dark:text-amber-500';
          return 'text-muted-foreground-1';
        },
        get recentMedia() {
          return [...d.sessionMedia].filter(m => m.kind === 'periodic' || m.kind === 'recording').sort((a, b) => b.at - a.at).slice(0, 4);
        },

        // ---------- Evidence tab ----------
        get allEvidence() {
          return [...d.events.flatMap(e => e.artifacts), ...d.sessionMedia].sort((a, b) => b.at - a.at);
        },
        get evidenceAnomalies() { return [...new Set(d.events.map(e => e.key))].map(k => ({ key: k, label: INDICATOR_BY_KEY[k].label })); },
        get filteredEvidence() {
          const f = this.evidenceFilter, q = f.q.trim().toLowerCase();
          return this.allEvidence.filter(a =>
            (!f.session || a.session === +f.session) &&
            (!f.anomaly || (f.anomaly === '*' ? !!a.anomaly : a.anomaly === f.anomaly)) &&
            (!f.source || a.source === f.source) &&
            (!f.availability || a.state === f.availability) &&
            (!q || `${this.artifactLabel(a)} session ${a.session} ${a.anomaly ? INDICATOR_BY_KEY[a.anomaly].label : ''} ${this.stateLabel(a)}`.toLowerCase().includes(q)));
        },
        get evidenceFiltered() { const f = this.evidenceFilter; return !!(f.session || f.anomaly || f.source || f.availability || f.q); },
        resetEvidence() { this.evidenceFilter = { session: '', anomaly: '', source: '', availability: '', q: '' }; },
        // Events with no media still appear, so nothing is silently missing
        get eventsWithoutMedia() {
          const f = this.evidenceFilter;
          if (f.source || f.availability || f.q) return [];
          return d.events.filter(e => !e.artifacts.length && (!f.session || e.session === +f.session) && (!f.anomaly || f.anomaly === '*' || e.key === f.anomaly));
        },

        // ---------- Activity tab ----------
        get activity() {
          const items = [];
          d.sessions.forEach(s => {
            items.push({ id: `a-start-${s.n}`, session: s.n, at: s.start, type: 'session', icon: ic('session_start'), title: `Session ${s.n} started`, description: `${s.device.type} · ${s.device.os} · ${s.device.browser}` });
            items.push({ id: `a-id-${s.n}`, session: s.n, at: s.start + 30e3, type: 'session', icon: ic('identity'), title: `Identity check: ${s.identity.status}`, description: `Face match ${s.identity.score}%` });
            items.push({ id: `a-end-${s.n}`, session: s.n, at: s.end, type: 'session', icon: ic('session_end'), title: `Session ${s.n} ended`, description: `Lasted ${dur(s.length)}` });
          });
          d.events.forEach(e => items.push({ id: `a-${e.id}`, session: e.session, at: e.at, type: 'anomaly', icon: ic(e.key), title: INDICATOR_BY_KEY[e.key].label, description: `${e.severity} severity${e.length ? ` · lasted ${dur(e.length)}` : ''}${e.artifacts.length ? '' : ' · no media captured'}` }));
          d.technical.forEach(t => items.push({ ...t, type: 'technical', icon: ic('warn') }));
          const f = this.activityFilter, q = f.q.trim().toLowerCase();
          return items
            .filter(i => (!f.session || i.session === +f.session) && (!f.type || i.type === f.type) && (!q || `${i.title} ${i.description} session ${i.session}`.toLowerCase().includes(q)))
            .sort((a, b) => b.at - a.at)
            .map((i, idx, arr) => ({ ...i, heading: idx === 0 || day(arr[idx - 1].at) !== day(i.at) ? `${day(i.at)} · Session ${i.session}` : '', meta: clock(new Date(i.at)) }));
        },
        get activityFiltered() { const f = this.activityFilter; return !!(f.session || f.type || f.q); },
        resetActivity() { this.activityFilter = { session: '', type: '', q: '' }; },

        // ---------- History tab ----------
        get historyItems() {
          const f = this.historyFilter;
          return [...d.history]
            .filter(h => (!f.type || h.kind === f.type) && (!f.actor || (f.actor === 'ai' ? h.actor === 'AI' : h.actor !== 'AI')))
            .sort((a, b) => b.at - a.at)
            .map((h, i, arr) => ({ ...h, icon: h.actor === 'AI' ? ic('ai') : null, tone: h.kind === 'case' ? 'accent' : '', heading: i === 0 || day(arr[i - 1].at) !== day(h.at) ? day(h.at) : '', meta: clock(new Date(h.at)) }));
        },
        get recentHistory() { return this.historyItems.slice(0, 3).map(h => ({ ...h, heading: '', meta: `${day(h.at)}, ${h.meta}` })); },
        get historyFiltered() { return !!(this.historyFilter.type || this.historyFilter.actor); },
        resetHistory() { this.historyFilter = { type: '', actor: '' }; },
        log(entry) { d.history.push({ id: `h-${Date.now()}-${Math.random()}`, at: Date.now(), ...entry }); },

        // ---------- ownership actions ----------
        assignToMe() {
          Object.assign(c, { state: 'assigned', reviewer: ME, assignedAt: Date.now() });
          SR.saveChange(c.id, { state: 'assigned', reviewer: ME, assignedAt: c.assignedAt });
          this.log({ kind: 'case', actor: 'Divya Menon', title: 'Assigned to Divya Menon', description: '' });
        },
        openMenu(type, ev) {
          if (this.menu?.type === type) { this.menu = null; return; }
          const r = ev.currentTarget.getBoundingClientRect();
          const width = type === 'assign' ? 320 : 200;
          this.menu = { type, top: r.bottom + 6, left: Math.max(8, Math.min(r.left, window.innerWidth - width - 8)), width, search: '' };
          if (type === 'assign') this.$nextTick(() => this.$refs.assignSearch?.focus());
        },
        // Reviewers for the assign menu: filtered by the search box, with how many open cases each owns
        get assignOptions() {
          const q = (this.menu?.search || '').trim().toLowerCase();
          return REVIEWERS
            .filter(r => !q || r.name.toLowerCase().includes(q))
            .map(r => ({ ...r, load: this.all.filter(x => x.state === 'assigned' && x.reviewer === r.id).length }));
        },
        assignTo(id) {
          this.menu = null;
          if (c.reviewer === id) return;
          const apply = () => {
            Object.assign(c, { state: 'assigned', reviewer: id, assignedAt: Date.now() });
            SR.saveChange(c.id, { state: 'assigned', reviewer: id, assignedAt: c.assignedAt });
            this.log({ kind: 'case', actor: 'Divya Menon', title: `${c.reviewer ? 'Reassigned' : 'Assigned'} to ${REVIEWER_BY_ID[id].name}`, description: '' });
          };
          if (c.reviewer && c.reviewer !== id) { this.pending = { to: REVIEWER_BY_ID[id].name, from: REVIEWER_BY_ID[c.reviewer].name, run: apply }; this.$dispatch('open-modal-cd-reassign'); return; }
          apply();
        },
        pending: null,
        runPending() { if (this.pending) { this.pending.run(); this.pending = null; } },
        setPriority(p) {
          this.menu = null;
          if (c.priority === p) return;
          c.priority = p;
          SR.saveChange(c.id, { priority: p });
          this.log({ kind: 'case', actor: 'Divya Menon', title: `Priority changed to ${PRIORITIES[p]}`, description: '' });
        },

        // ---------- decision ----------
        get reasons() { return this.decision.choice === 'flagged' ? FLAG_REASONS : CLEAR_REASONS; },
        choose(choice) {
          if (this.decision.choice === choice) return;
          this.decision = { ...this.decision, choice, reason: '', confirming: false, error: '' };
        },
        get reasonLabel() { return (this.reasons.find(r => r[0] === this.decision.reason) || [])[1] || ''; },
        get decisionError() {
          const x = this.decision;
          if (!x.choice) return 'Choose Clear or Flagged.';
          if (!x.reason) return 'Choose a reason.';
          if (x.reason === 'other' && !x.notes.trim()) return 'Add a note explaining the reason.';
          return '';
        },
        reviewDecision() {
          if (this.condition === 'stale') return;
          this.decision.error = this.decisionError;
          if (!this.decision.error) this.decision.confirming = true;
        },
        submit() {
          if (this.condition === 'stale') { this.decision.confirming = false; return; }
          const x = this.decision;
          const fields = { state: 'completed', result: x.choice, reason: this.reasonLabel + (x.notes.trim() ? ` — ${x.notes.trim()}` : ''), completedAt: Date.now(), reviewer: ME, assessedThrough: d.assessedThrough };
          Object.assign(c, fields);
          SR.saveChange(c.id, fields);
          this.log({ kind: 'case', actor: 'Divya Menon', title: `Marked ${x.choice === 'clear' ? 'Clear' : 'Flagged'}`, description: fields.reason });
          this.justSubmitted = true;
          x.confirming = false;
        },
        requestNewReview() {
          this.newReview = { id: `RC-${3000 + Math.floor(Math.random() * 900)}`, at: Date.now() };
          this.log({ kind: 'case', actor: 'Divya Menon', title: 'New review requested', description: `${this.newReview.id} was opened and queued. This decision stays in the record.` });
        },

        // ---------- page conditions (prototype) ----------
        setCondition(v) { this.condition = v; this.decision.confirming = false; },
        refreshEvidence() {
          // A newer Session finished: AI reassessed, and it's now part of this case
          const last = d.sessions[d.sessions.length - 1];
          const start = last.end + 20 * HOUR, length = 52 * MIN;
          d.sessions.push({ ...last, n: last.n + 1, start, end: start + length, length, identity: { status: 'Verified', score: 99.1 },
            coverage: JSON.parse(JSON.stringify({ ...last.coverage, snapshots: { expected: 10, got: 10 } })) });
          ['webcam', 'screen'].forEach(src => { const cv = d.sessions[d.sessions.length - 1].coverage[src]; if (cv.status !== 'not_required') Object.assign(cv, { status: 'complete', got: length, expected: length }); });
          d.assessedThrough = last.n + 1;
          d.aiAt = start + length + 6 * MIN;
          this.log({ kind: 'assessment', actor: 'AI', title: 'AI reassessed the candidate', description: `No new concerns. Assessed through Session ${last.n + 1}; added to this case.` });
          this.sessionIdx = d.sessions.length - 1;
          this.condition = 'normal';
        },

        // ---------- media viewer ----------
        openViewer(a) { if (a.state !== 'available') return; this.viewer = a; this.$dispatch('open-modal-cd-media'); },
      };
    };
  })();
</script>
