<!-- Assign reviewer / change priority (Admin). Fixed position so cards never clip it. -->
<div x-show="menu" x-cloak @click.outside="menu = null"
     :style="menu && { top: menu.top + 'px', left: menu.left + 'px', width: menu.width + 'px' }"
     class="fixed z-[80] bg-dropdown border border-dropdown-line rounded-xl shadow-xl overflow-hidden" role="menu">
  <template x-if="menu?.type === 'assign'">
    <div class="p-1">
      <p class="px-2 pt-2 pb-1 text-xs font-medium text-muted-foreground-1" x-text="c.reviewer ? 'Reassign to' : 'Assign to'"></p>
      <template x-for="r in reviewers" :key="r.id">
        <button type="button" @click="assignTo(r.id)"
                class="w-full flex items-center gap-x-2.5 py-2 px-2 rounded-lg text-sm text-start text-dropdown-item-foreground hover:bg-dropdown-item-hover focus:outline-hidden focus-visible:bg-dropdown-item-focus">
          <img class="shrink-0 size-6 rounded-full object-cover" :src="r.avatar" alt="">
          <span class="truncate" :class="c.reviewer === r.id && 'font-medium text-foreground'" x-text="r.id === 'divya' ? `${r.name} (you)` : r.name"></span>
          <svg x-show="c.reviewer === r.id" class="ms-auto shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </template>
    </div>
  </template>
  <template x-if="menu?.type === 'priority'">
    <div class="p-1">
      <p class="px-2 pt-2 pb-1 text-xs font-medium text-muted-foreground-1">Priority</p>
      <template x-for="(p, i) in priorities" :key="p">
        <button type="button" @click="setPriority(i)"
                class="w-full flex items-center gap-x-2 py-2 px-2 rounded-lg text-sm text-start text-dropdown-item-foreground hover:bg-dropdown-item-hover focus:outline-hidden focus-visible:bg-dropdown-item-focus">
          <span :class="c.priority === i && 'font-medium text-foreground'" x-text="p"></span>
          <svg x-show="c.priority === i" class="ms-auto shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </template>
    </div>
  </template>
</div>
