


<section class="bg-card border border-card-line shadow-2xs rounded-xl" aria-label="Activity">
  <div class="flex flex-wrap items-center gap-2 p-4 sm:px-5 border-b border-card-line">
    
<label class="relative block grow sm:max-w-xs">
  <span class="sr-only">Search activity</span>
  <svg class="absolute start-3 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 pointer-events-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  <input type="text" x-model="activityFilter.q" placeholder="Search activity"
         class="py-1.5 ps-9 pe-3 block w-full bg-layer border border-layer-line rounded-lg text-sm text-foreground placeholder:text-muted-foreground-1 focus:border-primary focus:ring-1 focus:ring-primary">
</label>

    
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="activityFilter.session ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Session: </span>
    <span class="truncate" x-text="((d.sessions.map(s =&gt; [String(s.n), `Session ${s.n}`])).find(o => String(o[0]) === String(activityFilter.session)) || [null, 'All sessions'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Session'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'All sessions'], ...(d.sessions.map(s =&gt; [String(s.n), `Session ${s.n}`]))]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(activityFilter.session) === String(v)"
              @click="activityFilter.session = v; open = false"
              :class="String(activityFilter.session) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(activityFilter.session) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

    
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="activityFilter.type ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Type: </span>
    <span class="truncate" x-text="(([[&#39;anomaly&#39;, &#39;Anomalies&#39;], [&#39;technical&#39;, &#39;Technical issues&#39;], [&#39;session&#39;, &#39;Session events&#39;]]).find(o => String(o[0]) === String(activityFilter.type)) || [null, 'All activity'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Type'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'All activity'], ...([[&#39;anomaly&#39;, &#39;Anomalies&#39;], [&#39;technical&#39;, &#39;Technical issues&#39;], [&#39;session&#39;, &#39;Session events&#39;]])]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(activityFilter.type) === String(v)"
              @click="activityFilter.type = v; open = false"
              :class="String(activityFilter.type) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(activityFilter.type) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

    <button type="button" x-show="activityFiltered" @click="resetActivity()"
            class="ms-auto py-1.5 px-2 rounded-lg text-sm text-muted-foreground-1 hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">Reset filters</button>
  </div>
  <div class="p-4 sm:p-5">
    
<div class="w-full ">
  <template x-for="(item, i) in activity" :key="item.id">
    <div>
      <!-- Heading -->
      <template x-if="item.heading">
        <div class="ps-2 my-2" :class="i === 0 ? 'mt-0' : ''">
          <h3 class="text-xs font-medium uppercase text-muted-foreground-1" x-text="item.heading"></h3>
        </div>
      </template>

      <!-- Item -->
      <div class="flex gap-x-3">
        <!-- Icon -->
        <div class="relative after:absolute after:top-7 after:bottom-0 after:inset-s-3.5 after:-translate-x-[0.5px] after:border-s after:border-line-2"
             :class="i === activity.length - 1 ? 'after:hidden' : ''">
          <div class="relative z-10 size-7 flex justify-center items-center">
            <template x-if="item.icon">
              <span class="flex text-muted-foreground-1" x-html="item.icon"></span>
            </template>
            <template x-if="!item.icon">
              <div class="size-2 rounded-full" :class="item.tone === 'accent' ? 'bg-primary' : 'bg-surface-3'"></div>
            </template>
          </div>
        </div>

        <!-- Right Content -->
        <div class="grow min-w-0 pt-0.5 pb-6">
          <h3 class="text-sm font-medium text-foreground" x-text="item.title"></h3>
          <p x-show="item.description" class="mt-1 text-sm text-muted-foreground-2" x-text="item.description"></p>
          <div x-show="item.actor || item.meta" class="mt-1 flex flex-wrap items-center gap-x-2 text-xs text-muted-foreground-1">
            <span x-show="item.actor" class="inline-flex items-center gap-x-1.5">
              <template x-if="item.actor_avatar">
                <img class="shrink-0 size-4 rounded-full object-cover" :src="item.actor_avatar" alt="">
              </template>
              <span x-text="item.actor"></span>
            </span>
            <span x-show="item.actor && item.meta" aria-hidden="true">·</span>
            <span x-show="item.meta" x-text="item.meta"></span>
          </div>
        </div>
      </div>
    </div>
  </template>
  <p x-show="!(activity).length" class="py-6 text-sm text-muted-foreground-1">No activity matches the current search or filters.</p>
</div>

  </div>
</section>
