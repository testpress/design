

<!-- Stale: a newer Session finished after the page opened. Only safe action: refresh. -->
<div x-show="condition === 'stale'" x-cloak role="alert"
     class="flex flex-col sm:flex-row sm:items-center gap-3 p-4 rounded-xl border border-amber-200 bg-amber-50 dark:border-amber-500/20 dark:bg-amber-500/10">
  <svg class="shrink-0 size-5 text-amber-600 dark:text-amber-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
  <div class="grow">
    <p class="text-sm font-medium text-amber-900 dark:text-amber-300">
      Session <span x-text="d.sessions.length + 1"></span> finished after you opened this case
    </p>
    <p class="mt-0.5 text-sm text-amber-800 dark:text-amber-400">
      AI has reassessed the candidate and the new session is now part of this case. Refresh evidence before deciding; submitting is blocked until then.
    </p>
  </div>
  

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary border border-transparent text-primary-foreground hover:bg-primary-hover focus:bg-primary-focus"   @click="refreshEvidence()">
  

    
    

    Refresh evidence

    

  
    </button>
  


</div>
