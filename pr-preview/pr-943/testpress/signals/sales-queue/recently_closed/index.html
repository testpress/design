

<!-- Card -->
<!-- Card -->
<div class="flex flex-col bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-xs rounded-xl overflow-hidden mt-4" x-data="{ status: new URLSearchParams(window.location.search).get('status') }">
  <div class="px-5 pt-5 pb-3">
    <h2 class="font-medium text-sm sm:text-base text-gray-800 dark:text-neutral-200">
      Recently closed
    </h2>
  </div>

  <!-- Empty State -->
  <div x-show="status === 'empty'" style="display: none;" class="flex flex-col justify-center min-h-[300px]">
    
  
  

  
    
  <div class="p-5 min-h-48 flex flex-col justify-center items-center text-center">
    
    
      <div class="mx-auto flex justify-center items-center size-12 bg-gray-100 dark:bg-neutral-800 rounded-full">
        <i data-lucide="history" class="shrink-0 size-6 text-gray-500 dark:text-neutral-400"></i>
      </div>
    

    <div class="max-w-sm mx-auto">
      <p class="mt-2 font-medium text-gray-800 dark:text-neutral-200">
        No recently closed Opportunities
      </p>
      
      <p class="mb-1 mt-1 text-sm text-gray-500 dark:text-neutral-400">
        Your latest Won and Lost Opportunities will appear here.
      </p>
      
    </div>

    

  </div>
  
  


  </div>
  <!-- End Empty State -->

  <!-- Onboarding State -->
  <div x-show="status === 'onboarding'" style="display: none;" class="flex flex-col justify-center min-h-[300px]">
    
  
  

  
    
  <div class="p-5 min-h-48 flex flex-col justify-center items-center text-center">
    
    
      <div class="mx-auto flex justify-center items-center size-12 bg-gray-100 dark:bg-neutral-800 rounded-full">
        <i data-lucide="history" class="shrink-0 size-6 text-gray-500 dark:text-neutral-400"></i>
      </div>
    

    <div class="max-w-sm mx-auto">
      <p class="mt-2 font-medium text-gray-800 dark:text-neutral-200">
        Your closed opportunities will appear here
      </p>
      
      <p class="mb-1 mt-1 text-sm text-gray-500 dark:text-neutral-400">
        See the outcomes of opportunities you&#39;ve worked on.
      </p>
      
    </div>

    

  </div>
  
  


  </div>
  <!-- End Onboarding State -->

  <!-- Data State -->
  <div x-show="status !== 'empty' && status !== 'onboarding'" class="flex flex-col flex-grow">
    <div class="px-0 py-0 overflow-hidden">
      <ul role="list" class="">
        
      </ul>
    </div>

    <!-- Footer -->
    <div class="flex justify-center mt-auto border-t border-gray-200 dark:border-neutral-700">
      <a class="group p-3 px-5 flex items-center justify-center text-sm font-medium text-emerald-600 dark:text-emerald-500 rounded-b-lg hover:text-emerald-700 dark:hover:text-emerald-600 focus:outline-none focus:decoration-2 focus:underline focus:text-emerald-700 dark:focus:text-emerald-600 transition-colors" href="#">
        View my results
        <i data-lucide="arrow-right" class="shrink-0 size-4 ml-1 transition-transform group-hover:translate-x-1"></i>
      </a>
    </div>
    <!-- End Footer -->
  </div>
  <!-- End Data State -->
</div>
<!-- End Card -->
