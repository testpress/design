<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

<script id="chart-dates-data" type="application/json">["2023-01-01", "2023-01-02", "2023-01-03", "2023-01-04", "2023-01-05"]</script>
<script id="chart-wasted-hours-data" type="application/json">[12, 15, 14, 18, 10]</script>

<script>
  window.addEventListener('load', () => {
    let chartDates = ['Jan', 'Feb', 'Mar', 'Apr', 'May'];
    let chartData = [10, 20, 15, 25, 30];

    try {
      const datesText = document.getElementById('chart-dates-data').textContent.trim();
      const hoursText = document.getElementById('chart-wasted-hours-data').textContent.trim();
      if (datesText && datesText !== "" && !datesText.includes("{" + "{")) chartDates = JSON.parse(datesText);
      if (hoursText && hoursText !== "" && !hoursText.includes("{" + "{")) chartData = JSON.parse(hoursText);
    } catch (e) {
      console.warn("Could not parse dynamic chart data");
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'empty') {
      chartData = chartDates.map(() => 0);

      const kpiAnomalies = document.getElementById('kpi-anomalies');
      if (kpiAnomalies) {
        kpiAnomalies.textContent = '-';
        kpiAnomalies.className = 'text-gray-500 dark:text-neutral-500';
      }

      const kpiHours = document.getElementById('kpi-hours');
      if (kpiHours) {
        kpiHours.textContent = '-';
        kpiHours.className = 'text-gray-500 dark:text-neutral-500';
      }

      const leaderboard = document.getElementById('leaderboard-list');
      const leaderboardEmptyState = document.getElementById('leaderboard-empty-state-template');
      if (leaderboard && leaderboardEmptyState) {
        leaderboard.innerHTML = leaderboardEmptyState.innerHTML;
      }

      const anomaliesTable = document.getElementById('anomalies-table-container');
      const tableEmptyState = document.getElementById('table-empty-state-template');
      if (anomaliesTable && tableEmptyState) {
        anomaliesTable.innerHTML = tableEmptyState.innerHTML;
      }
    }

    const chartDom = document.getElementById('hs-single-area-chart');
    if (chartDom) {
      const myChart = echarts.init(chartDom);
      const option = {
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'transparent',
          borderWidth: 0,
          padding: 0,
          extraCssText: 'box-shadow: none;',
          formatter: function (params) {
            let item = params[0];
            let val = item.value;
            let formattedVal = val >= 1000 ? (val / 1000) + 'k' : val;
            let dateStr = item.name;
            const dateObj = new Date(dateStr);
            if (!isNaN(dateObj)) {
               dateStr = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
            }
            return `
              <div class="px-3 py-2 min-w-32 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 shadow-sm rounded-xl text-sm">
                <div class="font-medium text-gray-800 dark:text-neutral-200 mb-1.5">${dateStr}</div>
                <div class="flex items-center gap-x-2">
                  <span class="size-2 rounded-sm bg-blue-600"></span>
                  <span class="text-gray-500 dark:text-neutral-400">Wasted Hours:</span>
                  <span class="font-medium text-gray-800 dark:text-neutral-200 ml-auto">${formattedVal}</span>
                </div>
              </div>
            `;
          }
        },
        grid: {
          top: 15,
          left: '3%',
          right: '4%',
          bottom: '3%',
          containLabel: true
        },
        xAxis: {
          type: 'category',
          boundaryGap: false,
          data: chartDates,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: {
            color: '#94a3b8',
            margin: 15,
            formatter: function (value) {
              const d = new Date(value);
              if (!isNaN(d)) {
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
              }
              return value;
            }
          }
        },
        yAxis: {
          type: 'value',
          splitLine: {
            lineStyle: {
              type: 'dashed',
              color: '#e2e8f0'
            }
          },
          axisLabel: {
            color: '#94a3b8',
            formatter: (value) => value >= 1000 ? `${value / 1000}k` : value
          }
        },
        series: [
          {
            name: 'Wasted Hours',
            type: 'line',
            smooth: true,
            symbol: 'circle',
            showSymbol: false,
            symbolSize: 8,
            itemStyle: {
              color: '#2563eb'
            },
            lineStyle: {
              width: 2
            },
            areaStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: 'rgba(37, 99, 235, 0.5)' },
                { offset: 1, color: 'rgba(37, 99, 235, 0)' }
              ])
            },
            data: chartData
          }
        ]
      };

      myChart.setOption(option);
      
      window.addEventListener('resize', function() {
        myChart.resize();
      });
    }

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  });
</script>
