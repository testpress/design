
<!-- Follow-up Card Wrapper -->
<div class="flex flex-col bg-white border border-gray-200 overflow-hidden rounded-xl shadow-2xs dark:bg-neutral-800 dark:border-neutral-700 mt-4">
  <!-- Header -->
  <div class="py-3 px-5 border-b border-gray-200 dark:border-neutral-700">
    <h2 class="font-medium text-gray-800 dark:text-neutral-200">
      Next Follow-up
    </h2>
  </div>

  <!-- Body -->
  <div class="p-5">
    
    <!-- Empty State -->
    <div class="flex flex-col items-center justify-center py-5 border border-dashed border-gray-200 rounded-xl dark:border-neutral-700">
      <div class="p-3 bg-gray-100 text-gray-500 rounded-full dark:bg-neutral-700 dark:text-neutral-400 mb-3">
        <i data-lucide="calendar-off" class="size-6"></i>
      </div>
      <p class="text-sm text-gray-500 dark:text-neutral-400 text-center mb-4 px-4">Schedule a follow-up to plan your next interaction with the student.</p>
      <button type="button" @click="$dispatch('open-modal-schedule-followup-detail')" class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 focus:outline-hidden focus:bg-primary-700 disabled:opacity-50 disabled:pointer-events-none">
        <i data-lucide="calendar-clock" class="shrink-0 size-4"></i>
        Schedule follow-up
      </button>
    </div>
    
  </div>
</div>
<!-- End Follow-up Card Wrapper -->
