


<!-- Status Card -->
<div class="bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-2xs rounded-xl h-full flex flex-col">
  <!-- Header -->
  <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700">
    <h2 class="font-medium text-gray-800 dark:text-neutral-200">
      Conversation
    </h2>
  </div>
  <!-- End Header -->

  <!-- Body -->
  <div class="flex-1 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
    <div class="pt-2 pb-5 px-4">
      <div class="relative">
        <!-- Time -->
        <div class="sticky top-0 inset-x-0 z-8 max-w-lg mx-auto text-center">
          <span class="py-0.5 px-1.5 bg-gray-100 dark:bg-neutral-900 text-xs text-gray-500 dark:text-neutral-400 rounded-full">Today</span>
        </div>
        <!-- End Time -->

        <!-- List -->
        <div class="w-full space-y-5">
          <!-- System Event: Opportunity created -->
          <div class="flex flex-col items-center justify-center my-4 text-center">
            <p class="text-xs font-medium text-gray-500 dark:text-neutral-400 flex items-center gap-x-1.5 justify-center">
              <i data-lucide="target" class="size-3.5 text-gray-400"></i> Opportunity created
            </p>
            <p class="text-[11px] text-gray-400 dark:text-neutral-500 mt-0.5"> <span class="mx-0.5">&middot;</span> Today 5:40 PM</p>
          </div>

          <!-- System Event: Ownership assigned -->
          <div class="flex flex-col items-center justify-center my-4 text-center">
            <p class="text-xs font-medium text-gray-500 dark:text-neutral-400 flex items-center gap-x-1.5 justify-center">
              <i data-lucide="user-check" class="size-3.5 text-gray-400"></i> Ownership assigned
            </p>
            <p class="text-[11px] text-gray-400 dark:text-neutral-500 mt-0.5">Priya Sharma <span class="mx-0.5">&middot;</span> Today 5:41 PM</p>
          </div>

          
             <div class="text-sm text-gray-500 py-10 text-center">No conversation recorded yet.</div>
          

        </div>
        <!-- End List -->
      </div>
    </div>
  </div>
  <!-- End Body -->

  <!-- Footer -->
  <div class="p-3 border-t border-gray-200 dark:border-neutral-700 relative">
    <textarea class="py-2.5 px-3 block w-full bg-gray-50 border-gray-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600 resize-none pe-12" rows="2" placeholder="Reply to ..."></textarea>
    <div class="absolute bottom-5 end-5 flex items-center">
      <button type="button" class="inline-flex shrink-0 justify-center items-center size-8 rounded-full text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:bg-primary-700 transition-all">
        <i data-lucide="send" class="shrink-0 size-3.5"></i>
      </button>
    </div>
  </div>
  <!-- End Footer -->
</div>
<!-- End Status Card -->
