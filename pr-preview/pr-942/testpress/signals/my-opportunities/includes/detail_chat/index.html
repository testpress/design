


<!-- Status Card -->
<div class="bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 shadow-2xs rounded-xl h-full flex flex-col">
  <!-- Header -->
  <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700">
    <h2 class="font-medium text-gray-800 dark:text-neutral-200">
      Conversation
    </h2>
  </div>
  <!-- End Header -->

  <!-- Body -->
  <div class="flex-1 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500">
    <div class="pt-2 pb-5 px-4">
      <div class="relative">

        <div class="sticky top-0 inset-x-0 z-8 max-w-lg mx-auto text-center">
          <span class="py-0.5 px-1.5 bg-gray-100 dark:bg-neutral-900 text-xs text-gray-500 dark:text-neutral-400 rounded-full">Today</span>
        </div>
        <!-- End Time -->

        <div class="w-full space-y-5">
          
             <div class="text-sm text-gray-500 py-10 text-center">No conversation recorded yet.</div>
          
        </div>
        <!-- End List -->
      </div>
    </div>
  </div>
  <!-- End Body -->

  <!-- Textarea Footer -->
  <footer class="bg-white dark:bg-neutral-800 rounded-b-xl border-t border-gray-200 dark:border-neutral-700 flex flex-col" x-data="{ tab: 'message', activeContext: '' }" x-init="$watch('tab', () => $nextTick(() => $refs.chatInput.focus()))">
    
    <!-- Top toolbar: Message type selector and Context selector -->
    <div class="px-3 py-2 border-b border-gray-100 dark:border-neutral-700/50 flex justify-between items-center bg-gray-50/50 dark:bg-neutral-800/50">

<div x-data="{ 
       open: false,
       top: 0,
       left: 'auto',
       right: 'auto',
       _triggerEl: null,
       _menuEl: null,
       _scrollHandler: null,
       init() {
         this.$watch('open', value => {
           console.log('Watch open value:', value);
           if (value) {
             console.log('Trigger ref:', this.$refs.trigger, 'Menu ref:', this.$refs.menu);
             this._triggerEl = this.$refs.trigger;
             this._menuEl = this.$refs.menu;
             this._scrollHandler = this._scrollHandler || this.updatePosition.bind(this);
             setTimeout(() => { 
               console.log('Calling updatePosition from setTimeout');
               this.updatePosition(); 
             }, 0);
             window.addEventListener('scroll', this._scrollHandler, true);
             window.addEventListener('resize', this._scrollHandler, true);
           } else {
             if (this._scrollHandler) {
               window.removeEventListener('scroll', this._scrollHandler, true);
               window.removeEventListener('resize', this._scrollHandler, true);
             }
           }
         });
       },
       updatePosition() {
         const trigger = this._triggerEl;
         console.log('updatePosition called, trigger:', trigger);
         if (!trigger) {
           console.log('No trigger element found!');
           return;
         }
         const rect = trigger.getBoundingClientRect();
         console.log('Trigger bounding rect:', rect);
         this.top = rect.bottom + 4;
         const placement = 'top-start';
         console.log('Placement:', placement);
          const menuWidth = this._menuEl ? this._menuEl.offsetWidth : 224;
          const menuHeight = this._menuEl ? this._menuEl.offsetHeight : 160;
          
          let actualPlacement = placement;
          const spaceBelow = window.innerHeight - rect.bottom;
          const spaceAbove = rect.top;
          
          if (placement.startsWith('bottom') && spaceBelow < menuHeight + 10 && spaceAbove > spaceBelow) {
            actualPlacement = placement.replace('bottom', 'top');
          } else if (placement.startsWith('top') && spaceAbove < menuHeight + 10 && spaceBelow > spaceAbove) {
            actualPlacement = placement.replace('top', 'bottom');
          }

          if (actualPlacement === 'bottom-end' || actualPlacement === 'top-end') {
            if (rect.right < menuWidth) {
              this.left = rect.left;
              this.right = 'auto';
            } else {
              this.left = rect.right - menuWidth;
              this.right = 'auto';
            }
            this.top = actualPlacement === 'bottom-end' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          } else if (actualPlacement === 'bottom-start' || actualPlacement === 'top-start') {
            let leftPos = rect.left;
            if (window.innerWidth - leftPos < menuWidth) {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            } else {
              this.left = leftPos;
              this.right = 'auto';
            }
            this.top = actualPlacement === 'bottom-start' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          }
       }
     }" 
     @keydown.escape.window="open = false"
     @close-dropdown.window="open = false"
     class="inline-flex ">
  
  <!-- Trigger -->
  <div @click="open = !open" class="cursor-pointer" x-ref="trigger">
    
      
        <button type="button" class="inline-flex items-center gap-x-1.5 text-sm font-medium text-gray-800 dark:text-neutral-200 hover:text-primary-600 dark:hover:text-primary-500 focus:outline-hidden">
          <span x-show="tab === 'message'" class="flex items-center gap-x-1.5"><i data-lucide="message-square" class="size-3.5"></i> Message</span>
          <span x-show="tab === 'note'" style="display: none;" class="flex items-center gap-x-1.5 text-amber-600 dark:text-amber-500"><i data-lucide="lock" class="size-3.5"></i> Internal Note</span>
          <i data-lucide="chevron-down" class="shrink-0 size-3 text-gray-500"></i>
        </button>
      
    
  </div>

  <!-- Dropdown Menu -->
  <div x-show="open" 
       x-ref="menu"
       x-cloak
       @click.outside="open = false"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed z-[9999] w-auto bg-white dark:bg-neutral-900 border border-transparent rounded-xl shadow-xl p-1"
       x-bind:style="{ top: top + 'px', left: left === 'auto' ? 'auto' : left + 'px', right: right === 'auto' ? 'auto' : right + 'px' }"
       role="menu"
       aria-orientation="vertical">
    
      
        
      
  </div>
</div>
