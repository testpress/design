<!-- KPI cards (Preline "KPI card with icon and link"): neutral, one number each, one footer action. Colour only for the backlog trend. -->









<!-- Loading -->
<div x-show="loading" x-cloak class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4" aria-busy="true" aria-label="Loading workload">
  <template x-for="i in 4" :key="i">
    <div class="flex flex-col bg-card border border-card-line shadow-2xs rounded-xl p-5 gap-3 animate-pulse">
      <div class="h-3 w-24 rounded-full bg-surface"></div>
      <div class="h-6 w-16 rounded-full bg-surface"></div>
      <div class="h-3 w-40 rounded-full bg-surface"></div>
    </div>
  </template>
</div>

<section x-show="ready" aria-label="Workload summary" class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4" :class="stale && 'opacity-70'">

  <!-- Unassigned -->
  <div class="flex flex-col bg-card border border-card-line shadow-2xs rounded-xl">
    <div class="p-4 md:p-5 flex justify-between gap-x-3">
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground-1">Unassigned</p>
        <h3 class="mt-1 text-xl sm:text-2xl font-medium text-foreground tabular-nums" x-text="num(unassignedCases.length)"></h3>
        <p class="mt-1 text-sm text-muted-foreground-1" x-show="unassignedCases.length"
           x-text="[highCount(unassignedCases) && `${num(highCount(unassignedCases))} high priority`, unassignedCases.length && `oldest ${waiting(Math.min(...unassignedCases.map(c => c.createdAt)))}`].filter(Boolean).join(' · ')"></p>
        <p class="mt-1 text-sm text-muted-foreground-1" x-show="!unassignedCases.length">Every case has a reviewer.</p>
      </div>
      <span class="shrink-0 flex justify-center items-center size-10 rounded-full bg-surface text-muted-foreground-1"><svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 13.29-6"/><circle cx="10" cy="8" r="5"/><path d="M19 16v6"/><path d="M22 19h-6"/></svg></span>
    </div>
    <button type="button" x-show="unassignedCases.length && eligible.length" @click="openMove('unassigned', highCount(unassignedCases) ? 'high' : 'all')"
            class="mt-auto py-3 px-4 md:px-5 w-full inline-flex justify-between items-center text-sm border-t border-card-footer hover:bg-layer-hover focus:outline-hidden focus-visible:bg-layer-hover rounded-b-xl font-medium text-primary">Assign cases <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <!-- High-priority work (or, when nobody has review access, that) -->
  <div class="flex flex-col bg-card border border-card-line shadow-2xs rounded-xl">
    <template x-if="!eligible.length && openCases.length">
      <div class="flex flex-col grow">
        <div class="p-4 md:p-5 flex justify-between gap-x-3">
          <div>
            <p class="text-xs uppercase tracking-wide text-muted-foreground-1">No one can review</p>
            <h3 class="mt-1 text-xl sm:text-2xl font-medium text-foreground tabular-nums" x-text="num(openCases.length)"></h3>
            <p class="mt-1 text-sm text-muted-foreground-1">Open cases are waiting, but no reviewer has review access.</p>
          </div>
          <span class="shrink-0 flex justify-center items-center size-10 rounded-full bg-surface text-muted-foreground-1"><svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5"/><path d="m22 8-5 5"/></svg></span>
        </div>
        <a href="#" class="mt-auto py-3 px-4 md:px-5 w-full inline-flex justify-between items-center text-sm border-t border-card-footer hover:bg-layer-hover focus:outline-hidden focus-visible:bg-layer-hover rounded-b-xl font-medium text-primary">Manage reviewer access <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></a>
      </div>
    </template>
    <template x-if="eligible.length || !openCases.length">
      <div class="flex flex-col grow">
        <div class="p-4 md:p-5 flex justify-between gap-x-3">
          <div>
            <p class="text-xs uppercase tracking-wide text-muted-foreground-1">High priority open</p>
            <h3 class="mt-1 text-xl sm:text-2xl font-medium text-foreground tabular-nums" x-text="num(highCases.length)"></h3>
            <p class="mt-1 text-sm text-muted-foreground-1" x-show="highCases.length"
               x-text="[[highCases.filter(c => c.priority === 0).length, 'critical'], [highCases.filter(c => c.state === 'queued').length, 'unassigned']].filter(p => p[0]).map(p => `${num(p[0])} ${p[1]}`).join(' · ') || 'All with reviewers'"></p>
            <p class="mt-1 text-sm text-muted-foreground-1" x-show="!highCases.length">No Critical or High cases are open.</p>
          </div>
          <span class="shrink-0 flex justify-center items-center size-10 rounded-full bg-surface text-muted-foreground-1"><svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/></svg></span>
        </div>
        <a x-show="highCases.length" :href="casesHref({ high: true })" class="mt-auto py-3 px-4 md:px-5 w-full inline-flex justify-between items-center text-sm border-t border-card-footer hover:bg-layer-hover focus:outline-hidden focus-visible:bg-layer-hover rounded-b-xl text-muted-foreground-2">View high priority <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></a>
      </div>
    </template>
  </div>

  <!-- Waiting over a week -->
  <div class="flex flex-col bg-card border border-card-line shadow-2xs rounded-xl">
    <div class="p-4 md:p-5 flex justify-between gap-x-3">
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground-1">Waiting over 7 days</p>
        <h3 class="mt-1 text-xl sm:text-2xl font-medium text-foreground tabular-nums" x-text="num(longWaiting.length)"></h3>
        <p class="mt-1 text-sm text-muted-foreground-1" x-show="longWaiting.length"
           x-text="[[longWaiting.filter(c => c.state === 'queued').length, 'unassigned'], [longWaiting.filter(c => c.state === 'assigned').length, 'with reviewers']].filter(p => p[0]).map(p => `${num(p[0])} ${p[1]}`).join(' · ')"></p>
        <p class="mt-1 text-sm text-muted-foreground-1" x-show="!longWaiting.length">Every open case is under a week old.</p>
      </div>
      <span class="shrink-0 flex justify-center items-center size-10 rounded-full bg-surface text-muted-foreground-1"><svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
    </div>
    <a x-show="longWaiting.length" :href="casesHref({ sort: 'oldest' })" class="mt-auto py-3 px-4 md:px-5 w-full inline-flex justify-between items-center text-sm border-t border-card-footer hover:bg-layer-hover focus:outline-hidden focus-visible:bg-layer-hover rounded-b-xl text-muted-foreground-2">View oldest first <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></a>
  </div>

  <!-- Today: is the backlog growing? -->
  <div class="flex flex-col bg-card border border-card-line shadow-2xs rounded-xl">
    <div class="p-4 md:p-5 flex justify-between gap-x-3">
      <div>
        <p class="text-xs uppercase tracking-wide text-muted-foreground-1">Decided today</p>
        <div class="mt-1 flex items-center gap-x-2">
          <h3 class="text-xl sm:text-2xl font-medium text-foreground tabular-nums" x-text="num(today.decided)"></h3>
          <!-- Trend: backlog grew (red) or shrank (green) since midnight -->
          <span x-show="today.change" class="inline-flex items-center gap-x-1 text-sm"
                :class="today.change > 0 ? 'text-red-600 dark:text-red-500' : 'text-green-600 dark:text-green-500'"
                @mouseenter="showTip($event, 'Since midnight', [['New cases', today.created], ['Decided', today.decided]], today.change > 0 ? 'More came in than were decided' : 'More were decided than came in')" @mouseleave="hideTip()">
            <svg x-show="today.change > 0" class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            <svg x-show="today.change < 0" class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
            <span x-text="`backlog ${today.change > 0 ? '+' : '−'}${num(Math.abs(today.change))}`"></span>
          </span>
        </div>
        <p class="mt-1 text-sm text-muted-foreground-1" x-text="`${num(today.created)} new since midnight`"></p>
      </div>
      <span class="shrink-0 flex justify-center items-center size-10 rounded-full bg-surface text-muted-foreground-1"><svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
    </div>
    <a :href="casesHref({ view: 'closed', sort: 'newest' })" class="mt-auto py-3 px-4 md:px-5 w-full inline-flex justify-between items-center text-sm border-t border-card-footer hover:bg-layer-hover focus:outline-hidden focus-visible:bg-layer-hover rounded-b-xl text-muted-foreground-2">View today's decisions <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></a>
  </div>
</section>
