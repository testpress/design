<!-- Prototype only: switch page condition. Not part of the product UI. -->
<div class="fixed bottom-4 inset-x-0 lg:ps-65 z-[60] flex justify-center px-4 pointer-events-none">
  <div class="pointer-events-auto flex flex-wrap items-center justify-center gap-x-3 gap-y-2 py-1.5 px-2 rounded-xl bg-layer border border-layer-line shadow-lg">
    <span class="ps-1.5 text-xs font-medium text-muted-foreground-1">Prototype</span>
    <div class="flex flex-wrap items-center gap-0.5" role="radiogroup" aria-label="Page condition">
      <template x-for="s in [['normal', 'Data'], ['large', 'Large team'], ['balanced', 'All owned'], ['unassigned_only', 'All unassigned'], ['no_reviewers', 'No reviewers'], ['none', 'No open work'], ['loading', 'Loading'], ['stale', 'Stale'], ['error', 'Error']]" :key="s[0]">
        <button type="button" @click="simulate = s[0]" role="radio" :aria-checked="simulate === s[0]"
                :class="simulate === s[0] ? 'bg-primary-100 text-primary-800 dark:bg-primary-500/20 dark:text-primary-300' : 'text-muted-foreground-1 hover:text-foreground hover:bg-muted-hover'"
                class="py-1 px-2.5 rounded-lg text-[13px] font-medium focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
                x-text="s[1]"></button>
      </template>
    </div>
    <span class="w-px h-4 bg-layer-line" aria-hidden="true"></span>
    <button type="button" @click="viewAsReviewer()" title="Reviewers can't see this view; you'll land on Review Cases"
            class="py-1 px-2.5 rounded-lg text-[13px] font-medium text-muted-foreground-1 hover:text-foreground hover:bg-muted-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
      View as Reviewer
    </button>
  </div>
</div>
