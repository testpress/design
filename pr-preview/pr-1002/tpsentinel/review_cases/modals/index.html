





<div x-data="{ 
       open: false,
       toggle() { this.open = !this.open; },
       init() {
         this.$watch('open', value => {
           if (value) {
             document.body.classList.add('overflow-hidden');
             this.$nextTick(() => {
               const autoFocusEl = this.$el.querySelector('[autofocus]');
               if (autoFocusEl) {
                 setTimeout(() => {
                   autoFocusEl.focus();
                   if (typeof autoFocusEl.setSelectionRange === 'function') {
                     const len = autoFocusEl.value.length;
                     autoFocusEl.setSelectionRange(len, len);
                   }
                 }, 50);
               } else if (this.$refs.closeBtn) {
                 this.$refs.closeBtn.focus();
               }
               if (window.lucide) { window.lucide.createIcons(); }
             });
           } else {
             document.body.classList.remove('overflow-hidden');
           }
         });
       }
     }"
     @open-modal-rc-reassign.window="open = true"
     @close-modal-rc-reassign.window="open = false"
     class="contents">

  
  

  
  <div x-show="open"
       x-cloak
       class="fixed inset-0 z-[10000] overflow-y-auto"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-title-rc-reassign">
    
    
    <div x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="open = false"
         class="fixed inset-0 bg-neutral-900/50 dark:bg-neutral-900/80 backdrop-blur-sm"></div>

    
    <div class="flex min-h-screen items-center justify-center p-4 text-center sm:p-0">
      
      
      <div x-show="open"
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           @keydown.escape.window="open = false"
           class="relative overflow-hidden rounded-xl bg-layer text-start shadow-xl sm:my-8 w-full sm:max-w-md border border-layer-line flex flex-col max-h-[90vh]">
        
        
        <div class="py-2.5 px-4 flex justify-between items-center border-b border-layer-line">
          <div>
            <h2 id="modal-title-rc-reassign" class="font-semibold text-foreground text-sm sm:text-base">
              Reassign cases
            </h2>
            
          </div>
          <button x-ref="closeBtn" type="button" @click="open = false" class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-muted text-foreground hover:bg-muted-hover disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-muted-focus" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        
        <div class="overflow-y-auto p-5 flex-1 min-h-0 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb text-sm text-muted-foreground-2">
          
  <p x-show="pending?.single">
    <span class="font-medium text-foreground" x-text="pending?.single?.name"></span>
    is assigned to <span x-text="reviewerFullName(pending?.single?.reviewer)"></span>.
    Reassign the case to <span class="font-medium text-foreground" x-text="pending?.to"></span>?
  </p>
  <p x-show="!pending?.single">
    Assign <span class="font-medium text-foreground" x-text="pending?.count"></span> cases to
    <span class="font-medium text-foreground" x-text="pending?.to"></span>?
    <span x-text="pending?.moving === pending?.count ? 'All of them are' : `${pending?.moving} of them are`"></span>
    currently assigned to another reviewer.
  </p>

        </div>

        
        
          <div class="p-4 flex justify-end gap-x-2">
            
              

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-layer border border-layer-line text-layer-foreground shadow-2xs hover:bg-layer-hover focus:bg-layer-focus"   @click="open = false">
  

    
    

    Cancel

    

  
    </button>
  


            
            
              

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary border border-transparent text-primary-foreground hover:bg-primary-hover focus:bg-primary-focus"   @click="$dispatch('modal-confirmed-rc-reassign'); open = false" >
  

    
    

    Reassign

    

  
    </button>
  


            
          </div>
        

      </div>
    </div>
  </div>
</div>
