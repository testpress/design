<style>
  /* Notes editor prototype. Structural + ProseMirror styles live here; colours come from the
     Testpress primary scale (--color-primary-*) set in layout/base.html. */
  /* On :root, not .notes-app: the slash menu is appended to <body> and must see these too. */
  :root { --p600: rgb(var(--color-primary-600)); --p700: rgb(var(--color-primary-700)); --p50: rgb(var(--color-primary-50)); --p100: rgb(var(--color-primary-100)); }
  .notes-app {
    display: flex; height: calc(100dvh - 3.75rem); background: #fff; position: relative; color: #111827; }
  .dark .notes-app { background: #171717; color: #e5e7eb; }
  .notes-app [hidden], .notes-app[hidden] { display: none !important; }

  /* ---- list pane ---- */
  .list-pane { width: 21rem; flex: none; display: flex; flex-direction: column; border-inline-end: 1px solid #e5e7eb; background: #fafafa; min-height: 0; }
  .dark .list-pane { background: #1c1c1c; border-color: #2e2e2e; }
  .list-pane__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px 16px; }
  .btn-new { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; background: var(--p600); color: #fff; font-size: 14px; font-weight: 500; }
  .btn-new:hover { background: var(--p700); }
  .btn-new:focus-visible, .note-row:focus-visible, .tray-chip:focus-visible { outline: 2px solid var(--p600); outline-offset: 2px; }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
  .search:focus-within { border-color: var(--p600); box-shadow: 0 0 0 3px rgb(var(--color-primary-500) / .18); }
  .search__input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font-size: 14px; box-shadow: none !important; }
  .search__input::-webkit-search-cancel-button { display: none; }
  .search__kbd { font: 500 11px/1 system-ui; color: #9ca3af; border: 1px solid #e5e7eb; border-radius: 4px; padding: 2px 5px; }
  .list-pane__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
  .list-pane__foot { display: flex; align-items: center; gap: 6px; padding: 10px 16px; font-size: 12px; color: #9ca3af; border-top: 1px solid #eee; }
  .list-group { padding: 14px 10px 4px; font-size: 12px; font-weight: 500; color: #9ca3af; }
  .note-row { display: block; width: 100%; text-align: start; padding: 9px 10px; border-radius: 8px; margin-bottom: 1px; }
  .note-row:hover { background: #f1f3f5; }
  .note-row.is-active { background: var(--p50); }
  .dark .note-row:hover { background: #262626; } .dark .note-row.is-active { background: rgb(var(--color-primary-500) / .15); }
  .note-row__top { display: flex; align-items: baseline; gap: 8px; }
  .note-row__title { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-row__title.is-derived { font-weight: 500; }
  .note-row__time { font-size: 12px; color: #9ca3af; flex: none; }
  .note-row__sub { display: block; font-size: 13px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .note-row mark { background: #fde68a; color: inherit; border-radius: 2px; }
  .row-warn { color: #d97706; display: inline-flex; }
  .list-empty { padding: 28px 16px; font-size: 14px; text-align: center; }

  /* ---- editor pane ---- */
  .editor-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .editor-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .editor-empty { flex: 1; display: grid; place-items: center; }
  .editor-top { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; flex: none; }
  .editor-top__back, .editor-top__new { display: none; }
  .save-status { display: inline-flex; align-items: center; font-size: 13px; color: #9ca3af; min-height: 20px; }
  .status-dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; margin-inline-end: 6px; }
  .save-status[data-state="saving"] .status-dot, .save-status[data-state="still"] .status-dot { animation: pulse 1s ease-in-out infinite; }
  .save-status[data-state="error"] { color: #b45309; font-weight: 500; }
  .save-status[data-state="idle"] .status-dot { background: var(--p600); }
  @keyframes pulse { 50% { opacity: .25 } }
  .editor-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 35vh; }
  .editor-column { max-width: 46rem; margin: 0 auto; padding: 24px 40px 0; }
  .save-strip { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #fffbeb; color: #92400e; font-size: 13px; border-top: 1px solid #fde68a; }
  .save-strip__retry { margin-inline-start: auto; font-weight: 600; text-decoration: underline; }
  .toast { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; font-size: 13px; padding: 10px 14px; border-radius: 8px; max-width: 90%; z-index: 30; }

  /* ---- ProseMirror content ---- */
  .note-prose { outline: none; font-size: 17px; line-height: 1.65; color: #1f2937; caret-color: var(--p600); word-break: break-word; }
  .dark .note-prose { color: #e5e7eb; }
  .note-prose > * + * { margin-top: .6em; }
  .note-prose h1[data-title] { font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin: 0 0 .25em; color: #111827; }
  .dark .note-prose h1[data-title] { color: #fff; }
  .note-prose h1:not([data-title]) { font-size: 27px; line-height: 1.25; font-weight: 700; margin-top: 1.2em; letter-spacing: -.015em; }
  .note-prose h2 { font-size: 22px; line-height: 1.3; font-weight: 700; margin-top: 1.3em; letter-spacing: -.01em; }
  .note-prose h3 { font-size: 18px; line-height: 1.35; font-weight: 600; margin-top: 1.1em; }
  .note-prose p.is-editor-empty:first-child::before, .note-prose .is-empty::before { content: attr(data-placeholder); float: left; height: 0; pointer-events: none; color: #c0c5cc; }
  .note-prose ul { list-style: disc; padding-inline-start: 1.4em; }
  .note-prose ol { list-style: decimal; padding-inline-start: 1.5em; }
  .note-prose li > p { margin: 0; }
  .note-prose li + li { margin-top: .2em; }
  .note-prose li::marker { color: #9ca3af; }
  .note-prose ul[data-type="taskList"] { list-style: none; padding: 0; }
  .note-prose ul[data-type="taskList"] li { display: flex; align-items: flex-start; gap: 10px; }
  /* label is exactly one text line high, so the box centres on the first line and the row adds no extra height */
  .note-prose ul[data-type="taskList"] li > label { flex: none; display: flex; align-items: center; height: 1.65em; margin: 0; user-select: none; }
  .note-prose ul[data-type="taskList"] li > label input { width: 18px; height: 18px; border-radius: 5px; cursor: pointer; margin: 0; color: var(--p600); flex: none; }
  .note-prose ul[data-type="taskList"] li > div { flex: 1; min-width: 0; }
  .note-prose ul[data-type="taskList"] li[data-checked="true"] > div { color: #9ca3af; text-decoration: line-through; }
  .note-prose ul[data-type="taskList"] ul[data-type="taskList"] { margin-top: .2em; }
  .note-prose blockquote { border-inline-start: 3px solid var(--p600); padding-inline-start: 16px; color: #4b5563; }
  .note-prose hr { border: 0; border-top: 1px solid #d1d5db; margin: 1.4em 0; }
  .note-prose hr.ProseMirror-selectednode { border-top-color: var(--p600); }
  .note-prose code { font: 500 .88em ui-monospace, SFMono-Regular, Menlo, monospace; background: #f3f4f6; padding: .1em .35em; border-radius: 5px; }
  .dark .note-prose code { background: #2a2a2a; }
  .note-prose pre { background: #0f1729; color: #e5e7eb; border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.55; }
  .note-prose pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  .note-prose mark { background: #fef3c7; color: inherit; padding: .05em .1em; border-radius: 3px; }
  .note-prose a { color: var(--p700); text-decoration: underline; text-underline-offset: 2px; cursor: text; }
  .note-prose ::selection { background: rgb(var(--color-primary-500) / .25); }
  .note-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: #9ca3af; margin: 0 0 1.4em; font-family: inherit; line-height: 1.4; user-select: none; }
  .note-meta__folder { display: inline-flex; align-items: center; gap: 5px; }

  /* ---- slash menu ---- */
  .slash-menu { position: fixed; z-index: 90; width: 15rem; max-height: min(18rem, 50vh); overflow-y: auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 10px 30px rgba(17,24,39,.14); padding: 4px; }
  .dark .slash-menu { background: #262626; border-color: #3a3a3a; }
  .slash-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 6px; font-size: 14px; text-align: start; color: #374151; }
  .dark .slash-item { color: #e5e7eb; }
  .slash-item.is-active { background: var(--p100); color: #111827; box-shadow: inset 3px 0 0 var(--p600); }
  .slash-item.is-active .slash-item__hint { color: var(--p700); }
  .dark .slash-item.is-active { background: rgb(var(--color-primary-500) / .3); color: #fff; }
  .slash-item__label { flex: 1; }
  .slash-item__hint { font: 500 11px/1 ui-monospace, Menlo, monospace; color: #9ca3af; }
  .slash-empty { padding: 10px; font-size: 13px; color: #6b7280; }

  /* ---- desktop bubble ---- */
  .bubble { position: fixed; z-index: 80; padding: 3px; background: #111827; color: #e5e7eb; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.28); width: max-content; }
  .bm-bar { display: flex; align-items: center; gap: 2px; }
  .bm-btn.is-open { background: rgba(255,255,255,.16); color: #fff; }
  .bm-pop { position: absolute; top: calc(100% + 6px); left: 0; background: #111827; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.28); padding: 3px; }
  .bm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 32px; height: 32px; padding: 0 6px; border-radius: 6px; color: #d1d5db; font-size: 13px; font-weight: 500; }
  .bm-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .bm-btn.is-on { background: rgba(255,255,255,.16); color: #fff; }
  .bm-btn--text { padding: 0 8px; }
  .bm-sep { width: 1px; height: 18px; background: rgba(255,255,255,.18); margin: 0 3px; }
  .bm-menu { display: flex; flex-direction: column; min-width: 11.5rem; padding: 2px; }
  .bm-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 14px; color: #e5e7eb; text-align: start; }
  .bm-item:hover { background: rgba(255,255,255,.1); }
  .bm-item.is-on { color: #fff; font-weight: 600; }
  .bm-link { display: flex; align-items: center; gap: 8px; padding: 2px 4px 2px 8px; }
  .bm-input { width: 15rem; height: 30px; border: 0; border-radius: 6px; background: rgba(255,255,255,.1); color: #fff; font-size: 14px; padding: 0 8px; outline: none; box-shadow: none !important; }
  .bm-input:focus { background: rgba(255,255,255,.16); }
  .bm-apply { height: 30px; padding: 0 10px; border-radius: 6px; background: var(--p600); color: #fff; font-size: 13px; font-weight: 600; }

  .bm-btn:focus-visible, .bm-item:focus-visible, .bm-apply:focus-visible { outline: 2px solid #fff; outline-offset: -2px; background: rgba(255,255,255,.16); }
  .editor-top__help { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; color: #9ca3af; font-size: 12px; }
  .editor-top__help:hover { background: #f3f4f6; color: #374151; }
  .editor-top__help:focus-visible { outline: 2px solid var(--p600); }
  .editor-top__help kbd { font: 500 11px/1 system-ui; border: 1px solid #e5e7eb; border-radius: 4px; padding: 2px 5px; }
  .help__panel { background: #fff; border-radius: 14px; padding: 18px 20px 22px; width: min(44rem, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; }
  .dark .help__panel { background: #262626; }
  .help__close { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: #6b7280; }
  .help__close:hover, .help__close:focus-visible { background: #f3f4f6; outline: none; box-shadow: 0 0 0 2px var(--p600); }
  .help__body { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 18px 28px; margin-top: 14px; }
  .help__body h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #9ca3af; margin-bottom: 6px; }
  .help__body dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
  .help__body dd { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .help__body kbd { font: 500 12px/1 ui-monospace, Menlo, monospace; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 5px; padding: 3px 6px; white-space: nowrap; }

  /* ---- sheet + prototype tools ---- */
  .sheet { position: absolute; inset: 0; z-index: 100; background: rgba(17,24,39,.45); display: grid; place-items: center; }
  .sheet__panel { background: #fff; border-radius: 14px; padding: 20px; width: min(26rem, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; }
  .dark .sheet__panel { background: #262626; }
  .sheet__actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .sheet__primary, .sheet__secondary { height: 44px; border-radius: 10px; font-size: 15px; font-weight: 600; }
  .sheet__primary { background: var(--p600); color: #fff; }
  .sheet__secondary { background: #f3f4f6; color: #111827; }
  .proto { position: absolute; right: 12px; bottom: 12px; z-index: 60; }
  .proto__btn { width: 34px; height: 34px; border-radius: 99px; background: #fff; border: 1px solid #e5e7eb; display: grid; place-items: center; color: #6b7280; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .proto__panel { position: absolute; right: 0; bottom: 42px; width: 16rem; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 10px 30px rgba(17,24,39,.14); padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .proto__row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .proto__link { text-align: start; font-size: 13px; color: var(--p700); text-decoration: underline; }

  /* ---- mobile: list screen -> full-screen editor, formatting bar on the keyboard ---- */
  .mbar { display: none; }
  @media (max-width: 1023px) {
    .notes-app { position: fixed; inset: 0 0 auto 0; z-index: 70; height: var(--vvh, 100dvh); transform: translateY(var(--vvtop, 0px)); }
    .list-pane { width: 100%; border: 0; background: #fff; }
    .dark .list-pane { background: #171717; }
    .notes-app[data-view="list"] .editor-pane { display: none; }
    .notes-app[data-view="editor"] .list-pane { display: none; }
    .list-pane__head { padding-top: calc(14px + env(safe-area-inset-top)); }
    .search__kbd, .editor-top__help { display: none; }
    .note-row { padding: 12px 10px; }
    .editor-top { padding: 0 8px; padding-top: env(safe-area-inset-top); height: calc(48px + env(safe-area-inset-top)); }
    .editor-top__back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px; color: var(--p700); font-size: 16px; font-weight: 500; }
    .editor-top__new { display: grid; place-items: center; width: 44px; height: 44px; color: var(--p700); }
    .editor-column { padding: 8px 20px 0; }
    .note-prose h1[data-title] { font-size: 28px; }
    .editor-scroll { padding-bottom: 50vh; scroll-padding-bottom: 130px; }
    .btn-new { height: 40px; }
    .proto { bottom: 76px; }
    .notes-app.kb-open .proto { display: none; }
    .bubble { display: none !important; }
    .mbar { display: block; position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; background: #f9fafb; border-top: 1px solid #e5e7eb; padding-bottom: env(safe-area-inset-bottom); }
    .mbar[hidden] { display: none; }
    .dark .mbar { background: #1f1f1f; border-color: #333; }
    .mbar__row { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 4px; }
    .mb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 44px; height: 44px; border-radius: 8px; color: #374151; }
    .dark .mb-btn { color: #e5e7eb; }
    .mb-btn:disabled { opacity: .35; }
    .mb-btn.is-on { background: var(--p100); color: var(--p700); }
    .mb-btn--text { padding: 0 10px; font-weight: 600; font-size: 15px; }
    .mb-link { display: flex; align-items: center; gap: 6px; width: 100%; padding: 0 8px; }
    .mb-link .bm-input { flex: 1; width: auto; background: #fff; color: #111827; border: 1px solid #d1d5db; height: 34px; font-size: 16px; }
    .mbar__tray { padding: 8px 12px 10px; border-bottom: 1px solid #e5e7eb; }
    .tray-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; margin: 2px 0 6px; }
    .tray-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .tray-chip { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 36px; padding: 0 12px; border-radius: 99px; background: #fff; border: 1px solid #e5e7eb; font-size: 14px; color: #374151; }
    .tray-chip.is-on { background: var(--p100); border-color: var(--p600); color: var(--p700); }
    .mbar__pop { position: absolute; right: 8px; bottom: 52px; background: #111827; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.28); z-index: 5; }
    .mbar__pop[hidden] { display: none; }
    .slash-menu { width: min(18rem, calc(100vw - 16px)); }
  }
  @media (prefers-reduced-motion: reduce) { .save-status .status-dot { animation: none !important; } }
</style>
