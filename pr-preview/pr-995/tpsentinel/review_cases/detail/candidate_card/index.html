<!-- Candidate details: contact and admin details. Name and workspace are in the page header, so they aren't repeated. Read-only; IDs can be copied. -->
<section class="bg-card border border-card-line shadow-2xs rounded-xl p-4 sm:p-5" aria-labelledby="candidate-heading">
  <h2 id="candidate-heading" class="text-base font-semibold text-foreground">Candidate</h2>
  <dl class="mt-3 grid grid-cols-[5.5rem_minmax(0,1fr)] gap-x-3 gap-y-2 text-sm">
    <dt class="text-muted-foreground-1">Email</dt>
    <dd class="flex items-center gap-x-1.5 min-w-0">
      <span class="text-foreground truncate" :title="c.email" x-text="c.email"></span>
      <button type="button" @click="copy(c.email, 'email')" :aria-label="copied === 'email' ? 'Copied' : 'Copy email'"
              class="shrink-0 inline-flex items-center justify-center size-6 rounded-md text-muted-foreground-1 hover:text-foreground hover:bg-muted-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
        <svg x-show="copied !== 'email'" class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <svg x-show="copied === 'email'" x-cloak class="size-3.5 text-green-600 dark:text-green-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </dd>

    <dt class="text-muted-foreground-1">Phone</dt>
    <dd class="text-foreground tabular-nums truncate" x-text="d.profile.phone"></dd>

    <dt class="text-muted-foreground-1">Candidate ID</dt>
    <dd class="flex items-center gap-x-1.5 min-w-0">
      <span class="text-foreground tabular-nums truncate" x-text="c.identifier"></span>
      <button type="button" @click="copy(c.identifier, 'id')" :aria-label="copied === 'id' ? 'Copied' : 'Copy candidate ID'"
              class="shrink-0 inline-flex items-center justify-center size-6 rounded-md text-muted-foreground-1 hover:text-foreground hover:bg-muted-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
        <svg x-show="copied !== 'id'" class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <svg x-show="copied === 'id'" x-cloak class="size-3.5 text-green-600 dark:text-green-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </dd>

    <dt class="text-muted-foreground-1">Enrolled</dt>
    <dd class="text-foreground truncate" x-text="enrolledOn"></dd>
  </dl>
</section>
