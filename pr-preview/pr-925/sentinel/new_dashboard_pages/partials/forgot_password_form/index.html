      <!-- Forgot Password Form -->
      <form action="#" method="POST" class="space-y-6">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">Email address</label>
          <div class="mt-2">
            <input id="email" type="email" name="email" required autocomplete="email" class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
          </div>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" class="flex w-full justify-center py-2 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 dark:bg-primary-600 dark:hover:bg-primary-500 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-200 shadow-sm">Send reset link</button>
        </div>
      </form>
