<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 dark:bg-neutral-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password</title>
  <link rel="stylesheet" href="/pr-preview/pr-925/css/sentinel_dashboard.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full text-gray-900 dark:text-neutral-100 font-sans antialiased">
  
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8 bg-gray-50 dark:bg-neutral-900 transition-colors duration-200"
  x-data="{ 
    isDark: localStorage.getItem('hs_theme') === 'dark' || (!localStorage.getItem('hs_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
  }"
  x-init="
    if (isDark) document.documentElement.classList.add('dark');
    $watch('isDark', val => { 
      const theme = val ? 'dark' : 'light';
      localStorage.setItem('hs_theme', theme);
      if (val) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })
  ">
  
  <!-- Dark Mode Toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button x-show="!isDark" @click="isDark = true" type="button" class="flex items-center gap-x-1.5 text-sm text-gray-500 hover:text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 rounded-md p-1 transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <span class="sr-only">Dark mode</span>
    </button>
    <button x-show="isDark" x-cloak @click="isDark = false" type="button" class="flex items-center gap-x-1.5 text-sm text-neutral-400 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 rounded-md p-1 transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span class="sr-only">Light mode</span>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <img src="/pr-preview/pr-925/img/sentinel/icon.png" alt="TPSentinel Logo" class="mx-auto h-10 w-auto" />
    <h2 class="mt-6 text-center text-2xl leading-9 font-bold tracking-tight text-gray-900 dark:text-white">Set new password</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
    <div class="bg-white dark:bg-neutral-800 border border-gray-200/60 dark:border-neutral-700 px-6 py-12 shadow-md sm:rounded-lg sm:px-12 transition-colors duration-200">
      
  <p class="mb-6 text-center text-sm text-gray-600 dark:text-neutral-400">Your new password must be different from previously used passwords.</p>
  <!-- Set New Password Form -->
<form action="#" method="POST" class="space-y-6" x-data="passwordValidation()">
  <!-- New Password Input -->
  <div>
    <label for="new_password" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">New password</label>
    <div class="mt-2 relative rounded-md">
      <input id="new_password" :type="showPassword ? 'text' : 'password'" name="new_password" x-model="pwd" @focus="showHints = true" required autocomplete="new-password" class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
      <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-primary-600 dark:text-neutral-500 dark:hover:text-primary-500 focus:outline-none focus-visible:text-primary-600 rounded-md">
        <svg x-show="!showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg x-show="showPassword" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      </button>
    </div>
    <!-- Password Validation Script & Checklist Partial -->
<script>
  function passwordValidation() {
    return {
      oldPwd: '',
      pwd: '',
      confirmPwd: '',
      showPassword: false,
      showHints: false,
      get rules() {
        const p = String(this.pwd || '');
        return {
          minLength: p.length >= 8,
          lowercase: /[a-z]/.test(p),
          uppercase: /[A-Z]/.test(p),
          numbers: /[0-9]/.test(p),
          special: /[!@#$%^&*(),.?":{}|<>]/.test(p),
          match: p.length > 0 && p === this.confirmPwd,
          differentFromOld: p.length > 0 && this.oldPwd.length > 0 && p !== this.oldPwd
        };
      }
    };
  }
</script>

<div x-show="showHints" x-cloak x-collapse class="mt-2.5 py-2 px-1">
  <ul class="space-y-1.5 text-xs">
    <li :class="rules.minLength ? 'text-primary-600 dark:text-primary-400 font-medium' : 'text-gray-500 dark:text-neutral-400'" class="flex items-center gap-x-2 transition-colors duration-200">
      <svg x-show="rules.minLength" class="shrink-0 size-4 text-primary-600 dark:text-primary-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span x-show="!rules.minLength" class="shrink-0 size-3.5 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
      <span>At least 8 characters</span>
    </li>
    <li :class="rules.lowercase ? 'text-primary-600 dark:text-primary-400 font-medium' : 'text-gray-500 dark:text-neutral-400'" class="flex items-center gap-x-2 transition-colors duration-200">
      <svg x-show="rules.lowercase" class="shrink-0 size-4 text-primary-600 dark:text-primary-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span x-show="!rules.lowercase" class="shrink-0 size-3.5 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
      <span>At least one lowercase letter</span>
    </li>
    <li :class="rules.uppercase ? 'text-primary-600 dark:text-primary-400 font-medium' : 'text-gray-500 dark:text-neutral-400'" class="flex items-center gap-x-2 transition-colors duration-200">
      <svg x-show="rules.uppercase" class="shrink-0 size-4 text-primary-600 dark:text-primary-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span x-show="!rules.uppercase" class="shrink-0 size-3.5 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
      <span>At least one uppercase letter</span>
    </li>
    <li :class="rules.numbers ? 'text-primary-600 dark:text-primary-400 font-medium' : 'text-gray-500 dark:text-neutral-400'" class="flex items-center gap-x-2 transition-colors duration-200">
      <svg x-show="rules.numbers" class="shrink-0 size-4 text-primary-600 dark:text-primary-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span x-show="!rules.numbers" class="shrink-0 size-3.5 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
      <span>At least one number</span>
    </li>
    <li :class="rules.special ? 'text-primary-600 dark:text-primary-400 font-medium' : 'text-gray-500 dark:text-neutral-400'" class="flex items-center gap-x-2 transition-colors duration-200">
      <svg x-show="rules.special" class="shrink-0 size-4 text-primary-600 dark:text-primary-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span x-show="!rules.special" class="shrink-0 size-3.5 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
      <span>At least one special character</span>
    </li>
    
  </ul>
</div>

  </div>

  <!-- Confirm Password Input -->
  <div>
    <label for="confirm_password" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">Confirm password</label>
    <div class="mt-2 relative rounded-md">
      <input id="confirm_password" :type="showPassword ? 'text' : 'password'" name="confirm_password" x-model="confirmPwd" required autocomplete="new-password" class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
      <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-primary-600 dark:text-neutral-500 dark:hover:text-primary-500 focus:outline-none focus-visible:text-primary-600 rounded-md">
        <svg x-show="!showPassword" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg x-show="showPassword" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      </button>
    </div>
    <div x-show="pwd.length > 0 && confirmPwd.length >= pwd.length && !rules.match" x-cloak class="mt-1.5 text-xs text-red-500 font-medium flex items-center gap-x-1">
      <svg class="size-3.5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Passwords do not match</span>
    </div>
  </div>

  <!-- Submit Button -->
  <div>
    <button type="submit" class="flex w-full justify-center py-2 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 dark:bg-primary-600 dark:hover:bg-primary-500 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-200 shadow-sm">Reset password</button>
  </div>
</form>


    </div>
    
<p class="mt-10 text-center text-sm text-gray-500 dark:text-neutral-400">
  Remember your password?
  <a href="/pr-preview/pr-925/sentinel/new_dashboard_pages/login/" class="text-sm leading-6 font-semibold text-primary-600 hover:text-primary-500 dark:text-primary-400 dark:hover:text-primary-300 transition-colors duration-200">Sign in</a>
</p>

  </div>
</div>


  <!-- Preline UI JS -->
  <script src="/pr-preview/pr-925/src/sentinel/node_modules/preline/dist/preline.js"></script>
</body>
</html>
