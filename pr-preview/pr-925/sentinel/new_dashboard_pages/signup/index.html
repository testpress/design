<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 dark:bg-neutral-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="/pr-preview/pr-925/css/sentinel_dashboard.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full text-gray-900 dark:text-neutral-100 font-sans antialiased">
  
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8 bg-gray-50 dark:bg-neutral-900 transition-colors duration-200"
  x-data="{ 
    isDark: localStorage.getItem('hs_theme') === 'dark' || (!localStorage.getItem('hs_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
  }"
  x-init="
    if (isDark) document.documentElement.classList.add('dark');
    $watch('isDark', val => { 
      const theme = val ? 'dark' : 'light';
      localStorage.setItem('hs_theme', theme);
      if (val) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })
  ">
  
  <!-- Dark Mode Toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button x-show="!isDark" @click="isDark = true" type="button" class="flex items-center gap-x-1.5 text-sm text-gray-500 hover:text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 rounded-md p-1 transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <span class="sr-only">Dark mode</span>
    </button>
    <button x-show="isDark" x-cloak @click="isDark = false" type="button" class="flex items-center gap-x-1.5 text-sm text-neutral-400 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 rounded-md p-1 transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span class="sr-only">Light mode</span>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <img src="/pr-preview/pr-925/img/sentinel/icon.png" alt="TPSentinel Logo" class="mx-auto h-10 w-auto" />
    <h2 class="mt-6 text-center text-2xl leading-9 font-bold tracking-tight text-gray-900 dark:text-white">Create your account</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
    <div class="bg-white dark:bg-neutral-800 border border-gray-200/60 dark:border-neutral-700 px-6 py-12 shadow-md sm:rounded-lg sm:px-12 transition-colors duration-200">
      
    <!-- Sign Up Form -->
  <form action="#" method="POST" class="space-y-6">
    <div class="grid grid-cols-1 gap-x-6 gap-y-6 sm:grid-cols-2">
      <!-- Full Name -->
      <div class="sm:col-span-2">
        <label for="full_name" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Full name</label>
        <div class="mt-2">
          <input id="full_name" name="full_name" type="text" required autocomplete="name"
            class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
        </div>
      </div>

      <!-- Business Email -->
      <div class="sm:col-span-2" x-data="{ showEmailHint: false }">
        <label for="email" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Business Email</label>
        <div class="mt-2">
          <input id="email" name="email" type="email" required autocomplete="email" @focus="showEmailHint = true" @blur="showEmailHint = false"
            class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
        </div>
        <p x-show="showEmailHint" x-cloak class="mt-1.5 text-xs text-gray-500 dark:text-neutral-400">We'll use this for account access and updates</p>
      </div>

      <!-- Organization -->
      <div class="sm:col-span-2">
        <label for="organization_name" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Organization</label>
        <div class="mt-2">
          <input id="organization_name" name="organization_name" type="text" required autocomplete="organization"
            class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
        </div>
      </div>

      <!-- Phone Number Field -->
      <div class="sm:col-span-2">
        <label for="phone" class="block text-sm font-medium leading-6 text-gray-900 dark:text-neutral-200">Phone number</label>
        <div class="mt-2 flex rounded-md border border-gray-300 dark:border-neutral-700 focus-within:border-primary-600 focus-within:ring-1 focus-within:ring-primary-600 dark:focus-within:border-primary-500 dark:focus-within:ring-primary-500 transition-colors duration-200 bg-white dark:bg-neutral-900">
          <!-- Country Code Dropdown -->

            <select id="country-code" name="country_code" data-hs-select='{
              "hasSearch": true,
              "searchPlaceholder": "Search country...",
              "searchClasses": "block w-full text-xs bg-transparent border-gray-200 dark:border-neutral-700 rounded-lg text-gray-800 dark:text-neutral-200 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:border-primary-600 focus:ring-1 focus:ring-primary-600 dark:focus:border-primary-500 dark:focus:ring-primary-500 py-1.5 px-2.5",
              "searchWrapperClasses": "bg-white dark:bg-neutral-900 p-2 -mx-1 sticky top-0",
              "placeholder": "Code",
              "toggleTag": "<button type=\"button\" aria-expanded=\"false\"><span class=\"me-1.5\" data-icon></span><span class=\"text-gray-700 dark:text-neutral-200 text-sm\" data-title></span></button>",
              "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-1.5 ps-3 pe-8 flex items-center text-nowrap w-full cursor-pointer bg-white dark:bg-neutral-900 border-r border-gray-300 dark:border-neutral-700 rounded-l-md text-start text-sm text-gray-700 dark:text-neutral-200 hover:bg-gray-50 dark:hover:bg-neutral-800 focus:outline-none",
              "dropdownClasses": "mt-2 max-h-72 pb-1 ps-1 pe-1.5 space-y-0.5 z-20 w-72 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-lg shadow-xl overflow-hidden overflow-y-auto [&::-webkit-scrollbar]:w-1 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-600",
              "optionClasses": "hs-selected:bg-gray-100 dark:hs-selected:bg-neutral-800 py-1.5 px-2.5 w-full text-sm text-gray-800 dark:text-neutral-300 cursor-pointer hover:bg-gray-100 dark:hover:bg-neutral-800 rounded-lg focus:outline-none focus:bg-gray-100 dark:focus:bg-neutral-800",

<script>
  function passwordValidation() {
    return {
      oldPwd: '',
      pwd: '',
      confirmPwd: '',
      showPassword: false,
      showHints: false,
      get rules() {
        const p = String(this.pwd || '');
        return {
          minLength: p.length >= 8,
          lowercase: /[a-z]/.test(p),
          uppercase: /[A-Z]/.test(p),
          numbers: /[0-9]/.test(p),
          special: /[!@#$%^&*(),.?":{}|<>]/.test(p),
          match: p.length > 0 && p === this.confirmPwd,
          differentFromOld: p.length > 0 && this.oldPwd.length > 0 && p !== this.oldPwd
        };
      }
    };
  }
</script>
