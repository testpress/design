<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50 dark:bg-neutral-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/pr-preview/pr-925/css/sentinel_dashboard.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full text-gray-900 dark:text-neutral-100 font-sans antialiased">
  
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8 bg-gray-50 dark:bg-neutral-900 transition-colors duration-200"
  x-data="{ 
    isDark: localStorage.getItem('hs_theme') === 'dark' || (!localStorage.getItem('hs_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
  }"
  x-init="
    if (isDark) document.documentElement.classList.add('dark');
    $watch('isDark', val => { 
      const theme = val ? 'dark' : 'light';
      localStorage.setItem('hs_theme', theme);
      if (val) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })
  ">
  
  <!-- Dark Mode Toggle -->
  <div class="fixed top-4 right-4 z-50">
    <button x-show="!isDark" @click="isDark = true" type="button" class="flex items-center gap-x-1.5 text-sm text-gray-500 hover:text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-600 rounded-md p-1 transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <span class="sr-only">Dark mode</span>
    </button>
    <button x-show="isDark" x-cloak @click="isDark = false" type="button" class="flex items-center gap-x-1.5 text-sm text-neutral-400 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 rounded-md p-1 transition-colors">
      <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <span class="sr-only">Light mode</span>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <img src="/pr-preview/pr-925/img/sentinel/icon.png" alt="TPSentinel Logo" class="mx-auto h-10 w-auto" />
    <h2 class="mt-6 text-center text-2xl leading-9 font-bold tracking-tight text-gray-900 dark:text-white">Sign in to your account</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
    <div class="bg-white dark:bg-neutral-800 border border-gray-200/60 dark:border-neutral-700 px-6 py-12 shadow-md sm:rounded-lg sm:px-12 transition-colors duration-200">
      
  <!-- Login Form -->
<form action="#" method="POST" class="space-y-6">
  <!-- Email Input -->
  <div>
    <label for="email" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">Email address</label>
    <div class="mt-2">
      <input id="email" type="email" name="email" required autocomplete="email" class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
    </div>
  </div>

  <!-- Password Input with Toggle -->
  <div x-data="{ show: false }">
    <div class="flex items-center justify-between">
      <label for="password" class="block text-sm leading-6 font-medium text-gray-900 dark:text-neutral-200">Password</label>
      <a href="/pr-preview/pr-925/sentinel/new_dashboard_pages/forgot-password/" class="text-sm leading-6 font-medium text-primary-600 hover:text-primary-500 dark:text-primary-400 dark:hover:text-primary-300 transition-colors duration-200">Forgot password?</a>
    </div>
    <div class="mt-2 relative rounded-md">
      <input id="password" :type="show ? 'text' : 'password'" name="password" required autocomplete="current-password" class="block w-full rounded-md bg-white dark:bg-neutral-900 px-3 py-1.5 pr-10 text-base text-gray-900 dark:text-neutral-100 border-0 ring-1 ring-inset ring-gray-300 dark:ring-neutral-700 focus:ring-2 focus:ring-inset focus:ring-primary-600 dark:focus:ring-primary-500 sm:text-sm sm:leading-6" />
      <button type="button" @click="show = !show" :aria-label="show ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-primary-600 dark:text-neutral-500 dark:hover:text-primary-500 focus:outline-none focus-visible:text-primary-600 rounded-md">
        <svg x-show="!show" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg x-show="show" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Submit Button -->
  <div>
    <button type="submit" class="flex w-full justify-center py-2 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 dark:bg-primary-600 dark:hover:bg-primary-500 focus:outline-none focus:ring-1 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-200 shadow-sm">Sign in</button>
  </div>
</form>

<!-- Social Logins Section -->
<div>
  <div class="mt-10 flex items-center gap-x-6">
    <div class="w-full flex-1 border-t border-gray-200 dark:border-neutral-700"></div>
    <p class="text-sm leading-6 font-medium text-nowrap text-gray-900 dark:text-neutral-500">Or continue with</p>
    <div class="w-full flex-1 border-t border-gray-200 dark:border-neutral-700"></div>
  </div>

  <div class="mt-6 grid grid-cols-1 gap-4">
    <a href="#" class="flex w-full items-center justify-center gap-3 rounded-md bg-white dark:bg-neutral-900 px-3 py-2 text-sm font-semibold text-gray-900 dark:text-neutral-300 shadow-xs inset-ring inset-ring-gray-300 dark:inset-ring-neutral-700 hover:bg-gray-50 dark:hover:bg-neutral-800 focus-visible:inset-ring-transparent">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="h-5 w-5">
        <path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335" />
        <path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4" />
        <path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05" />
        <path d="M12.0004 24.0001C15.2404 24.0001 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.2654 14.29L1.27539 17.385C3.25539 21.31 7.3104 24.0001 12.0004 24.0001Z" fill="#34A853" />
      </svg>
      <span class="text-sm leading-6 font-semibold">Google</span>
    </a>
  </div>
</div>


    </div>
    
<p class="mt-10 text-center text-sm text-gray-500 dark:text-neutral-400">
  Not a member?
  <a href="/pr-preview/pr-925/sentinel/new_dashboard_pages/signup/" class="text-sm leading-6 font-semibold text-primary-600 hover:text-primary-500 dark:text-primary-400 dark:hover:text-primary-300 transition-colors duration-200">Sign up</a>
</p>

  </div>
</div>


  <!-- Preline UI JS -->
  <script src="/pr-preview/pr-925/src/sentinel/node_modules/preline/dist/preline.js"></script>
</body>
</html>
