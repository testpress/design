

<section id="timeline-component" class="mb-16 pt-8">
    <div class="mb-6 flex items-center justify-between border-b border-gray-200 dark:border-neutral-700 pb-4">
        <div class="flex items-center gap-2">
            <i data-lucide="list-tree" class="w-6 h-6 text-gray-800 dark:text-white"></i>
            <h2 class="text-2xl font-semibold text-gray-800 dark:text-white">Timeline</h2>
        </div>
    </div>

    <div class="p-6 bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-700 rounded-xl shadow-xs max-w-lg"
        x-data="{ groups: [
          { label: 'Session 2', events: [
            { time: '10:14 AM', title: 'Session started', description: 'Chrome 129 on Windows 11' },
            { time: '10:31 AM', title: 'Multiple faces', description: 'High severity' }
          ] },
          { label: 'Session 1', events: [
            { time: '10:02 AM', title: 'Session started', description: '' },
            { time: '10:09 AM', title: 'Session failed', description: '' }
          ] }
        ] }">
        
<div class="">
  <template x-for="(group, gIdx) in groups" :key="gIdx">
    <div>
      <!-- Group marker -->
      <div x-show="group.label" class="relative pb-1 after:absolute after:top-4 after:bottom-0 after:start-4 after:w-px after:bg-gray-300 dark:after:bg-neutral-600 after:-translate-x-1/2">
        <div class="w-full flex gap-x-4">
          <span class="relative z-1 flex shrink-0 justify-center items-center w-8">
            <span class="flex shrink-0 justify-center items-center size-2 bg-white dark:bg-neutral-800 border border-gray-300 dark:border-neutral-600 rounded-full"></span>
          </span>
          <span class="grow text-xs text-gray-500 dark:text-neutral-400" x-text="group.label"></span>
        </div>
      </div>

      <template x-for="(event, eIdx) in group.events" :key="eIdx">
        <!-- Event -->
        <div class="relative after:absolute after:top-8 after:bottom-0 after:start-4 after:w-px after:border-s after:border-dashed after:-translate-x-1/2"
          :class="gIdx === groups.length - 1 && eIdx === group.events.length - 1 ? 'pb-0 after:border-transparent' : 'pb-6 after:border-gray-300 dark:after:border-neutral-600'">
          <div class="w-full flex gap-x-4">
            <span class="flex shrink-0 justify-center items-center size-8 bg-gray-100 dark:bg-neutral-700 text-gray-500 dark:text-neutral-400 rounded-full">
              <span class="size-1.5 rounded-full bg-current"></span>
            </span>
            <div class="grow mt-1 flex flex-col gap-y-1">
              <span class="text-sm text-gray-800 dark:text-neutral-200" x-text="event.title"></span>
              <span class="flex flex-wrap items-center gap-x-1.5 text-xs text-gray-500 dark:text-neutral-400">
                <span x-text="event.time"></span>
                <template x-if="event.description">
                  <span class="inline-flex items-center gap-x-1.5"><span aria-hidden="true">&middot;</span><span x-text="event.description"></span></span>
                </template>
              </span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>
</div>

    </div>
</section>
