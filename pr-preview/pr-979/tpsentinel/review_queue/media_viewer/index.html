



<!-- Media Viewer -->




<div x-data="{ 
       open: false,
       toggle() { this.open = !this.open; },
       init() {
         this.$watch('open', value => {
           if (value) {
             document.body.classList.add('overflow-hidden');
             this.$nextTick(() => {
               const autoFocusEl = this.$el.querySelector('[autofocus]');
               if (autoFocusEl) {
                 setTimeout(() => {
                   autoFocusEl.focus();
                   if (typeof autoFocusEl.setSelectionRange === 'function') {
                     const len = autoFocusEl.value.length;
                     autoFocusEl.setSelectionRange(len, len);
                   }
                 }, 50);
               } else if (this.$refs.closeBtn) {
                 this.$refs.closeBtn.focus();
               }
               if (window.lucide) { window.lucide.createIcons(); }
             });
           } else {
             document.body.classList.remove('overflow-hidden');
           }
         });
       }
     }"
     @open-modal-viewer.window="open = true"
     @close-modal-viewer.window="open = false"
     class="contents">

  
  

  
  <div x-show="open"
       x-cloak
       class="fixed inset-0 z-[10000] overflow-y-auto"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-title-viewer">
    
    
    <div x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="open = false"
         class="fixed inset-0 bg-neutral-900/50 dark:bg-neutral-900/80 backdrop-blur-sm"></div>

    
    <div class="flex min-h-screen items-center justify-center p-4 text-center sm:p-0">
      
      
      <div x-show="open"
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           @keydown.escape.window="open = false"
           class="relative overflow-hidden rounded-xl bg-white dark:bg-neutral-800 text-start shadow-xl sm:my-8 w-full sm:max-w-5xl border border-gray-200 dark:border-neutral-700 flex flex-col max-h-[90vh]">
        
        
        <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700">
          <div>
            <h2 id="modal-title-viewer" class="font-semibold text-gray-800 dark:text-neutral-200 text-sm sm:text-base">
              Evidence
            </h2>
            
          </div>
          <button x-ref="closeBtn" type="button" @click="open = false" class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-50 dark:bg-neutral-800 text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        
        <div class="overflow-y-auto p-5 flex-1 min-h-0 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500 text-sm text-gray-700 dark:text-neutral-300">
          
<div @keydown.arrow-left.window="open && stepViewer(-1)" @keydown.arrow-right.window="open && stepViewer(1)">
  <template x-if="viewerItem">
    <div>
      <p class="text-sm font-medium text-foreground" x-text="viewerItem.anomaly || viewerItem.label"></p>
      <p class="text-xs text-muted-foreground-1"
        x-text="(viewerItem.anomaly ? viewerItem.label + ' · ' : '') + viewerItem.session + ' · ' + viewerItem.time + (viewerItem.length ? ' · ' + viewerItem.length : '')"></p>

      <div class="mt-3">
        <template x-if="viewerItem.reference">
          <div class="max-w-xl mx-auto">
            <div class="grid grid-cols-2 gap-3">
              <figure>
                <img class="w-full aspect-square object-cover rounded-lg bg-surface" :src="viewerItem.reference" alt="Enrolment photo">
                <figcaption class="mt-1.5 text-xs text-muted-foreground-1">Enrolment photo</figcaption>
              </figure>
              <figure>
                <img class="w-full aspect-square object-cover rounded-lg bg-surface" :src="viewerItem.src" alt="Check-in photo">
                <figcaption class="mt-1.5 text-xs text-muted-foreground-1">Check-in photo</figcaption>
              </figure>
            </div>
            <p class="mt-3 text-sm text-foreground" x-text="'Partial match · ' + viewerItem.score + '% similar'"></p>
          </div>
        </template>
        <template x-if="viewerItem.src && !viewerItem.reference">
          <div class="relative">
            <img class="w-full max-h-[60vh] object-contain rounded-lg bg-surface" :src="viewerItem.src"
              :alt="viewerItem.label + ' at ' + viewerItem.time">
            <span x-show="viewerItem.length" class="absolute inset-0 flex items-center justify-center">
              <span class="inline-flex justify-center items-center size-14 rounded-full bg-gray-900/70 text-white"><svg class="shrink-0 size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
            </span>
          </div>
        </template>
        <template x-if="!viewerItem.src">
          <div class="flex flex-col items-center justify-center gap-2 py-16 rounded-lg bg-surface text-surface-foreground">
            <svg class="shrink-0 size-8" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            <span class="text-sm" x-text="'Audio clip · ' + viewerItem.length"></span>
          </div>
        </template>
      </div>

      <div class="mt-4 flex items-center justify-between gap-x-2">
        <span class="text-xs text-muted-foreground-1" x-text="(viewer.index + 1) + ' of ' + viewer.items.length + ' · use ← → to browse'"></span>
        <div class="flex gap-x-2">
          

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-1.5 px-2.5 text-[13px] bg-white border border-gray-200 text-gray-800 shadow-2xs hover:bg-gray-50 focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"   @click="stepViewer(-1)" :disabled="viewer.index === 0">
  

    
    

    Previous

    

  
    </button>
  


          

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-1.5 px-2.5 text-[13px] bg-white border border-gray-200 text-gray-800 shadow-2xs hover:bg-gray-50 focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"   @click="stepViewer(1)" :disabled="viewer.index >= viewer.items.length - 1">
  

    
    

    Next

    

  
    </button>
  


        </div>
      </div>
    </div>
  </template>
</div>

        </div>

        
        

      </div>
    </div>
  </div>
</div>
