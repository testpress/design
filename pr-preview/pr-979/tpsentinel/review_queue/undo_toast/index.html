<!-- Undo Toast -->
<div x-show="toast" x-transition.opacity class="fixed bottom-5 end-5 z-[80] max-w-xs w-full">
  <div class="bg-white border border-gray-200 rounded-xl shadow-lg dark:bg-neutral-800 dark:border-neutral-700"
    role="status" aria-live="polite">
    <div class="flex p-4">
      <p class="text-sm text-gray-800 dark:text-white">
        <span x-text="toast && toast.entry.candidate.name"></span> submitted as
        <span class="font-medium" x-text="toast && (toast.choice === 'flagged' ? 'Flagged' : 'Clear')"></span>
      </p>

      <div class="ms-auto ps-3 flex items-center space-x-3">
        <button type="button" @click="undo()"
          class="text-blue-600 decoration-2 hover:underline font-medium text-sm focus:outline-none focus:underline dark:text-blue-500">
          Undo
        </button>
        <button type="button" @click="dismissToast()" aria-label="Close"
          class="shrink-0 flex justify-center items-center size-5 text-gray-400 focus:outline-none dark:text-neutral-500">
          <span class="sr-only">Close</span>
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
<!-- End Undo Toast -->
