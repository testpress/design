

<!-- Flagged moments: snapshots and clips captured -->
<div x-ref="evidence" class="@container scroll-mt-6">
  <div class="flex items-center justify-between gap-3">
    <h2 class="font-semibold text-foreground">Flagged moments</h2>
    <button type="button" x-show="evidenceItems.length > 4" @click="openAllEvidence('moments')"
      class="text-sm font-medium text-primary hover:underline underline-offset-4 focus:outline-hidden focus-visible:underline">
      View all
    </button>
  </div>

  <div class="pt-4 space-y-4">
    <div class="grid grid-cols-1 @sm:grid-cols-2 @2xl:grid-cols-3 @4xl:grid-cols-4 gap-4">
      <template x-for="m in pageEvidenceItems" :key="(m.id || '') + (m.time || '') + (m.label || '') + (m.src || '')">
        
<button type="button" @click="openViewer(m)"
  class="group text-start rounded-lg focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
  :aria-label="'Open ' + (m.anomaly || m.label) + ' at ' + formatEvidenceTime(m)">
  <span class="relative block aspect-video rounded-lg overflow-hidden bg-surface">
    <template x-if="m.src && !m.reference">
      <img class="size-full object-cover group-hover:opacity-90" :src="m.src" alt="" loading="lazy">
    </template>
    <template x-if="m.reference">
      <span class="size-full grid grid-cols-2 gap-0.5 group-hover:opacity-90">
        <img class="size-full object-cover" :src="m.reference" alt="" loading="lazy">
        <img class="size-full object-cover" :src="m.src" alt="" loading="lazy">
      </span>
    </template>
    <template x-if="!m.src">
      <span class="size-full flex flex-col items-center justify-center gap-1 text-surface-foreground">
        <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        <span class="text-xs">Audio</span>
      </span>
    </template>
    <template x-if="m.length">
      <span class="absolute bottom-1.5 end-1.5 inline-flex items-center gap-x-1 py-0.5 px-1.5 rounded-md bg-gray-900/70 text-[11px] font-medium text-white">
        <svg class="shrink-0 size-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span x-text="m.length"></span>
      </span>
    </template>
  </span>
  <span class="mt-1.5 block text-xs font-medium text-foreground" x-text="m.anomaly || m.label"></span>
  <span class="block text-xs text-muted-foreground" x-text="formatEvidenceTime(m)"></span>
</button>

      </template>
    </div>

    <p x-show="!evidenceItems.length" class="text-sm text-muted-foreground-1">
      Nothing was captured for this case.
    </p>
  </div>
</div>
<!-- End Flagged moments -->
