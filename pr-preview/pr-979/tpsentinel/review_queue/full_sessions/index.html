<!-- Full sessions: webcam and screen recordings of each whole session, for wider context -->
<div x-show="sessionRecordings.length">
  <button type="button" @click="showFullSessions = !showFullSessions" :aria-expanded="showFullSessions"
    class="group w-full flex items-center justify-between gap-x-3 text-start focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary rounded-lg">
    <span>
      <span class="font-semibold text-foreground">Full sessions</span>
      <span class="ms-1.5 text-sm text-muted-foreground-1"
        x-text="sessionRecordings.length + (sessionRecordings.length === 1 ? ' session' : ' sessions') + ' recorded'"></span>
    </span>
    <span class="inline-flex items-center gap-x-1 text-sm font-medium text-muted-foreground-1 group-hover:text-foreground">
      <span x-text="showFullSessions ? 'Hide' : 'Show'"></span>
      <svg class="shrink-0 size-4 transition-transform" :class="showFullSessions ? 'rotate-180' : ''" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </span>
  </button>

  <div x-show="showFullSessions" class="mt-4 space-y-6">
    <p class="text-sm text-muted-foreground-1">Complete webcam and screen recordings, for context around a moment. Only sessions that were recorded are listed.</p>
    <template x-for="g in sessionRecordings" :key="g.session.label">
      <div class="@container flex flex-col @lg:flex-row @lg:items-start gap-3 @lg:gap-6">
        <div class="@lg:w-44 shrink-0">
          <p class="text-sm font-medium text-foreground" x-text="g.session.label"></p>
          <p class="text-xs text-muted-foreground" x-text="g.session.date + ' · ' + g.session.started + ' – ' + g.session.ended"></p>
        </div>
        <div class="grow grid grid-cols-2 gap-3 max-w-xl">
          <template x-for="r in g.recordings" :key="r.label">
            <button type="button" @click="openRecording(r)"
              class="group text-start rounded-lg focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
              :aria-label="'Play ' + g.session.label + ' ' + r.label">
              <span class="relative block aspect-video rounded-lg overflow-hidden bg-surface">
                <img class="size-full object-cover group-hover:opacity-90" :src="r.src" alt="">
                <span class="absolute bottom-1.5 end-1.5 inline-flex items-center gap-x-1 py-0.5 px-1.5 rounded-md bg-gray-900/70 text-[11px] font-medium text-white">
                  <svg class="shrink-0 size-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span x-text="r.length"></span>
                </span>
              </span>
              <span class="mt-1.5 block text-xs font-medium text-foreground" x-text="r.label"></span>
            </button>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>
