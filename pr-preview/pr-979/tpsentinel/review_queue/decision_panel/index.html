



<!-- Decision: Clear/Flagged sit side by side only when the panel is wide enough -->
<div class="@container">
  <h2 class="font-semibold text-foreground">Your decision</h2>

  <!-- Stale review: refreshing is the only action -->
  <template x-if="current.stale">
    <div class="mt-4 p-4 rounded-lg bg-surface text-sm" role="alert">
      <p class="font-medium text-foreground">New evidence is available</p>
      <p class="mt-1 text-muted-foreground-1">
        <span x-text="current.stale.session"></span> ended <span x-text="current.stale.ended"></span>,
        after this case was opened. Refresh to review it before deciding.
      </p>
      <div class="mt-3">
        

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   @click="refresh()">
  

    
    

    Refresh evidence

    

  
    </button>
  


      </div>
    </div>
  </template>

  <template x-if="!current.stale">
    <div class="mt-4 space-y-4">
      <div class="grid @lg:grid-cols-2 gap-2" role="radiogroup" aria-label="Integrity result">
        




<label for="decision-clear" class="py-3 px-4 flex text-sm bg-white dark:bg-neutral-800 text-gray-800 dark:text-neutral-200 rounded-xl cursor-pointer ring-1 ring-gray-200 dark:ring-neutral-700 has-[:checked]:ring-2 has-[:checked]:ring-primary-600 dark:has-[:checked]:ring-primary-500 transition-all ">
  <input 
    id="decision-clear" 
    name="decision" 
    type="radio" 
    class="shrink-0 size-4 mt-0.5 bg-transparent border-gray-300 dark:border-neutral-600 rounded-full shadow-2xs text-primary-600 dark:text-primary-500 focus:ring-0 focus:ring-offset-0 checked:bg-primary-600 dark:checked:bg-primary-500 checked:border-primary-600 dark:checked:border-primary-500 disabled:opacity-50 disabled:pointer-events-none "
    value="clear"
    
    
    
    x-model="choice"
    
    >
  <span class="grow px-4 space-y-1">
    
      <span class="block font-medium ">
        Clear
      </span>
    
    
      <span class="block text-sm/6 text-gray-500 dark:text-neutral-400">
        The evidence doesn&#39;t show an integrity issue.
      </span>
    
  </span>
</label>


        




<label for="decision-flagged" class="py-3 px-4 flex text-sm bg-white dark:bg-neutral-800 text-gray-800 dark:text-neutral-200 rounded-xl cursor-pointer ring-1 ring-gray-200 dark:ring-neutral-700 has-[:checked]:ring-2 has-[:checked]:ring-primary-600 dark:has-[:checked]:ring-primary-500 transition-all ">
  <input 
    id="decision-flagged" 
    name="decision" 
    type="radio" 
    class="shrink-0 size-4 mt-0.5 bg-transparent border-gray-300 dark:border-neutral-600 rounded-full shadow-2xs text-primary-600 dark:text-primary-500 focus:ring-0 focus:ring-offset-0 checked:bg-primary-600 dark:checked:bg-primary-500 checked:border-primary-600 dark:checked:border-primary-500 disabled:opacity-50 disabled:pointer-events-none "
    value="flagged"
    
    
    
    x-model="choice"
    
    @change="$nextTick(() => $refs.notes && $refs.notes.focus())">
  <span class="grow px-4 space-y-1">
    
      <span class="block font-medium ">
        Flagged
      </span>
    
    
      <span class="block text-sm/6 text-gray-500 dark:text-neutral-400">
        The evidence shows an integrity issue.
      </span>
    
  </span>
</label>


      </div>

      <div>
        <label for="decision-notes" class="block mb-2 text-sm font-medium text-foreground">
          Notes <span class="font-normal text-muted-foreground-1" x-text="choice === 'flagged' ? '(required for Flagged)' : '(optional)'"></span>
        </label>
        
<div class="w-full">
  

  <div class="relative w-full">
    <textarea id="decision-notes" 
              name="notes"
              rows="3"
              class="py-2 px-3 sm:py-3 sm:px-4 block w-full bg-white dark:bg-neutral-800 border-gray-200 dark:border-neutral-700 rounded-lg sm:text-sm text-gray-800 dark:text-neutral-200 placeholder:text-gray-500 dark:placeholder:text-neutral-400 focus:border-primary-700 dark:focus:border-primary-600 focus:z-10 focus:ring-primary-700 dark:focus:ring-primary-600 disabled:opacity-50 disabled:pointer-events-none [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500  "
              placeholder="What did you see in the evidence?"
              
              
              x-model="notes"
              x-ref="notes"
              ></textarea>
  </div>
  
  
</div>

      </div>

      <div class="flex flex-wrap items-center gap-3">
        

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary-600 border border-transparent text-white hover:bg-primary-700 focus:bg-primary-700 dark:focus:ring-offset-neutral-800"   @click="submit()" :disabled="!canSubmit" x-text="submitLabel">
  

    
    

    Submit decision

    

  
    </button>
  


        <span class="text-xs text-muted-foreground-1" x-text="submitHint"></span>
      </div>
    </div>
  </template>
</div>
<!-- End Decision -->
