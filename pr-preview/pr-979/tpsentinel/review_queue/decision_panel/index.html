<!-- Decision -->
<div class="p-4 sm:p-5 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-neutral-800 dark:border-neutral-700">
  <h3 class="font-semibold text-gray-800 dark:text-neutral-200">Your decision</h3>

  <!-- Stale Review: refresh is the only action -->
  <template x-if="current.stale">
    <div class="mt-4 p-4 rounded-lg bg-gray-100 text-sm dark:bg-neutral-700" role="alert">
      <p class="font-medium text-gray-800 dark:text-neutral-200">This review is out of date</p>
      <p class="mt-1 text-gray-600 dark:text-neutral-400">
        <span x-text="current.stale.newer_session"></span> ended <span x-text="current.stale.ended"></span>,
        after this case was opened. Refresh to review the latest evidence before deciding.
      </p>
      <button type="button" @click="refresh()"
        class="mt-3 py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-blue-600 border border-transparent text-white hover:bg-blue-700 focus:outline-none focus:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600">
        Refresh case
      </button>
    </div>
  </template>

  <template x-if="!current.stale">
    <div class="mt-4 space-y-4">
      <!-- Radio Cards -->
      <div class="grid sm:grid-cols-2 gap-2" role="radiogroup" aria-label="Integrity result">
        <label for="decision-clear"
          class="flex items-start p-3 w-full bg-white border rounded-lg text-sm cursor-pointer dark:bg-neutral-800"
          :class="choice === 'clear' ? 'border-blue-600 ring-1 ring-blue-600 dark:border-blue-500 dark:ring-blue-500' : 'border-gray-200 dark:border-neutral-700'">
          <input type="radio" id="decision-clear" name="decision" value="clear" x-model="choice"
            class="mt-0.5 shrink-0 size-4 bg-transparent border-gray-300 rounded-full text-blue-600 focus:ring-blue-500 dark:border-neutral-600 dark:text-blue-500">
          <span class="ms-3">
            <span class="block font-medium text-gray-800 dark:text-neutral-200">Clear</span>
            <span class="block text-gray-500 dark:text-neutral-400">The evidence doesn't show an integrity issue.</span>
          </span>
        </label>

        <label for="decision-flagged"
          class="flex items-start p-3 w-full bg-white border rounded-lg text-sm cursor-pointer dark:bg-neutral-800"
          :class="choice === 'flagged' ? 'border-blue-600 ring-1 ring-blue-600 dark:border-blue-500 dark:ring-blue-500' : 'border-gray-200 dark:border-neutral-700'">
          <input type="radio" id="decision-flagged" name="decision" value="flagged" x-model="choice"
            @change="$nextTick(() => $refs.notes.focus())"
            class="mt-0.5 shrink-0 size-4 bg-transparent border-gray-300 rounded-full text-blue-600 focus:ring-blue-500 dark:border-neutral-600 dark:text-blue-500">
          <span class="ms-3">
            <span class="block font-medium text-gray-800 dark:text-neutral-200">Flagged</span>
            <span class="block text-gray-500 dark:text-neutral-400">The evidence shows an integrity issue.</span>
          </span>
        </label>
      </div>
      <!-- End Radio Cards -->

      <!-- Notes -->
      <div>
        <label for="decision-notes" class="block mb-2 text-sm font-medium text-gray-800 dark:text-neutral-200">
          Notes <span class="font-normal text-gray-500 dark:text-neutral-400"
            x-text="choice === 'flagged' ? '(required for Flagged)' : '(optional)'"></span>
        </label>
        <textarea id="decision-notes" x-ref="notes" x-model="notes" rows="3"
          class="py-2 px-3 block w-full bg-white border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder:text-neutral-500"
          placeholder="What did you see in the evidence?"></textarea>
        <p class="mt-1 text-xs text-gray-500 dark:text-neutral-400">
          Press <kbd class="font-mono">Ctrl</kbd> + <kbd class="font-mono">Enter</kbd> to submit from here,
          <kbd class="font-mono">Esc</kbd> to leave the field.
        </p>
      </div>
      <!-- End Notes -->

      <div class="flex flex-wrap items-center gap-3">
        <button type="button" @click="submit()" :disabled="!canSubmit"
          class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg bg-blue-600 border border-transparent text-white hover:bg-blue-700 focus:outline-none focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none dark:bg-blue-500 dark:hover:bg-blue-600"
          x-text="submitLabel"></button>
        <span class="text-xs text-gray-500 dark:text-neutral-400" x-text="submitHint"></span>
      </div>
    </div>
  </template>
</div>
<!-- End Decision -->
