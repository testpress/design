




<!-- View all evidence: everything captured for this case, grouped by session, a few sessions per page -->




<div x-data="{ 
       open: false,
       toggle() { this.open = !this.open; },
       init() {
         this.$watch('open', value => {
           if (value) {
             document.body.classList.add('overflow-hidden');
             this.$nextTick(() => {
               const autoFocusEl = this.$el.querySelector('[autofocus]');
               if (autoFocusEl) {
                 setTimeout(() => {
                   autoFocusEl.focus();
                   if (typeof autoFocusEl.setSelectionRange === 'function') {
                     const len = autoFocusEl.value.length;
                     autoFocusEl.setSelectionRange(len, len);
                   }
                 }, 50);
               } else if (this.$refs.closeBtn) {
                 this.$refs.closeBtn.focus();
               }
               if (window.lucide) { window.lucide.createIcons(); }
             });
           } else {
             document.body.classList.remove('overflow-hidden');
           }
         });
       }
     }"
     @open-modal-all-evidence.window="open = true"
     @close-modal-all-evidence.window="open = false"
     class="contents">

  
  

  
  <div x-show="open"
       x-cloak
       class="fixed inset-0 z-[10000] overflow-y-auto"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-title-all-evidence">
    
    
    <div x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="open = false"
         class="fixed inset-0 bg-neutral-900/50 dark:bg-neutral-900/80 backdrop-blur-sm"></div>

    
    <div class="flex min-h-screen items-center justify-center p-4 text-center sm:p-0">
      
      
      <div x-show="open"
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
           x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
           @keydown.escape.window="open = false"
           class="relative overflow-hidden rounded-xl bg-white dark:bg-neutral-800 text-start shadow-xl sm:my-8 w-full sm:max-w-5xl border border-gray-200 dark:border-neutral-700 flex flex-col max-h-[90vh]">
        
        
        <div class="py-2.5 px-4 flex justify-between items-center border-b border-gray-200 dark:border-neutral-700">
          <div>
            <h2 id="modal-title-all-evidence" class="font-semibold text-gray-800 dark:text-neutral-200 text-sm sm:text-base">
              All evidence
            </h2>
            
          </div>
          <button x-ref="closeBtn" type="button" @click="open = false" class="size-8 shrink-0 flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-gray-50 dark:bg-neutral-800 text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-700 disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        
        <div class="overflow-y-auto p-0 flex-1 min-h-0 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-none [&::-webkit-scrollbar-track]:bg-gray-100 dark:[&::-webkit-scrollbar-track]:bg-neutral-700 [&::-webkit-scrollbar-thumb]:bg-gray-300 dark:[&::-webkit-scrollbar-thumb]:bg-neutral-500 text-sm text-gray-700 dark:text-neutral-300">
          
<template x-if="current">
  <div class="flex flex-col h-[75dvh]">
    <div class="px-5 pt-4" x-init="$watch('allEvidence.tab', () => { allEvidence.page = 0; $refs.allScroll && ($refs.allScroll.scrollTop = 0); })">
      <p class="mb-3 text-sm text-muted-foreground-1" x-text="current.candidate.name + ' · ' + courseSummary"></p>
      



<div  id="all-evidence-tabs">
  
  
  <div class="sm:hidden relative w-full"
       x-data="{ 
         open: false,
         top: 0,
         left: 0,
         width: 0,
         _scrollHandler: null,
         init() {
           this.$watch('open', value => {
             if (value) {
               this._scrollHandler = this._scrollHandler || (() => this.updatePosition());
               setTimeout(() => this.updatePosition(), 0);
               window.addEventListener('scroll', this._scrollHandler, true);
               window.addEventListener('resize', this._scrollHandler, true);
             } else {
               window.removeEventListener('scroll', this._scrollHandler, true);
               window.removeEventListener('resize', this._scrollHandler, true);
             }
           });
         },
         updatePosition() {
           const rect = this.$refs.trigger.getBoundingClientRect();
           this.top = rect.bottom + 4;
           this.left = rect.left;
           this.width = rect.width;
         }
       }">
    
    <button type="button" @click="open = !open" x-ref="trigger" class="py-2 px-3 inline-flex items-center justify-between w-full gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 hover:bg-gray-50 focus:outline-hidden focus:bg-gray-50 dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800 dark:focus:bg-neutral-800" aria-haspopup="menu" :aria-expanded="open.toString()">
      <span x-html="
        
          allEvidence.tab === 'moments' ? 'Flagged moments' :
        
          allEvidence.tab === 'recordings' ? 'Full sessions' :
        
          allEvidence.tab === 'snapshots' ? 'Snapshots' :
         'Select tab'
      "></span>
      <svg class="shrink-0 size-4 transition-transform duration-200" :class="open ? 'rotate-180' : ''" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <div x-show="open" 
         @click.outside="open = false"
         @keydown.escape.window="open = false"
         x-cloak
         x-transition:enter="transition ease-out duration-100"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-75"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="fixed z-[9999] bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-700 rounded-lg shadow-xl p-1"
         x-bind:style="{ top: top + 'px', left: left + 'px', width: width + 'px' }"
         role="menu"
         aria-orientation="vertical">
      
        
          <button type="button"
                  class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm font-normal text-start focus:outline-hidden hover:bg-gray-100 focus:bg-gray-100 dark:hover:bg-neutral-800 dark:focus:bg-neutral-800 text-gray-800 dark:text-neutral-200"
                  @click="allEvidence.tab = 'moments'; open = false"
                  >
            
            <span>Flagged moments</span>
          </button>
        
      
        
          <button type="button"
                  class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm font-normal text-start focus:outline-hidden hover:bg-gray-100 focus:bg-gray-100 dark:hover:bg-neutral-800 dark:focus:bg-neutral-800 text-gray-800 dark:text-neutral-200"
                  @click="allEvidence.tab = 'recordings'; open = false"
                  >
            
            <span>Full sessions</span>
          </button>
        
      
        
          <button type="button"
                  class="w-full flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm font-normal text-start focus:outline-hidden hover:bg-gray-100 focus:bg-gray-100 dark:hover:bg-neutral-800 dark:focus:bg-neutral-800 text-gray-800 dark:text-neutral-200"
                  @click="allEvidence.tab = 'snapshots'; open = false"
                  >
            
            <span>Snapshots</span>
          </button>
        
      
    </div>
  </div>

  
  <nav class="hidden sm:flex  gap-1 relative after:absolute after:bottom-0 after:inset-x-0 after:border-b after:border-gray-200 dark:after:border-neutral-700" aria-label="Tabs" role="tablist" aria-orientation="horizontal">
    
    
      
        <button type="button"
                
                  @click="allEvidence.tab = 'moments'"
                
                class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700 focus:text-gray-800 dark:focus:text-neutral-200 after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none hover:bg-gray-100 dark:hover:bg-neutral-700 hover:text-gray-800 dark:hover:text-neutral-200 "
                :class="allEvidence.tab === 'moments' 
                          ? 'after:bg-gray-800 dark:after:bg-neutral-200 text-gray-800 dark:text-neutral-200' 
                          : 'text-gray-500 dark:text-neutral-400'"
                :aria-selected="allEvidence.tab === 'moments'"
                id="all-evidence-tabs-item-moments"
                aria-controls="all-evidence-tabs-panel-moments"
                role="tab"
                >
          
          Flagged moments
          
        </button>
      
    
      
        <button type="button"
                
                  @click="allEvidence.tab = 'recordings'"
                
                class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700 focus:text-gray-800 dark:focus:text-neutral-200 after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none hover:bg-gray-100 dark:hover:bg-neutral-700 hover:text-gray-800 dark:hover:text-neutral-200 "
                :class="allEvidence.tab === 'recordings' 
                          ? 'after:bg-gray-800 dark:after:bg-neutral-200 text-gray-800 dark:text-neutral-200' 
                          : 'text-gray-500 dark:text-neutral-400'"
                :aria-selected="allEvidence.tab === 'recordings'"
                id="all-evidence-tabs-item-recordings"
                aria-controls="all-evidence-tabs-panel-recordings"
                role="tab"
                >
          
          Full sessions
          
        </button>
      
    
      
        <button type="button"
                
                  @click="allEvidence.tab = 'snapshots'"
                
                class="px-2.5 py-1.5 mb-2 relative inline-flex justify-center items-center gap-x-2 text-sm rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700 focus:text-gray-800 dark:focus:text-neutral-200 after:absolute after:-bottom-2 after:inset-x-0 after:z-10 after:h-0.5 after:pointer-events-none hover:bg-gray-100 dark:hover:bg-neutral-700 hover:text-gray-800 dark:hover:text-neutral-200 "
                :class="allEvidence.tab === 'snapshots' 
                          ? 'after:bg-gray-800 dark:after:bg-neutral-200 text-gray-800 dark:text-neutral-200' 
                          : 'text-gray-500 dark:text-neutral-400'"
                :aria-selected="allEvidence.tab === 'snapshots'"
                id="all-evidence-tabs-item-snapshots"
                aria-controls="all-evidence-tabs-panel-snapshots"
                role="tab"
                >
          
          Snapshots
          
        </button>
      
    
  </nav>

  
  
    
  
    
  
    
  

  
</div>

    </div>

    <div x-ref="allScroll" class="@container grow overflow-y-auto px-5 py-4 space-y-6 [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
      <p x-show="allEvidence.tab === 'recordings'" class="text-sm text-muted-foreground-1">Complete webcam and screen recordings. Only sessions that were recorded are listed.</p>
      <p x-show="allEvidence.tab === 'snapshots'" class="text-sm text-muted-foreground-1">Routine webcam and screen snapshots taken every few minutes, not tied to a flagged moment.</p>

      <template x-for="g in allEvidencePageGroups" :key="allEvidence.tab + g.session">
        <div>
          <p class="mb-2 text-xs font-medium text-muted-foreground-1" x-text="g.session + ' · ' + g.date"></p>
          <div class="grid grid-cols-2 @2xl:grid-cols-3 @4xl:grid-cols-4 gap-4">
            <template x-for="m in g.items" :key="m.session + m.time + m.label">
              
<button type="button" @click="openFromAll(m)"
  class="group text-start rounded-lg focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary"
  :aria-label="'Open ' + (m.anomaly || m.label) + ' at ' + formatEvidenceTime(m)">
  <span class="relative block aspect-video rounded-lg overflow-hidden bg-surface">
    <template x-if="m.src && !m.reference">
      <img class="size-full object-cover group-hover:opacity-90" :src="m.src" alt="" loading="lazy">
    </template>
    <template x-if="m.reference">
      <span class="size-full grid grid-cols-2 gap-0.5 group-hover:opacity-90">
        <img class="size-full object-cover" :src="m.reference" alt="" loading="lazy">
        <img class="size-full object-cover" :src="m.src" alt="" loading="lazy">
      </span>
    </template>
    <template x-if="!m.src">
      <span class="size-full flex flex-col items-center justify-center gap-1 text-surface-foreground">
        <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        <span class="text-xs">Audio</span>
      </span>
    </template>
    <template x-if="m.length">
      <span class="absolute bottom-1.5 end-1.5 inline-flex items-center gap-x-1 py-0.5 px-1.5 rounded-md bg-gray-900/70 text-[11px] font-medium text-white">
        <svg class="shrink-0 size-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span x-text="m.length"></span>
      </span>
    </template>
  </span>
  <span class="mt-1.5 block text-xs font-medium text-foreground" x-text="m.anomaly || m.label"></span>
  <span class="block text-xs text-muted-foreground" x-text="formatEvidenceTime(m)"></span>
</button>

            </template>
          </div>
        </div>
      </template>

      <p x-show="!allEvidenceGroups.length" class="text-sm text-muted-foreground-1"
        x-text="allEvidence.tab === 'recordings' ? 'No sessions were recorded for this case.' : 'Nothing here for this case.'"></p>
    </div>

    <!-- Paging: by sessions -->
    <div x-show="allEvidencePages > 1" class="px-5 py-3 flex items-center justify-between gap-x-2 border-t border-layer-line">
      <span class="text-xs text-muted-foreground-1" x-text="'Page ' + (allEvidence.page + 1) + ' of ' + allEvidencePages"></span>
      <div class="flex gap-x-2">
        

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-1.5 px-2.5 text-[13px] bg-white border border-gray-200 text-gray-800 shadow-2xs hover:bg-gray-50 focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"   @click="allEvidence.page--; $refs.allScroll.scrollTop = 0" :disabled="allEvidence.page === 0">
  

    
    

    Newer

    

  
    </button>
  


        

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-1.5 px-2.5 text-[13px] bg-white border border-gray-200 text-gray-800 shadow-2xs hover:bg-gray-50 focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"   @click="allEvidence.page++; $refs.allScroll.scrollTop = 0" :disabled="allEvidence.page >= allEvidencePages - 1">
  

    
    

    Older

    

  
    </button>
  


      </div>
    </div>
  </div>
</template>

        </div>

        
        

      </div>
    </div>
  </div>
</div>
