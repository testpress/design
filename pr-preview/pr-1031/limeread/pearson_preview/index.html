<!doctype html>
<html class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Pearson reader</title>

  <!-- Dynamic Path Detection -->
  <script>
    window.previewPath = window.location.pathname.match(/(\/pr-preview\/pr-\d+)?/)[0] || '';
    document.write('<link rel="stylesheet" href="' + window.previewPath + '/css/limeread.css">');
  </script>
  <noscript>
    <link rel="stylesheet" href="/css/limeread.css" />
  </noscript>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>


  <style>
    [x-cloak] {
      display: none !important;
    }

    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
  <script>
    (function () {
      const html = document.querySelector('html');
      const isLightOrAuto = localStorage.getItem('hs_theme') === 'light' || (localStorage.getItem('hs_theme') === 'auto' && !window.matchMedia('(prefers-color-scheme: dark)').matches);
      const isDarkOrAuto = localStorage.getItem('hs_theme') === 'dark' || (localStorage.getItem('hs_theme') === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isLightOrAuto && html.classList.contains('dark')) html.classList.remove('dark');
      else if (isDarkOrAuto && html.classList.contains('light')) html.classList.remove('light');
      else if (isDarkOrAuto && !html.classList.contains('dark')) html.classList.add('dark');
      else if (isLightOrAuto && !html.classList.contains('light')) html.classList.add('light');
    })();
  </script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();
    });
  </script>
</head>


<body x-data="{ handedOff: false }" x-init="setTimeout(() => handedOff = true, 2500)"
  class="min-h-screen bg-background-1 text-foreground antialiased">

  <main x-show="!handedOff" class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm space-y-6">
      <div class="flex items-center justify-center gap-x-3">
        <span class="shrink-0 animate-spin size-5 border-2 border-primary border-t-transparent rounded-full" role="status" aria-label="Loading"></span>
        <h1 class="text-base font-semibold text-foreground">Opening in Pearson reader…</h1>
      </div>

      <!-- The book being opened, so the admin can match it with what Pearson shows -->
      <div class="p-4 flex items-center gap-4 bg-card border border-card-line rounded-xl shadow-2xs">
        <div class="h-20 aspect-[2/3] shrink-0 p-1.5 flex flex-col justify-end rounded-md bg-teal-800 text-white">
          <span class="text-[8px] font-semibold leading-tight">Campbell Biology</span>
        </div>
        <div class="min-w-0 space-y-1">
          <p class="font-semibold text-foreground truncate">Campbell Biology</p>
          <p class="text-sm text-muted-foreground-1 truncate">Lisa A. Urry, Michael L. Cain</p>
          <p class="text-sm text-muted-foreground-1">12th Edition · 978-0135188743</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Stand-in for Pearson's own page, which Limeread doesn't control -->
  <main x-show="handedOff" x-cloak class="min-h-screen p-6 flex">
    <div class="grow flex items-center justify-center rounded-xl border-2 border-dashed border-line-3 text-center p-6">
      <div class="max-w-sm space-y-2">
        <i class="mx-auto block shrink-0 size-8 text-muted-foreground" data-lucide="book-open-text"></i>
        <p class="font-medium text-foreground">Pearson reader</p>
      </div>
    </div>
  </main>
</body>


</html>
