
<!-- Mobile Folders Drawer -->
<div x-show="mobileNotesFolderOpen" x-cloak
     class="fixed inset-0 z-[100] lg:hidden" role="dialog" aria-modal="true">
  <div x-show="mobileNotesFolderOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200"
       x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="mobileNotesFolderOpen = false"
       class="fixed inset-0 bg-gray-900/50 transition-opacity"></div>

  <div x-show="mobileNotesFolderOpen" x-transition:enter="transform transition ease-out duration-300"
       x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
       x-transition:leave="transform transition ease-in duration-300" x-transition:leave-start="translate-y-0"
       x-transition:leave-end="translate-y-full"
       class="fixed bottom-0 inset-x-0 flex flex-col w-full max-h-[80vh] bg-white shadow-xl rounded-t-2xl dark:bg-neutral-900 overflow-hidden">
      <div class="shrink-0 py-3 px-4 flex justify-between items-center border-b border-gray-200 dark:border-neutral-800">
        <h3 class="font-medium text-gray-800 dark:text-neutral-200">Folders</h3>
        <button @click="mobileNotesFolderOpen = false" type="button"
                class="p-1 inline-flex justify-center items-center rounded-full bg-white dark:bg-neutral-800 border border-gray-200 dark:border-neutral-800 text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-700 focus:outline-hidden focus:bg-gray-100 dark:focus:bg-neutral-700">
          <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto">
        <ul x-show="status !== 'onboarding'" role="list" class="divide-y divide-gray-100 dark:divide-neutral-800">
          <li @click="selectedNoteFolder = 'all'; mobileNotesFolderOpen = false" class="flex items-center space-x-3 px-4 py-4 cursor-pointer" :class="selectedNoteFolder === 'all' ? 'bg-primary-50 dark:bg-primary-500/10' : ''">
            <div class="shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-primary-500">
                <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <span class="block text-sm font-medium" :class="selectedNoteFolder === 'all' ? 'text-primary-700 dark:text-primary-400' : 'text-gray-900 dark:text-neutral-200'">All Notes</span>
              <p class="text-xs text-gray-500 dark:text-neutral-500" x-text="(folderCounts['all'] || 0) + ' notes'"></p>
            </div>
          </li>
          <li @click="selectedNoteFolder = 'uncategorized'; mobileNotesFolderOpen = false" class="flex items-center space-x-3 px-4 py-4 cursor-pointer" :class="selectedNoteFolder === 'uncategorized' ? 'bg-primary-50 dark:bg-primary-500/10' : ''">
            <div class="shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-gray-400">
                <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <span class="block text-sm font-medium" :class="selectedNoteFolder === 'uncategorized' ? 'text-primary-700 dark:text-primary-400' : 'text-gray-900 dark:text-neutral-200'">Uncategorized</span>
              <p class="text-xs text-gray-500 dark:text-neutral-500" x-text="(folderCounts['uncategorized'] || 0) + ' notes'"></p>
            </div>
          </li>
          <template x-for="folder in folders" :key="folder.id">
            <li class="flex items-center justify-between px-4 py-3 cursor-pointer" :class="selectedNoteFolder === folder.id ? 'bg-primary-50 dark:bg-primary-500/10' : ''">
              <div @click="selectedNoteFolder = folder.id; mobileNotesFolderOpen = false" class="flex-1 h-full flex items-center space-x-3">
                <div class="shrink-0">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-yellow-500/80">
                    <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path>
                  </svg>
                </div>
                <div class="min-w-0 flex-1">
                  <span class="block text-sm font-medium line-clamp-1" :class="selectedNoteFolder === folder.id ? 'text-primary-700 dark:text-primary-400' : 'text-gray-900 dark:text-neutral-200'" x-text="folder.name"></span>
                  <p class="text-xs text-gray-500 dark:text-neutral-500" x-text="(folderCounts[folder.id] || 0) + ' notes'"></p>
                </div>
              </div>
              <!-- Folder Actions Dropdown -->
              <div class="hs-dropdown [--placement:bottom-right] relative inline-flex" @click.stop>
                <button :id="'hs-mob-fldmd-mod-' + folder.id" type="button" class="size-8 inline-flex justify-center items-center text-gray-400 hover:bg-gray-100 rounded-full dark:text-neutral-500 dark:hover:bg-neutral-800 transition-colors focus:outline-none focus:bg-gray-100 dark:focus:bg-neutral-800">
                  <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="1"></circle>
                    <circle cx="12" cy="16" r="1"></circle>
                  </svg>
                </button>
                <div class="hs-dropdown-menu hs-dropdown-open:opacity-100 w-32 z-50 transition-[opacity,margin] duration opacity-0 bg-white border border-gray-200 rounded-xl shadow-lg hidden dark:bg-neutral-900 dark:border-neutral-800" role="menu" aria-orientation="vertical" :aria-labelledby="'hs-mob-fldmd-mod-' + folder.id">
                  <div class="p-1 space-y-0.5">
                    <button @click="$dispatch('open-modal-rename-folder'); mobileNotesFolderOpen = false" type="button" class="w-full flex items-center py-2 px-3 rounded-lg text-sm text-gray-800 dark:text-neutral-200 hover:bg-gray-100 dark:hover:bg-neutral-800">
                      Rename
                    </button>
                    <button @click="$dispatch('open-modal-delete-folder'); mobileNotesFolderOpen = false" type="button" class="w-full flex items-center py-2 px-3 rounded-lg text-sm text-red-600 dark:text-red-500 hover:bg-gray-100 dark:hover:bg-neutral-800">
                      Delete
                    </button>
                  </div>
                </div>
              </div>
            </li>
          </template>
        </ul>
        <div x-show="status === 'onboarding'" x-cloak class="h-full flex flex-col justify-center py-8">
          
          
  
  

  
    
  <div class="p-5 min-h-[200px] flex flex-col justify-center items-center text-center">
    
    
      <div class="mx-auto">
        
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-12 h-12 mx-auto text-yellow-500/80">
              <path d="M19.5 21a3 3 0 003-3v-4.5a3 3 0 00-3-3h-15a3 3 0 00-3 3V18a3 3 0 003 3h15zM1.5 10.146V6a3 3 0 013-3h5.379a2.25 2.25 0 011.59.659l2.122 2.121c.14.141.331.22.53.22H19.5a3 3 0 013 3v1.146A4.483 4.483 0 0019.5 9h-15a4.483 4.483 0 00-3 1.146z"></path>
            </svg>
          
      </div>
    

    <div class="max-w-sm mx-auto">
      <p class="mt-2 font-medium text-gray-800 dark:text-neutral-200">
        No folders yet
      </p>
      
      <p class="mb-5 mt-1 text-sm text-gray-500 dark:text-neutral-400">
        Create a folder to organize your notes.
      </p>
      
    </div>

    
    <div class="flex items-center gap-x-2 ">
      
        

  
  
  

  
  

  

  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-1.5 px-2.5 text-xs bg-white border border-gray-200 text-gray-800 hover:bg-gray-50 focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-700 dark:focus:bg-neutral-700"   @click="$dispatch('open-modal-add-folder'); mobileNotesFolderOpen = false">
  

    
    

    + New folder

    

  
    </button>
  


      
      
      
    </div>
    

  </div>
  
  


        </div>
      </div>
      <!-- Bottom Action -->
      <div x-show="status !== 'onboarding'" class="shrink-0 p-4 border-t border-gray-200 dark:border-neutral-800">
        <button @click="$dispatch('open-modal-add-folder'); mobileNotesFolderOpen = false" type="button" class="w-full py-2.5 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm hover:bg-gray-50 focus:outline-none focus:bg-gray-50 dark:bg-neutral-800 dark:border-neutral-700 dark:text-neutral-200 dark:hover:bg-neutral-700 dark:focus:bg-neutral-700">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus size-4"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          New folder
        </button>
      </div>
    </div>
  </div>
</div>
