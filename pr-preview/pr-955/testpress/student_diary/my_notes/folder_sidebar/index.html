  <div x-data="{
         active: false,
         top: 0, left: 0,
         arrowOffset: '50%',
         updatePosition() {
           const trigger = this.$refs.trigger;
           const tip = this.$refs.tip;
           if (!trigger || !tip) return;
           const r = trigger.getBoundingClientRect();
           const placement = 'bottom';
           const gap = 8;
           // Force display to measure real dimensions (tip may still be hidden via x-show)
           const wasHidden = tip.style.display === 'none' || getComputedStyle(tip).display === 'none';
           if (wasHidden) tip.style.setProperty('display', 'block', 'important');
           const tipW = tip.offsetWidth || 100;
           const tipH = tip.offsetHeight || 28;
           if (wasHidden) tip.style.removeProperty('display');
           console.log('[tooltip] placement:', placement, '| trigger rect:', r, '| tipW:', tipW, '| tipH:', tipH);
           if (placement === 'top') {
             this.top  = r.top - tipH - gap;
             this.left = r.left + (r.width - tipW) / 2;
           } else if (placement === 'bottom') {
             this.top  = r.bottom + gap;
             this.left = r.left + (r.width - tipW) / 2;
           } else if (placement === 'left') {
             this.top  = r.top + (r.height - tipH) / 2;
             this.left = r.left - tipW - gap;
           } else if (placement === 'right') {
             this.top  = r.top + (r.height - tipH) / 2;
             this.left = r.right + gap;
           }
           // Clamp to viewport
           const minL = 8, maxL = window.innerWidth - tipW - 8;
           const origLeft = this.left;
           this.left = Math.max(minL, Math.min(this.left, maxL));
           if (placement === 'top' || placement === 'bottom') {
             const triggerCenter = r.left + r.width / 2;
             const shift = triggerCenter - this.left;
             this.arrowOffset = Math.max(8, Math.min(shift, tipW - 8)) + 'px';
           }
           console.log('[tooltip] final top:', this.top, '| left:', this.left);
         }
       }"
       @mouseenter="active = true; $nextTick(() => updatePosition())"
       @mouseleave="active = false"
       @focusin="active = true; $nextTick(() => updatePosition())"
       @focusout="active = false"
       @click="active = !active; if(active) $nextTick(() => updatePosition())"
       @click.outside="active = false"
       @keydown.escape.window="active = false"
       @scroll.window.capture.passive="if(active) updatePosition()"
       @resize.window.passive="if(active) updatePosition()"
       class="relative inline-flex items-center align-middle cursor-pointer">

<div x-data="{ 
       open: false,
       top: 0,
       left: 'auto',
       right: 'auto',
       _triggerEl: null,
       _menuEl: null,
       _scrollHandler: null,
       init() {
         this.$watch('open', value => {
           console.log('Watch open value:', value);
           if (value) {
             this.$dispatch('dropdown-opened');
             console.log('Trigger ref:', this.$refs.trigger, 'Menu ref:', this.$refs.menu);
             this._triggerEl = this.$refs.trigger;
             this._menuEl = this.$refs.menu;
             this._scrollHandler = this._scrollHandler || this.updatePosition.bind(this);
             setTimeout(() => { 
               console.log('Calling updatePosition from setTimeout');
               this.updatePosition(); 
             }, 0);
             window.addEventListener('scroll', this._scrollHandler, true);
             window.addEventListener('resize', this._scrollHandler, true);
           } else {
             if (this._scrollHandler) {
               window.removeEventListener('scroll', this._scrollHandler, true);
               window.removeEventListener('resize', this._scrollHandler, true);
             }
           }
         });
       },
       updatePosition() {
         const trigger = this._triggerEl;
         console.log('updatePosition called, trigger:', trigger);
         if (!trigger) {
           console.log('No trigger element found!');
           return;
         }
         const rect = trigger.getBoundingClientRect();
         console.log('Trigger bounding rect:', rect);
         this.top = rect.bottom + 4;
         const placement = 'bottom-end';
         const adaptive = false;
         console.log('Placement:', placement);
          const menuWidth = this._menuEl ? this._menuEl.offsetWidth : 224;
          const menuHeight = this._menuEl ? this._menuEl.offsetHeight : 160;
          
          if (placement === 'bottom-end' || placement === 'top-end') {
            if (adaptive && rect.right < menuWidth) {
              this.left = rect.left;
              this.right = 'auto';
            } else {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            }
            this.top = placement === 'bottom-end' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          } else if (placement === 'bottom-start' || placement === 'top-start') {
            let leftPos = rect.left;
            if (adaptive && (window.innerWidth - leftPos < menuWidth)) {
              this.left = 'auto';
              this.right = window.innerWidth - rect.right;
            } else {
              this.left = leftPos;
              this.right = 'auto';
            }
            this.top = placement === 'bottom-start' ? rect.bottom + 4 : rect.top - menuHeight - 4;
          }
       }
     }" 
     @keydown.escape.window="open = false"
     @dropdown-opened.window="if ($event.target !== $el) open = false"
