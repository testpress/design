<script>
  function productBenefits() {
    const PLANS = [
      { id: 0, name: "Basic Access" },
      { id: 1, name: "Standard Access" },
      { id: 2, name: "Mentorship Pro" },
      { id: 3, name: "Premium Elite" },
    ];


    const clone = (value) => JSON.parse(JSON.stringify(value));

    return {
      plans: clone(PLANS),
      noPlans: false,
      saved: [],
      benefits: [],
      nextId: 1,

      newName: "",
      newError: "",

      editingId: null,
      editName: "",
      editError: "",

      dragId: null,
      dragReady: null,
      overId: null,
      deleting: null,
      saving: false,

      init() {
        this.refreshIcons();
        this.$nextTick(() => this.$refs.newBenefit.focus());
        this.$watch("benefits", () => this.refreshIcons());
        this.$watch("plans", () => this.refreshIcons());
        this.$watch("noPlans", (value) => (this.plans = value ? [] : clone(PLANS)));
      },

      refreshIcons() {
        this.$nextTick(() => window.lucide && window.lucide.createIcons());
      },

      get hasPlans() {
        return this.plans.length > 0;
      },

      get dirty() {
        return JSON.stringify(this.benefits) !== JSON.stringify(this.saved);
      },

      countFor(benefit) {
        return benefit.plans.length;
      },

      countIn(planId) {
        return this.benefits.filter((b) => b.plans.includes(planId)).length;
      },

      toggle(benefit, planId) {
        benefit.plans = benefit.plans.includes(planId)
          ? benefit.plans.filter((id) => id !== planId)
          : [...benefit.plans, planId].sort((a, b) => a - b);
      },

      setAll(planId, include) {
        this.benefits.forEach((b) => {
          if (include !== b.plans.includes(planId)) this.toggle(b, planId);
        });
      },

      validate(name, exceptId = null) {
        const trimmed = name.trim();
        if (!trimmed) return "Enter a benefit name.";
        if (trimmed.length > 255) return "Keep the name under 255 characters.";
        const duplicate = this.benefits.some(
          (b) => b.id !== exceptId && b.name.trim().toLowerCase() === trimmed.toLowerCase()
        );
        if (duplicate) return "“" + trimmed + "” is already in the list.";
        return "";
      },

      addBenefit() {
        this.newError = this.validate(this.newName);
        if (this.newError) {
          this.$refs.newBenefit.focus();
          return;
        }
        this.benefits.push({ id: this.nextId++, name: this.newName.trim(), plans: [] });
        this.newName = "";
        this.$nextTick(() => this.$refs.newBenefit.focus());
      },

      startEdit(benefit) {
        this.editingId = benefit.id;
        this.editName = benefit.name;
        this.editError = "";
      },

      // Returns true when the name was saved (or unchanged). On false the caller
      // keeps the field open (Enter) or puts the old name back (blur).
      saveEdit(benefit) {
        if (this.editingId !== benefit.id) return true;
        if (this.editName.trim() === benefit.name) {
          this.cancelEdit();
          return true;
        }
        const error = this.validate(this.editName, benefit.id);
        if (error) {
          this.editError = error;
          return false;
        }
        benefit.name = this.editName.trim();
        this.cancelEdit();
        return true;
      },

      cancelEdit() {
        this.editingId = null;
        this.editName = "";
        this.editError = "";
      },

      move(index, step) {
        const target = index + step;
        if (target < 0 || target >= this.benefits.length) return;
        const [item] = this.benefits.splice(index, 1);
        this.benefits.splice(target, 0, item);
      },

      dropOn(targetId) {
        const from = this.benefits.findIndex((b) => b.id === this.dragId);
        const to = this.benefits.findIndex((b) => b.id === targetId);
        if (from > -1 && to > -1 && from !== to) {
          const [item] = this.benefits.splice(from, 1);
          this.benefits.splice(to, 0, item);
        }
        this.dragId = null;
        this.overId = null;
      },

      askDelete(benefit) {
        this.deleting = benefit;
        this.$dispatch("open-modal-delete-benefit");
      },

      deletingPlansText() {
        if (!this.deleting || this.deleting.plans.length === 0) return "";
        const names = this.plans
          .filter((p) => this.deleting.plans.includes(p.id))
          .map((p) => p.name);
        if (names.length === 0) return "";
        return " and from the comparison of " + names.length + (names.length === 1 ? " plan" : " plans") + " (" + names.join(", ") + ")";
      },

      confirmDelete() {
        if (!this.deleting) return;
        this.benefits = this.benefits.filter((b) => b.id !== this.deleting.id);
        this.deleting = null;
      },

      discard() {
        this.benefits = clone(this.saved);
        this.newName = "";
        this.newError = "";
        this.cancelEdit();
      },

      save() {
        this.saving = true;
        setTimeout(() => {
          this.saved = clone(this.benefits);
          this.saving = false;
          this.$dispatch("toast", {
            title: "Benefits saved",
            description: "Students now see the updated benefits.",
            variant: "success",
          });
        }, 700);
      },
    };
  }
</script>
