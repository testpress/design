<!-- Session context: changes with Session navigation; the result and decision don't -->
<section id="session-panel" class="bg-card border border-card-line shadow-2xs rounded-xl scroll-mt-20" aria-labelledby="session-heading">
  <!-- Header: which session (title), when (one small line), and Previous / Next -->
  <div class="flex items-center justify-between gap-3 px-4 pt-4 sm:px-5 sm:pt-5">
    <div class="min-w-0">
      <h2 id="session-heading" class="flex items-center gap-x-2 text-base font-semibold text-foreground">
        <span>Session <span x-text="session.n"></span> <span class="font-normal text-muted-foreground-1" x-text="`of ${d.sessions.length}`"></span></span>
        <!-- Status only when it isn't the usual "Completed" -->
        <span x-show="session.status !== 'Completed'" class="py-0.5 px-1.5 rounded-md bg-surface text-xs font-medium text-surface-foreground" x-text="session.status"></span>
      </h2>
      <p class="text-xs text-muted-foreground-1 truncate"
         x-text="`${day(session.start)}, ${span(session.start, session.end)} · ${dur(session.length)}${sessionIdx === d.sessions.length - 1 ? ' · latest' : ''}`"></p>
    </div>
    <div class="shrink-0 flex items-center">
      <button type="button" @click="prevSession()" :disabled="sessionIdx === 0" aria-label="Previous session"
              class="inline-flex items-center justify-center size-8 rounded-lg text-muted-foreground-1 hover:bg-muted-hover hover:text-foreground disabled:opacity-40 disabled:pointer-events-none focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button type="button" @click="nextSession()" :disabled="sessionIdx === d.sessions.length - 1" aria-label="Next session"
              class="inline-flex items-center justify-center size-8 rounded-lg text-muted-foreground-1 hover:bg-muted-hover hover:text-foreground disabled:opacity-40 disabled:pointer-events-none focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
        <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="px-4 pb-4 pt-5 sm:px-5 sm:pb-5 flex flex-col gap-5">
    <!-- Identity check: reference stays fixed, captured image follows the Session -->
    <div>
      <div class="flex items-center justify-between gap-2">
        <h3 class="text-sm font-medium text-muted-foreground-1">Identity check</h3>
        <button type="button" @click="activityFilter = { session: '', type: 'session', q: 'Identity' }; tab = 'activity'"
                class="text-xs text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">All checks</button>
      </div>
      <div class="mt-2 grid grid-cols-2 gap-2">
        <figure>
          <img :src="identityImage" alt="Reference photo" class="w-full aspect-[4/3] rounded-lg object-cover bg-surface">
          <figcaption class="mt-1 text-xs text-muted-foreground-1">Reference</figcaption>
        </figure>
        <figure>
          <img :src="identityImage" :alt="`Captured in Session ${session.n}`" class="w-full aspect-[4/3] rounded-lg object-cover bg-surface">
          <figcaption class="mt-1 text-xs text-muted-foreground-1" x-text="`Captured · Session ${session.n}`"></figcaption>
        </figure>
      </div>
      <p class="mt-2 text-sm">
        <span class="font-medium" :class="session.identity.status === 'Verified' ? 'text-foreground' : 'text-amber-700 dark:text-amber-500'" x-text="session.identity.status"></span>
        <span class="text-muted-foreground-1" x-text="`· ${session.identity.score}% face match`"></span>
      </p>
      <p x-show="session.identity.status === 'Conditional'" class="mt-0.5 text-sm text-muted-foreground-2">
        An 80–98% match needs a person to confirm it’s the same candidate.
      </p>
    </div>

    <!-- This Session's coverage -->
    <div>
      <h3 class="text-sm font-medium text-muted-foreground-1">Evidence in this session</h3>
      <dl class="mt-1 divide-y divide-card-line">
        <template x-for="row in sessionCoverage(session)" :key="row.label">
          <div class="py-2 flex items-center justify-between gap-3 text-sm">
            <dt class="text-foreground" x-text="row.label"></dt>
            <dd class="text-end">
              <span class="font-medium" :class="coverageClass(row)" x-text="row.status"></span>
              <span x-show="row.measure && row.gap" class="text-muted-foreground-1" x-text="`· ${row.measure}`"></span>
            </dd>
          </div>
        </template>
      </dl>
    </div>

    <!-- Device and connection -->
    <div>
      <h3 class="text-sm font-medium text-muted-foreground-1">Device</h3>
      <!-- Two columns of label-over-value pairs: uses the panel's full width, three short rows -->
      <dl class="mt-2 grid grid-cols-2 gap-x-4 gap-y-3">
        <template x-for="[label, value, title] in [
            ['Type', session.device.type],
            ['OS', session.device.os],
            ['Browser', session.device.browser],
            ['SDK', session.device.sdk],
            ['IP', session.device.ip],
            ['Time zone', session.device.timezone.split(' ')[0], session.device.timezone]
          ]" :key="label">
          <div class="min-w-0">
            <dt class="text-xs text-muted-foreground-1" x-text="label"></dt>
            <dd class="mt-0.5 text-sm text-foreground tabular-nums truncate" :title="title || value" x-text="value"></dd>
          </div>
        </template>
      </dl>
    </div>

    <button type="button" @click="activityFilter = { session: String(session.n), type: '', q: '' }; tab = 'activity'"
            class="self-start inline-flex items-center gap-x-1 text-sm text-primary hover:underline underline-offset-2 focus:outline-hidden focus-visible:underline">
      <span x-text="`View Session ${session.n} activity`"></span>
      <svg class="shrink-0 size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</section>
