

<!-- Review Cases navigation and view identity. Workspace and Priority scope the whole page. -->
<div class="flex flex-col gap-1">
  <a :href="window.SentinelReview.url('/tpsentinel/review_cases/?view=open')"
     class="inline-flex items-center gap-x-1 -ms-1 py-1 px-1 w-fit rounded-lg text-sm text-muted-foreground-1 hover:text-foreground focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Review cases
  </a>
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h1 class="text-lg md:text-xl font-semibold text-foreground">Reviewer workload</h1>
      <p class="mt-1 flex flex-wrap items-center gap-x-2 text-sm text-muted-foreground-1">
        <span x-show="ready && !noOpenWork" x-text="headline"></span>
        <span x-show="ready && !noOpenWork" aria-hidden="true">·</span>
        <span :class="stale && 'text-amber-700 dark:text-amber-400'" x-text="loadFailed ? 'Not updated' : updatedLabel"></span>
        <button type="button" @click="refresh()" :disabled="refreshing" aria-label="Refresh workload"
                class="inline-flex justify-center items-center size-6 rounded-md hover:bg-muted-hover hover:text-foreground disabled:opacity-50 focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
          <svg class="shrink-0 size-3.5" :class="refreshing && 'animate-spin'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </button>
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="workspace ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Workspace: </span>
    <span class="truncate" x-text="((workspaceOptions).find(o => String(o[0]) === String(workspace)) || [null, 'All workspaces'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Workspace'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'All workspaces'], ...(workspaceOptions)]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(workspace) === String(v)"
              @click="workspace = v; open = false"
              :class="String(workspace) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(workspace) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

      
<div class="relative inline-flex" x-data="{ open: false }"
     @click.outside="open = false" @keydown.escape.stop="open = false">
  <button type="button" @click="open = !open" :aria-expanded="open" aria-haspopup="listbox"
          :class="priority ? 'text-foreground font-medium' : 'text-muted-foreground-1'"
          class="relative inline-flex items-center min-w-32 py-1.5 ps-3 pe-8 bg-layer border border-layer-line rounded-lg text-sm text-start hover:bg-layer-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    <span class="sr-only">Priority: </span>
    <span class="truncate" x-text="((priorityOptions).find(o => String(o[0]) === String(priority)) || [null, 'All priorities'])[1]"></span>
    <svg class="absolute end-2.5 top-1/2 -translate-y-1/2 shrink-0 size-4 text-muted-foreground-1 transition-transform" :class="open && 'rotate-180'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div x-show="open" x-cloak role="listbox" :aria-label="'Priority'"
       x-transition:enter="transition ease-out duration-100" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       class="absolute z-50 top-full start-0 mt-1 min-w-full w-max max-w-72 max-h-72 overflow-y-auto p-1 bg-dropdown border border-dropdown-line rounded-lg shadow-xl [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-track]:bg-scrollbar-track [&::-webkit-scrollbar-thumb]:bg-scrollbar-thumb">
    <template x-for="[v, l] in [['', 'All priorities'], ...(priorityOptions)]" :key="'opt-' + v">
      <button type="button" role="option" :aria-selected="String(priority) === String(v)"
              @click="priority = v; open = false"
              :class="String(priority) === String(v) ? 'bg-dropdown-item-active font-medium text-foreground' : 'text-dropdown-item-foreground hover:bg-dropdown-item-hover'"
              class="w-full flex items-center justify-between gap-x-3 py-2 px-3 rounded-lg text-sm text-start focus:outline-hidden focus-visible:bg-dropdown-item-focus">
        <span class="truncate" x-text="l"></span>
        <svg x-show="String(priority) === String(v)" class="shrink-0 size-4 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </template>
  </div>
</div>

    </div>
  </div>
</div>

<!-- Active scope: every number below is for these filters -->
<div x-show="hasFilters" x-cloak class="-mt-1 flex flex-wrap items-center gap-2 text-sm">
  <span class="text-muted-foreground-1">Showing workload for</span>
  <template x-for="f in [['workspace', workspaceLabel], ['priority', priorityLabel === 'Critical and High' ? 'Critical and High priority' : priorityLabel + ' priority']].filter(f => $data[f[0]])" :key="f[0]">
    <span class="inline-flex items-center gap-x-1 py-1 ps-2.5 pe-1 rounded-full text-xs font-medium bg-primary-100 text-primary-800 dark:bg-primary-500/20 dark:text-primary-300">
      <span class="truncate max-w-64" x-text="f[1]"></span>
      <button type="button" @click="$data[f[0]] = ''" :aria-label="`Remove ${f[0]} filter`"
              class="inline-flex justify-center items-center size-4 rounded-full hover:bg-primary-200 dark:hover:bg-primary-500/30 focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
        <svg class="shrink-0 size-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </span>
  </template>
  <button type="button" @click="clearFilters()"
          class="py-1 px-1.5 rounded-lg text-sm font-medium text-primary hover:text-primary-hover focus:outline-hidden focus-visible:ring-2 focus-visible:ring-primary">
    Clear all filters
  </button>
</div>

<!-- Stale data: keep the last figures, say how old they are -->
<div x-show="stale" x-cloak role="status"
     class="flex flex-wrap items-center gap-x-3 gap-y-2 py-2.5 px-4 rounded-xl border border-amber-200 bg-amber-50 text-sm text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300">
  <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
  <p class="grow" x-text="`Couldn't refresh. These figures are from ${updatedLabel.replace('Updated ', '')} and may be out of date.`"></p>
  <button type="button" @click="refresh()" :disabled="refreshing"
          class="font-medium underline underline-offset-4 hover:no-underline disabled:opacity-50 focus:outline-hidden focus-visible:ring-2 focus-visible:ring-amber-500 rounded">
    Try again
  </button>
</div>

<!-- Load failure: never shown as zeroes; filters stay -->
<div x-show="loadFailed" x-cloak class="bg-card border border-card-line rounded-xl">
  
  
  
  

  
    
  <div class="p-5 min-h-[400px] flex flex-col justify-center items-center text-center">
    
    
      <div class="mx-auto flex justify-center items-center size-12 bg-surface rounded-full">
        <i data-lucide="cloud-off" class="shrink-0 size-6 text-muted-foreground-1"></i>
      </div>
    

    <div class="max-w-sm mx-auto">
      <p class="mt-2 font-medium text-foreground">
        Couldn&#39;t load reviewer workload
      </p>
      
      <p class="mb-5 mt-1 text-sm text-muted-foreground-1">
        Your filters are kept. Try again in a moment.
      </p>
      
    </div>

    
    <div class="flex items-center gap-x-2 ">
      
      
      
        

  
  
  

  
  

  

  
  
  

  
    <button type="button" class="inline-flex items-center justify-center gap-x-1.5 font-medium rounded-lg disabled:opacity-50 disabled:pointer-events-none focus:outline-hidden transition-colors py-2 px-3 text-sm bg-primary border border-transparent text-primary-foreground hover:bg-primary-hover focus:bg-primary-focus"   @click.prevent="refresh()">
  

    
    

    Try again

    

  
    </button>
  


      
    </div>
    

  </div>
  
  


</div>
